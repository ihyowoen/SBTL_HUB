name: R34 bounded LFP source-quote audit and cleanup (NO MERGE)
on:
  push:
    branches:
      - news/r28-20261017-source-verified-lfp
    paths:
      - "scripts/.r34_temp_quote_scope_patch.mjs"
      - ".github/workflows/r34-one-time-quote-coverage.yml"
permissions:
  contents: write
jobs:
  r34-exact-head-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify branch and frozen R33 data before touching anything
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "news/r28-20261017-source-verified-lfp"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "6851fdbe4a25b30b7204d07708a1238123c14910"
          test "$(git rev-parse HEAD:data/cards.full.json)" = "79cd66d64705e44f702670c7b437449abd2145d2"
          test "$(git rev-parse HEAD:public/data/cards.json)" = "b1c12f3649a1bbe11f00a977331100a86bcaf928"
          test "$(git rev-parse HEAD:direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json)" = "2431257bc5e727b5e85aef42fe5c62597277dc2b"
      - name: Apply precise issuer quote corrections and deterministic Full-to-Lean projection
        run: node scripts/.r34_temp_quote_scope_patch.mjs
      - name: Verify direct-add and strict publication invariants
        shell: bash
        run: |
          set -euo pipefail
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > "$RUNNER_TEMP/base.full.json"
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/base.full.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/base.full.json" --full data/cards.full.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Run complete existing repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove temporary code and workflow, commit strictly governed files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r34_temp_quote_scope_patch.mjs
          rm .github/workflows/r34-one-time-quote-coverage.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/r34-one-time-quote-coverage.yml data/cards.full.json direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json public/data/cards.json scripts/.r34_temp_quote_scope_patch.mjs | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'BLOCK: unexpected R34 mutation scope:\n%s\n' "$actual" >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cards): R34 tighten exact LFP source-quote coverage (NO MERGE)"
          git push origin HEAD:news/r28-20261017-source-verified-lfp
