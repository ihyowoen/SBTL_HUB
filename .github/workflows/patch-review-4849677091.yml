name: Patch review 4849677091

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_review_4849677091.py
      - .github/workflows/patch-review-4849677091.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_review_4849677091.py
      - name: Compile validator
        run: python -m py_compile validation_scripts/stage_lineage_contract_check.py
      - name: Focused regression
        run: python -m unittest validation_scripts.tests.test_review_4849677091_contracts validation_scripts.tests.test_review_4849359963_contracts
      - name: Full workflow-contract regression
        run: python validation_scripts/run_workflow_contract_suite.py
      - name: Prompt overlay verification
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified fix and remove temporary files
        run: |
          rm -f scripts/patch_review_4849677091.py .github/workflows/patch-review-4849677091.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind confirmation effects to interpretation"
          git push origin HEAD:agent/structural-news-value-v3
