name: tmp-july-theme-stage-matrix
on: push
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/monthly-brief-2026-07-backfill
      - name: Build theme-stage matrix
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('runs/2026-09-10/monthly-brief-2026-07-universe-review.json')
          d=json.loads(p.read_text())
          cards=d['cards']
          themes={
            'ESS_BESS_GRID_STORAGE':[r'\bBESS\b',r'ESS',r'저장',r'배터리저장',r'양수',r'흐름전지'],
            'EV_CELL_MANUFACTURING':[r'EV',r'전기차',r'동력배터리',r'셀',r'배터리 생산',r'공장',r'기가팩토리'],
            'CHEMISTRY_TECH':[r'LFP',r'나트륨',r'전고체',r'고체전지',r'실리콘 음극',r'바나듐',r'LMFP',r'망간',r'프리도핑'],
            'CRITICAL_MINERALS_RECYCLING':[r'리튬',r'니켈',r'코발트',r'흑연',r'희토류',r'텅스텐',r'핵심광물',r'재활용',r'재자원',r'블랙매스',r'정광'],
            'GRID_POWER_AI_INFRA':[r'계통',r'송전',r'배전',r'변압기',r'데이터센터',r'AI',r'전력인프라',r'직류',r'PPA'],
            'POLICY_TRADE_REGULATION':[r'관세',r'세금',r'소비세',r'규정',r'법',r'정부',r'DOE',r'보조',r'지원',r'입찰',r'RFP'],
            'CAPITAL_FINANCE_MA':[r'인수',r'M&A',r'금융',r'조달',r'투자',r'대출',r'펀드',r'기업가치',r'오프테이크',r'톨링'],
            'LOCALIZATION_SUPPLY_CHAIN':[r'현지',r'미국 내',r'국내',r'공급망',r'오프테이크',r'장기공급',r'프레임워크',r'합작',r'조지아'],
            'POUCH_FILM_PACKAGING':[r'파우치',r'알루미늄',r'포장',r'필름'],
          }
          stages={
            'OPERATING_COD':[r'상업운전',r'가동',r'운영 시작',r'생산개시',r'생산 시작',r'판매가능'],
            'COMMISSIONING_INSTALLATION':[r'통전',r'설치 완료',r'시운전',r'준공',r'개장'],
            'CONSTRUCTION_FID':[r'착공',r'건설',r'FID',r'최종투자결정',r'EPC'],
            'CONTRACT_OFFTAKE_TOLLING':[r'계약',r'PPA',r'오프테이크',r'톨링',r'낙찰',r'수주'],
            'FINANCING_CAPITAL':[r'금융',r'조달',r'투자',r'인수',r'기업가치',r'대출'],
            'POLICY_APPROVAL_PROCUREMENT':[r'승인',r'규정',r'관세',r'소비세',r'지원',r'입찰',r'RFP',r'허가',r'공고'],
            'MARKET_DATA_SIGNAL':[r'생산',r'탑재',r'비중',r'증가',r'감소',r'시장',r'보고서',r'통계'],
          }
          def text(c): return ' '.join(str(c.get(k,'')) for k in ('title','sub','fact','gate'))
          def hit(txt,pats): return any(re.search(p,txt,re.I) for p in pats)
          theme_map={k:[] for k in themes}; stage_map={k:[] for k in stages}
          cross={}
          for c in cards:
            t=text(c)
            th=[k for k,p in themes.items() if hit(t,p)]
            st=[k for k,p in stages.items() if hit(t,p)]
            for k in th: theme_map[k].append(c)
            for k in st: stage_map[k].append(c)
            for a in th:
              for b in st: cross[(a,b)]=cross.get((a,b),0)+1
          def short(c): return {'id':c['id'],'date':c['date'],'region':c['region'],'signal':c['signal'],'title':c['title'],'gate':c['gate']}
          rank={'top':3,'high':2,'mid':1}
          def reps(arr,n=12):
            return [short(c) for c in sorted(arr,key=lambda c:(rank.get(c['signal'],0),c['date'],c['id']),reverse=True)[:n]]
          out={
            'month':d['month'],'locked_main_commit_sha':d['locked_main_commit_sha'],'full_blob_sha':d['full_blob_sha'],'month_count':d['month_count'],
            'theme_counts':{k:len(v) for k,v in theme_map.items()},
            'stage_counts':{k:len(v) for k,v in stage_map.items()},
            'cross_counts':[{ 'theme':a,'stage':b,'count':n} for (a,b),n in sorted(cross.items(),key=lambda x:x[1],reverse=True)],
            'theme_representatives':{k:reps(v,18) for k,v in theme_map.items()},
            'stage_representatives':{k:reps(v,12) for k,v in stage_map.items()},
          }
          outp=Path('runs/2026-09-10/working/monthly-brief-2026-07/theme-stage-matrix.json')
          outp.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'theme_counts':out['theme_counts'],'stage_counts':out['stage_counts']},ensure_ascii=False,indent=2))
          PY
      - name: Commit matrix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-july-theme-stage-matrix.yml
          git add runs/2026-09-10/working/monthly-brief-2026-07/theme-stage-matrix.json
          git commit -m "audit: add July theme-stage matrix"
          git push origin HEAD:chatgpt/monthly-brief-2026-07-backfill