name: nr26-remediate-fingerprint-normalization

on:
  push:
    branches:
      - "remediate/nr26-fingerprint-normalization-20260919"

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'Bootstrap NR26 fingerprint normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Normalize fingerprint date containers
        shell: bash
        run: |
          set -euo pipefail
          BASE="cd61937bf786bd0541f00a32a61d534c1633e8fe"
          BASE_BLOB="a619cb37a7c513c751c5419d09fa6b8488170aaa"
          UPDATED="2026-09-18T15:20:00Z"
          MANIFEST="direct-adds/2026-09-19-nr26-fingerprint-normalization/direct-add.json"

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse "$BASE:data/cards.full.json")" = "$BASE_BLOB"
          git show "$BASE:data/cards.full.json" > /tmp/cards.full.base.json

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const ids = [
            "2026-09-10_EU_03",
            "2026-09-16_CN_02",
            "2026-09-16_EU_01",
            "2026-09-17_EU_01",
            "2026-09-16_GL_04"
          ];
          const updated = "2026-09-18T15:20:00Z";
          const fullPath = "data/cards.full.json";
          const manifestPath = "direct-adds/2026-09-19-nr26-fingerprint-normalization/direct-add.json";
          const doc = JSON.parse(fs.readFileSync(fullPath, "utf8"));
          for (const id of ids) {
            const card = doc.cards.find((x) => x.id === id);
            if (!card) throw new Error("missing card " + id);
            const fp = card.event_fingerprint;
            if (!fp || fp.representative_date !== card.date) {
              throw new Error("unexpected fingerprint/date state for " + id);
            }
            delete fp.representative_date;
            fp.event_date = card.date;
          }
          doc.updated = updated;
          fs.writeFileSync(fullPath, JSON.stringify(doc, null, 2) + "\n");

          const manifest = {
            schema: "manual_direct_add_v2",
            status: "PASS",
            direct_add_id: "NR26_FINGERPRINT_NORMALIZATION_20260919_R1",
            review_mode: "already_reviewed_bounded_direct_add",
            formal_full_run_claimed: false,
            base_main_commit_sha: "cd61937bf786bd0541f00a32a61d534c1633e8fe",
            base_full_blob_sha: "a619cb37a7c513c751c5419d09fa6b8488170aaa",
            expected_before: 1674,
            expected_after: 1674,
            output_updated: updated,
            operations: { add: [], update: ids, id_migration: [] },
            editorial_attestation: {
              policy_version: "EMBEDDED_NEWS_VALUE_SELECTION_V4",
              additions: [],
              updates: ids.map((id) => ({
                id,
                change_type: "correction",
                changed_fields: ["event_fingerprint"],
                reason: "Normalize the existing NR26 event_fingerprint date key from representative_date to the active migration contract event_date key without changing the represented event or date value.",
                evidence_review_summary: "Post-merge remediation prep after PR #381 review. The semantic date is unchanged; only the date-bearing fingerprint key is normalized so later governed representative-date migration can be validated atomically."
              }))
            }
          };
          fs.mkdirSync(path.dirname(manifestPath), { recursive: true });
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          NODE

          node scripts/lean_cards.mjs
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance "$MANIFEST"
          node scripts/validate_manual_direct_add.mjs --manifest "$MANIFEST" --base /tmp/cards.full.base.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest "$MANIFEST" --base /tmp/cards.full.base.json --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json "$MANIFEST"
          git diff --cached --quiet && { echo "No remediation changes"; exit 1; }
          git commit -m "Normalize NR26 fingerprint date containers"
          git push origin HEAD:"${GITHUB_REF_NAME}"
