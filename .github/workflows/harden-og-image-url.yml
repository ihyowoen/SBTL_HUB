name: Harden and validate OG image URL

on:
  push:
    branches:
      - agent/og-image-enrichment

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-image-enrichment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject unsafe OG image URLs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'lib/chat/retrieve/ogExtractor.js';
          const before = `    if (!["http:", "https:"].includes(absolute.protocol) || absolute.username || absolute.password) return null;\n    return absolute.href;`;
          const after = `    if (!isSafePublicHttpUrl(absolute.href)) return null;\n    return absolute.href;`;
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(before)) throw new Error('Expected OG image validation snippet not found');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
      - run: npm test
      - run: npm run build
      - name: Commit hardened validated patch
        run: |
          rm .github/workflows/harden-og-image-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject unsafe OG image targets"
          git push origin HEAD:agent/og-image-enrichment
