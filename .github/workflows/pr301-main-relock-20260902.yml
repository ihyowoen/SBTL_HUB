name: PR301 main relock 20260902

on:
  push:
    branches:
      - chatgpt/20260831-preflight-reconciliation-r2
    paths:
      - .github/workflows/pr301-main-relock-20260902.yml

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260831-preflight-reconciliation-r2
          fetch-depth: 0
      - name: Prove UI-only main change irrelevant and relock R3
        shell: bash
        run: |
          set -euo pipefail
          expected_main='48e46b1cd635163666aa05465a193b7c74342691'
          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$expected_main"
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          p = Path('runs/2026-08-31/stage_0_0d_document_universe_20260901_CURRENT_MAIN_1514_PREFLIGHT_RECONCILIATION_R3.json')
          d = json.loads(p.read_text(encoding='utf-8'))

          old = '71371c841f7fe18bf97bf500aa537b6f1975d5dc'
          new = '48e46b1cd635163666aa05465a193b7c74342691'
          assert d['repository_head_sha'] == old
          assert d['canonical_full_blob_sha'] == '53219907cdb435c3822c41d097b23e475662aa8a'
          assert d['prompt_package_manifest_blob_sha'] == '854605068c78633d99ae32d8c635e12ff34b5a35'
          assert d['docs_file_count'] == 88
          assert d['current_run_full_reads_or_parses_completed'] == 5
          assert d['current_run_full_reads_or_parses_missing'] == 83
          assert d['stage_0_0c_authorized'] is False
          assert d['status'] == 'BLOCKED_DOCUMENT_UNIVERSE_INCOMPLETE'

          changed = [
              '__tests__/mdText.test.jsx',
              'src/App.jsx',
              'src/MdText.jsx',
              'src/mdParse.js',
          ]
          d['head_change_reconciliation'] = {
              'previous_locked_main_sha': old,
              'current_locked_main_sha': new,
              'change_source': 'PR #303 md-renderer merge',
              'changed_files': changed,
              'relevance_decision': 'PROVED_IRRELEVANT_TO_STAGE_0_0D_GOVERNANCE_SCOPE_AND_RELOCKED',
              'proof_basis': [
                  '71371c...48e46b compare contains only UI renderer source/test files listed above',
                  'no docs/** files changed',
                  'no .github/workflows/** files changed',
                  'no validator/registry/schema/contract files changed',
                  'data/cards.full.json blob remains 53219907cdb435c3822c41d097b23e475662aa8a',
                  'docs/llm_prompts/v1/PROMPT_MANIFEST.md blob remains 854605068c78633d99ae32d8c635e12ff34b5a35'
              ],
              'manifest_regenerated_after_irrelevance_proof': True
          }
          d['repository_head_sha'] = new
          d['head_lock']['locked_main_sha'] = new
          d['head_lock']['current_main_sha_at_last_recheck'] = new
          d['repository_state_lock']['repository_head_sha'] = new
          d['artifact_date_basis'] = '2026-08-31 run reconciled through 2026-09-02 KST; R3 regenerated after proving PR #303 UI-only main-head change irrelevant to the governed Stage 0.0D universe'
          d.setdefault('review_resolution', {})['main_head_relock_20260902'] = 'main advanced to 48e46b1c via PR #303; four UI/test-only changed files proved outside Stage 0.0D governance scope; canonical cards/prompt blobs unchanged; manifest regenerated and relocked'
          d['generated_kst'] = datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds')

          # No head-change defect is emitted because policy permits regeneration after irrelevance is proved.
          assert not any(x.get('type') == 'REPOSITORY_HEAD_CHANGED' for x in d['incomplete_universe_defects'])
          assert d['repository_head_sha'] == new
          assert d['head_lock']['locked_main_sha'] == new
          assert d['repository_state_lock']['repository_head_sha'] == new
          assert d['canonical_full_blob_sha'] == '53219907cdb435c3822c41d097b23e475662aa8a'
          assert d['prompt_package_manifest_blob_sha'] == '854605068c78633d99ae32d8c635e12ff34b5a35'
          assert len(d['documents']) == 88
          assert len(d['governed_external_inventory']) == 5
          assert len(d['unresolved_dependencies']) == 27
          assert sum(1 for x in d['incomplete_universe_defects'] if x['type'] == 'MISSING_DEPENDENCY') == 27
          assert d['stage_0_0c_authorized'] is False
          assert d['status'] == 'BLOCKED_DOCUMENT_UNIVERSE_INCOMPLETE'

          p.write_text(json.dumps(d, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git rm .github/workflows/pr301-main-relock-20260902.yml
          git add runs/2026-08-31/stage_0_0d_document_universe_20260901_CURRENT_MAIN_1514_PREFLIGHT_RECONCILIATION_R3.json
          git commit -m "Relock Stage 0.0D after UI-only main advance"
          git push origin HEAD:chatgpt/20260831-preflight-reconciliation-r2
