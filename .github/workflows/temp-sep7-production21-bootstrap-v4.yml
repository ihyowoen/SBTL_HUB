name: TEMP Sep 7 production21 bootstrap v10

on:
  push:
    branches:
      - chatgpt/production-20260907-r7-21
    paths:
      - tmp/sep7-production21-bootstrap/trigger-v10.txt

permissions:
  contents: write
  actions: read

jobs:
  governed-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate, apply, audit, and commit governed Sep 7 production run
        shell: bash
        run: |
          set +e
          LOG=tmp/sep7-production21-bootstrap/last-run.log
          bash tmp/sep7-production21-bootstrap/run_v17.sh >"$LOG" 2>&1
          rc=$?
          cat "$LOG"
          if [ "$rc" -ne 0 ]; then
            git config user.name ihyowoen
            git config user.email hyowoen@hotmail.com
            git add "$LOG"
            git commit -m "Capture Sep 7 production bootstrap failure log" || true
            git push origin HEAD:chatgpt/production-20260907-r7-21 || true
          fi
          exit "$rc"
