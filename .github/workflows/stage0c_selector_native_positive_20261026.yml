name: Stage 0.0C selector-only V4 native positive audit
on:
  push:
    branches:
      - ops/stage0c-selector-entry-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-only-positive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exact-main 0.0D V4 native full-read (not prior receipt reuse)
        run: python3 scripts/r37_native_preflight.py
      - name: Exact-main 0.0C native 1330-ID discovery gate and negative controls
        run: python3 scripts/stage0c_positive_gate_20261026.py
      - name: Upload immutable selector gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0c-selector-native-entry-${{ github.run_id }}
          path: |
            runs/2026-10-24/r37-native-0-0d-evidence/R37_0_0D_V4_STAGE_20261024.json
            runs/2026-10-24/r37-native-0-0d-evidence/R37_NATIVE_VALIDATOR_QC.json
            runs/2026-10-26/stage0c-selector-entry/STAGE_0_0C_NATIVE_POSITIVE_RECEIPT.json
            runs/2026-10-26/stage0c-selector-entry/STAGE_0_0C_SELECTOR_RUN_MANIFEST.json
          if-no-files-found: warn
