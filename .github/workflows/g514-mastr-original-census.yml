name: G5.14 Germany ESS MaStR original source census (isolated research branch)

on:
  push:
    branches: [research/g514-mastr-census-20261123]
    paths:
      - .github/workflows/g514-mastr-original-census.yml
      - research/germany_ess_g514/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g514-mastr-official-audit
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic XML parser dependency
        run: python -m pip install lxml==5.4.0
      - name: Inspect original ZIP header and exact member inventory
        run: |
          python - <<'PY'
          import sys, json, zipfile, re, pathlib
          sys.path.insert(0, "research/germany_ess_g514")
          from G5_14_R16_MASTR_RANGE_VERIFY_20261119 import HttpRangeFile
          url="https://download.marktstammdatenregister.de/Stichtag/Gesamtdatenexport_20261001_26.1.zip"
          h=HttpRangeFile(url)
          with zipfile.ZipFile(h) as z:
              names=z.namelist()
              groups={}
              for group in ["AnlagenStromSpeicher","EinheitenStromSpeicher","Katalogwerte"]:
                  infos=[x for x in z.infolist() if re.fullmatch(group+r"(?:_\d+)?\.xml",x.filename,re.I)]
                  groups[group]={"count":len(infos),"compressed_bytes":sum(i.compress_size for i in infos),
                                 "uncompressed_bytes":sum(i.file_size for i in infos),
                                 "members":[{"name":i.filename,"crc32":f"{i.CRC:08x}","compressed":i.compress_size} for i in infos]}
          assert h.length==3218297640,(h.length,"frozen official MaStR size mismatch")
          assert groups["AnlagenStromSpeicher"]["count"]==29
          assert groups["EinheitenStromSpeicher"]["count"]==29
          pathlib.Path("g514_output").mkdir(exist_ok=True)
          result={"status":"ORIGINAL_SOURCE_ZIP_HEADER_VERIFIED",
                  "url":url,"bytes":h.length,"etag":h.etag,"range_requests":h.range_requests,
                  "total_members":len(names),"groups":groups,
                  "warning":"The 2026-10-01 vintage is not ISE's 2026-10-13."}
          pathlib.Path("g514_output/official_source_inventory.json").write_text(json.dumps(result,indent=2))
          print("OFFICIAL ZIP inventory",json.dumps({k:{kk:v[kk] for kk in ("count","compressed_bytes")} for k,v in groups.items()}))
          PY
      - name: Run bounded synthetic tests (not country output)
        run: |
          python research/germany_ess_g514/G5_14_R18_BATTERY_RAW_REAGGREGATION_20261120.py --self-test --out g514_synthetic
      - name: Execute 29+29 archived MaStR XML original national census
        run: |
          set -o pipefail
          python -u research/germany_ess_g514/G5_14_R18_BATTERY_RAW_REAGGREGATION_20261120.py --source official-remote --out g514_output 2>&1 | tee g514_full_run.log
          sha256sum research/germany_ess_g514/*.py g514_output/*.json g514_output/*.csv > g514_output/source_artifact_sha256.txt
          echo "CENSUS_COMPLETED__SOURCE_2026_10_01"
      - name: Preserve small-machine QC and source logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: germany-g514-20261001-native-mastr-QC
          path: |
            g514_output/*.json
            g514_output/*.csv
            g514_output/*.txt
            g514_full_run.log
          if-no-files-found: warn
          retention-days: 90
