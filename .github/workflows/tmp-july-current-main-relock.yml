name: tmp-july-current-main-relock
on: push
permissions:
  contents: write
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/monthly-brief-2026-07-backfill
          fetch-depth: 0
      - name: Compare locked July universe with current main
        run: |
          git fetch origin main
          python - <<'PY'
          import json, subprocess, hashlib
          from pathlib import Path
          OLD_MAIN='3bb929004ff8b547b86e5f1beab0efb3dac19d62'
          NEW_MAIN=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          old=json.loads(Path('runs/2026-09-10/monthly-brief-2026-07-universe-review.json').read_text())
          raw=subprocess.check_output(['git','show',f'{NEW_MAIN}:data/cards.full.json'],text=True)
          cur=json.loads(raw); cards=cur if isinstance(cur,list) else cur.get('cards',[])
          blob=subprocess.check_output(['git','rev-parse',f'{NEW_MAIN}:data/cards.full.json'],text=True).strip()
          def first(c,*ks,default=''):
            for k in ks:
              v=c.get(k)
              if v not in (None,'',[]): return v
            return default
          def cid(c): return str(first(c,'id','news_id',default=first(c,'url',default='')))
          def date(c): return str(first(c,'date','d'))
          def sig(c):
            v=str(first(c,'signal','s',default='')).lower()
            return {'t':'top','h':'high','m':'mid','i':'info'}.get(v,v or 'unknown')
          oldmap={c['id']:c for c in old['cards']}
          july=[c for c in cards if date(c).startswith('2026-07')]
          curmap={cid(c):c for c in july}
          added=sorted(set(curmap)-set(oldmap)); removed=sorted(set(oldmap)-set(curmap))
          fields=['date','region','signal','title','sub','gate','fact','urls','fact_sources','related_lineage']
          changed=[]
          for i in sorted(set(curmap)&set(oldmap)):
            o=oldmap[i]; c=curmap[i]
            canon={
              'id':i,'date':date(c),'region':first(c,'region','r'),'signal':sig(c),
              'title':first(c,'title','T'),'sub':first(c,'sub','subtitle','S'),'gate':first(c,'gate','g'),'fact':first(c,'fact','F'),
              'urls':c.get('urls') if isinstance(c.get('urls'),list) else ([c.get('url')] if c.get('url') else []),
              'fact_sources':c.get('fact_sources',[]),'related_lineage':c.get('related_lineage')
            }
            delta=[f for f in fields if o.get(f)!=canon.get(f)]
            if delta: changed.append({'id':i,'changed_fields':delta,'before':{f:o.get(f) for f in delta},'after':{f:canon.get(f) for f in delta}})
          def compact(c):
            return {'id':cid(c),'date':date(c),'region':first(c,'region','r'),'signal':sig(c),'title':first(c,'title','T'),'sub':first(c,'sub','subtitle','S'),'gate':first(c,'gate','g'),'fact':first(c,'fact','F'),'implication':first(c,'implication','I','why_it_matters'),'urls':c.get('urls') if isinstance(c.get('urls'),list) else ([c.get('url')] if c.get('url') else []),'fact_sources':c.get('fact_sources',[]),'related_lineage':c.get('related_lineage')}
          outdir=Path('runs/2026-09-14/working/monthly-brief-2026-07'); outdir.mkdir(parents=True,exist_ok=True)
          audit={'old_locked_main':OLD_MAIN,'old_blob':old['full_blob_sha'],'current_main':NEW_MAIN,'current_blob':blob,'old_july_count':len(oldmap),'current_july_count':len(july),'added_ids':added,'removed_ids':removed,'changed':changed}
          (outdir/'current-main-delta.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          universe={'schema_version':'monthly-brief-universe-review.v2','month':'2026-07','locked_main_commit_sha':NEW_MAIN,'full_blob_sha':blob,'canonical_total':len(cards),'month_count':len(july),'cards':[compact(c) for c in july]}
          (outdir/'current-universe.json').write_text(json.dumps(universe,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'main':NEW_MAIN,'blob':blob,'canonical_total':len(cards),'july_count':len(july),'added':len(added),'removed':len(removed),'changed':len(changed),'added_ids':added,'removed_ids':removed},ensure_ascii=False,indent=2))
          PY
      - name: Commit relock audit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-july-current-main-relock.yml
          git add runs/2026-09-14/working/monthly-brief-2026-07/current-main-delta.json runs/2026-09-14/working/monthly-brief-2026-07/current-universe.json
          git commit -m "audit: relock July universe to current main"
          git push origin HEAD:chatgpt/monthly-brief-2026-07-backfill