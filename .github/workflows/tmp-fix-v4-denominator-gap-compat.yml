name: Apply V4 denominator-gap compatibility fix

on:
  push:
    branches:
      - chatgpt/fix-v4-denominator-gap-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-v4-denominator-gap-compat
          fetch-depth: 0
      - name: Patch frozen V3 full-completeness compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('validation_scripts/stage_a_full_v3_completeness.py')
          s = p.read_text(encoding='utf-8')
          marker = 'CANONICAL_POLICY_FILE = "docs/STRUCTURAL_NEWS_VALUE_SELECTION.md"\n'
          assert marker in s
          s = s.replace(marker, marker + 'V4_POLICY_VERSION = "EMBEDDED_NEWS_VALUE_SELECTION_V4"\n', 1)
          candidate_marker = '''def _candidate_id(item: Mapping[str, Any], fallback: str) -> str:\n    return str(\n        item.get("spec_id")\n        or item.get("review_pool_item_id")\n        or item.get("story_id")\n        or fallback\n    )\n\n\n'''
          helper = '''def _validate_denominator_gap_compat(\n    item: Mapping[str, Any],\n    label: str,\n    messages: list[str],\n) -> None:\n    """Preserve frozen V3 booleans while honoring the active V4 text contract."""\n    if "denominator_gap" not in item:\n        return\n    denominator_gap = item.get("denominator_gap")\n    if item.get("selection_policy_version") == V4_POLICY_VERSION:\n        denominator = item.get("systemic_scale_denominator")\n        denominator_present = isinstance(denominator, str) and bool(denominator.strip())\n        if denominator_present:\n            if denominator_gap not in (None, "", [], {}):\n                messages.append(\n                    f"{label}: V4 denominator_gap must be empty when systemic_scale_denominator is supplied"\n                )\n        elif not isinstance(denominator_gap, str) or not denominator_gap.strip():\n            messages.append(\n                f"{label}: V4 denominator_gap must be a non-empty explanation when systemic_scale_denominator is absent"\n            )\n        return\n    if not isinstance(denominator_gap, bool):\n        messages.append(f"{label}: V3 denominator_gap must be boolean")\n\n\n'''
          assert candidate_marker in s
          s = s.replace(candidate_marker, candidate_marker + helper, 1)
          old = '''    if "denominator_gap" in item and not isinstance(item.get("denominator_gap"), bool):\n        messages.append(f"{label}: denominator_gap must be boolean")\n'''
          assert old in s
          s = s.replace(old, '    _validate_denominator_gap_compat(item, label, messages)\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          cat > validation_scripts/tests/test_stage_a_v4_denominator_gap_compat.py <<'PY'
          from __future__ import annotations

          import unittest

          from validation_scripts import stage_a_full_v3_completeness as full


          class TestStageAV4DenominatorGapCompatibility(unittest.TestCase):
              def validate(self, item):
                  messages = []
                  full._validate_denominator_gap_compat(item, "ITEM", messages)
                  return messages

              def test_historical_v3_boolean_semantics_are_preserved(self):
                  self.assertEqual(self.validate({"denominator_gap": False}), [])
                  self.assertIn("ITEM: V3 denominator_gap must be boolean", self.validate({"denominator_gap": "gap"}))

              def test_v4_without_denominator_requires_explanatory_text(self):
                  item = {
                      "selection_policy_version": full.V4_POLICY_VERSION,
                      "systemic_scale_denominator": None,
                      "denominator_gap": "No defensible denominator is available from Stage A source metadata.",
                  }
                  self.assertEqual(self.validate(item), [])
                  item["denominator_gap"] = False
                  self.assertIn("V4 denominator_gap must be a non-empty explanation", self.validate(item)[0])

              def test_v4_with_denominator_requires_empty_gap(self):
                  item = {
                      "selection_policy_version": full.V4_POLICY_VERSION,
                      "systemic_scale_denominator": "Q2 2026 U.S. storage additions = 20.2 GWh",
                      "denominator_gap": None,
                  }
                  self.assertEqual(self.validate(item), [])
                  item["denominator_gap"] = "should be empty"
                  self.assertIn("V4 denominator_gap must be empty", self.validate(item)[0])


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Run targeted regressions
        run: |
          python -m unittest validation_scripts.tests.test_stage_a_v4_denominator_gap_compat -v
          python -m unittest validation_scripts.tests.test_stage_a_v4_contract validation_scripts.tests.test_stage_a_v4_hardening -v
          python -m py_compile validation_scripts/stage_a_full_v3_completeness.py
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-v4-denominator-gap-compat.yml
          git add validation_scripts/stage_a_full_v3_completeness.py validation_scripts/tests/test_stage_a_v4_denominator_gap_compat.py
          git commit -m 'fix: align V4 denominator-gap semantics with frozen V3 completeness'
          git push origin HEAD:chatgpt/fix-v4-denominator-gap-compat
