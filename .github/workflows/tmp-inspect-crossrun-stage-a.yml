name: Inspect cross-run Stage A artifacts

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-inspect-crossrun-stage-a.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect cross-run artifacts
        shell: bash
        run: |
          git fetch origin chatgpt/v4-crossrun-20260831-20260901
          python3 - <<'PY'
          import json, re, subprocess
          REF='origin/chatgpt/v4-crossrun-20260831-20260901'
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',REF],text=True).splitlines()
          run_paths=[p for p in paths if p.startswith('runs/2026-09-02/')]
          interesting=[p for p in run_paths if re.search(r'(stage.?a|preselect|select|candidate|event_universe|carry_forward)',p,re.I)]
          print('=== INTERESTING PATHS ===')
          for p in interesting: print(p)
          print('=== JSON STRUCTURE SCAN ===')
          for p in run_paths:
              if not p.endswith('.json'): continue
              try:
                  raw=subprocess.check_output(['git','show',f'{REF}:{p}'])
                  o=json.loads(raw.decode('utf-8-sig'))
              except Exception:
                  continue
              keys=set(o) if isinstance(o,dict) else set()
              hit=(
                  'stage_a' in str(o.get('stage','')).lower()
                  or any(k in keys for k in ('strict_passed_spec','candidate_review_pool','watchlist_context_pool','reject_or_support_only_pool','decision_ledger','preselection','stage_a_handoff'))
                  or 'stage_a' in p.lower()
              )
              if not hit: continue
              summary={'path':p,'type':type(o).__name__,'keys':sorted(keys)}
              if isinstance(o,dict):
                  for k,v in o.items():
                      if isinstance(v,list): summary[k+'_count']=len(v)
                      elif k in ('stage','status','story_count','event_count','run_id','run_tag','selection_policy_version'): summary[k]=v
              print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
      - name: Remove inspector workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-inspect-crossrun-stage-a.yml
          git commit -m 'chore: remove temporary Stage A inspector'
          git push origin HEAD:chatgpt/v4-run-baseline-20260831-20260901-r4
