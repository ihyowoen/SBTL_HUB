name: fix-pr297-codex-review2-once

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: write

env:
  RUN_PATH: runs/2026-08-29/card-run.json
  BASE_SHA: 937dce6429c8bf63535d8043c7f559c9f2001f5d
  BASE_BLOB: 9278233be67240aac1cdf7963e12d8e2878319f0

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260829-combined18-governed-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repair synthesis, ledger, Tata stage, and evidence packages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, copy, hashlib
          from urllib.parse import urlparse

          root=Path('.')
          run_path=root/'runs/2026-08-29/card-run.json'
          targets=[
            run_path,
            root/'runs/2026-08-29/card_run_audit_20260829_CURRENT_MAIN_1496_COMBINED18.json',
            root/'runs/2026-08-29/content_polish_results_20260829_CURRENT_MAIN_1496_COMBINED18.json',
            root/'runs/2026-08-29/evidence_qc_results_20260829_CURRENT_MAIN_1496_COMBINED18.json',
            root/'runs/2026-08-29/final_publish_readiness_qc_results_20260829_CURRENT_MAIN_1496_COMBINED18.json',
            root/'runs/2026-08-29/post_acceptance_baseline_revalidation_20260829_CURRENT_MAIN_1496_COMBINED18.json',
            root/'runs/2026-08-29/stage_0_0c_coverage_discovery_20260829_CURRENT_MAIN_1496.json',
            root/'runs/2026-08-29/stage_0_0d_document_universe_20260829_CURRENT_MAIN_1496.json',
            root/'runs/2026-08-29/stage_0_7c_independent_completeness_review_20260829_CURRENT_MAIN_1496_COMBINED18.json',
          ]
          VISIBLE_SYNTH=['fact','gate','implication']

          def dom(url):
              h=(urlparse(url or '').hostname or '').lower()
              return h[4:] if h.startswith('www.') else h

          run=json.loads(run_path.read_text(encoding='utf-8'))
          specs={op['card'].get('source_spec_id') for op in run['operations']['insert']}

          def patch_tata(o):
              spec=o.get('source_spec_id') or o.get('spec_id')
              if spec!='NEW27_TH_001': return
              replacements={
                'title':'Tata Power Renewables, 라자스탄 190.5MW FDRE 커미셔닝…115MWh BESS 통합',
                'sub':'SJVN FDRE Tranche-1의 190.5MW 태양광 프로젝트 커미셔닝을 완료했으며, 전체 460MW 계약 프로젝트의 일부로 115MWh BESS를 포함한다.',
                'gate':'190.5MW는 커미셔닝된 태양광 FDRE 구간이고 460MW는 전체 계약용량이다. 115MWh BESS의 전력용량(MW)은 공개자료에서 별도로 확인되지 않는다.',
                'fact':'Tata Power Renewable Energy는 8월 24일 라자스탄 Bikaner Kalasar의 190.5MW Solar FDRE 프로젝트를 커미셔닝했다고 발표했다. 이 시설은 SJVN FDRE Tranche-1의 460MW 계약 프로젝트 일부이며 115MWh BESS를 통합하고 HPPC·MSEDCL·NPCL에 전력을 공급한다.',
                'implication':['인도 FDRE 조달이 태양광과 저장장치를 결합한 실제 커미셔닝 단계로 진입한 사례다.','BESS 셀·PCS 수요는 단순 재생에너지 증설보다 firm/dispatchable 계약 구조와 함께 추적할 필요가 있다.']
              }
              for k,v in replacements.items():
                  if k in o: o[k]=copy.deepcopy(v)

          def patch_card(o):
              spec=o.get('source_spec_id') or o.get('spec_id')
              if spec not in specs: return
              patch_tata(o)
              if not isinstance(o.get('fact_sources'),list): return
              fslist=[x for x in o['fact_sources'] if isinstance(x,dict)]
              ledger=o.get('source_discovery_ledger')
              if isinstance(ledger,list):
                  for row in ledger:
                      if not isinstance(row,dict) or row.get('outcome')!='used_in_fact_sources': continue
                      fs=None
                      ru=row.get('source_url') or row.get('url')
                      for cand in fslist:
                          cu=cand.get('source_url') or cand.get('url')
                          if ru==cu or row.get('source_name')==cand.get('source_name') or row.get('source_domain')==dom(cu):
                              fs=cand; break
                      if fs:
                          row['source_spec_id']=spec
                          row['source_role']=fs.get('source_role') or fs.get('evidence_role')
                          row['source_origin_type']=fs.get('source_origin_type')
                          row['checked_at']=fs.get('fetched_at')
              st=o.get('source_diversity_status')
              if st=='PASS_MULTI_SOURCE':
                  audit=[]; fields=[]
                  for fs in fslist:
                      affected=[f for f in VISIBLE_SYNTH if f in (fs.get('supports') or [])]
                      for f in affected:
                          if f not in fields: fields.append(f)
                      audit.append({
                          'source_domain':dom(fs.get('source_url') or fs.get('url')),
                          'source_role':fs.get('source_role') or fs.get('evidence_role'),
                          'unique_contribution':fs.get('source_contribution') or fs.get('claim') or '',
                          'affected_visible_fields':affected,
                      })
                  o['source_synthesis_applied']=True
                  o['source_synthesis_fields']=fields
                  o['source_synthesis_audit']=audit
              elif st=='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION':
                  o['source_synthesis_applied']=False
                  o['source_synthesis_fields']=[]
                  o['source_synthesis_audit']=[]

          def traverse(o):
              if isinstance(o,dict):
                  patch_card(o)
                  for v in list(o.values()): traverse(v)
              elif isinstance(o,list):
                  for v in o: traverse(v)

          traverse(run)
          truth={op['card'].get('source_spec_id'):copy.deepcopy(op['card'].get('fact_sources',[])) for op in run['operations']['insert']}

          def patch_packages(o):
              if isinstance(o,dict):
                  spec=o.get('source_spec_id') or o.get('spec_id')
                  if spec in {'NEW27_TH_002','NEW27_TH_008'} and isinstance(o.get('sources'),list) and ('evidence_package_status' in o or 'source_discovery_status' in o):
                      o['sources']=copy.deepcopy(truth[spec])
                  patch_tata(o)
                  for v in list(o.values()): patch_packages(v)
              elif isinstance(o,list):
                  for v in o: patch_packages(v)

          patch_packages(run)
          run_path.write_text(json.dumps(run,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for p in targets[1:]:
              d=json.loads(p.read_text(encoding='utf-8'))
              traverse(d); patch_packages(d)
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          run=json.loads(run_path.read_text(encoding='utf-8'))
          def canon(x):
              if isinstance(x,dict): return {k:canon(x[k]) for k in sorted(x)}
              if isinstance(x,list): return [canon(v) for v in x]
              return x
          ops_sha=hashlib.sha256(json.dumps(canon(run['operations']),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          for p in targets:
              d=json.loads(p.read_text(encoding='utf-8'))
              def bind(x):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          if k=='reviewed_operations_sha256': x[k]=ops_sha
                          else: bind(v)
                  elif isinstance(x,list):
                      for v in x: bind(v)
              bind(d)
              if p.name.startswith('card_run_audit'):
                  d['inserted_ids']=[x['card']['id'] for x in run['operations']['insert']]
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('review2 operations SHA256:',ops_sha)
          PY

      - name: Re-materialize canonical from exact locked baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]] || { echo "main moved; rebase required" >&2; exit 1; }
          git show "$BASE_SHA:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"
          [[ "$(git hash-object "$RUNNER_TEMP/cards.full.base.json")" == "$BASE_BLOB" ]] || { echo "baseline blob mismatch" >&2; exit 1; }
          node scripts/apply_card_run.mjs --apply --run "$RUN_PATH" --baseline "$RUNNER_TEMP/cards.full.base.json" --output data/cards.full.json --report "$RUNNER_TEMP/apply-pre.json" --base-main-sha "$BASE_SHA" --skip-lean
          node scripts/lean_cards.mjs
          node scripts/apply_card_run.mjs --verify --run "$RUN_PATH" --baseline data/cards.full.json --output data/cards.full.json --report runs/2026-08-29/apply-report.json --base-main-sha "$BASE_SHA" --lean-path public/data/cards.json

      - name: Refresh hashes and validate review findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          full=Path('data/cards.full.json').read_bytes(); lean=Path('public/data/cards.json').read_bytes()
          fh=hashlib.sha256(full).hexdigest(); lh=hashlib.sha256(lean).hexdigest()
          p=Path('runs/2026-08-29/card_run_audit_20260829_CURRENT_MAIN_1496_COMBINED18.json')
          d=json.loads(p.read_text(encoding='utf-8')); d['full_output_sha256']=fh; d['lean_output_sha256']=lh
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          r=json.load(open('runs/2026-08-29/card-run.json',encoding='utf-8'))
          cards=[x['card'] for x in r['operations']['insert']]
          used=[]; bad=[]; synth_bad=[]
          for c in cards:
              st=c.get('source_diversity_status')
              if st=='PASS_MULTI_SOURCE' and not (c.get('source_synthesis_applied') is True and c.get('source_synthesis_fields') and c.get('source_synthesis_audit')):
                  synth_bad.append(c['id'])
              if st=='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION' and not (c.get('source_synthesis_applied') is False and c.get('source_synthesis_fields')==[] and c.get('source_synthesis_audit')==[]):
                  synth_bad.append(c['id'])
              for row in c.get('source_discovery_ledger',[]):
                  if isinstance(row,dict) and row.get('outcome')=='used_in_fact_sources':
                      used.append((c['id'],row))
                      miss=[k for k in ('source_role','source_origin_type','checked_at') if not row.get(k)]
                      if miss: bad.append((c['id'],miss))
          assert len(cards)==18
          assert len(used)==34, len(used)
          assert not bad, bad
          assert not synth_bad, synth_bad
          tata=next(c for c in cards if c.get('source_spec_id')=='NEW27_TH_001')
          visible=' '.join(str(tata.get(k,'')) for k in ('title','sub','gate','fact','implication'))
          assert '상업가동' not in visible and '현재 가동' not in visible
          acme=next(c for c in cards if c.get('source_spec_id')=='NEW27_TH_002')
          gv=next(c for c in cards if c.get('source_spec_id')=='NEW27_TH_008')
          assert any(s.get('source_name')=='BioEnergy Times' and s.get('source_origin_type')=='independent_body_level_article' for s in acme['evidence_package']['sources'])
          assert all('BNR Securities' not in str(s.get('source_name','')) for s in acme['evidence_package']['sources'])
          assert any(s.get('source_name')=='Energy Global' and s.get('source_origin_type')=='independent_body_level_article' for s in gv['evidence_package']['sources'])
          assert all(s.get('source_origin_type')!='source_owner_social_release' for s in gv['evidence_package']['sources'])
          json.dump({'cards':cards},open('.tmp_pr297_r2_scope.json','w'),ensure_ascii=False,indent=2)
          json.dump({'ids':[c['id'] for c in cards]},open('.tmp_pr297_r2_ids.json','w'),ensure_ascii=False,indent=2)
          print('full',fh); print('lean',lh); print('used-ledger rows',len(used))
          PY
          python validation_scripts/evidence_qc_v8_check.py .tmp_pr297_r2_scope.json --new-id-file .tmp_pr297_r2_ids.json --json-report .tmp_pr297_r2_evidence.json
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_relations.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN_PATH" --canonical data/cards.full.json
          node scripts/validate_card_run_audits.mjs --run "$RUN_PATH" --full data/cards.full.json --lean public/data/cards.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check
          rm -f .tmp_pr297_r2_scope.json .tmp_pr297_r2_ids.json .tmp_pr297_r2_evidence.json

      - name: Commit review2 remediation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pr297-codex-review2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json runs/2026-08-29 .github/workflows/fix-pr297-codex-review2-once.yml
          git commit -m "Address second Codex P2 review on PR #297"
          git push origin HEAD:chatgpt/20260829-combined18-governed-run
