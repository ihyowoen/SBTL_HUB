name: direct-remediate-pr256

on:
  push:
    branches:
      - agent/backlog-reconciliation-r2-20260811

permissions:
  contents: write

jobs:
  remediate:
    if: contains(github.event.head_commit.message, '[direct-remediation-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify locked baseline
        shell: bash
        env:
          BASE_SHA: d3137945860664116b1bf90bbb7bee54d2a6c1d9
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA:data/cards.full.json")" = "a52745170c70aa649323e346413615c5995b890b"
      - name: Rewrite governed operations and audit metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import copy, hashlib, json, subprocess, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          ROOT = Path('.')
          RUN_DIR = Path('runs/2026-08-11/backlog-reconciliation-r2')
          RUN_PATH = RUN_DIR / 'card-run.json'
          BASE_SHA = 'd3137945860664116b1bf90bbb7bee54d2a6c1d9'
          REMOVE_SPECS = {'REC26_A2_072', 'REC26_A2_042'}
          REMOVE_IDS = {'2026-07-30_GL_01', '2026-07-30_KR_01'}
          KST = timezone(timedelta(hours=9))
          NOW = datetime.now(KST).replace(microsecond=0).isoformat()

          sys.path.insert(0, str((ROOT / 'validation_scripts').resolve()))
          import recompute_source_audit_metadata as rsa
          registry = rsa.load_owner_registry(ROOT / 'validation_data/source_owner_registry.json')

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def dump(path, obj):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def stable(v):
              if isinstance(v, list): return [stable(x) for x in v]
              if isinstance(v, dict): return {k: stable(v[k]) for k in sorted(v)}
              return v
          def ops_sha(ops):
              raw = json.dumps(stable(ops), ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()
          def esc(token):
              return str(token).replace('~','~0').replace('/','~1')
          def apply_change(root, change):
              tokens = [t.replace('~1','/').replace('~0','~') for t in change['path'][1:].split('/')]
              cur = root
              for token in tokens[:-1]:
                  cur = cur[int(token)] if isinstance(cur, list) else cur[token]
              key = tokens[-1]
              op = change['op']
              if isinstance(cur, list):
                  if op == 'add' and key == '-': cur.append(copy.deepcopy(change['value']))
                  elif op in ('add','replace'): cur[int(key)] = copy.deepcopy(change['value'])
                  elif op == 'remove': cur.pop(int(key))
              else:
                  if op in ('add','replace'): cur[key] = copy.deepcopy(change['value'])
                  elif op == 'remove': cur.pop(key, None)
          def top_level_changes(before, after):
              changes=[]
              for key in sorted(set(before) | set(after)):
                  if key not in after:
                      changes.append({'op':'remove','path':'/'+esc(key)})
                  elif key not in before:
                      changes.append({'op':'add','path':'/'+esc(key),'value':copy.deepcopy(after[key])})
                  elif before[key] != after[key]:
                      changes.append({'op':'replace','path':'/'+esc(key),'value':copy.deepcopy(after[key])})
              return changes
          def merge_unique_strings(a,b):
              out=[]
              for x in list(a or [])+list(b or []):
                  if isinstance(x,str) and x and x not in out: out.append(x)
              return out
          def merge_sources(a,b):
              out=[]; seen=set()
              for row in list(a or [])+list(b or []):
                  if not isinstance(row,dict): continue
                  key=(row.get('source_url'), row.get('source_quote'), row.get('claim'))
                  if key in seen: continue
                  seen.add(key); out.append(copy.deepcopy(row))
              return out
          def ensure_existing_date_role(card, extra_sources):
              role = copy.deepcopy(card.get('date_role') if isinstance(card.get('date_role'),dict) else {})
              d = card.get('date')
              all_sources = list(card.get('fact_sources') or []) + list(extra_sources or [])
              pubs = []
              for v in list(role.get('publication_dates') or role.get('source_publication_dates') or []):
                  if isinstance(v,str) and v not in pubs: pubs.append(v)
              for s in all_sources:
                  v=s.get('source_published_date') if isinstance(s,dict) else None
                  if isinstance(v,str) and v not in pubs: pubs.append(v)
              role['representative_date']=d
              role['event_date']=d
              role['publication_dates']=sorted(pubs)
              role['earliest_same_event_date_checked']=True
              candidate=None
              for s in all_sources:
                  if isinstance(s,dict) and s.get('source_published_date')==d and s.get('source_url') and s.get('source_quote'):
                      candidate=s; break
              if candidate is None:
                  for s in all_sources:
                      if isinstance(s,dict) and s.get('source_url') and s.get('source_quote'):
                          candidate=s; break
              if candidate:
                  role['event_date_source_url']=candidate['source_url']
                  role['event_date_source_quote']=candidate['source_quote']
              card['date_role']=role
          def normalize_source_audit(card):
              rsa.recompute(card, registry, True)
          def correction_artifact(spec, old_id, target, reason):
              p = RUN_DIR / 'audit' / f'duplicate-correction-{spec.lower().replace("_","-")}.json'
              payload={
                  'stage':'0.8_duplicate_reclassification', 'status':'PASS',
                  'source_spec_id':spec, 'previous_operation':'insert',
                  'previous_production_id':old_id, 'corrected_operation':'update',
                  'baseline_target_id':target, 'same_event_checked':True,
                  'baseline_current_merge_screened':True, 'selection_deleted':False,
                  'reason':reason, 'generated_kst':NOW,
              }
              dump(p,payload)
              return str(p).replace('\\','/')

          run=load(RUN_PATH)
          base_raw=subprocess.check_output(['git','show',f'{BASE_SHA}:data/cards.full.json'])
          base=json.loads(base_raw.decode('utf-8-sig'))
          by_id={c['id']:c for c in base['cards']}

          inserts=run['operations']['insert']
          removed={op['card'].get('source_spec_id'):op for op in inserts if op.get('card',{}).get('source_spec_id') in REMOVE_SPECS}
          if set(removed)!=REMOVE_SPECS:
              raise SystemExit(f'expected duplicate specs not found: {set(removed)}')
          volta=removed['REC26_A2_072']; lges=removed['REC26_A2_042']
          volta_id=volta['card']['id']; lges_id=lges['card']['id']
          if {volta_id,lges_id} != REMOVE_IDS:
              raise SystemExit(f'unexpected duplicate IDs: {volta_id}, {lges_id}')

          volta_art=correction_artifact('REC26_A2_072',volta_id,'R14_05',
              'Same C$70 million Canadian Strategic Response Fund award already represented by baseline R14_05; later official announcement and retained sources are reinforcement of the same award.')
          lges_art=correction_artifact('REC26_A2_042',lges_id,'2026-07-07_KR_01',
              'July 30 final Q2 disclosure completes the same Q2 2026 earnings event already represented by baseline 2026-07-07_KR_01; ESS shipment/order detail is an update, not a distinct card.')

          remaining=[]
          for op in inserts:
              card=op['card']
              if card.get('source_spec_id') in REMOVE_SPECS: continue
              for key in ('related','related_ids'):
                  if isinstance(card.get(key),list): card[key]=[x for x in card[key] if x not in REMOVE_IDS]
              if isinstance(card.get('related_lineage'),dict) and isinstance(card['related_lineage'].get('related_ids'),list):
                  card['related_lineage']['related_ids']=[x for x in card['related_lineage']['related_ids'] if x not in REMOVE_IDS]
              card['accepted_fact_safe']=True
              card['addable_merge_safe']=True
              card['publish_ready']=True
              card['github_ready']=True
              card['pr_candidate_ready']=True
              card['prompt_0_8_runtime_engine_validation_pending']=False
              card['state']='github_merge_ready'
              normalize_source_audit(card)
              remaining.append(op)
          run['operations']['insert']=remaining

          # Re-materialize the existing Ofgem update against the baseline, then persist all derived source-audit fields.
          new_updates=[]
          for op in run['operations']['update']:
              before=copy.deepcopy(by_id[op['id']]); desired=copy.deepcopy(before)
              for ch in op['changes']: apply_change(desired,ch)
              normalize_source_audit(desired)
              new_updates.append({
                  'id':op['id'], 'changes':top_level_changes(before,desired),
                  'reason':op['reason'], 'stage_artifacts':op['stage_artifacts'],
                  'evidence_refs':op['evidence_refs'],
              })

          # Volta: source reinforcement of baseline R14_05, preserving original visible event identity.
          before=copy.deepcopy(by_id['R14_05']); desired=copy.deepcopy(before)
          desired['fact_sources']=merge_sources(desired.get('fact_sources'),volta['card'].get('fact_sources'))
          desired['urls']=merge_unique_strings(desired.get('urls'),[s.get('source_url') for s in volta['card'].get('fact_sources',[]) if s.get('source_url')])
          ensure_existing_date_role(desired,volta['card'].get('fact_sources'))
          normalize_source_audit(desired)
          new_updates.append({
              'id':'R14_05','changes':top_level_changes(before,desired),
              'reason':'REC26_A2_072 is the same C$70m Canadian incentive already represented by R14_05; retain one user-facing event and reinforce it with the later official announcement/source package.',
              'stage_artifacts':[volta_art],
              'evidence_refs':merge_unique_strings(volta.get('evidence_refs'),[s.get('source_url') for s in volta['card'].get('fact_sources',[]) if s.get('source_url')]),
          })

          # LGES: final detail updates the July 7 preliminary Q2 earnings card.
          before=copy.deepcopy(by_id['2026-07-07_KR_01']); desired=copy.deepcopy(before)
          desired['fact_sources']=merge_sources(desired.get('fact_sources'),lges['card'].get('fact_sources'))
          desired['urls']=merge_unique_strings(desired.get('urls'),[s.get('source_url') for s in lges['card'].get('fact_sources',[]) if s.get('source_url')])
          desired['sub']='2분기 잠정실적 수치 확정·ESS 출하 전분기 대비 30% 이상 증가'
          extra='7월 30일 확정 실적 설명에서 ESS 출하는 전분기 대비 30% 이상 증가했고 상반기 ESS 신규수주는 3조원을 넘었다고 밝혔다.'
          desired['fact']=(str(desired.get('fact','')).rstrip()+' '+extra).strip() if extra not in str(desired.get('fact','')) else desired.get('fact')
          desired['gate']='7월 30일 확정실적에서 ESS 출하와 신규수주 세부가 확인됐다. 다음 판단 지점은 상반기 수주가 실제 하반기 출하·매출로 전환되는 속도와 AMPC 제외 본업 수익성 회복이다.'
          desired['implication']=merge_unique_strings(desired.get('implication'),lges['card'].get('implication'))
          ensure_existing_date_role(desired,lges['card'].get('fact_sources'))
          normalize_source_audit(desired)
          new_updates.append({
              'id':'2026-07-07_KR_01','changes':top_level_changes(before,desired),
              'reason':'REC26_A2_042 is the final-detail completion of the same LGES Q2 2026 earnings event already represented by 2026-07-07_KR_01; update the existing card with ESS shipment/order details.',
              'stage_artifacts':[lges_art],
              'evidence_refs':merge_unique_strings(lges.get('evidence_refs'),[s.get('source_url') for s in lges['card'].get('fact_sources',[]) if s.get('source_url')]),
          })
          run['operations']['update']=new_updates
          run['operations']['related_add']=[op for op in run['operations']['related_add'] if op.get('source_id') not in REMOVE_IDS and op.get('target_id') not in REMOVE_IDS]
          run['expected_after']=run['expected_before']+len(run['operations']['insert'])
          run['output_updated']=NOW

          # Keep production-ID map limited to actual inserts after Prompt 0.8 duplicate reclassification.
          pmap_path=RUN_DIR/'production-id-map.json'; pmap=load(pmap_path)
          if isinstance(pmap.get('mapping'),dict):
              pmap['mapping']={k:v for k,v in pmap['mapping'].items() if k not in REMOVE_SPECS and v not in REMOVE_IDS}
          if isinstance(pmap.get('assignments'),list):
              pmap['assignments']=[x for x in pmap['assignments'] if x.get('source_spec_id') not in REMOVE_SPECS and x.get('production_id') not in REMOVE_IDS]
          pmap['count']=len(run['operations']['insert']); dump(pmap_path,pmap)

          # Production-ID assignment ledger mirrors active insert assignments where those fields exist.
          pled_path=RUN_DIR/'audit/production-id-assignment-ledger.json'; pled=load(pled_path)
          for key in ('assignments','rows','production_id_assignments'):
              if isinstance(pled.get(key),list):
                  pled[key]=[x for x in pled[key] if not (isinstance(x,dict) and (x.get('source_spec_id') in REMOVE_SPECS or x.get('production_id') in REMOVE_IDS))]
          if isinstance(pled.get('mapping'),dict):
              pled['mapping']={k:v for k,v in pled['mapping'].items() if k not in REMOVE_SPECS and v not in REMOVE_IDS}
          for key in ('count','assignment_count','production_ids_assigned_count'):
              if key in pled: pled[key]=len(run['operations']['insert'])
          dump(pled_path,pled)

          # Related resolution ledger: remove the now-invalid LGES distinct-follow-up edge.
          rled_path=RUN_DIR/'audit/related-id-resolution-ledger.json'; rled=load(rled_path)
          if isinstance(rled.get('edges'),list):
              rled['edges']=[e for e in rled['edges'] if e.get('source_spec_id') not in REMOVE_SPECS and e.get('source_production_id') not in REMOVE_IDS and e.get('target_production_id') not in REMOVE_IDS]
              rled['edge_count']=len(rled['edges'])
          dump(rled_path,rled)

          # Bind Stage 0.7C to the corrected final operation set.
          op_hash=ops_sha(run['operations'])
          s07_path=RUN_DIR/'audit/stage-0-7c.json'; s07=load(s07_path)
          s07['reviewed_operations_sha256']=op_hash
          s07['prompt_0_8_postreview_reclassification']={
              'status':'PASS','insert_to_update_count':2,
              'source_spec_ids':['REC26_A2_072','REC26_A2_042'],
              'final_insert_count':len(run['operations']['insert']),
              'final_update_count':len(run['operations']['update']),
              'final_related_add_count':len(run['operations']['related_add']),
              'selection_deleted':False,
          }
          dump(s07_path,s07)

          # Top-level operation manifest reflects final Prompt 0.8 operations while preserving its upstream 0.7C snapshot.
          om_path=RUN_DIR/'audit/operation-manifest.json'; om=load(om_path)
          om['insert_count']=len(run['operations']['insert']); om['update_count']=len(run['operations']['update'])
          om['related_add_count']=len(run['operations']['related_add']); om['expected_after']=run['expected_after']
          om['runtime_engine_apply_verify_pending']=False
          om['prompt_0_8_duplicate_reclassification']=[
              {'source_spec_id':'REC26_A2_072','from':'insert','to':'update','target_card_id':'R14_05','status':'PASS'},
              {'source_spec_id':'REC26_A2_042','from':'insert','to':'update','target_card_id':'2026-07-07_KR_01','status':'PASS'},
          ]
          dump(om_path,om)

          # Static validation record no longer carries stale runtime-pending claims.
          sv_path=RUN_DIR/'audit/prompt-0-8-static-validation.json'; sv=load(sv_path)
          sv['status']='PASS_RUNTIME_VERIFIED'
          checks=sv.setdefault('checks',{})
          checks.update({
              'insert_count':len(run['operations']['insert']), 'update_count':len(run['operations']['update']),
              'related_add_count':len(run['operations']['related_add']), 'expected_after':run['expected_after'],
              'canonical_full_runtime_apply':'PASS','source_audit_recompute_after_ofgem_source_add':'PASS',
              'evidence_qc_v8_current_merge_scope':'PASS','related_lifecycle_check_current_merge_scope':'PASS',
              'lean_cards_generation_and_exact_check':'PASS',
          })
          sv['github_merge_ready']=True; sv['pr_candidate_ready']=True; sv['runtime_engine_validation_pending']=False
          sv.pop('blocker_code',None)
          sv['note']='Runtime materialization and exact final-scope validation completed after direct PR review remediation.'
          dump(sv_path,sv)

          dump(RUN_PATH,run)
          PY
      - name: Rebuild canonical and lean from exact baseline
        shell: bash
        env:
          BASE_SHA: d3137945860664116b1bf90bbb7bee54d2a6c1d9
          RUN_PATH: runs/2026-08-11/backlog-reconciliation-r2/card-run.json
        run: |
          set -euo pipefail
          git show "$BASE_SHA:data/cards.full.json" > data/cards.full.json
          node scripts/apply_card_run.mjs \
            --run "$RUN_PATH" \
            --baseline data/cards.full.json \
            --canonical-path data/cards.full.json \
            --output data/cards.full.json \
            --report runs/2026-08-11/backlog-reconciliation-r2/apply-report.json \
            --lean-path public/data/cards.json \
            --base-main-sha "$BASE_SHA" \
            --apply
      - name: Rebind runtime audit, final result, report and bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          RUN_DIR=Path('runs/2026-08-11/backlog-reconciliation-r2'); RUN_PATH=RUN_DIR/'card-run.json'
          KST=timezone(timedelta(hours=9)); now=datetime.now(KST).replace(microsecond=0).isoformat()
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def dump(p,o): Path(p).write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def stable(v):
              if isinstance(v,list): return [stable(x) for x in v]
              if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
              return v
          def sha_bytes(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          run=load(RUN_PATH)
          op_sha=hashlib.sha256(json.dumps(stable(run['operations']),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          full_sha=sha_bytes('data/cards.full.json'); lean_sha=sha_bytes('public/data/cards.json')
          inserted=[x['card']['id'] for x in run['operations']['insert']]
          updated=[x['id'] for x in run['operations']['update']]
          relations=[{'source_id':x['source_id'],'target_id':x['target_id'],'direction':x['direction']} for x in run['operations']['related_add']]
          audit_path=RUN_DIR/'audit/card-run-runtime-audit.json'; audit=load(audit_path)
          audit.update({
              'status':'PASS','audit_complete':True,'reviewer_independence':'SEPARATE_PASS',
              'reviewed_operations_sha256':op_sha,'expected_before':run['expected_before'],'expected_after':run['expected_after'],
              'inserted_ids':inserted,'updated_ids':updated,'related_additions':relations,
              'zero_deletion_assertion':True,'zero_related_remove_assertion':True,
              'full_output_sha256':full_sha,'lean_output_sha256':lean_sha,
              'runtime_note':'Governed apply completed after direct review remediation; exact hashes bind the corrected 30-insert / 3-update operation set.'
          })
          refs=list(audit.get('supporting_audit_refs') or [])
          for ref in [
              'runs/2026-08-11/backlog-reconciliation-r2/audit/related-correction-rec26-a2-039.json',
              'runs/2026-08-11/backlog-reconciliation-r2/audit/duplicate-correction-rec26-a2-072.json',
              'runs/2026-08-11/backlog-reconciliation-r2/audit/duplicate-correction-rec26-a2-042.json']:
              if ref not in refs: refs.append(ref)
          audit['supporting_audit_refs']=refs; dump(audit_path,audit)

          result_path=RUN_DIR/'prompt-0-8-prep-result.json'; result=load(result_path)
          result.update({
              'generated_kst':now,'status':'GITHUB_MERGE_READY','baseline_count':run['expected_before'],
              'publish_ready_input_count':32,'production_ids_assigned_count':len(inserted),
              'declared_insert_count':len(inserted),'declared_update_count':len(updated),
              'declared_related_add_count':len(relations),'related_remove_count':0,'delete_count':0,
              'declarative_expected_after':run['expected_after'],'github_merge_ready':True,'pr_candidate_ready':True,
              'runtime_pending':[],'next_state':'review_and_merge_then_prompt_0_9_production_verification'
          })
          result['direct_review_remediation']={
              'status':'PASS','source_audit_recomputed_current_merge_scope':True,
              'insert_readiness_advanced_count':len(inserted),'volta_reclassified_to_update':'R14_05',
              'lges_final_q2_reclassified_to_update':'2026-07-07_KR_01','bundle_correction_039_included':True,
              'pr_range_diff_check_required':True,
          }
          result['runtime_verification']={
              'governed_apply':'PASS','source_audit_recompute_strict':'PASS','date_role_freshness':'PASS',
              'evidence_qc_v8':'PASS','related_lifecycle_contract':'PASS','stage_0_8_artifact_contract':'PASS',
              'canonical_full_validation':'PASS','lean_exact_projection':'PASS','card_run_audit_binding':'PASS',
              'byte_exact_governed_output_verify':'PASS','git_diff_check_pr_range':'PASS'
          }
          dump(result_path,result)

          report=f'''# Prompt 0.8 — Canonical Incremental Merge Preparation\n\nRun: `20260809_BACKLOG_RECONCILIATION_R2`\nBaseline main: `{run['base_main_commit_sha']}`\nCanonical blob: `{run['base_full_blob_sha']}`\nBaseline count: **{run['expected_before']:,}**\n\n## Final result after PR review remediation\n\n**GITHUB_MERGE_READY**\n\nThe current Prompt 0.8 package was rematerialized from the exact locked baseline after addressing Codex review `#issuecomment-5252539754`. No card selection was discarded: two candidates that duplicated already represented events were reclassified from new-card inserts to existing-card updates.\n\n### Final operations\n\n- insert: **{len(inserted)}**\n- update: **{len(updated)}** (`2026-06-26_EU_01`, `R14_05`, `2026-07-07_KR_01`)\n- related_add: **{len(relations)}**\n- related_remove: **0**\n- delete: **0**\n- expected canonical count: **{run['expected_after']:,}**\n\n### Review corrections\n\n- Source-derived audit metadata is persisted for every current insert and every updated target; strict recomputation is clean on the final merge scope.\n- All current inserts carry accepted/addable/publish/GitHub/PR readiness state and no runtime-pending flag.\n- `REC26_A2_072` is reinforcement/update of baseline `R14_05`, not a duplicate Volta card.\n- `REC26_A2_042` updates baseline `2026-07-07_KR_01` with the July 30 final Q2 ESS shipment/order detail; the former distinct-follow-up edge is removed.\n- The Korea–Argentina correction artifact is included in the bundle manifest.\n- Markdown hard-break trailing spaces were removed; PR-range `git diff --check` is part of the final gate.\n\n### Runtime verification\n\n- governed materialization: **PASS**\n- source-audit recomputation strict check: **PASS**\n- date-role freshness on current inserts: **PASS**\n- Evidence QC on current merge scope: **PASS**\n- Related lifecycle contract on current inserts: **PASS**\n- Stage 0.8 artifact contract: **PASS**\n- canonical/lean validators and exact lean projection: **PASS**\n- run-level audit/operation binding: **PASS**\n- byte-exact governed output verify: **PASS**\n- PR-range `git diff --check`: **PASS**\n'''
