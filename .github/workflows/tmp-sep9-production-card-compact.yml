name: tmp-sep9-production-card-compact
on:
  push:
    branches: [chatgpt/sep9-r1-current-main-production-r1]
    paths: [.github/workflows/tmp-sep9-production-card-compact.yml]
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/production-cards.detail.json')
          d=json.loads(p.read_text())
          rows=[]
          for c in d['cards']:
              rows.append({k:c.get(k) for k in ['id','source_spec_id','source_event_id','source_story_ids','region','date','cat','sub_cat','signal','title','sub','gate','urls']})
          out=Path('runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/production-cards.compact.json')
          out.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/production-cards.compact.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: compact Sep9 production candidate summary'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
