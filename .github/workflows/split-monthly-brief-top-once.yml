name: split-monthly-brief-top-once

on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-08
    paths:
      - "scripts/split_monthly_brief_top_once.mjs"
      - ".github/workflows/split-monthly-brief-top-once.yml"

permissions:
  contents: write

jobs:
  split:
    if: ${{ !contains(github.event.head_commit.message, '[monthly-brief-top-split]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-08
      - run: node scripts/split_monthly_brief_top_once.mjs
      - name: Commit compact top/high views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/monthly_brief_2026-08_top_*.json tmp/monthly_brief_2026-08_high_index.json
          git commit -m "chore: split August Monthly Brief evidence views [monthly-brief-top-split]"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-08
