name: Sep8 nested provenance repair
on:
  push:
    branches: [chatgpt/sep8-provenance-nested-repair]
    paths: ['.github/workflows/sep8-provenance-nested-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Re-lock merged main and repair only nested provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          MAIN=4a3142adb66e1c04eb10806315932bea87b73b70
          FINAL=b197b31fbe1d58c1318461b83de6c8ba4d0dd6c2020d03f04046a45bab88e4e7
          OLD=09bac68f66d83a8fb997e7eb93787cd21ec5ed998c4d240bb860cd4b03feae37
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(sha256sum data/cards.full.json | awk '{print $1}')" = 9584cee08b1f670199c77d84adbe24f4e7656c84f31c992965edd3e112b8d974
          test "$(sha256sum public/data/cards.json | awk '{print $1}')" = 47fbda218c4484dcd747e8e0c90329ea34085839d20a617ee12d4bce3f45f5cd
          python - <<'PY'
          import json, pathlib
          R=pathlib.Path('runs/2026-09-09/sep8-r7-current-main-production-r1')
          FINAL='b197b31fbe1d58c1318461b83de6c8ba4d0dd6c2020d03f04046a45bab88e4e7'
          OLD='09bac68f66d83a8fb997e7eb93787cd21ec5ed998c4d240bb860cd4b03feae37'
          files=[R/'stage-0-7c.json', R/'stage-0-8.json']
          def count_value(o, value):
            if isinstance(o, dict): return sum((1 if v==value else count_value(v,value)) for v in o.values())
            if isinstance(o, list): return sum(count_value(v,value) for v in o)
            return 0
          def bind(o):
            if isinstance(o, dict):
              for k,v in list(o.items()):
                if k=='reviewed_operations_sha256': o[k]=FINAL
                else: bind(v)
            elif isinstance(o, list):
              for v in o: bind(v)
          seven=json.load(open(files[0])); eight=json.load(open(files[1]))
          assert seven['reviewed_operations_sha256']==FINAL
          assert seven['operation_freeze']['reviewed_operations_sha256']==OLD
          assert seven['round_6_operation_binding']['reviewed_operations_sha256']==OLD
          assert count_value(seven,OLD)==2, count_value(seven,OLD)
          assert eight['reviewed_operations_sha256']==FINAL
          assert eight['certified_0_7c']['reviewed_operations_sha256']==OLD
          old8=count_value(eight,OLD)
          assert old8==19, old8
          bind(seven); bind(eight)
          assert count_value(seven,OLD)==0 and count_value(eight,OLD)==0
          assert seven['reviewed_operations_sha256']==seven['operation_freeze']['reviewed_operations_sha256']==seven['round_6_operation_binding']['reviewed_operations_sha256']==FINAL
          assert eight['reviewed_operations_sha256']==eight['certified_0_7c']['reviewed_operations_sha256']==FINAL
          ready=eight['github_merge_ready']; assert len(ready)==18
          assert all(x['merge_prep']['reviewed_operations_sha256']==FINAL for x in ready)
          for p,d in zip(files,[seven,eight]): p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('NESTED_PROVENANCE_REPAIRED', {'stage_0_7c_old_bindings':2,'stage_0_8_old_bindings':old8,'final_sha':FINAL})
          PY
      - name: Validate metadata-only repair and unchanged canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          R=runs/2026-09-09/sep8-r7-current-main-production-r1
          FINAL=b197b31fbe1d58c1318461b83de6c8ba4d0dd6c2020d03f04046a45bab88e4e7
          test "$(sha256sum data/cards.full.json | awk '{print $1}')" = 9584cee08b1f670199c77d84adbe24f4e7656c84f31c992965edd3e112b8d974
          test "$(sha256sum public/data/cards.json | awk '{print $1}')" = 47fbda218c4484dcd747e8e0c90329ea34085839d20a617ee12d4bce3f45f5cd
          python validation_scripts/stage_artifact_contract_check.py 0.8 "$R/stage-0-8.json"
          node scripts/validate_card_run_stage_artifacts.mjs --run "$R/card-run.json"
          node scripts/validate_card_run_v4_hardening.mjs --run "$R/card-run.json"
          node scripts/validate_card_run_status_consistency.mjs --run "$R/card-run.json"
          python - <<'PY'
          import json
          R='runs/2026-09-09/sep8-r7-current-main-production-r1/'
          F='b197b31fbe1d58c1318461b83de6c8ba4d0dd6c2020d03f04046a45bab88e4e7'
          s=json.load(open(R+'stage-0-7c.json')); m=json.load(open(R+'stage-0-8.json'))
          assert s['reviewed_operations_sha256']==s['operation_freeze']['reviewed_operations_sha256']==s['round_6_operation_binding']['reviewed_operations_sha256']==F
          assert m['reviewed_operations_sha256']==m['certified_0_7c']['reviewed_operations_sha256']==F
          assert len(m['github_merge_ready'])==18 and all(x['merge_prep']['reviewed_operations_sha256']==F for x in m['github_merge_ready'])
          print('EXACT_NESTED_BINDING_PASS', {'stage_0_7c':3,'stage_0_8':20,'operation_sha256':F})
          PY
          git diff --check
          test -z "$(git diff --name-only | grep -v -E '^runs/2026-09-09/sep8-r7-current-main-production-r1/(stage-0-7c|stage-0-8)\.json$' || true)"
      - name: Commit metadata-only repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sep8-provenance-nested-repair.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Sep 8 nested operation provenance bindings'
          git push origin HEAD:chatgpt/sep8-provenance-nested-repair
