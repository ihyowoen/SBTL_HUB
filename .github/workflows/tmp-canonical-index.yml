name: tmp-canonical-index
on:
  push:
    branches:
      - agent/tmp-stage00d-read-20260808
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate compact canonical index from locked main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin d3137945860664116b1bf90bbb7bee54d2a6c1d9
          git show d3137945860664116b1bf90bbb7bee54d2a6c1d9:data/cards.full.json > /tmp/cards.full.json
          python - <<'PY'
          import json, pathlib
          d=json.load(open('/tmp/cards.full.json',encoding='utf-8'))
          out=[]
          for c in d['cards']:
              ef=c.get('event_fingerprint') or {}
              out.append({
                'id':c.get('id'), 'date':c.get('date'), 'region':c.get('region'),
                'title':c.get('title'), 'sub':c.get('sub'),
                'urls':c.get('urls') or [], 'source_story_ids':c.get('source_story_ids') or [],
                'related':c.get('related') or [],
                'event_fingerprint':{k:ef.get(k) for k in ['actor','asset_or_policy','location','event_type','event_date','factual_anchor']}
              })
          obj={'base_main_commit_sha':'d3137945860664116b1bf90bbb7bee54d2a6c1d9','base_full_blob_sha':'a52745170c70aa649323e346413615c5995b890b','total':d['total'],'cards':out}
          pathlib.Path('canonical-reconciliation-index.json').write_text(json.dumps(obj,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'total':len(out),'main':obj['base_main_commit_sha'],'blob':obj['base_full_blob_sha']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-reconciliation-index
          path: canonical-reconciliation-index.json
          if-no-files-found: error
