name: Apply review 4871316119 fix

on:
  push:
    branches:
      - agent/review-4870635557-related-assertions
    paths:
      - .github/workflows/review-4871316119-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-4870635557-related-assertions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded Related patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("validation_scripts/related_lifecycle_check.py")
          text = path.read_text(encoding="utf-8")
          marker = '_KNOWN_SINGLE_TOKEN_ENTITY_NAMES = {"tesla", "acme"}\n'
          addition = '''_KNOWN_SINGLE_TOKEN_ENTITY_NAMES = {"tesla", "acme"}\n_KNOWN_KOREAN_SINGLE_TOKEN_ENTITY_NAMES = {\n    "삼성", "현대", "기아", "포스코", "한화", "두산", "롯데", "에코프로",\n    "엘지", "금양", "천보", "율촌화학", "동화기업", "한국전력",\n    "수출입은행", "산업통상자원부",\n}\n_KOREAN_ENTITY_CLASS_TERMS = {\n    "프로젝트", "사업", "공장", "플랜트", "시설", "법인", "컨소시엄",\n    "센터", "단지", "기지", "연구원", "위원회", "은행",\n}\n_KOREAN_ENTITY_SUFFIXES = (\n    "주식회사", "에너지솔루션", "솔루션", "퓨처엠", "비엠", "화학",\n    "전자", "전력", "산업", "소재", "배터리", "모빌리티", "홀딩스",\n    "테크놀로지", "테크", "공사", "연구원", "위원회", "은행", "그룹",\n)\n'''
          if text.count(marker) != 1:
              raise SystemExit("single-token entity marker not found exactly once")
          text = text.replace(marker, addition)

          old = '''        # Korean/mixed-script proper names have no capitalization signal. Once\n        # neutral role/modifier vocabularies are removed, a substantive Hangul\n        # token is treated as an identifiable named subject.\n        if _prior._base.re.search(r"[가-힣]", original):\n            return True\n'''
          new = '''        # Hangul has no capitalization signal, so require an affirmative\n        # company/institution or class-bound project/facility cue. Unknown\n        # Korean modifiers and adverbs remain fail-closed.\n        if _prior._base.re.search(r"[가-힣]", original):\n            korean_base = original[:-1] if original.endswith("의") else original\n            next_is_entity_class = (\n                index + 1 < len(normalized_role_tokens)\n                and normalized_role_tokens[index + 1] in _KOREAN_ENTITY_CLASS_TERMS\n            )\n            has_entity_suffix = any(\n                korean_base.endswith(suffix) and len(korean_base) > len(suffix)\n                for suffix in _KOREAN_ENTITY_SUFFIXES\n            )\n            if (\n                subject_token in _KNOWN_KOREAN_SINGLE_TOKEN_ENTITY_NAMES\n                or next_is_entity_class\n                or has_entity_suffix\n            ):\n                return True\n            continue\n'''
          if text.count(old) != 1:
              raise SystemExit("blanket Hangul acceptance block not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("validation_scripts/tests/test_review_4871316119_contracts.py")
          test_path.write_text('''import unittest\n\nfrom validation_scripts import related_lifecycle_check as related\n\n\nclass TestReview4871316119Contracts(unittest.TestCase):\n    @staticmethod\n    def _strict_follow_up(assertion):\n        parent = {"id": "PARENT", "date": "2026-04-01", "related": []}\n        child = {\n            "id": "CHILD",\n            "date": "2026-07-01",\n            "related": ["PARENT"],\n            "publish_ready": True,\n            "related_lineage": {\n                "status": "PASS",\n                "relation_type": "distinct_follow_up",\n                "related_ids": ["PARENT"],\n                "reason": "The verified development changes the predecessor assessment.",\n                "same_event_checked": True,\n                "earliest_same_event_date_checked": True,\n                "fresh_follow_up_anchor_class": "data_financial_anchor",\n                "fresh_follow_up_anchor": assertion,\n                "incremental_fact_vs_predecessor": assertion,\n                "changed_judgment_vs_predecessor": assertion,\n            },\n        }\n        return child, {"PARENT": parent, "CHILD": child}\n\n    def _assert_failure(self, assertion):\n        self.assertFalse(related.item_specific_lineage_assertion(assertion))\n        child, by_id = self._strict_follow_up(assertion)\n        errors, warnings = related.check_card(child, by_id, require_contract=True)\n        self.assertEqual([], warnings)\n        self.assertIn("distinct_follow_up requires item-specific fresh_follow_up_anchor", errors)\n\n    def _assert_success(self, assertion):\n        self.assertTrue(related.item_specific_lineage_assertion(assertion))\n        child, by_id = self._strict_follow_up(assertion)\n        errors, warnings = related.check_card(child, by_id, require_contract=True)\n        self.assertEqual([], warnings)\n        self.assertEqual([], errors)\n\n    def test_unknown_hangul_modifiers_do_not_become_entities(self):\n        for assertion in (\n            "대폭 설비투자 감축",\n            "급격히 영업이익 감소",\n            "예상보다 수율 하락",\n            "이례적으로 처리량 증가",\n        ):\n            with self.subTest(assertion=assertion):\n                self._assert_failure(assertion)\n\n    def test_positive_korean_entity_signals_remain_supported(self):\n        for assertion in (\n            "에코프로비엠 설비투자 감축",\n            "율촌화학 영업이익 감소",\n            "울산 공장 수율 개선",\n            "새만금 프로젝트 처리량 증가",\n            "산업통상자원부 전망 개선",\n        ):\n            with self.subTest(assertion=assertion):\n                self._assert_success(assertion)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY
      - name: Validate patch
        shell: bash
        run: |
          python -m compileall -q validation_scripts
          python -m unittest discover -s validation_scripts/tests -v
          python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/review-4871316119-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_scripts/related_lifecycle_check.py validation_scripts/tests/test_review_4871316119_contracts.py .github/workflows/review-4871316119-fix.yml
          git commit -m "fix: require positive Korean Related subjects"
          git push origin HEAD:agent/review-4870635557-related-assertions
