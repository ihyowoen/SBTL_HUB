name: Patch review 4839991362

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_structural_v3_review_4839991362.py
      - .github/workflows/patch-review-4839991362.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python scripts/patch_structural_v3_review_4839991362.py

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run workflow-contract regression tests
        run: python -m unittest validation_scripts.tests.test_workflow_contracts

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: preserve canonical V3 package across QC stages"
          git push origin HEAD:agent/structural-news-value-v3
