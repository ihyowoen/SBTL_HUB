name: tmp-inspect-codex-290

on:
  push:
    branches:
      - chatgpt/fix-codex-review-5051253059
    paths:
      - .github/workflows/tmp-inspect-codex-290.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect target date groups and references
        run: |
          python <<'PY'
          import json
          p='data/cards.full.json'
          d=json.load(open(p,encoding='utf-8'))
          cards=d['cards']
          print('TOTAL', d['total'], len(cards))
          for dt in ['2026-07-31','2024-04-02','2024-04-03']:
            print('\nGROUP', dt, 'KR')
            for c in cards:
              if c.get('date')==dt and c.get('region')=='KR':
                print(json.dumps({k:c.get(k) for k in ['id','assigned_id','source_spec_id','signal','title','date']}, ensure_ascii=False))
          targets={'2026-07-31_KR_02','2026-07-31_KR_03','2026-07-31_KR_04','2024-04-03_KR_01'}
          print('\nRELATED REFERENCES')
          for c in cards:
            hits=[x for x in c.get('related',[]) if x in targets]
            if hits:
              print(c['id'], hits, c.get('title'))
          by={c['id']:c for c in cards}
          lotte=by['2024-04-03_KR_01']
          print('\nLOTTE VISIBLE')
          for k in ['title','sub','gate','fact','implication']:
            print(k,'=',json.dumps(lotte.get(k),ensure_ascii=False))
          print('\nLOTTE DATE_ROLE',json.dumps(lotte.get('date_role'),ensure_ascii=False))
          print('LOTTE EVENT_FP',json.dumps(lotte.get('event_fingerprint'),ensure_ascii=False))

          needles={'2024-04-03_KR_01','2024-04-03','2026-07-31_KR_02','2026-07-31_KR_03','2026-07-31_KR_04'}
          print('\nEXACT STRING OCCURRENCES')
          def walk(x,path='$'):
            if isinstance(x,dict):
              for k,v in x.items(): walk(v,f'{path}.{k}')
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,f'{path}[{i}]')
            elif isinstance(x,str) and x in needles:
              print(x,path)
          walk(d)
          PY