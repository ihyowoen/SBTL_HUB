name: tmp-pr380-review5219397073-v4
on:
  push:
    paths:
      - '.github/workflows/tmp-pr380-review5219397073-v4.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch final Codex findings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const publicPath='public/data/monthly_briefs.json';
          const auditPath='runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json';
          const cardsPath='data/cards.full.json';
          const lib=JSON.parse(fs.readFileSync(publicPath,'utf8'));
          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const root=JSON.parse(fs.readFileSync(cardsPath,'utf8'));
          const cards=Array.isArray(root)?root:(root.cards||root.items||[]);
          const issue=lib.items.find(x=>x.id==='monthly-brief-2026-06-r1');
          if(!issue) throw new Error('June issue not found');
          const flow=id=>issue.key_flows.find(x=>x.id===id);
          const evidenceIds=['2026-05-13_CN_01','2026-05-13_EU_01','2026-05-08_US_01','2026-05-11_US_03','2026-05-15_US_01'];
          for(const id of evidenceIds){const c=cards.find(x=>x.id===id); if(!c||!String(c.date||'').startsWith('2026-05')) throw new Error('missing '+id);}
          const uniq=xs=>[...new Set(xs)];

          issue.executive_diagnosis='5월 말까지 ESS는 이미 대형 공급계약·프로젝트금융·장주기 조달·상업운전이 동시에 늘고 있었고, AI·데이터센터도 일부 저장 수요와 연결되기 시작했다. 6월의 변화는 이 흐름이 새로 생긴 것이 아니라 tolling·용량계약처럼 수익구조가 더 다양하고 구체적인 형태로 전개되고 제도·기술 단계가 한층 세분화됐다는 데 있다. 5년·20년 tolling과 20년 용량계약, 세액공제 지분금융이 이어졌고 8~10시간 저장과 LDES 정책선정이 전면에 나왔다. 차세대 저장에서는 5월에도 나트륨이온 공급계약·양산계획·가동 프로젝트가 이미 존재한 가운데 6월 CATL 제품의 인도 일정이 후속으로 구체화됐고, 전고체는 실차시험으로 단계 전진했다. CO₂·철공기 상업계약은 6월에 추가된 별도 상업계약 신호다. 공급망도 5월부터 공공조달·재정지원 적격성, 외국인투자 조건, FEOC 대응과 정책금융 등 기업·거래 단위 규칙이 존재했고, 6월에는 중국의 명단형 통제·조달제한, G7 지원수단 검토, EU EV 셀 생산금융 등 다른 거래규칙이 추가로 분화했다.';
          issue.what_changed='5월 canonical 214건을 기준으로 보면 ESS의 성장, 금융조달, 장주기 조달과 AI 연계 수요는 이미 확인되고 있었다. 또 일본에서는 19개 배터리저장 프로젝트 1,251MW가 20년 고정수익 계약을 확보해 장기계약 자체도 이미 존재했다. 6월에는 그 방향성이 계약기간의 단순 연장이 아니라 수익구조의 형태와 저장시간, 제도 실행단계에서 더 구체화됐다. 5년·20년 tolling과 20년 용량계약 같은 서로 다른 수익계약 구조가 추가로 확인됐다. 장주기 정책에서는 5월 조달 신호가 6월 영국 Ofgem의 LDES 16개 프로젝트 잠정선정으로 구체화됐고, 이와 별개로 EU 17개국의 비구속 저장 배치 공약은 LDES로 한정되지 않은 기술중립적 일반 저장정책 신호로 추가됐다. 차세대 기술도 하나의 단계전진으로 묶이지 않는다. 나트륨이온은 5월부터 공급계약·양산계획·가동 신호가 있었고 6월 CATL의 인도 일정은 제품별 후속 구체화다. 전고체는 실차검증으로 단계가 전진했으며, CO₂·철공기 계약은 6월에 새로 확인된 별도 상업계약 신호다. 공급망·현지화 역시 기업단위 규칙이 6월에 처음 나타난 것이 아니라 5월의 공공조달·재정지원 적격성, 외국인투자 조건, FEOC 대응과 정책금융 위에 6월의 명단형 통제·G7 지원검토·EV 셀 생산금융·기술 라이선스·재생원료 인증·배터리패스포트가 추가로 분화한 것으로 본다. AI·데이터센터는 5월부터 이어진 선택적 전력인프라 수요축을 보강했을 뿐 6월 ESS 전체를 설명하는 단일 원인은 아니다. SBTL 관점에서도 ESS·LFP 성장만으로 파우치필름 수요를 자동 환산하지 않으며, 실제 셀 폼팩터·고객프로그램·필름 공급계약이 확인될 때만 직접 수요 신호로 본다.';

          flow('03').title='차세대 저장, 5월부터 엇갈린 실행단계가 6월 제품후속·실차검증·신규 계약으로 더 분화';
          flow('03').summary='5월 나트륨이온은 이미 3년 60GWh 공급계약, 4분기 양산계획과 100MW·200MWh 나트륨 BESS 가동 신호가 있어 단순 전망 단계로 볼 수 없다. 따라서 6월 CATL의 나트륨이온 ESS 9월 중국 인도 일정과 연내 1GWh 목표는 기술 전체의 단계상승이 아니라 특정 제품의 후속 구체화로 본다. 반면 전고체는 5월 본격 실증 전 전망에서 Factorial이 Stellantis 차량 통합 후 도로시험에 들어가 단계 전진이 확인됐다. Energy Dome·Google의 아일랜드 23MW·200MWh CO₂ 배터리 상업계약과 Ore Energy·Budget Thuis의 철공기 ESS 1GWh 계약은 5월 연속선으로 과장하지 않고 6월에 추가된 별도 상업계약 신호로 본다. 기술별로 기존 실행수준과 고객계약·인도·실차시험·COD를 분리해 후속 단계를 확인해야 한다.';
          flow('04').title='공급망, 5월부터 기업·거래 단위 규칙이 존재…6월 명단형 통제·지원수단으로 추가 분화';
          flow('04').summary='5월에도 EU의 공공조달·재정지원 적격성 조건과 외국인투자 심사 조건, FEOC 대응 지분구조 조정, 미국의 기업별 정책금융처럼 기업·거래 단위 규칙이 이미 존재했다. 따라서 6월을 거시 리스크가 처음 거래규칙으로 내려온 달로 보지 않는다. 6월에는 중국이 미국 기업 10곳을 이중용도 수출통제 대상에 올리고 별도의 46개 미국 기업 제품에 정부조달 금지를 적용했으며, G7은 가격격차 보조·공동조달·가격하한을 검토수단으로 제시했다. EU는 EEA 내 연 10GWh 이상 EV 배터리 셀 생산 프로젝트를 대상으로 15억유로 무이자대출 시설을 출범시켰다. 즉 기업단위 규칙의 존재 자체가 아니라 명단형 제한·지원수단·생산금융의 조합이 추가로 분화한 것이 6월의 변화다.';
          issue.watch=issue.watch.map(x=>{
            if(x.includes('Ofgem')) return '영국 Ofgem의 LDES 16개 프로젝트 잠정선정이 실제 지원계약·인허가·투자로 전환되는지 추적한다. EU 17개국의 비구속 저장 배치 공약은 LDES로 한정되지 않은 기술중립적 일반 저장정책 신호로 별도 추적한다.';
            if(x.includes('나트륨이온')&&x.includes('전고체')) return '5월부터 계약·양산계획·가동 신호가 있었던 나트륨이온은 6월 제품별 인도 일정이 실제 납품·양산으로 이어지는지 보고, 전고체는 실차시험 이후 검증단계를 추적한다. 6월에 별도 상업계약 신호가 확인된 CO₂·철공기는 계약이 착공·납품·COD로 전환되는지 구분해 확인한다.';
            return x;
          });

          const baseline=audit.previous_month_baseline?.baseline_state;
          if(!Array.isArray(baseline)) throw new Error('baseline_state missing');
          const nextGen=baseline.find(x=>String(x.theme).toLowerCase().includes('next-generation'));
          const supply=baseline.find(x=>String(x.theme).toLowerCase().includes('localization and supply-chain'));
          if(!nextGen||!supply) throw new Error('baseline themes missing');
          nextGen.theme='Next-generation technology already showed uneven maturity by technology';
          nextGen.finding='May sodium-ion already included a three-year 60GWh supply contract, a Q4 mass-production plan and a commissioned 100MW/200MWh sodium BESS, while solid-state remained short of full demonstration. June sodium-ion is therefore a product-specific follow-up, not a sector-wide stage upgrade; solid-state road testing is the clearer May→June stage advance.';
          nextGen.evidence_card_ids=uniq(['2026-05-13_CN_01',...(nextGen.evidence_card_ids||[])]);
          supply.theme='Supply-chain policy already included company- and transaction-level rules';
          supply.finding='May combined macro concentration/mineral risk with company- and transaction-level rules, including EU public-procurement / financial-support eligibility and foreign-investment conditions, FEOC-linked ownership restructuring and named U.S. policy financing. June adds different named-company lists, considered support tools and EV-cell production finance rather than introducing transaction-level rules for the first time.';
          supply.evidence_card_ids=uniq([...(supply.evidence_card_ids||[]),'2026-05-13_EU_01','2026-05-08_US_01','2026-05-11_US_03','2026-05-15_US_01']);

          const d3=audit.delta_classification.find(x=>x.flow_id==='03');
          const d4=audit.delta_classification.find(x=>x.flow_id==='04');
          if(!d3||!d4) throw new Error('delta classifications missing');
          d3.classification='MIXED_CONTINUATION_STAGE_ADVANCE_PLUS_JUNE_NEW_SIGNAL';
          d3.may_state='Sodium-ion already had a 60GWh supply contract, Q4 mass-production plan and a commissioned 100MW/200MWh BESS; solid-state remained pre-full-demonstration. The May baseline does not establish CO₂ or iron-air progression anchors.';
          d3.june_change='CATL sodium-ion delivery scheduling is a product-specific follow-up within an already executing technology; solid-state road testing is the clearer stage advance; CO₂ and iron-air contracts are separate June commercial-contract signals.';
          d4.classification='TRANSACTION_LEVEL_RULES_DIVERSIFIED';
          d4.may_state='Macro concentration/mineral risk coexisted with transaction-level rules: EU public-procurement / financial-support eligibility, foreign-investment conditions, FEOC-linked ownership restructuring and named policy financing were already present.';
          d4.june_change='June adds a different mix of named-company export/procurement lists, considered G7 support tools and EU EV-cell production finance. The delta is diversification of transaction-level instruments, not first-time operationalization.';

          audit.codex_review_5219397073_remediation={
            review_id:5219397073,
            reviewed_head:'7d8fedd86578f2b4974cfaa63596f35f3b171af6',
            may_baseline_additions:{
              sodium_execution:['2026-05-13_CN_01'],
              eu_procurement_investment:['2026-05-13_EU_01'],
              feoc_restructuring:['2026-05-08_US_01','2026-05-11_US_03'],
              named_policy_financing:['2026-05-15_US_01']
            },
            findings_addressed:[
              'technology_specific_progression_split',
              'eu_general_storage_pledge_separated_from_ldes',
              'may_sodium_execution_added_june_product_followup',
              'may_transaction_level_rules_added_june_instrument_diversification'
            ]
          };

          const pub=JSON.stringify(issue);
          if(pub.includes('1260H')) throw new Error('1260H leaked');
          if(!issue.what_changed.includes('기술중립적 일반 저장정책')) throw new Error('EU split missing');
          if(!flow('03').summary.includes('3년 60GWh')) throw new Error('sodium May baseline missing');
          if(!flow('04').summary.includes('5월에도')) throw new Error('supply May baseline missing');
          for(const id of evidenceIds) if(!JSON.stringify(audit).includes(id)) throw new Error('audit evidence missing '+id);
          fs.writeFileSync(publicPath,JSON.stringify(lib,null,2)+'\n');
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          NODE
      - name: Validate all
        run: |
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
      - name: Commit content and cleanup helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git commit -m 'fix: correct May baseline in June delta'
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
          git rm .github/workflows/tmp-pr380-review5219397073.yml .github/workflows/tmp-pr380-review5219397073-v2.yml .github/workflows/tmp-pr380-may-eu-scan.yml .github/workflows/tmp-pr380-review5219397073-v3.yml .github/workflows/tmp-pr380-review5219397073-v4.yml
          git commit -m 'chore: remove PR380 review helpers'
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
