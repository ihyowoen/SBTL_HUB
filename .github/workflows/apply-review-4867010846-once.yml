name: Apply review 4867010846 once

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - ".github/workflows/apply-review-4867010846-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python scripts/patch_review_4867010846.py

      - name: Run focused review checks
        run: |
          python - <<'PY'
          from validation_scripts import stage_lineage_contract_check as lineage

          assert lineage._has_bound_interpretation_effect(
              "The filing, although late, would strengthen the current demand outlook"
          )
          assert lineage._has_bound_interpretation_effect(
              "Although unrelated facts changed, the filing would strengthen the current demand outlook"
          )
          assert not lineage._has_bound_interpretation_effect(
              "Although unrelated facts changed, Project Alpha production weakened if the current demand outlook improved"
          )
          assert not lineage._has_bound_interpretation_effect(
              "The filing, although late, Project Alpha production weakened if the current demand outlook improved"
          )
          PY

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit patch and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_review_4867010846.py .github/workflows/apply-review-4867010846-once.yml
          git add validation_scripts/stage_lineage_contract_check.py
          git commit -m "fix: preserve main clauses across nested concessions"
          git push origin HEAD:agent/structural-news-value-v3
