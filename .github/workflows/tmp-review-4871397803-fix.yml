name: Temporary review 4871397803 fix

on:
  push:
    branches:
      - agent/review-4870635557-related-assertions
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-4870635557-related-assertions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('validation_scripts/related_lifecycle_check.py')
          text = target.read_text(encoding='utf-8')

          marker = '''_KOREAN_ENTITY_CLASS_TERMS = {
              "프로젝트", "사업", "공장", "플랜트", "시설", "법인", "컨소시엄",
              "센터", "단지", "기지", "연구원", "위원회", "은행",
          }
'''
          replacement = marker + '''_COMPARATIVE_OR_PERIOD_ACRONYMS = {
              "yoy", "qoq", "mom", "wow", "ytd", "qtd", "mtd", "ttm", "ltm",
          }
          _KNOWN_KOREAN_CLASS_BOUND_IDENTIFIERS = {
              "울산", "새만금", "포항", "광양", "구미", "오창", "청주", "평택",
              "화성", "이천", "천안", "아산", "당진", "서산", "군산", "익산",
              "전주", "여수", "나주", "창원", "부산", "대구", "인천", "서울",
              "대전", "판교", "제주",
          }
'''
          if marker not in text:
              raise SystemExit('Korean entity-class marker not found')
          text = text.replace(marker, replacement, 1)

          old_korean = '''            next_is_entity_class = (
                index + 1 < len(normalized_role_tokens)
                and normalized_role_tokens[index + 1] in _KOREAN_ENTITY_CLASS_TERMS
            )
'''
          new_korean = '''            next_is_entity_class = (
                index + 1 < len(normalized_role_tokens)
                and normalized_role_tokens[index + 1] in _KOREAN_ENTITY_CLASS_TERMS
            )
            has_named_class_identifier = next_is_entity_class and (
                subject_token in _KNOWN_KOREAN_CLASS_BOUND_IDENTIFIERS
                or subject_token in _KNOWN_KOREAN_SINGLE_TOKEN_ENTITY_NAMES
                or bool(_prior._base.re.search(r"[0-9A-Za-z]", original))
            )
'''
          if old_korean not in text:
              raise SystemExit('Korean class-bound block not found')
          text = text.replace(old_korean, new_korean, 1)
          text = text.replace(
              '''                subject_token in _KNOWN_KOREAN_SINGLE_TOKEN_ENTITY_NAMES
                or next_is_entity_class
                or has_entity_suffix
''',
              '''                subject_token in _KNOWN_KOREAN_SINGLE_TOKEN_ENTITY_NAMES
                or has_named_class_identifier
                or has_entity_suffix
''',
              1,
          )

          old_english = '''        has_corporate_name_signal = index == 0 and has_corporate_suffix
        if len(original) >= 2 and (
            original.isupper()
'''
          new_english = '''        has_corporate_name_signal = index == 0 and has_corporate_suffix
        is_governed_acronym_entity = (
            original.isupper()
            and subject_token not in _COMPARATIVE_OR_PERIOD_ACRONYMS
        )
        if len(original) >= 2 and (
            is_governed_acronym_entity
'''
          if old_english not in text:
              raise SystemExit('English acronym block not found')
          text = text.replace(old_english, new_english, 1)
          target.write_text(text, encoding='utf-8')

          test_path = Path('validation_scripts/tests/test_review_4871397803_contracts.py')
          test_path.write_text('''import unittest

from validation_scripts import related_lifecycle_check as related


class TestReview4871397803Contracts(unittest.TestCase):
    @staticmethod
    def _strict_follow_up(assertion):
        parent = {"id": "PARENT", "date": "2026-04-01", "related": []}
        child = {
            "id": "CHILD",
            "date": "2026-07-01",
            "related": ["PARENT"],
            "publish_ready": True,
            "related_lineage": {
                "status": "PASS",
                "relation_type": "distinct_follow_up",
                "related_ids": ["PARENT"],
                "reason": "The verified development changes the predecessor assessment.",
                "same_event_checked": True,
                "earliest_same_event_date_checked": True,
                "fresh_follow_up_anchor_class": "data_financial_anchor",
                "fresh_follow_up_anchor": assertion,
                "incremental_fact_vs_predecessor": assertion,
                "changed_judgment_vs_predecessor": assertion,
            },
        }
        return child, {"PARENT": parent, "CHILD": child}

    def _assert_strict_failure(self, assertion):
        self.assertFalse(related.item_specific_lineage_assertion(assertion))
        child, by_id = self._strict_follow_up(assertion)
        errors, warnings = related.check_card(child, by_id, require_contract=True)
        self.assertEqual([], warnings)
        self.assertIn(
            "distinct_follow_up requires item-specific fresh_follow_up_anchor",
            errors,
        )

    def _assert_strict_success(self, assertion):
        self.assertTrue(related.item_specific_lineage_assertion(assertion))
        child, by_id = self._strict_follow_up(assertion)
        errors, warnings = related.check_card(child, by_id, require_contract=True)
        self.assertEqual([], warnings)
        self.assertEqual([], errors)

    def test_comparative_period_acronyms_are_not_entities(self):
        for assertion in (
            "YOY profit decline",
            "QOQ EBITDA improvement",
            "TTM capex reduction",
            "YTD throughput growth",
        ):
            with self.subTest(assertion=assertion):
                self._assert_strict_failure(assertion)

    def test_real_acronym_and_named_period_subjects_remain_valid(self):
        for assertion in (
            "SBTL profit decline",
            "Project Alpha YOY profit decline",
            "Tesla QOQ EBITDA improvement",
        ):
            with self.subTest(assertion=assertion):
                self._assert_strict_success(assertion)

    def test_generic_korean_class_modifiers_are_not_identifiers(self):
        for assertion in (
            "대형 공장 수율 개선",
            "신설 공장 수율 개선",
            "주요 프로젝트 처리량 증가",
        ):
            with self.subTest(assertion=assertion):
                self._assert_strict_failure(assertion)

    def test_named_korean_class_bound_subjects_remain_valid(self):
        for assertion in (
            "울산 공장 수율 개선",
            "새만금 프로젝트 처리량 증가",
            "삼성 공장 수율 개선",
            "제1 공장 수율 개선",
        ):
            with self.subTest(assertion=assertion):
                self._assert_strict_success(assertion)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          Path('.github/workflows/tmp-review-4871397803-fix.yml').unlink()
