name: Stage C R6 Accepted 7

on:
  push:
    branches:
      - chatgpt/recover-exact-425-artifacts-20260903
    paths:
      - '.tmp/stage-c-r6-accepted7/TRIGGER'

permissions:
  contents: write

jobs:
  stage-c-accepted7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Stage C production artifact surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/stage_c_r6_accepted7.py')
          s = p.read_text(encoding='utf-8')
          def repl(old, new):
              global s
              if old in s:
                  assert s.count(old) == 1, (old, s.count(old))
                  s = s.replace(old, new)
              assert new in s, new
          repl(
              '        "spec_id": pkg["spec_id"],\n        "source_story_ids": pkg["source_story_ids"],',
              '        "spec_id": pkg["spec_id"],\n        "source_spec_id": pkg["spec_id"],\n        "source_story_ids": pkg["source_story_ids"],'
          )
          repl(
              '            "relation_type": "program_lineage",\n            "related_ids": [],\n            "provisional_current_batch_candidate_ids": [qna_id],',
              '            "relation_type": "program_lineage",\n            "related_ids": [qna_id],\n            "provisional_current_batch_candidate_ids": [qna_id],'
          )
          repl(
              '    "stage": "stage_c",\n    "status": "PASS" if not revisions else "PARTIAL_REVISE_REQUIRED",',
              '    "stage": "stage_c",\n    "status": "PASS" if not revisions else "PARTIAL_REVISE_REQUIRED",\n    "strict_gate_acceptance_guard_applied": True,\n    "accepted_pool_lineage_status": "PASS",'
          )
          p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/patch_stage_c_r6_eu_lineage.py
          if ! git diff --quiet -- scripts/stage_c_r6_accepted7.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/stage_c_r6_accepted7.py
            git commit -m 'fix: align Stage C with production artifact contract and R6 lineage'
            git push
          fi
      - name: Build and validate Stage C fact-safe output
        run: python3 scripts/stage_c_r6_accepted7.py
      - name: Validate Stage C production artifact contract
        shell: bash
        run: |
          set -euo pipefail
          python3 validation_scripts/stage_artifact_contract_check.py C \
            runs/2026-09-03/stage_c_r6_accepted7_20260903_R1.json \
            | tee runs/2026-09-03/stage_c_r6_accepted7_contract_20260903_R1.json
      - name: Commit validated Stage C outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-03/stage_c_r6_accepted7_20260903_R1.json \
                  runs/2026-09-03/stage_c_r6_accepted7_validation_20260903_R1.json \
                  runs/2026-09-03/stage_c_r6_accepted7_contract_20260903_R1.json
          git rm -r .tmp/stage-c-r6-accepted7
          git commit -m 'audit: Stage C R6 accepted7 production-contract closure'
          git push
