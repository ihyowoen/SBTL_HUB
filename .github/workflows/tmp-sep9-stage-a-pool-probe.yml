name: tmp-sep9-stage-a-pool-probe
on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - '.github/workflows/tmp-sep9-stage-a-pool-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sep9-r1-current-main-production-r1
          fetch-depth: 0
      - name: Find prior passing pool samples
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- runs validation_scripts >/dev/null 2>&1 || true
          python - <<'PY'
          import json, pathlib
          pools=['candidate_review_pool','watchlist_context_pool','reject_or_support_only_pool','existing_reinforcement','support_source_only','rejected','decision_ledger','review_pool_resolution_ledger']
          out={p:None for p in pools}; origins={}
          for path in pathlib.Path('runs').rglob('stage-a*.json'):
              try: d=json.loads(path.read_text())
              except: continue
              if str(d.get('status','')).upper()!='PASS': continue
              for p in pools:
                  v=d.get(p)
                  if out[p] is None and isinstance(v,list) and v:
                      out[p]=v[0]
                      origins[p]=str(path)
              if all(out[p] is not None for p in pools): break
          res={'origins':origins,'samples':{},'missing':[]}
          for p,v in out.items():
              if v is None: res['missing'].append(p)
              else: res['samples'][p]={'keys':list(v.keys()) if isinstance(v,dict) else [],'item':v}
          target=pathlib.Path('runs/2026-09-10/sep9-r1-current-main-production-r1/stage-a-pool-probe.json')
          target.write_text(json.dumps(res,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'origins':origins,'missing':res['missing']}))
          PY
      - name: Commit probe
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/stage-a-pool-probe.json
          git commit -m 'chore: capture Stage A pool samples'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
