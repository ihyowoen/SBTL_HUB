name: Apply V4 source-prompt version compatibility fix

on:
  push:
    branches:
      - chatgpt/fix-v4-source-prompt-version-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-v4-source-prompt-version-compat
          fetch-depth: 0
      - name: Patch source-prompt provenance compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('validation_scripts/stage_a_full_v3_completeness_review4945668766.py')
          s=p.read_text(encoding='utf-8')
          old='_SOURCE_PROMPT_VERSION = "structural_default_review_pool_partition_20260506"\n'
          new='''_SOURCE_PROMPT_VERSION = "structural_default_review_pool_partition_20260506"\n_SOURCE_PROMPT_V4_VERSION = "STAGE_A_INTEGRATED_SELECTOR_V4_20260901"\n_V4_POLICY_VERSION = "EMBEDDED_NEWS_VALUE_SELECTION_V4"\n'''
          assert old in s
          s=s.replace(old,new,1)
          marker='''def _validate_source_prompt_provenance(\n    data: Mapping[str, Any], messages: list[str]\n) -> None:\n'''
          helper='''def _artifact_uses_v4_source_prompt(data: Mapping[str, Any]) -> bool:\n    for pool in (\n        "strict_passed_spec",\n        "candidate_review_pool",\n        "watchlist_context_pool",\n        "reject_or_support_only_pool",\n    ):\n        values = data.get(pool)\n        if not isinstance(values, list):\n            continue\n        for item in values:\n            if isinstance(item, Mapping) and item.get("selection_policy_version") == _V4_POLICY_VERSION:\n                return True\n    return False\n\n\ndef _expected_source_prompt_version(data: Mapping[str, Any]) -> str:\n    return _SOURCE_PROMPT_V4_VERSION if _artifact_uses_v4_source_prompt(data) else _SOURCE_PROMPT_VERSION\n\n\n'''
          assert marker in s
          s=s.replace(marker,helper+marker,1)
          oldcheck='''    if "source_prompt_version" in data and data.get("source_prompt_version") != _SOURCE_PROMPT_VERSION:\n        messages.append(\n            f"full Stage A artifact source_prompt_version must be {_SOURCE_PROMPT_VERSION}"\n        )\n'''
          newcheck='''    if "source_prompt_version" in data:\n        expected_version = _expected_source_prompt_version(data)\n        if data.get("source_prompt_version") != expected_version:\n            messages.append(\n                f"full Stage A artifact source_prompt_version must be {expected_version}"\n            )\n'''
          assert oldcheck in s
          s=s.replace(oldcheck,newcheck,1)
          p.write_text(s,encoding='utf-8')
          PY
          cat > validation_scripts/tests/test_stage_a_v4_source_prompt_version_compat.py <<'PY'
          from __future__ import annotations

          import hashlib
          import unittest
          from pathlib import Path

          from validation_scripts import stage_a_full_v3_completeness_review4945668766 as mod


          class TestStageAV4SourcePromptVersionCompatibility(unittest.TestCase):
              def base(self):
                  path = Path('docs/llm_prompts/v1/01_PROMPT_0_1_Stage_A.md')
                  return {
                      'source_prompt_file': str(path),
                      'source_prompt_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'source_prompt_authority': 'uploaded_or_repo_source_file_prompt',
                      'source_prompt_provenance_status': 'PASS',
                      'strict_passed_spec': [],
                      'candidate_review_pool': [],
                      'watchlist_context_pool': [],
                      'reject_or_support_only_pool': [],
                  }

              def messages(self, data):
                  out=[]
                  mod._validate_source_prompt_provenance(data,out)
                  return out

              def test_historical_v3_artifact_keeps_historical_version(self):
                  data=self.base(); data['source_prompt_version']=mod._SOURCE_PROMPT_VERSION
                  self.assertEqual(self.messages(data),[])

              def test_v4_candidate_requires_active_v4_prompt_version(self):
                  data=self.base(); data['strict_passed_spec']=[{'selection_policy_version':mod._V4_POLICY_VERSION}]
                  data['source_prompt_version']=mod._SOURCE_PROMPT_V4_VERSION
                  self.assertEqual(self.messages(data),[])
                  data['source_prompt_version']=mod._SOURCE_PROMPT_VERSION
                  self.assertTrue(any(mod._SOURCE_PROMPT_V4_VERSION in m for m in self.messages(data)))

              def test_v4_review_only_artifact_also_requires_v4_version(self):
                  data=self.base(); data['candidate_review_pool']=[{'selection_policy_version':mod._V4_POLICY_VERSION}]
                  data['source_prompt_version']=mod._SOURCE_PROMPT_V4_VERSION
                  self.assertEqual(self.messages(data),[])


          if __name__ == '__main__':
              unittest.main()
          PY
      - name: Run targeted regressions
        run: |
          python -m unittest validation_scripts.tests.test_stage_a_v4_source_prompt_version_compat -v
          python -m unittest validation_scripts.tests.test_stage_a_v4_denominator_gap_compat -v
          python -m unittest validation_scripts.tests.test_stage_a_v4_contract.StageAV4MachineContractTest -v
          python -m py_compile validation_scripts/stage_a_full_v3_completeness_review4945668766.py
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-v4-source-prompt-version.yml
          git add validation_scripts/stage_a_full_v3_completeness_review4945668766.py validation_scripts/tests/test_stage_a_v4_source_prompt_version_compat.py
          git commit -m 'fix: align V4 Stage A source-prompt provenance version'
          git push origin HEAD:chatgpt/fix-v4-source-prompt-version-compat
