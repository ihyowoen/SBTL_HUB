name: TEMP R7 Stage A diagnostic

on:
  push:
    branches:
      - chatgpt/validate-20260903-r7-stage-a
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose temporary validation payload reconstruction
        shell: bash
        run: |
          set +e
          LOG=/tmp/r7-diagnostic.txt
          : > "$LOG"
          {
            echo '== source files =='
            ls -l tmp/r7-stage-a-validation
            echo '== encoded lengths =='
            wc -c tmp/r7-stage-a-validation/generator.part* tmp/r7-stage-a-validation/manifest.part*

            cat tmp/r7-stage-a-validation/generator.part* | tr -d '\r\n' > /tmp/generator.b64
            echo "generator-b64-bytes=$(wc -c < /tmp/generator.b64)"
            base64 -d /tmp/generator.b64 > /tmp/generator.gz 2>/tmp/generator.base64.err
            echo "generator-base64-exit=$?"
            cat /tmp/generator.base64.err
            gzip -t /tmp/generator.gz 2>/tmp/generator.gzip.err
            echo "generator-gzip-test-exit=$?"
            cat /tmp/generator.gzip.err
            gzip -dc /tmp/generator.gz > /tmp/r7_stage_a_generator.py 2>/tmp/generator.decompress.err
            echo "generator-decompress-exit=$?"
            cat /tmp/generator.decompress.err
            wc -c /tmp/r7_stage_a_generator.py

            cat tmp/r7-stage-a-validation/manifest.part* | tr -d '\r\n' > /tmp/manifest.b64
            echo "manifest-b64-bytes=$(wc -c < /tmp/manifest.b64)"
            base64 -d /tmp/manifest.b64 > /tmp/manifest.gz 2>/tmp/manifest.base64.err
            echo "manifest-base64-exit=$?"
            cat /tmp/manifest.base64.err
            gzip -t /tmp/manifest.gz 2>/tmp/manifest.gzip.err
            echo "manifest-gzip-test-exit=$?"
            cat /tmp/manifest.gzip.err
            gzip -dc /tmp/manifest.gz > /tmp/r7_stage_a_manifest.json 2>/tmp/manifest.decompress.err
            echo "manifest-decompress-exit=$?"
            cat /tmp/manifest.decompress.err
            wc -c /tmp/r7_stage_a_manifest.json

            echo '== generator entrypoint markers =='
            grep -nE 'argparse|sys\.argv|__main__|def main|MANIFEST|OUTPUT|out_dir|output' /tmp/r7_stage_a_generator.py | head -160

            echo '== manifest parse =='
            python - <<'PY'
          import json, pathlib, hashlib, traceback
          try:
              p=pathlib.Path('/tmp/r7_stage_a_manifest.json')
              m=json.loads(p.read_text())
              print('manifest-sha256',hashlib.sha256(p.read_bytes()).hexdigest())
              print('schema',m.get('schema'))
              print('events',len(m.get('events',[])))
              print('stories',sum(len(e.get('s',[])) for e in m.get('events',[])))
          except Exception:
              traceback.print_exc()
          PY
          } >> "$LOG" 2>&1
          cat "$LOG"

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: r7-stage-a-diagnostic
          path: /tmp/r7-diagnostic.txt
          if-no-files-found: error
