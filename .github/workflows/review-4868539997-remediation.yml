name: Review 4868539997 remediation

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - ".github/workflows/review-4868539997-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused review fixes and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          related_path = Path("validation_scripts/related_lifecycle_check.py")
          related = related_path.read_text(encoding="utf-8")
          old_related = '''_ASSERTION_EVENT_SUBJECT_TERMS = {
              "permit", "license", "agreement", "contract", "filing", "construction",
              "operation", "operations", "commissioning", "delivery", "shipment",
              "investment", "funding", "guidance", "forecast", "rule", "milestone",
              "허가", "인가", "계약", "공시", "건설", "운영", "가동", "상업운전",
              "납품", "출하", "투자", "금융", "전망", "규정", "이정표",
          }
          '''
          new_related = '''_ASSERTION_EVENT_SUBJECT_TERMS = {
              "permit", "license", "agreement", "contract", "filing", "construction",
              "operation", "operations", "commissioning", "launch", "start", "award",
              "delivery", "shipment", "investment", "funding", "guidance", "forecast",
              "rule", "milestone", "허가", "인가", "계약", "공시", "건설", "운영",
              "가동", "상업운전", "출시", "착수", "수주", "납품", "출하", "투자",
              "금융", "전망", "규정", "이정표",
          }
          '''
          if related.count(old_related) != 1:
              raise SystemExit("related event-subject block did not match exactly once")
          related_path.write_text(related.replace(old_related, new_related), encoding="utf-8")

          lineage_path = Path("validation_scripts/stage_lineage_contract_check.py")
          lineage = lineage_path.read_text(encoding="utf-8")
          old_lineage = '''    r"as\\s+long\\s+as|so\\s+long\\s+as|"
          '''
          new_lineage = '''    r"conditional\\s+on|dependent\\s+on|as\\s+long\\s+as|so\\s+long\\s+as|"
          '''
          if lineage.count(old_lineage) != 1:
              raise SystemExit("conditional boundary line did not match exactly once")
          lineage_path.write_text(lineage.replace(old_lineage, new_lineage), encoding="utf-8")

          test_path = Path("validation_scripts/tests/test_review_4868539997_contracts.py")
          test_path.write_text('''from __future__ import annotations

import copy
import unittest

from validation_scripts import related_lifecycle_check as related
from validation_scripts import stage_lineage_contract_check as lineage
from validation_scripts.tests import test_review_4861791404_contracts as v3_contracts
from validation_scripts.tests import test_review_4862131806_contracts as related_contracts


class TestReview4868539997Contracts(unittest.TestCase):
    def base_v3_spec(self):
        return copy.deepcopy(
            v3_contracts.TestReview4861791404Contracts().base_v3_spec()
        )

    @staticmethod
    def confirmation_point(effect):
        return {
            "measurable_event_or_metric": "Project Alpha production milestone",
            "interpretation_effect": effect,
        }

    def test_conditional_on_and_dependent_on_do_not_bind_dependent_effects(self):
        for effect in (
            "Project Alpha production weakened conditional on the current demand outlook strengthened",
            "Project Alpha production weakened dependent on the current demand outlook strengthened",
        ):
            with self.subTest(effect=effect):
                self.assertFalse(lineage._has_bound_interpretation_effect(effect))
                self.assertFalse(
                    lineage._valid_confirmation_point(self.confirmation_point(effect))
                )

    def test_complete_v3_rejects_conditional_binding_bypasses(self):
        for effect in (
            "Project Alpha production weakened conditional on the current demand outlook strengthened",
            "Project Alpha production weakened dependent on the current demand outlook strengthened",
        ):
            with self.subTest(effect=effect):
                spec = self.base_v3_spec()
                spec["next_confirmation_points"] = [self.confirmation_point(effect)]
                messages = []
                self.assertFalse(
                    lineage.validate_stage_a_v3_override(
                        spec, spec["spec_id"], messages
                    )
                )

    def test_leading_conditional_phrases_preserve_real_main_effects(self):
        for effect in (
            "Conditional on Project Alpha production improving, "
            "the current demand outlook would strengthen",
            "Dependent on Project Alpha production improving, "
            "the current demand outlook would strengthen",
        ):
            with self.subTest(effect=effect):
                self.assertTrue(lineage._has_bound_interpretation_effect(effect))
                self.assertTrue(
                    lineage._valid_confirmation_point(self.confirmation_point(effect))
                )

    def test_named_nominal_execution_anchors_are_item_specific(self):
        for assertion in (
            "Project Alpha launch",
            "Project Alpha start",
            "Project Alpha award",
            "프로젝트 알파 출시",
            "프로젝트 알파 착수",
            "프로젝트 알파 수주",
        ):
            with self.subTest(assertion=assertion):
                self.assertTrue(related.item_specific_lineage_assertion(assertion))

    def test_strict_related_accepts_named_nominal_execution_anchors(self):
        fixture = related_contracts.TestReview4862131806Contracts()
        for assertion in (
            "Project Alpha launch",
            "Project Alpha start",
            "Project Alpha award",
        ):
            with self.subTest(assertion=assertion):
                fixture._assert_strict_success(assertion)

    def test_bare_execution_role_words_remain_rejected(self):
        fixture = related_contracts.TestReview4862131806Contracts()
        for assertion in ("launch", "start", "award"):
            with self.subTest(assertion=assertion):
                self.assertFalse(related.item_specific_lineage_assertion(assertion))
                fixture._assert_strict_failure(assertion)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run focused review regression
        run: python -m unittest validation_scripts.tests.test_review_4868539997_contracts -v

      - name: Run full workflow-contract regression suite
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit remediation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/review-4868539997-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_scripts/related_lifecycle_check.py \
                  validation_scripts/stage_lineage_contract_check.py \
                  validation_scripts/tests/test_review_4868539997_contracts.py \
                  .github/workflows/review-4868539997-remediation.yml
          git commit -m "fix: address review 4868539997"
          git push origin HEAD:agent/structural-news-value-v3
