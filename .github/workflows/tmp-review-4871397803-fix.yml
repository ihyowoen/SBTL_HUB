          PY
      - name: Compile validators
        run: python -m compileall -q validation_scripts
      - name: Run focused regressions
        run: python -m unittest validation_scripts.tests.test_review_4871397803_contracts -v
      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -v
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close comparative and Korean class subject bypasses"
