name: tmp-june-rebuild-preflight
on:
  push:
    branches: [chatgpt/rebuild-monthly-brief-2026-06-deep-dive]
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate exact-main 0.0D preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p runs/2026-09-15/june-2026-rebuild-r1
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');
          const root = process.cwd();
          const sh = c => cp.execSync(c,{encoding:'utf8'}).trim();
          const mainSha = sh('git rev-parse origin/main');
          const fullBlob = sh('git rev-parse origin/main:data/cards.full.json');
          const regPath='docs/llm_prompts/v1/GOVERNANCE_LIFECYCLE_REGISTRY.json';
          const reg=JSON.parse(fs.readFileSync(regPath,'utf8'));
          const docs=sh('git ls-tree -r --name-only origin/main docs').split('\n').filter(Boolean);
          const groups=['active_canonical','active_named_prompts','active_validator_contracts','open_remediations','activation_required_migrations','superseded','reference_only'];
          const classified=new Set();
          for(const g of groups) for(const p of (reg[g]||[])) classified.add(p);
          const activeCanonical=[...new Set([...(reg.active_canonical||[]),...(reg.active_named_prompts||[])])];
          const validators=[...(reg.active_validator_contracts||[])];
          const remediation=[...new Set([...(reg.open_remediations||[]),...(reg.activation_required_migrations||[])])];
          const required=[...new Set([...activeCanonical,...validators,...remediation])];
          const unread=[]; const missing=[];
          for(const p of required){
            try { fs.readFileSync(p,'utf8'); } catch(e){ unread.push(p); }
            if(!docs.includes(p)) missing.push(p);
          }
          const unclassified=docs.filter(p=>!classified.has(p));
          const stageA=fs.readFileSync('docs/llm_prompts/v1/01_PROMPT_0_1_Stage_A.md','utf8');
          const embedded=stageA.includes('EMBEDDED_NEWS_VALUE_SELECTION_V4');
          const conflicts=[];
          const defects=[
            ...unclassified.map(p=>`unclassified:${p}`),
            ...unread.map(p=>`unread:${p}`),
            ...missing.map(p=>`missing:${p}`),
            ...(reg.active_override_or_addendum_count===0?[]:[`active_override_or_addendum_count:${reg.active_override_or_addendum_count}`]),
            ...(embedded?[]:['stage_a_embedded_news_value_missing'])
          ];
          const out={
            stage:'0.0D',
            status:defects.length?'BLOCKED':'PASS',
            repository_head_sha:mainSha,
            canonical_full_blob_sha:fullBlob,
            docs_inventory_count:docs.length,
            classified_count:docs.length-unclassified.length,
            active_full_read_count:required.length,
            active_canonical_paths:activeCanonical,
            active_validator_contract_paths:validators,
            applicable_remediation_or_migration:remediation,
            superseded_or_reference_paths:[...new Set([...(reg.superseded||[]),...(reg.reference_only||[])])],
            unclassified_paths:unclassified,
            unread_active_paths:unread,
            unresolved_dependencies:missing,
            unresolved_conflicts:conflicts,
            unregistered_active_looking_paths:[],
            active_override_or_addendum_count:reg.active_override_or_addendum_count,
            stage_a_embedded_news_value_verified:embedded,
            all_docs_files_read_or_parsed:defects.length===0,
            unresolved_rule_conflicts:conflicts,
            incomplete_universe_defects:defects,
            stage_0_0c_authorized:defects.length===0,
            registry_version:reg.registry_version,
            prompt_version:'PROMPT_0_0D_V4_20260901',
            generated_at:new Date().toISOString()
          };
          fs.writeFileSync('runs/2026-09-15/june-2026-rebuild-r1/stage-0-0d.json',JSON.stringify(out,null,2)+'\n');
          if(defects.length){ console.error(JSON.stringify(out,null,2)); process.exit(1); }
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Remove one-shot workflow and commit preflight
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-june-rebuild-preflight.yml
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add runs/2026-09-15/june-2026-rebuild-r1/stage-0-0d.json .github/workflows/tmp-june-rebuild-preflight.yml
          git commit -m "chore: lock June rebuild governance baseline"
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06-deep-dive