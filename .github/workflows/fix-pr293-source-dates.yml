name: Fix PR293 Source Date Audit

on:
  push:
    branches:
      - chatgpt/pr289-review-remediation-1496
    paths:
      - .github/workflows/fix-pr293-source-dates.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/pr289-review-remediation-1496
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock exact 1496 baseline and patch audited dates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3732ad9460b44329f0856591c29f166a39ebf5f8"
          test "$(git rev-parse 3732ad9460b44329f0856591c29f166a39ebf5f8:data/cards.full.json)" = "3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f"
          git show origin/main:data/cards.full.json > /tmp/base.cards.full.json
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('data/cards.full.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          cards=d['cards']
          by={c['id']:c for c in cards}
          assert len(cards)==1496

          # SK Innovation / SKIET merger: board resolution and official merger IR are Aug 25, 2026.
          sk=by['2026-08-25_KR_01']
          sk_primary=[s for s in sk['fact_sources'] if 'skinnovation.com/ir/notice/105' in s.get('source_url','')]
          assert len(sk_primary)==1
          sk_primary[0]['source_published_date']='2026-08-25'
          sk_primary[0]['visible_quote_date']='2026-08-25'
          sk['date_role']['publication_date']='2026-08-25'
          sk['date_role']['publication_dates']=['2026-08-25']
          sk['date_role']['source_publication_dates']=['2026-08-25']

          # GE Vernova Supernode Stage 3 official release is Aug 21; independent ESN follow-up is Aug 24.
          ge=by['2026-08-21_GL_02']
          ge_primary=[s for s in ge['fact_sources'] if s.get('source_owner')=='GE Vernova']
          assert len(ge_primary)==1
          ge_primary[0]['source_published_date']='2026-08-21'
          ge_primary[0]['visible_quote_date']='2026-08-21'
          ge['date_role']['publication_date']='2026-08-21'
          ge['date_role']['publication_dates']=['2026-08-21','2026-08-24']
          ge['date_role']['source_publication_dates']=['2026-08-21','2026-08-24']

          # Morrow/Lyten MOU event is Aug 21; bankruptcy-estate release Aug 22; ESN Aug 25.
          ly=by['2026-08-21_EU_01']
          ly['date_role']['publication_date']='2026-08-22'
          ly['date_role']['publication_dates']=['2026-08-22','2026-08-25']
          ly['date_role']['source_publication_dates']=['2026-08-22','2026-08-25']

          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          m=json.load(open('direct-adds/pr289-review-remediation-1496/direct-add.json',encoding='utf-8'))
          assert set(['2026-08-25_KR_01','2026-08-21_GL_02','2026-08-21_EU_01']).issubset(set(m['operations']['update']))
          Path('/tmp/ids.json').write_text(json.dumps({'ids':m['operations']['update']}),encoding='utf-8')
          PY
          node scripts/lean_cards.mjs

      - name: Revalidate bounded remediation
        shell: bash
        run: |
          set -euo pipefail
          M=direct-adds/pr289-review-remediation-1496/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest "$M" --base /tmp/base.cards.full.json --full data/cards.full.json
          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file /tmp/ids.json
          python validation_scripts/evidence_qc_v8_check.py data/cards.full.json --new-id-file /tmp/ids.json
          python validation_scripts/related_lifecycle_check.py data/cards.full.json --require-contract --new-id-file /tmp/ids.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Remove temporary workflow and commit final three-file shape
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pr293-source-dates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct audited source publication dates in PR293"
          python - <<'PY'
          import subprocess
          expected={'data/cards.full.json','public/data/cards.json','direct-adds/pr289-review-remediation-1496/direct-add.json'}
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PY
          git push origin HEAD:chatgpt/pr289-review-remediation-1496
