name: fix-pr297-review-5061109006-v2

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: write

env:
  RUN_PATH: runs/2026-08-29/card-run.json
  BASE_SHA: 937dce6429c8bf63535d8043c7f559c9f2001f5d
  BASE_BLOB: 9278233be67240aac1cdf7963e12d8e2878319f0

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260829-combined18-governed-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run corrected remediation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/fix-pr297-review-5061109006-once.yml')
          text=p.read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY",start)
          code=textwrap.dedent(text[start:end])
          bad="  _,card2,_=recompute(card,registry,strict=True)\n  card.clear(); card.update(card2)"
          good="  recompute(card,registry,strict=True)"
          if bad not in code:
            raise SystemExit('expected recompute replacement target not found')
          code=code.replace(bad,good,1)
          exec(compile(code,'<review-5061109006-remediation>','exec'),{'__name__':'__main__'})
          PY

      - name: Re-materialize exact locked canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]] || { echo 'main moved; rebase required' >&2; exit 1; }
          mkdir -p .tmp-pr297-r5061109006
          git show "$BASE_SHA:data/cards.full.json" > .tmp-pr297-r5061109006/cards.full.base.json
          [[ "$(git hash-object .tmp-pr297-r5061109006/cards.full.base.json)" == "$BASE_BLOB" ]] || { echo 'baseline blob mismatch' >&2; exit 1; }
          node scripts/apply_card_run.mjs --apply --run "$RUN_PATH" --baseline .tmp-pr297-r5061109006/cards.full.base.json --output data/cards.full.json --report .tmp-pr297-r5061109006/apply-pre.json --base-main-sha "$BASE_SHA" --skip-lean
          node scripts/lean_cards.mjs
          node scripts/apply_card_run.mjs --verify --run "$RUN_PATH" --baseline data/cards.full.json --output data/cards.full.json --report runs/2026-08-29/apply-report.json --base-main-sha "$BASE_SHA" --lean-path public/data/cards.json

      - name: Validate all three review findings and governed run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.load(open('runs/2026-08-29/card-run.json',encoding='utf-8'))
          cards=[x['card'] for x in r['operations']['insert']]
          Path('.tmp-pr297-r5061109006').mkdir(exist_ok=True)
          json.dump({'cards':cards},open('.tmp-pr297-r5061109006/current-run-scope.json','w'),ensure_ascii=False,indent=2)
          json.dump({'ids':[c['id'] for c in cards]},open('.tmp-pr297-r5061109006/current-run-ids.json','w'),ensure_ascii=False,indent=2)
          if len(cards)!=18: raise SystemExit('expected 18 inserts')
          for c in cards:
            m=c.get('source_claim_coverage_map')
            if not isinstance(m,list) or not m or any(x.get('status')!='PASS' for x in m): raise SystemExit(f"{c.get('id')}: coverage map missing/failing")
            for x in m:
              if not x.get('visible_claim') or not x.get('supporting_fact_source_indices') or not x.get('supporting_sources'): raise SystemExit(f"{c.get('id')}: non-auditable map entry")
          gv=next(c for c in cards if c.get('source_spec_id')=='NEW27_TH_008')
          gr=gv.get('date_role') or gv.get('date_role_alignment')
          if gv.get('publication_dates')!=['2026-08-27'] or gr.get('source_publication_dates')!=['2026-08-27'] or gr.get('publication_dates')!=['2026-08-27']:
            raise SystemExit('Greenvolt stale publication date remains')
          catl=next(c for c in cards if c.get('source_spec_id')=='NEW27_A_004')
          cr=catl.get('date_role') or catl.get('date_role_alignment')
          if 'August 26' not in str(cr.get('event_date_source_quote')): raise SystemExit('CATL event-date quote does not prove Aug-26')
          if not any('August 26' in str(fs.get('source_quote')) for fs in catl.get('fact_sources',[])): raise SystemExit('CATL date proof not retained in fact_sources')
          cn=next(c for c in cards if c.get('source_spec_id')=='NEW27_TH_003')
          qs=' | '.join(str(fs.get('source_quote','')) for fs in cn.get('fact_sources',[]))
          for tok in ('168.3','448.7','21.81','58.60','18%','16%'):
            if tok not in qs: raise SystemExit(f'CNESA retained quotes missing {tok}')
          full=Path('data/cards.full.json').read_bytes(); lean=Path('public/data/cards.json').read_bytes()
          fh=hashlib.sha256(full).hexdigest(); lh=hashlib.sha256(lean).hexdigest()
          p=Path('runs/2026-08-29/card_run_audit_20260829_CURRENT_MAIN_1496_COMBINED18.json')
          d=json.loads(p.read_text(encoding='utf-8')); d['full_output_sha256']=fh; d['lean_output_sha256']=lh
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('full',fh); print('lean',lh)
          PY
          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file .tmp-pr297-r5061109006/current-run-ids.json
          python validation_scripts/evidence_qc_v8_check.py .tmp-pr297-r5061109006/current-run-scope.json --new-id-file .tmp-pr297-r5061109006/current-run-ids.json --json-report .tmp-pr297-r5061109006/evidence-qc-v8.json
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_relations.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN_PATH" --canonical data/cards.full.json
          node scripts/validate_card_run_audits.mjs --run "$RUN_PATH" --full data/cards.full.json --lean public/data/cards.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Commit remediation and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-pr297-r5061109006
          rm -f .github/workflows/fix-pr297-review-5061109006-once.yml .github/workflows/fix-pr297-review-5061109006-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json runs/2026-08-29 .github/workflows/fix-pr297-review-5061109006-once.yml .github/workflows/fix-pr297-review-5061109006-v2.yml
          git commit -m 'Persist auditable claim coverage for PR #297'
          git push origin HEAD:chatgpt/20260829-combined18-governed-run
