name: Workflow contract validation

on:
  pull_request:
    paths:
      - "contracts/**"
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"
      - ".github/workflows/workflow-contract-validation.yml"
  push:
    branches:
      - main
      - agent/workflow-contract-related-source-audit
      - agent/canonical-v3-contract-schema
    paths:
      - "contracts/**"
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"
      - ".github/workflows/workflow-contract-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Verify canonical V3 contract alignment
        run: python validation_scripts/v3_contract_drift_check.py

      - name: Verify generated V3 stage contracts
        run: python validation_scripts/v3_stage_contracts.py --check

      - name: Verify V3 stage contract flow
        run: python validation_scripts/v3_stage_contract_flow_check.py --check

      - name: TEMP exact10 Stage A validator diagnostic
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          from validation_scripts import stage_lineage_contract_check as validator

          root = Path('validation_scripts/tests/fixtures')
          names = [
              'temp_exact10_good_00.txt',
              'temp_exact10_good_01.txt',
              'temp_exact10_good_02.txt',
              'temp_exact10_good_03.txt',
              'temp_exact10_good_tail_a.txt',
              'temp_exact10_good_tail_b.txt',
          ]
          encoded = ''.join((root / name).read_text(encoding='utf-8') for name in names)
          assert len(encoded) == 28524, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '058d13fe9c8ee35e59436a10738b3f59435cfa25629b9f58f9b024c49ba361b8'
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '724c7931d95ef55f107cc36b0bc13d9913fb72b6ca0d33ec88b4e583a9f5f9cc'
          payload = json.loads(raw.decode('utf-8'))
          print('TEMP_EXACT10_TRANSPORT_PASS')
          print('TEMP_EXACT10_STRICT_COUNT', len(payload['strict_passed_spec']))
          print('TEMP_EXACT10_LEDGER_COUNT', len(payload['decision_ledger']))
          raise SystemExit(validator.check_stage_a_full(payload))
          PY

      - name: Run workflow-contract and exporter regression tests
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
