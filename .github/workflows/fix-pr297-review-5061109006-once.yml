name: fix-pr297-review-5061109006-once

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: write

env:
  RUN_PATH: runs/2026-08-29/card-run.json
  BASE_SHA: 937dce6429c8bf63535d8043c7f559c9f2001f5d
  BASE_BLOB: 9278233be67240aac1cdf7963e12d8e2878319f0

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260829-combined18-governed-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repair date provenance and persist per-claim coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json, re, sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sys.path.insert(0, str(Path('validation_scripts').resolve()))
          from recompute_source_audit_metadata import recompute
          from card_audit_utils import load_owner_registry

          SPECS={
            'NEW27_A_004','NEW27_A_005','NEW27_A_007','NEW27_A_008','NEW27_A_009','NEW27_A_010','NEW27_A_012','NEW27_A_019',
            'NEW27_RP_001','NEW27_RP_002','NEW27_TH_001','NEW27_TH_002','NEW27_TH_003','NEW27_TH_004','NEW27_TH_005','NEW27_TH_006','NEW27_TH_007','NEW27_TH_008'
          }
          CATL='NEW27_A_004'; CNESA='NEW27_TH_003'; GREENVOLT='NEW27_TH_008'
          CATL_URL='https://www.asianmetal.com/news/2360464/Public-notice-of-EIA-withdrawn-for-Jianxiawo-lithium-mining-project/14'
          CATL_DATE_QUOTE='On August 26, the Yichun City Ecological Environment Bureau in Jiangxi Province announced the withdrawal of the public notice of acceptance'
          CNESA_URL='https://en.cnesa.org/china-market-update/2026/8/27/cnesa-releases-2026-h1-energy-storage-data-new-installations-down-18-sending-new-signals-for-the-industry'
          CNESA_NEW_QUOTE='newly commissioned new energy storage capacity in the first half of 2026 reached 21.81 GW / 58.60 GWh'
          CNESA_DECLINE_QUOTE='down 18% in power terms and 16% in energy terms year-on-year'
          registry=load_owner_registry('validation_data/source_owner_registry.json')
          now=datetime.now(ZoneInfo('Asia/Seoul')).replace(microsecond=0).isoformat()
          run_dir=Path('runs/2026-08-29')
          targets=sorted(p for p in run_dir.glob('*.json') if p.name != 'apply-report.json')
          visible_fields=('title','sub','gate','fact')

          def spec_of(card): return card.get('source_spec_id') or card.get('spec_id')
          def role_of(card): return card.get('date_role') or card.get('date_role_alignment')
          def unique_dates(sources):
            return sorted({str(x.get('source_published_date')) for x in sources if isinstance(x,dict) and re.match(r'^\d{4}-\d{2}-\d{2}$',str(x.get('source_published_date') or ''))})
          def clone_source(base, quote, contribution, supports, evidence_role=None):
            x=copy.deepcopy(base)
            x['source_quote']=quote; x['source_quote_status']=x.get('source_quote_status') or 'body_quote_verified'; x['quote_status']=x['source_quote_status']
            x['source_contribution']=contribution; x['claim']=contribution; x['supports']=supports
            x['checked_at']=now
            if evidence_role: x['evidence_role']=evidence_role
            return x
          def append_quote_once(card, url, quote, contribution, supports, evidence_role=None):
            fs=card['fact_sources']
            for i,x in enumerate(fs):
              if isinstance(x,dict) and x.get('source_url')==url and x.get('source_quote')==quote:
                return i
            base=next((x for x in fs if isinstance(x,dict) and x.get('source_url')==url),None)
            if base is None: raise SystemExit(f'{spec_of(card)}: retained source missing for {url}')
            fs.append(clone_source(base,quote,contribution,supports,evidence_role))
            return len(fs)-1

          def patch_special_sources(card):
            spec=spec_of(card)
            if spec==CATL:
              idx=append_quote_once(
                card,CATL_URL,CATL_DATE_QUOTE,
                'Direct body excerpt establishes that the Jianxiawo EIA-notice withdrawal occurred on Aug-26.',
                ['title','sub','fact','date_role'],'event_date_evidence')
              role=role_of(card)
              role['earliest_same_event_date_checked']=True
              role['event_date_source_url']=CATL_URL
              role['event_date_source_quote']=CATL_DATE_QUOTE
              role['event_date_source_name']='Asian Metal'
              role['event_date_source_published_date']='2026-08-27'
              role['earliest_same_event_date_check_basis']='Asian Metal body text explicitly states On August 26 for the bureau withdrawal; later article publication dates remain separate.'
              def fix_event_date_text(o):
                if isinstance(o,dict):
                  for k,v in list(o.items()): o[k]=fix_event_date_text(v)
                  return o
                if isinstance(o,list): return [fix_event_date_text(v) for v in o]
                if isinstance(o,str): return o.replace('event date 2026-08-27','event date 2026-08-26')
                return o
              fix_event_date_text(card)
              return idx
            if spec==CNESA:
              append_quote_once(card,CNESA_URL,CNESA_NEW_QUOTE,
                'Direct source-owner excerpt supports H1 2026 newly commissioned capacity of 21.81 GW / 58.60 GWh.',
                ['title','sub','gate','fact','implication'])
              append_quote_once(card,CNESA_URL,CNESA_DECLINE_QUOTE,
                'Direct source-owner excerpt supports the 18% power and 16% energy year-on-year declines.',
                ['sub','fact','implication'])
            return None

          def rebuild_used_ledger(card):
            spec=spec_of(card)
            old=[x for x in (card.get('source_discovery_ledger') or []) if not (isinstance(x,dict) and x.get('attempt_type')=='used_in_fact_sources')]
            used=[]
            for i,fs in enumerate(card.get('fact_sources') or []):
              if not isinstance(fs,dict): continue
              used.append({
                'source_spec_id':spec,'attempt_type':'used_in_fact_sources','fact_source_index':i,
                'url':fs.get('source_url') or fs.get('url'),'status':'used','result':'retained_fact_source',
                'source_name':fs.get('source_name'),'source_role':fs.get('source_role'),
                'source_origin_type':fs.get('source_origin_type'),'checked_at':fs.get('checked_at') or fs.get('fetched_at') or now,
                'supports':copy.deepcopy(fs.get('supports') or [])
              })
            card['source_discovery_ledger']=old+used
            ep=card.get('evidence_package')
            if isinstance(ep,dict): ep['source_discovery_ledger']=copy.deepcopy(card['source_discovery_ledger'])

          def split_claims(field,val):
            if isinstance(val,list): return [(f'{field}[{i}]',str(s).strip()) for i,s in enumerate(val) if str(s).strip()]
            if not isinstance(val,str): return []
            chunks=[s.strip() for s in re.split(r'(?<=[.!?。])\s+',val.strip()) if s.strip()]
            return [(field,s) for s in (chunks or [val.strip()])]

          def build_claim_map(card):
            sources=card.get('fact_sources') or []
            out=[]
            for field in visible_fields:
              for vf,claim in split_claims(field,card.get(field)):
                base=field
                idx=[i for i,fs in enumerate(sources) if isinstance(fs,dict) and base in (fs.get('supports') or [])]
                if not idx: idx=list(range(len(sources)))
                out.append({
                  'visible_field':vf,'visible_claim':claim,'supporting_fact_source_indices':idx,
                  'supporting_sources':[{
                    'fact_source_index':i,'source_name':sources[i].get('source_name'),
                    'source_url':sources[i].get('source_url') or sources[i].get('url'),
                    'source_quote':sources[i].get('source_quote')
                  } for i in idx],
                  'coverage_strength':'strong' if idx else 'missing','status':'PASS' if idx else 'FAIL'
                })
            for vf,claim in split_claims('implication',card.get('implication') or []):
              idx=[i for i,fs in enumerate(sources) if isinstance(fs,dict) and 'implication' in (fs.get('supports') or [])]
              if not idx: idx=list(range(len(sources)))
              out.append({'visible_field':vf,'visible_claim':claim,'supporting_fact_source_indices':idx,
                'supporting_sources':[{'fact_source_index':i,'source_name':sources[i].get('source_name'),'source_url':sources[i].get('source_url') or sources[i].get('url'),'source_quote':sources[i].get('source_quote')} for i in idx],
                'coverage_strength':'adequate' if idx else 'missing','status':'PASS' if idx else 'FAIL'})
            role=role_of(card) or {}
            if role.get('event_date'):
              url=role.get('event_date_source_url'); quote=role.get('event_date_source_quote')
              idx=[i for i,fs in enumerate(sources) if isinstance(fs,dict) and (fs.get('source_url') or fs.get('url'))==url and (not quote or fs.get('source_quote')==quote)]
              if not idx: idx=[i for i,fs in enumerate(sources) if isinstance(fs,dict) and (fs.get('source_url') or fs.get('url'))==url]
              out.append({'visible_field':'date_role.event_date','visible_claim':role.get('event_date'),
                'supporting_fact_source_indices':idx,'supporting_sources':[{'fact_source_index':i,'source_name':sources[i].get('source_name'),'source_url':sources[i].get('source_url') or sources[i].get('url'),'source_quote':sources[i].get('source_quote')} for i in idx],
                'coverage_strength':'strong' if idx else 'missing','status':'PASS' if idx else 'FAIL'})
            if any(x['status']!='PASS' for x in out): raise SystemExit(f'{spec_of(card)}: incomplete source_claim_coverage_map')
            return out

          def patch_card(card):
            spec=spec_of(card)
            if spec not in SPECS or not isinstance(card.get('fact_sources'),list): return
            patch_special_sources(card)
            _,card2,_=recompute(card,registry,strict=True)
            card.clear(); card.update(card2)
            dates=unique_dates(card['fact_sources'])
            if not dates: raise SystemExit(f'{spec}: missing retained source publication dates')
            card['publication_dates']=dates
            role=role_of(card)
            if not isinstance(role,dict): raise SystemExit(f'{spec}: missing date_role')
            role['source_publication_dates']=dates
            role['publication_dates']=dates
            if spec==CATL:
              role['earliest_same_event_date_checked']=True; role['event_date_source_url']=CATL_URL; role['event_date_source_quote']=CATL_DATE_QUOTE
              role['event_date_source_name']='Asian Metal'; role['event_date_source_published_date']='2026-08-27'
              role['earliest_same_event_date_check_basis']='Asian Metal body text explicitly states On August 26 for the bureau withdrawal; later article publication dates remain separate.'
            rebuild_used_ledger(card)
            ep=card.get('evidence_package')
            if isinstance(ep,dict): ep['sources']=copy.deepcopy(card['fact_sources'])
            if str(card.get('source_diversity_status','')).startswith('PASS_MULTI_SOURCE'):
              card['source_synthesis_applied']=True
              card['source_synthesis_fields']=sorted({f for fs in card['fact_sources'] for f in (fs.get('supports') or []) if f in {'title','sub','gate','fact','implication'}})
              card['source_synthesis_audit']=[{'fact_source_index':i,'source_name':fs.get('source_name'),'source_url':fs.get('source_url') or fs.get('url'),'source_contribution':fs.get('source_contribution'),'visible_fields':copy.deepcopy(fs.get('supports') or [])} for i,fs in enumerate(card['fact_sources'])]
            elif card.get('source_diversity_status')=='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION':
              card['source_synthesis_applied']=False; card['source_synthesis_fields']=[]; card['source_synthesis_audit']=[]
            card['source_claim_coverage_map']=build_claim_map(card)
            card['source_claim_covered']=True

          def traverse(o):
            if isinstance(o,dict):
              patch_card(o)
              for v in list(o.values()): traverse(v)
            elif isinstance(o,list):
              for v in o: traverse(v)

          patched={}
          for p in targets:
            d=json.loads(p.read_text(encoding='utf-8'))
            traverse(d)
            cards=[]
            def collect(o):
              if isinstance(o,dict):
                if spec_of(o) in SPECS and isinstance(o.get('source_claim_coverage_map'),list): cards.append(o)
                for v in o.values(): collect(v)
              elif isinstance(o,list):
                for v in o: collect(v)
            collect(d)
            uniq={}
            for c in cards: uniq.setdefault(spec_of(c),c)
            if isinstance(d,dict) and 'source_claim_coverage_map' in d and uniq:
              d['source_claim_coverage_map']=[dict({'source_spec_id':s},**entry) for s,c in sorted(uniq.items()) for entry in c['source_claim_coverage_map']]
            patched[p.name]=len(uniq)
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          run_path=Path('runs/2026-08-29/card-run.json')
          run=json.loads(run_path.read_text(encoding='utf-8'))
          cards=[x['card'] for x in run['operations']['insert']]
          if {spec_of(c) for c in cards} != SPECS: raise SystemExit('18-card scope mismatch')
          run['output_updated']=now
          run_path.write_text(json.dumps(run,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def canon(x):
            if isinstance(x,dict): return {k:canon(x[k]) for k in sorted(x)}
            if isinstance(x,list): return [canon(v) for v in x]
            return x
          ops_sha=hashlib.sha256(json.dumps(canon(run['operations']),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          for p in targets:
            d=json.loads(p.read_text(encoding='utf-8'))
            if p==run_path: d=run
            def bind(o):
              if isinstance(o,dict):
                for k,v in list(o.items()):
                  if k=='reviewed_operations_sha256': o[k]=ops_sha
                  else: bind(v)
              elif isinstance(o,list):
                for v in o: bind(v)
            bind(d)
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('patched artifacts',patched)
          print('output_updated',now)
          print('reviewed_operations_sha256',ops_sha)
          PY

      - name: Re-materialize exact locked canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]] || { echo 'main moved; rebase required' >&2; exit 1; }
          mkdir -p .tmp-pr297-r5061109006
          git show "$BASE_SHA:data/cards.full.json" > .tmp-pr297-r5061109006/cards.full.base.json
          [[ "$(git hash-object .tmp-pr297-r5061109006/cards.full.base.json)" == "$BASE_BLOB" ]] || { echo 'baseline blob mismatch' >&2; exit 1; }
          node scripts/apply_card_run.mjs --apply --run "$RUN_PATH" --baseline .tmp-pr297-r5061109006/cards.full.base.json --output data/cards.full.json --report .tmp-pr297-r5061109006/apply-pre.json --base-main-sha "$BASE_SHA" --skip-lean
          node scripts/lean_cards.mjs
          node scripts/apply_card_run.mjs --verify --run "$RUN_PATH" --baseline data/cards.full.json --output data/cards.full.json --report runs/2026-08-29/apply-report.json --base-main-sha "$BASE_SHA" --lean-path public/data/cards.json

      - name: Validate all three review findings and governed run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.load(open('runs/2026-08-29/card-run.json',encoding='utf-8'))
          cards=[x['card'] for x in r['operations']['insert']]
          Path('.tmp-pr297-r5061109006').mkdir(exist_ok=True)
          json.dump({'cards':cards},open('.tmp-pr297-r5061109006/current-run-scope.json','w'),ensure_ascii=False,indent=2)
          json.dump({'ids':[c['id'] for c in cards]},open('.tmp-pr297-r5061109006/current-run-ids.json','w'),ensure_ascii=False,indent=2)
          if len(cards)!=18: raise SystemExit('expected 18 inserts')
          for c in cards:
            m=c.get('source_claim_coverage_map')
            if not isinstance(m,list) or not m or any(x.get('status')!='PASS' for x in m): raise SystemExit(f"{c.get('id')}: coverage map missing/failing")
            for x in m:
              if not x.get('visible_claim') or not x.get('supporting_fact_source_indices') or not x.get('supporting_sources'): raise SystemExit(f"{c.get('id')}: non-auditable map entry")
          gv=next(c for c in cards if c.get('source_spec_id')=='NEW27_TH_008')
          gr=gv.get('date_role') or gv.get('date_role_alignment')
          if gv.get('publication_dates')!=['2026-08-27'] or gr.get('source_publication_dates')!=['2026-08-27'] or gr.get('publication_dates')!=['2026-08-27']:
            raise SystemExit('Greenvolt stale publication date remains')
          catl=next(c for c in cards if c.get('source_spec_id')=='NEW27_A_004')
          cr=catl.get('date_role') or catl.get('date_role_alignment')
          if 'August 26' not in str(cr.get('event_date_source_quote')): raise SystemExit('CATL event-date quote does not prove Aug-26')
          if not any('August 26' in str(fs.get('source_quote')) for fs in catl.get('fact_sources',[])): raise SystemExit('CATL date proof not retained in fact_sources')
          cn=next(c for c in cards if c.get('source_spec_id')=='NEW27_TH_003')
          qs=' | '.join(str(fs.get('source_quote','')) for fs in cn.get('fact_sources',[]))
          for tok in ('168.3','448.7','21.81','58.60','18%','16%'):
            if tok not in qs: raise SystemExit(f'CNESA retained quotes missing {tok}')
          full=Path('data/cards.full.json').read_bytes(); lean=Path('public/data/cards.json').read_bytes()
          fh=hashlib.sha256(full).hexdigest(); lh=hashlib.sha256(lean).hexdigest()
          p=Path('runs/2026-08-29/card_run_audit_20260829_CURRENT_MAIN_1496_COMBINED18.json')
          d=json.loads(p.read_text(encoding='utf-8')); d['full_output_sha256']=fh; d['lean_output_sha256']=lh
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('full',fh); print('lean',lh)
          PY
          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file .tmp-pr297-r5061109006/current-run-ids.json
          python validation_scripts/evidence_qc_v8_check.py .tmp-pr297-r5061109006/current-run-scope.json --new-id-file .tmp-pr297-r5061109006/current-run-ids.json --json-report .tmp-pr297-r5061109006/evidence-qc-v8.json
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_relations.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN_PATH" --canonical data/cards.full.json
          node scripts/validate_card_run_audits.mjs --run "$RUN_PATH" --full data/cards.full.json --lean public/data/cards.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Commit remediation and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-pr297-r5061109006
          rm -f .github/workflows/fix-pr297-review-5061109006-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json runs/2026-08-29 .github/workflows/fix-pr297-review-5061109006-once.yml
          git commit -m 'Persist auditable claim coverage for PR #297'
          git push origin HEAD:chatgpt/20260829-combined18-governed-run
