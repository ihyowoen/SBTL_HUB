name: inspect-pr297-codex-5470089474

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260829-combined18-governed-run
          fetch-depth: 0
      - name: Inspect targeted cards and contract shapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          run=json.loads(Path('runs/2026-08-29/card-run.json').read_text(encoding='utf-8'))
          cards=[x['card'] for x in run['operations']['insert']]
          def text(c):
              return json.dumps(c,ensure_ascii=False)
          pats={
              'ISO':re.compile(r'ISO\s*9001|ISO\s*14001|Gumi Plant 4|구미.*4',re.I),
              'TAIWAN':re.compile(r'Taiwan|Taipei|대만|2026-08-21|August 21|8월 21',re.I),
              'US_METRICS':re.compile(r'46\.4|4\.883|9\.6%|6\.7\s*GW|73%',re.I),
          }
          keep=['id','source_spec_id','title','sub','fact','implication','gate','publication_dates','date_role','fact_sources','source_claim_coverage_map','source_synthesis_applied','source_synthesis_fields','source_synthesis_audit','source_discovery_ledger','evidence_package']
          for label,pat in pats.items():
              hits=[c for c in cards if pat.search(text(c))]
              print('\n===',label,'HITS',len(hits),'===')
              for c in hits:
                  out={k:c.get(k) for k in keep if k in c}
                  print(json.dumps(out,ensure_ascii=False,indent=2))
          print('\n=== MULTI SOURCE SYNTHESIS SHAPES ===')
          for c in cards:
              if c.get('source_synthesis_applied') is True:
                  print(json.dumps({
                      'id':c.get('id'),'spec':c.get('source_spec_id'),
                      'fields':c.get('source_synthesis_fields'),
                      'audit':c.get('source_synthesis_audit'),
                      'facts':[{'source_name':f.get('source_name'),'source_url':f.get('source_url') or f.get('url'),'source_role':f.get('source_role'),'source_domain':f.get('source_domain'),'source_contribution':f.get('source_contribution'),'supports':f.get('supports')} for f in c.get('fact_sources',[]) if isinstance(f,dict)]
                  },ensure_ascii=False,indent=2))
          print('\n=== LEDGER USED ROW SHAPES ===')
          for c in cards:
              rows=[]
              for r in c.get('source_discovery_ledger',[]) or []:
                  if isinstance(r,dict) and (r.get('outcome')=='used_in_fact_sources' or r.get('attempt_type')=='used_in_fact_sources'):
                      rows.append(r)
              print(json.dumps({'id':c.get('id'),'spec':c.get('source_spec_id'),'rows':rows},ensure_ascii=False,indent=2))
          PY
