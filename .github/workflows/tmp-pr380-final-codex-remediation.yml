name: tmp-pr380-final-codex-remediation

on:
  push:
    branches:
      - chatgpt/rebuild-monthly-brief-2026-06
    paths:
      - .github/workflows/tmp-pr380-final-codex-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch final Codex findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          brief_path = Path('public/data/monthly_briefs.json')
          audit_path = Path('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json')

          library = json.loads(brief_path.read_text(encoding='utf-8'))
          audit = json.loads(audit_path.read_text(encoding='utf-8'))

          library['updated_at'] = '2026-09-16'
          june = next(x for x in library['items'] if x.get('id') == 'monthly-brief-2026-06-r1')
          flows = {x['id']: x for x in june['key_flows']}

          june['executive_diagnosis'] = (
              '5월 말까지 ESS는 이미 대형 공급계약·프로젝트금융·장주기 조달·상업운전이 동시에 늘고 있었고, AI·데이터센터도 일부 저장 수요와 연결되기 시작했다. '
              '6월의 변화는 이 흐름이 새로 생긴 것이 아니라 tolling·용량계약처럼 수익구조가 더 다양하고 구체적인 형태로 전개되고 제도·기술 단계가 한층 세분화됐다는 데 있다. '
              '5년·20년 tolling과 20년 용량계약, 세액공제 지분금융이 이어졌고 8~10시간 저장과 LDES 정책선정이 전면에 나왔다. '
              '차세대 저장은 5월의 전망·실증 전 단계에서 나트륨이온 인도 일정, CO₂·철공기 상업계약, 전고체 실차시험으로 전진했다. '
              '공급망도 5월의 중국 집중·현지화·핵심광물 리스크에서 6월의 기업별 조달적격성·생산금융·기술권리·재생원료 인증·추적성 규칙으로 구체화됐다.'
          )
          june['what_changed'] = (
              '5월 canonical 214건을 기준으로 보면 ESS의 성장, 금융조달, 장주기 조달과 AI 연계 수요는 이미 확인되고 있었다. '
              '또 일본에서는 19개 배터리저장 프로젝트 1,251MW가 20년 고정수익 계약을 확보해 장기계약 자체도 이미 존재했다. '
              '6월에는 그 방향성이 계약기간의 단순 연장이 아니라 수익구조의 형태와 저장시간, 제도 실행단계에서 더 구체화됐다. '
              '5년·20년 tolling과 20년 용량계약 같은 서로 다른 수익계약 구조가 추가로 확인됐고, LDES 지원은 개별 프로젝트 조달에서 영국 잠정선정과 EU의 비구속적 국가 배치 공약으로 넓어졌다. '
              '차세대 기술은 전망에서 고객계약·인도·실차검증으로 내려왔으며, 공급망·현지화는 국가 단위 논의에서 기업명단·EV 셀 생산금융·기술 라이선스·재생원료 인증·배터리패스포트 같은 운영 규칙으로 이동했다. '
              'AI·데이터센터는 5월부터 이어진 선택적 전력인프라 수요축을 보강했을 뿐 6월 ESS 전체를 설명하는 단일 원인은 아니다. '
              'SBTL 관점에서도 ESS·LFP 성장만으로 파우치필름 수요를 자동 환산하지 않으며, 실제 셀 폼팩터·고객프로그램·필름 공급계약이 확인될 때만 직접 수요 신호로 본다.'
          )

          flows['01']['title'] = 'ESS 자산화, 5월의 금융·장기계약에서 6월의 수익구조 다변화로 심화'
          flows['01']['summary'] = (
              '5월에도 프로젝트금융, 최저수익 구조와 상업운전이 확인됐고 일본에서는 19개 배터리저장 프로젝트 1,251MW가 20년 고정수익 계약을 확보해 장기계약 자체도 이미 존재했다. '
              '6월에는 독일 300MW BESS의 5년 tolling, 애리조나 19MW·10시간 CO₂ 저장의 20년 tolling, 온타리오 8시간 BESS의 20년 용량계약처럼 서로 다른 수익계약 구조가 추가로 확인됐다. '
              '텍사스 120MW·480MWh의 1억3,000만달러 세액공제 지분금융 종결과 호주 Orana 415MW·1,660MWh의 상업운전은 5월에도 이미 보였던 금융·COD 단계가 계속 실행된 사례다. '
              '따라서 6월의 실질적 심화는 계약기간이 더 길어졌다는 데 있지 않고 tolling·용량계약 등 수익구조가 더 다양하고 구체적인 형태로 확인된 데 있다.'
          )

          # 1260H was deliberately quarantined from source_card_ids/refs, so remove the residual public claim.
          flows['04']['summary'] = (
              '5월에는 중국 공급망 집중과 미국·EU의 현지화 대응, 핵심광물 갈등이 큰 축이었다. 6월에는 그 리스크가 기업과 거래 단위 규칙으로 내려왔다. '
              '중국은 미국 기업 10곳을 이중용도 수출통제 대상에 올렸고, 별도의 46개 미국 기업 제품에 정부조달 금지를 적용했다. '
              'G7은 가격격차 보조·공동조달·가격하한을 검토수단으로 제시했고 EU는 EEA 내 연 10GWh 이상 EV 배터리 셀 생산 프로젝트를 대상으로 15억유로 무이자대출 시설을 출범시켰다.'
          )

          # Audit: explicitly add May's 20-year fixed-revenue contract baseline.
          baseline_items = audit['previous_month_baseline']['baseline_state']
          bank = next(x for x in baseline_items if x['theme'] == 'ESS bankability and execution already present')
          bank['finding'] = (
              'May already contained project-financing closes, minimum-revenue/optimization structures, utility-scale COD, large ESS supply contracts, '
              'and 20-year fixed-revenue storage contracts in Japan.'
          )
          if '2026-05-13_JP_01' not in bank['evidence_card_ids']:
              bank['evidence_card_ids'].append('2026-05-13_JP_01')

          delta = {x['flow_id']: x for x in audit['delta_classification']}
          delta['01']['classification'] = 'STRUCTURE_DIFFERENTIATED_WITH_CONTINUING_EXECUTION'
          delta['01']['may_state'] = 'Financing, revenue-floor structures, COD and 20-year fixed-revenue storage contracts already existed.'
          delta['01']['june_change'] = (
              'June adds different revenue-contract forms—5-year/20-year tolling and a 20-year capacity contract—while tax-equity financing and COD remain continuing execution evidence. '
              'The delta is structural differentiation, not longer contract duration.'
          )

          selected = {x['id']: x for x in audit['selected_flows']}
          selected['01']['title'] = flows['01']['title']
          selected['01']['delta_classification'] = delta['01']['classification']

          effect = audit['independent_external_deep_dive'].get('editorial_effect', '')
          effect = effect.replace('longer revenue contracts', 'more differentiated revenue-contract structures')
          audit['independent_external_deep_dive']['editorial_effect'] = effect

          # Update official selection text now that 1260H is quarantined from publication.
          audit['official_source_selection']['selected_card_count'] = len(june['source_card_ids'])
          assert len(june['source_card_ids']) == 20
          assert '2026-06-09_US_02' not in june['source_card_ids']
          assert all(r.get('id') != '2026-06-09_US_02' for r in june['refs'])
          assert '1260H' not in flows['04']['summary']

          audit['codex_final_head_rereview_remediation'] = {
              'review_id': 5218883058,
              'reviewed_head': 'badbcd5c9e87060f88d30059841c051a1181884f',
              'findings_addressed': [
                  'removed_residual_1260h_public_claim_after_anchor_quarantine',
                  'advanced_monthly_library_updated_at_to_2026_09_16',
                  'reframed_flow01_from_longer_duration_to_revenue_structure_differentiation_and_added_may_20y_anchor'
              ]
          }

          brief_path.write_text(json.dumps(library, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert library['updated_at'] == '2026-09-16'
          assert '계약기간이 더 길어졌다는 데 있지 않고' in flows['01']['summary']
          assert '2026-05-13_JP_01' in bank['evidence_card_ids']
          assert delta['01']['classification'] == 'STRUCTURE_DIFFERENTIATED_WITH_CONTINUING_EXECUTION'
          assert selected['01']['delta_classification'] == delta['01']['classification']
          PY
      - name: Validate publication
        run: |
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
      - name: Commit remediation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git commit -m "fix: address final PR380 Codex review"
          git rm .github/workflows/tmp-pr380-final-codex-remediation.yml
          git commit -m "chore: remove final PR380 remediation helper"
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
