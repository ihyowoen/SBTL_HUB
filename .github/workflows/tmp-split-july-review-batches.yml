name: tmp-split-july-review-batches

on:
  push:
    branches:
      - chatgpt/monthly-brief-2026-07-backfill
    paths:
      - .github/workflows/tmp-split-july-review-batches.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/monthly-brief-2026-07-backfill
      - name: Split review universe into bounded batches
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          src=Path('runs/2026-09-10/monthly-brief-2026-07-universe-review.json')
          data=json.loads(src.read_text())
          outdir=Path('runs/2026-09-10/working/monthly-brief-2026-07')
          if outdir.exists(): shutil.rmtree(outdir)
          outdir.mkdir(parents=True)
          cards=data['cards']
          groups=[]
          for signal in ('top','high','mid'):
              xs=[c for c in cards if c['signal']==signal]
              for i in range(0,len(xs),25):
                  batch=xs[i:i+25]
                  name=f'{signal}-{i//25+1:02d}.json'
                  payload={'month':'2026-07','signal':signal,'batch':i//25+1,'count':len(batch),'cards':batch}
                  (outdir/name).write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
                  groups.append({'file':name,'signal':signal,'count':len(batch),'first_id':batch[0]['id'],'last_id':batch[-1]['id']})
          (outdir/'index.json').write_text(json.dumps({'batches':groups},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(groups,ensure_ascii=False,indent=2))
          PY
      - name: Commit batches and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-split-july-review-batches.yml
          git add runs/2026-09-10/working/monthly-brief-2026-07
          git commit -m "audit: split July Monthly Brief review batches"
          git push origin HEAD:chatgpt/monthly-brief-2026-07-backfill
