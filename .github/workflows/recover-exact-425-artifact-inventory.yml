name: Recover historical 290 residual 44 mapping

on:
  push:
    branches:
      - chatgpt/recover-exact-425-artifacts-20260903
    paths:
      - '.github/workflows/recover-exact-425-artifact-inventory.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search all reachable Git text blobs for historical 290 residual 44 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,re,json
          needles=[
            re.compile(r'historical.{0,80}290',re.I|re.S),
            re.compile(r'290.{0,80}historical',re.I|re.S),
            re.compile(r'residual.{0,80}44',re.I|re.S),
            re.compile(r'44.{0,80}residual',re.I|re.S),
            re.compile(r'37.{0,40}5.{0,40}2',re.I|re.S),
            re.compile(r'carry[-_ ]forward.{0,80}(290|44|37)',re.I|re.S),
          ]
          objs=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          seen=set(); hits=[]
          for line in objs:
            parts=line.split(' ',1); sha=parts[0]; path=parts[1] if len(parts)>1 else ''
            if sha in seen: continue
            seen.add(sha)
            try:
              if subprocess.check_output(['git','cat-file','-t',sha],text=True,stderr=subprocess.DEVNULL).strip()!='blob': continue
              size=int(subprocess.check_output(['git','cat-file','-s',sha],text=True).strip())
              if size>2_000_000: continue
              raw=subprocess.check_output(['git','cat-file','blob',sha])
              text=raw.decode('utf-8','ignore')
            except Exception:
              continue
            matched=[]
            for pat in needles:
              m=pat.search(text)
              if m:
                s=max(0,m.start()-240); e=min(len(text),m.end()+600)
                matched.append(re.sub(r'\s+',' ',text[s:e]))
            if matched:
              hits.append({'blob_sha':sha,'path':path,'size':size,'snippets':matched[:4]})
          print('HIT_COUNT=',len(hits))
          for h in hits[:100]: print(json.dumps(h,ensure_ascii=False))
          PY
