              'card_ids':['2026-06-22_CN_05','2026-06-23_EU_01','2026-06-17_US_02','2026-06-17_CN_05']
            },
            {
              'id':'04','title':'공급망 규칙, 국가·품목에서 기업·조달 적격성까지 세분화',
              'summary':'미 국방부 1260H 목록에는 CATL·BYD·Trina 등이 추가됐지만 이는 일반 제재나 투자금지가 아니라 국방조달 제한이다. 중국은 미국 방산·희토류 기업 10곳에 이중용도 수출통제를, 46곳에는 정부조달 금지를 즉시 적용했다. G7은 핵심광물의 가격격차 보조·공동조달·가격하한을 검토수단으로 제시했고, EU는 역내 셀 생산에 15억유로 무이자대출 시설을 출범시켰다. 통제와 지원 모두 국적만이 아니라 기업명단·조달자격·금융조건 단위로 세분화되는 흐름이지만, 비구속 선언과 실제 시행규칙은 구분해야 한다.',
