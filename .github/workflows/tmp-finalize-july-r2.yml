name: tmp-finalize-july-r2
on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-07
    paths:
      - .github/workflows/tmp-finalize-july-r2.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-07
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Preserve R1 and publish remediation as R2
        run: |
          python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          brief_path = Path('public/data/monthly_briefs.json')
          audit_path = Path('runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')

          data = json.loads(brief_path.read_text())
          current = [x for x in data['items'] if x.get('month') == '2026-07']
          assert len(current) == 1
          current = current[0]
          assert current['id'] == 'monthly-brief-2026-07-r1'
          assert current['revision'] == 1 and current['status'] == 'published'
          assert current['published_at'] == '2026-09-14'
          assert len(current['source_card_ids']) == 19 and len(current['refs']) == 19

          old_text = subprocess.check_output([
              'git','show','4ed1bb28e5f76e24d4a520ec722104affb52407d:public/data/monthly_briefs.json'
          ], text=True)
          old_data = json.loads(old_text)
          r1 = next(x for x in old_data['items'] if x.get('id') == 'monthly-brief-2026-07-r1')
          assert r1['revision'] == 1 and r1['status'] == 'published'
          assert r1['published_at'] == '2026-09-14'
          assert r1['qc']['reviewed_at'] == '2026-09-14'
          assert r1['approval']['approved_at'] == '2026-09-14'
          assert len(r1['source_card_ids']) == 21 and len(r1['refs']) == 21

          r2 = copy.deepcopy(current)
          r2['id'] = 'monthly-brief-2026-07-r2'
          r2['revision'] = 2
          r2['status'] = 'revised'
          r2['published_at'] = '2026-09-15'
          r2['qc']['reviewed_at'] = '2026-09-15'
          r2['qc']['notes'] = (
              'Revision 2 preserves the September 14 R1 as publication history and records the September 15 exact-head remediation. '
              'Nine non-indispensable cards with compound-title, fact, or canonical-URL defects are quarantined; 19 official canonical anchors remain. '
              'Every R2 public reference retains its locked canonical title and is bound to a validator-accepted governed URL; Flow 03 is limited to directly published ESS evidence and Flow 05 to surviving Section 301 and China consumption-tax evidence.'
          )
          r2['approval']['approved_at'] = '2026-09-15'
          r2['approval']['notes'] = (
              'Revision 2 approved on September 15 after exact-head remediation. R1 remains preserved as the September 14 publication; '
              'the revised issue removes unsupported EV-growth, FCC foreign-made-scope, and four-hour LCOS publication premises without changing the locked canonical provenance contract.'
          )

          other = [x for x in data['items'] if x.get('month') != '2026-07']
          data['items'] = other + [r2, r1]
          data['updated_at'] = '2026-09-15'
          brief_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          audit = json.loads(audit_path.read_text())
          assert audit['audit_date'] == '2026-09-15'
          assert audit['official_source_selection']['selected_card_count'] == 19
          audit['issue_id'] = 'monthly-brief-2026-07-r2'
          revision_method = (
              'Preserve the September 14 publication as immutable R1 history and publish the September 15 post-publication remediation as R2; '
              'do not backdate QC or approval for content that did not exist on R1.'
          )
          if revision_method not in audit['method']:
              audit['method'].append(revision_method)
          audit.setdefault('qc', {})['codex_review_5205423260'] = 'REMEDIATED_R1_PRESERVED_R2_PUBLISHED_2026_09_15'
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n')

          # Fail closed on revision semantics.
          final = json.loads(brief_path.read_text())
          july = [x for x in final['items'] if x.get('month') == '2026-07']
          assert {(x['revision'], x['status'], x['published_at']) for x in july} == {
              (1, 'published', '2026-09-14'),
              (2, 'revised', '2026-09-15'),
          }
          r2f = next(x for x in july if x['revision'] == 2)
          assert r2f['qc']['reviewed_at'] == '2026-09-15'
          assert r2f['approval']['approved_at'] == '2026-09-15'
          assert len(r2f['refs']) == 19 and len(r2f['source_card_ids']) == 19
          assert json.loads(audit_path.read_text())['issue_id'] == 'monthly-brief-2026-07-r2'
          PY
      - run: npm run validate:monthly-briefs
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit revision history remediation
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git rm .github/workflows/tmp-finalize-july-r2.yml
          git add public/data/monthly_briefs.json runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json
          git commit -m "fix: publish July remediation as revision 2"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-07
