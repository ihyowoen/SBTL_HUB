name: Historical carry-forward terminal R3
on:
  push:
    branches: [chatgpt/v4-run-baseline-20260831-20260901-r4]
    paths: [.github/workflows/tmp-historical-terminal-r3.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize historical terminal reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main chatgpt/v4-crossrun-20260831-20260901
          test "$(git rev-parse origin/main)" = "df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          cross='origin/chatgpt/v4-crossrun-20260831-20260901'
          source_path='runs/2026-09-02/historical_governed_carry_forward_20260825_active246_R1.json'
          source=json.loads(subprocess.check_output(['git','show',f'{cross}:{source_path}'],text=True))
          active_r2=json.loads(Path('runs/2026-09-02/historical_active_246_reconciliation_20260902_R2.json').read_text())
          residual=json.loads(Path('runs/2026-09-02/historical_residual_44_terminal_reconciliation_20260902_R2.json').read_text())
          doc=json.loads(Path('runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_df6fccc.json').read_text())
          ids=source['source_augmentation_story_ids']+source['earnings_deep_dive_story_ids']
          assert len(ids)==246 and len(set(ids))==246
          canonical={x['story_id']:x['production_card_id'] for x in active_r2['current_main_exact_provenance_crosscheck']['direct_canonical_matches']}
          assert set(canonical)=={'U1476','U1581','U1989'}
          holds=[x for x in ids if x not in canonical]
          assert len(holds)==243 and len(set(holds))==243
          assert residual['status']=='PASS_TERMINAL_ACCOUNTING'
          assert residual['accounting']['input_total']==44
          assert residual['accounting']['accounted_total']==44
          assert residual['accounting']['active_carry_forward_to_stage_a_from_this_residual_cohort']==0
          assert doc['status']=='PASS' and doc['repository_head_sha']=='df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4'
          assert doc['stage_0_0c_authorized'] is True
          terminal=[]
          for sid in ids:
              if sid in canonical:
                  terminal.append({'candidate_id':f'historical:20260825:{sid}','story_id':sid,'disposition':'already_canonicalized_exact_provenance','production_card_id':canonical[sid],'stage_a_eligible_current_run':False})
              else:
                  terminal.append({'candidate_id':f'historical:20260825:{sid}','story_id':sid,'disposition':'provenance_hold_not_stage_a_evaluable','reason':'Exact historical cohort membership is known, but per-row headline/URL/event metadata is not repository-bound on the current run branch. Current V4 Stage A evaluation would require fabrication, so this row is terminally held at discovery scope and remains reopenable.','reopen_condition':'Materialize the exact row from SHA-256 4b8cac6945977056728bf97ddacccf4ffc7596420396d6354f50fd4fd3d68fae (or the exact event-universe source row), then rerun current V4 0.0C/Stage A for this story.','stage_a_eligible_current_run':False})
          out={
            'schema':'stage_0_0c_historical_carry_forward_terminal_reconciliation_v3',
            'stage':'0.0C-HISTORICAL-CARRY-FORWARD',
            'status':'PASS_TERMINAL_HISTORICAL_ACCOUNTING_CURRENT_STAGE_A_UNBLOCKED',
            'generated_date':'2026-09-02',
            'document_universe_manifest_ref':'runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_df6fccc.json',
            'repository_head_sha':'df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4',
            'base_full_blob_sha':'53219907cdb435c3822c41d097b23e475662aa8a',
            'canonical_card_count':1514,
            'source_historical_246_ref':source_path,
            'source_historical_246_artifact_bindings':active_r2['source_artifact_bindings'],
            'source_residual_44_ref':'runs/2026-09-02/historical_residual_44_terminal_reconciliation_20260902_R2.json',
            'policy_boundary':{
              'historical_v3_selection_reused':False,
              'historical_identity_membership_reused':True,
              'no_historical_item_silently_deleted':True,
              'provenance_hold_is_not_reject':True,
              'provenance_hold_is_reopenable':True,
              'current_stage_a_may_process_only_source_bound_current_events':True
            },
            'historical_246_accounting':{
              'input_total':246,'already_canonicalized_exact':3,'provenance_hold_not_stage_a_evaluable':243,'active_carry_forward_to_current_stage_a':0,'accounted_total':246,'accounting_pass':True
            },
            'residual_44_accounting':residual['accounting'],
            'historical_gross_accounting':{
              'historical_gross':290,'residual_44':44,'active_246':246,'historical_rows_terminally_accounted':290,'historical_rows_entering_current_stage_a':0,'accounting_pass':True
            },
            'terminal_historical_246_disposition_ledger':terminal,
            'known_unknowns':[{'type':'HISTORICAL_SOURCE_ROWS_NOT_REPOSITORY_BOUND','count':243,'effect':'Rows are preserved as provenance holds outside current Stage A, not rejected.'}],
            'current_event_universe':{
              'run_id':'SBTL_V4_XRUN_20260831_143419__20260901_123511_R3','source_bound_event_count':425,'observation_count':632,'input_sha256':{'20260831':'40c308cfe4ca067bb0d93a57475ee0ea359bfaf1332e895dcf35591dc6ceafb8','20260901':'28fcb692c1782bebc06f8f8816cdee8ce3bef80f703aab7eddab4df837df3452'},'full_local_artifact_sha256':'90719eb1067241df6b201c2722cca5280f89ea69d0e3fd3e7865b9e91d9e8c13'
            },
            'formal_stage_a_handoff':{
              'authorized':True,'stage_a_input_scope':'current_source_bound_crossrun_events_only','stage_a_input_event_count':425,'historical_stage_a_input_count':0,'selection_policy_version':'EMBEDDED_NEWS_VALUE_SELECTION_V4','condition':'A repository-bound compact current-event handoff must be materialized from the SHA-locked 425-event universe before the formal Stage A artifact is emitted.'
            }
          }
          assert len(out['terminal_historical_246_disposition_ledger'])==246
          assert sum(1 for x in terminal if x['disposition']=='provenance_hold_not_stage_a_evaluable')==243
          p=Path('runs/2026-09-02/stage_0_0c_historical_carry_forward_terminal_reconciliation_20260902_R3.json')
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS historical 290 terminal accounting; Stage A current scope = 425')
          PY
          git add runs/2026-09-02/stage_0_0c_historical_carry_forward_terminal_reconciliation_20260902_R3.json
          git rm .github/workflows/tmp-historical-terminal-r3.yml
          git commit -m 'chore: close historical carry-forward at 0.0C boundary'
          git push origin HEAD:chatgpt/v4-run-baseline-20260831-20260901-r4
