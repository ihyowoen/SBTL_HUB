name: tmp-monthly-card-remediation

on:
  push:
    branches:
      - chatgpt/monthly-brief-card-remediation-20260909-r1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply governed bounded card remediation
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='e19f6c113ccb62906e7fdefaf3bae657c58b5637'
          BASE_BLOB="$(git rev-parse "${BASE_SHA}:data/cards.full.json")"
          export BASE_SHA BASE_BLOB
          node <<'NODE'
          const fs = require('fs');
          const fullPath = 'data/cards.full.json';
          const doc = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
          if (!Array.isArray(doc.cards) || doc.cards.length !== 1599) throw new Error(`unexpected canonical count ${doc.cards?.length}`);
          const byId = new Map(doc.cards.map((c) => [c.id, c]));

          const old300 = byId.get('2026-08-05_US_03');
          if (!old300) throw new Error('missing Old 300 card');
          const pv = 'https://www.pv-magazine.com/2026/08/06/orsted-turns-on-500-mwh-battery-project-with-co-located-solar-in-texas/';
          const esn = 'https://www.energy-storage.news/orsted-puts-500mwh-old-300-texas-bess-into-operation/';
          const spw = 'https://www.solarpowerworldonline.com/2026/08/orsted-adds-500-mwh-of-tesla-bess-to-ercot-grid/';
          for (const u of [pv, esn, spw]) if (!old300.urls?.includes(u)) throw new Error(`Old 300 missing governed URL ${u}`);
          old300.urls = [pv, esn, spw, ...old300.urls.filter((u) => ![pv, esn, spw].includes(u))];

          const jian = byId.get('2026-08-26_CN_02');
          if (!jian) throw new Error('missing Jianxiawo card');
          jian.title = 'CATL Jianxiawo EIA 접수 공시 철회…재가동 절차 다시 후퇴';
          jian.sub = '8월 26일 환경접수 예정 공시 철회…재검증 뒤 재공시 예정';
          jian.gate = 'Jianxiawo 재가동 기대가 EIA 접수 공시 철회로 다시 후퇴했다. 다음 확인 지점은 재공시·최종 환경승인·실제 재가동 여부다.';
          if (!jian.event_fingerprint || typeof jian.event_fingerprint !== 'object') throw new Error('Jianxiawo missing event_fingerprint');
          jian.event_fingerprint = {
            ...jian.event_fingerprint,
            actor: 'CATL Jianxiawo EIA 접수 공시 철회',
            factual_anchor: '이춘시 환경당국은 8월 26일 Jianxiawo 광산 EIA 보고서의 접수 예정 공시를 철회하고 재검증 뒤 다시 공시하겠다고 밝혔다.'
          };

          const ts = new Date().toISOString();
          doc.updated = ts;
          doc.total = doc.cards.length;
          fs.writeFileSync(fullPath, JSON.stringify(doc, null, 2) + '\n');

          const manifest = {
            schema: 'manual_direct_add_v2',
            status: 'PASS',
            direct_add_id: 'MONTHLY_BRIEF_CARD_REMEDIATION_20260909_R1',
            review_mode: 'already_reviewed_bounded_direct_add',
            formal_full_run_claimed: false,
            base_main_commit_sha: process.env.BASE_SHA,
            base_full_blob_sha: process.env.BASE_BLOB,
            expected_before: 1599,
            expected_after: 1599,
            output_updated: ts,
            operations: {
              add: [],
              update: ['2026-08-05_US_03', '2026-08-26_CN_02'],
              id_migration: []
            },
            editorial_attestation: {
              policy_version: 'EMBEDDED_NEWS_VALUE_SELECTION_V4',
              additions: [],
              updates: [
                {
                  id: '2026-08-05_US_03',
                  change_type: 'evidence_update',
                  changed_fields: ['urls'],
                  reason: 'Monthly Brief downstream QC found that urls[0] pointed to a co-location/context source while the visible title is the commercial-operation claim. Reorder existing governed URLs so a title/fact-supporting COD source is primary without changing any fact or event identity.',
                  evidence_review_summary: 'The locked card already contains pv magazine and Energy-Storage.News evidence supporting title/fact for Old 300 commercial operation; Solar Power World remains retained for co-location/independent-operation context.'
                },
                {
                  id: '2026-08-26_CN_02',
                  change_type: 'correction',
                  changed_fields: ['event_fingerprint', 'gate', 'sub', 'title'],
                  reason: 'Monthly Brief downstream QC found that the Aug-26 event card headline had absorbed a Sep-1 Benchmark forecast, blurring the representative-event/month boundary. Re-anchor the visible headline and event fingerprint to the Aug-26 EIA-acceptance-notice withdrawal while retaining later Benchmark evidence as dated reinforcement inside the governed evidence package.',
                  evidence_review_summary: 'The Aug-26 Eastmoney/Shanghai Securities News report establishes the EIA acceptance-notice withdrawal and re-verification step. Benchmark Sep-1 and Northern Miner Sep-2 remain valid later reinforcement but no longer control the Aug-26 card title, sub, gate, or event anchor.'
                }
              ]
            }
          };
          fs.mkdirSync('direct-adds/2026-09-09-monthly-brief-card-remediation', { recursive: true });
          fs.writeFileSync('direct-adds/2026-09-09-monthly-brief-card-remediation/direct-add.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

          node scripts/lean_cards.mjs
          git show "${BASE_SHA}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"
          MANIFEST='direct-adds/2026-09-09-monthly-brief-card-remediation/direct-add.json'
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance "$MANIFEST"
          node scripts/validate_manual_direct_add.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Commit validated canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json direct-adds/2026-09-09-monthly-brief-card-remediation/direct-add.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remediate Monthly Brief card integrity findings'
          git push origin HEAD:chatgpt/monthly-brief-card-remediation-20260909-r1
