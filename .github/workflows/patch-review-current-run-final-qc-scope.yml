name: Patch current-run Final QC scope

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_review_current_run_final_qc_scope.py
      - .github/workflows/patch-review-current-run-final-qc-scope.yml

permissions:
  contents: write

concurrency:
  group: patch-review-current-run-final-qc-scope
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused fix
        run: python scripts/patch_review_current_run_final_qc_scope.py
      - name: Compile validators
        run: python -m py_compile validation_scripts/*.py
      - name: Run focused regression
        run: python -m unittest validation_scripts.tests.test_review_current_run_final_qc_scope -v
      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -p 'test*.py'
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Remove temporary patch machinery
        run: |
          rm scripts/patch_review_current_run_final_qc_scope.py
          rm .github/workflows/patch-review-current-run-final-qc-scope.yml
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope Final QC validators to current run"
          git push origin HEAD:agent/structural-news-value-v3
