name: G5.14 frozen MaStR bounded checkpoint census
on:
  push:
    branches: [research/g514-mastr-census-20261123]
    paths:
      - .github/workflows/g514-mastr-original-census.yml
  workflow_dispatch:
    inputs:
      prior_cache_key:
        description: Exact prior checkpoint cache key (required for continuation)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: g514-mastr-official-audit
  cancel-in-progress: false
jobs:
  census:
    if: github.ref == 'refs/heads/research/g514-mastr-census-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lxml==5.4.0
      - name: Recover pinned original receipt without contacting BNetzA
        run: |
          mkdir -p g514_evidence
          base64 -d research/g514_resume_tools/R23_PINNED_INVENTORY_ARCHIVE.zip.b64 > g514_evidence/R23_SOURCE.zip
          echo '5d613791ccd32f8f7cd427ed7b8f4d813fb56f6efd266657a2d92ed9e347c299  g514_evidence/R23_SOURCE.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile, pathlib, hashlib
          with zipfile.ZipFile('g514_evidence/R23_SOURCE.zip') as z:
              assert z.testzip() is None
              b=z.read('g514_output/official_source_inventory.json')
          assert hashlib.sha256(b).hexdigest()=='804ef23894cbc829a31a51e435d7e730861a9c9f1e03639a950d3c15d631915b'
          pathlib.Path('g514_evidence/inventory.json').write_bytes(b)
          PY
      - name: Restore exact prior checkpoint if continuing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: g514_state
          key: ${{ inputs.prior_cache_key }}
          fail-on-cache-miss: true
      - name: Reject duplicate initial invocation
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        id: initial
        with:
          path: g514_state
          key: g514-20261001-r26-first-guard
          lookup-only: true
      - name: Single bounded source operation
        if: github.event_name == 'workflow_dispatch' || steps.initial.outputs.cache-hit != 'true'
        id: process
        run: |
          set +e
          python -u research/g514_resume_tools/G5_14_R26_MASTR_CHECKPOINT.py --parser research/germany_ess_g514/G5_14_R23_BATTERY_RAW_REAGGREGATION_20261123.py --inventory g514_evidence/inventory.json --work g514_state --max-members 4 --max-requests 50 > g514_evidence/source.log 2>&1
          rc=$?
          cat g514_evidence/source.log
          echo "$rc" > g514_evidence/process_exit.txt
          if [ -f g514_state/RUN_RECEIPT.json ]; then cp g514_state/RUN_RECEIPT.json g514_evidence/; fi
          if [ -f g514_state/RESULT.json ]; then cp g514_state/RESULT.json g514_evidence/; fi
          test -f g514_evidence/RUN_RECEIPT.json
      - name: Preserve checkpoint under immutable run key
        if: always() && steps.process.outcome == 'success'
        uses: actions/cache/save@v4
        id: save
        with:
          path: g514_state
          key: g514-20261001-r26-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve first-run guard
        if: always() && github.event_name == 'push' && steps.process.outcome == 'success' && steps.save.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: g514_evidence/process_exit.txt
          key: g514-20261001-r26-first-guard
      - name: Record durable checkpoint key and evidence
        if: always()
        run: |
          mkdir -p g514_evidence
          printf '%s\n' 'g514-20261001-r26-${{ github.run_id }}-${{ github.run_attempt }}' > g514_evidence/checkpoint_key.txt
          printf '%s\n' '${{ steps.save.outcome }}' > g514_evidence/cache_save_outcome.txt
          (cd g514_evidence && sha256sum *.json *.txt *.log *.zip 2>/dev/null > SHA256SUMS.txt) || true
      - name: Upload receipt and source log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g514-r26-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g514_evidence/
          retention-days: 90
      - name: Require genuine full census for full success
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('g514_evidence/RUN_RECEIPT.json')
          assert p.exists(), 'No actual source receipt; no completion claim'
          x=json.loads(p.read_text())
          assert not x['fixture']
          print('Actual completed members:',x['completed_members'])
          assert x['full_complete'] and x['completed_members']=={'catalog':1,'sse':29,'see':29}, 'Bounded partial or blocked; inspect saved receipt'
          assert Path('g514_evidence/RESULT.json').exists()
          PY
