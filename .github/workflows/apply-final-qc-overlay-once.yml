name: Apply Final QC overlay once

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - .github/workflows/apply-final-qc-overlay-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch Final QC overlay
        run: |
          python - <<'PY'
          from pathlib import Path

          old = """- Run `evidence_qc_v8_check.py`,
            `python validation_scripts/related_lifecycle_check.py <MERGED_BASELINE_CANDIDATE_ARTIFACT> --require-contract --allow-provisional-related --new-id-file <CURRENT_RUN_ID_FILE>`,
            `date_role_freshness_check.py --require-date-role`, and
            `stage_artifact_contract_check.py 0.7` before `publish_ready=true`."""

          new = """- Run all four validators against `<MERGED_BASELINE_CANDIDATE_ARTIFACT>` before `publish_ready=true`:
            `python validation_scripts/evidence_qc_v8_check.py <MERGED_BASELINE_CANDIDATE_ARTIFACT>`,
            `python validation_scripts/related_lifecycle_check.py <MERGED_BASELINE_CANDIDATE_ARTIFACT> --require-contract --allow-provisional-related --new-id-file <CURRENT_RUN_ID_FILE>`,
            `python validation_scripts/date_role_freshness_check.py <MERGED_BASELINE_CANDIDATE_ARTIFACT> --require-date-role`, and
            `python validation_scripts/stage_artifact_contract_check.py 0.7 <MERGED_BASELINE_CANDIDATE_ARTIFACT>`."""

          targets = [
              Path("validation_scripts/apply_prompt_contract_overlays.py"),
              Path("docs/llm_prompts/v1/09_PROMPT_0_7_Final_QC.md"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one old Final QC command block in {path}, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Add focused regression
        run: |
          cat > validation_scripts/tests/test_review_4864682739_contracts.py <<'PYTEST'
          """Regression coverage for review 4864682739 Final QC commands."""
          from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[2]
          TARGETS = (
              ROOT / "validation_scripts/apply_prompt_contract_overlays.py",
              ROOT / "docs/llm_prompts/v1/09_PROMPT_0_7_Final_QC.md",
          )
          COMMANDS = (
              "python validation_scripts/evidence_qc_v8_check.py <MERGED_BASELINE_CANDIDATE_ARTIFACT>",
              "python validation_scripts/related_lifecycle_check.py <MERGED_BASELINE_CANDIDATE_ARTIFACT> --require-contract --allow-provisional-related --new-id-file <CURRENT_RUN_ID_FILE>",
              "python validation_scripts/date_role_freshness_check.py <MERGED_BASELINE_CANDIDATE_ARTIFACT> --require-date-role",
              "python validation_scripts/stage_artifact_contract_check.py 0.7 <MERGED_BASELINE_CANDIDATE_ARTIFACT>",
          )


          class TestReview4864682739Contracts(unittest.TestCase):
              def test_every_final_qc_validator_has_python_and_required_input(self):
                  for path in TARGETS:
                      text = path.read_text(encoding="utf-8")
                      for command in COMMANDS:
                          self.assertIn(f"`{command}`", text, path)

              def test_bare_non_executable_final_qc_commands_are_absent(self):
                  forbidden = (
                      "`evidence_qc_v8_check.py`,",
                      "`date_role_freshness_check.py --require-date-role`",
                      "`stage_artifact_contract_check.py 0.7`",
                  )
                  for path in TARGETS:
                      text = path.read_text(encoding="utf-8")
                      for value in forbidden:
                          self.assertNotIn(value, text, path)


          if __name__ == "__main__":
              unittest.main()
          PYTEST

      - name: Verify overlay and focused regression
        run: |
          python validation_scripts/apply_prompt_contract_overlays.py --check
          python -m unittest validation_scripts.tests.test_review_4864682739_contracts -v

      - name: Commit permanent changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-final-qc-overlay-once.yml
          git add validation_scripts/apply_prompt_contract_overlays.py \
                  docs/llm_prompts/v1/09_PROMPT_0_7_Final_QC.md \
                  validation_scripts/tests/test_review_4864682739_contracts.py
          git commit -m "fix: make Final QC validator commands executable"
          git push origin HEAD:agent/structural-news-value-v3
