name: nr26-bootstrap-materialize

on:
  push:
    branches:
      - nr26-20260918-r1-formal

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Materialize and validate formal NR26 run
        shell: bash
        run: |
          set -euo pipefail
          RUN="runs/2026-09-18/nr26-20260911-v4-r1/card-run.json"
          AUDIT="runs/2026-09-18/nr26-20260911-v4-r1/audit/card-run-audit.json"
          BASE="1305dea1892b5b19ce5bad84e67407743e5b1c26"

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE"

          mkdir -p "$(dirname "$AUDIT")"
          printf '{}\n' > "$AUDIT"

          node scripts/apply_card_run.mjs \
            --run "$RUN" \
            --baseline data/cards.full.json \
            --canonical-path data/cards.full.json \
            --output data/cards.full.json \
            --report /tmp/nr26-apply-report.json \
            --lean-path public/data/cards.json \
            --base-main-sha "$BASE" \
            --apply

          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const runPath = 'runs/2026-09-18/nr26-20260911-v4-r1/card-run.json';
          const auditPath = 'runs/2026-09-18/nr26-20260911-v4-r1/audit/card-run-audit.json';
          const run = JSON.parse(fs.readFileSync(runPath, 'utf8'));
          const stable = (v) => Array.isArray(v) ? v.map(stable)
            : (v && typeof v === 'object')
              ? Object.fromEntries(Object.keys(v).sort().map(k => [k, stable(v[k])]))
              : v;
          const sha = (x) => crypto.createHash('sha256').update(x).digest('hex');
          const audit = {
            schema: 'card_run_audit_v1',
            status: 'PASS',
            audit_complete: true,
            reviewer_independence: 'SEPARATE_PASS',
            run_id: run.run_id,
            base_main_commit_sha: run.base_main_commit_sha,
            base_full_blob_sha: run.base_full_blob_sha,
            document_universe_manifest_ref: run.document_universe_manifest_ref,
            coverage_discovery_ref: run.coverage_discovery_ref,
            independent_completeness_ref: run.independent_completeness_ref,
            reviewed_operations_sha256: sha(Buffer.from(JSON.stringify(stable(run.operations)))),
            expected_before: run.expected_before,
            expected_after: run.expected_after,
            inserted_ids: run.operations.insert.map(x => x.card.id),
            updated_ids: run.operations.update.map(x => x.id),
            related_additions: run.operations.related_add.map(x => ({
              source_id: x.source_id,
              target_id: x.target_id,
              direction: x.direction,
            })),
            zero_deletion_assertion: true,
            zero_related_remove_assertion: true,
            full_output_sha256: sha(fs.readFileSync('data/cards.full.json')),
            lean_output_sha256: sha(fs.readFileSync('public/data/cards.json')),
          };
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
          console.log(JSON.stringify({
            operations_sha256: audit.reviewed_operations_sha256,
            full_output_sha256: audit.full_output_sha256,
            lean_output_sha256: audit.lean_output_sha256,
            inserted: audit.inserted_ids.length,
            related_additions: audit.related_additions.length,
          }, null, 2));
          NODE

          node scripts/validate_json_schema_subset.mjs \
            --schema schemas/card-run.v1.schema.json \
            --instance "$RUN"
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN"
          node scripts/validate_card_run_v4_hardening.mjs --run "$RUN"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN"
          node scripts/validate_card_run_relations.mjs --run "$RUN"
          node scripts/validate_card_run_lineage_containers.mjs \
            --run "$RUN" --canonical data/cards.full.json
          node scripts/validate_card_run_audits_dispatch.mjs \
            --run "$RUN" --full data/cards.full.json --lean public/data/cards.json

          ID_LEDGER="/tmp/nr26-prompt-0-8-id-ledger.json"
          MERGE_PREP_REF="$(
            node scripts/validate_prompt_0_8_semantic_gate.mjs \
              --run "$RUN" \
              --full data/cards.full.json \
              --ledger "$ID_LEDGER"
          )"
          test -s "$ID_LEDGER"
          test -n "$MERGE_PREP_REF" && test -f "$MERGE_PREP_REF"

          STRICT_ID_COUNT="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.ids||[]).length))' "$ID_LEDGER")"
          echo "=== NR26 RELATED DIAGNOSTIC ==="
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "validation_scripts")
          from related_lifecycle_core import item_specific_lineage_assertion
          d=json.load(open("data/cards.full.json", encoding="utf-8"))
          cards=d["cards"] if isinstance(d,dict) else d
          for cid in ("2026-09-15_CN_01","2026-09-15_GL_01"):
              card=next(x for x in cards if x.get("id")==cid)
              lin=card.get("related_lineage") or {}
              print(cid, "relation_type=", repr(lin.get("relation_type")))
              for k in ("fresh_follow_up_anchor","incremental_fact_vs_predecessor","changed_judgment_vs_predecessor"):
                  v=lin.get(k)
                  print(" ", k, "=", repr(v), "item_specific=", item_specific_lineage_assertion(v))
          PY

          if [[ "$STRICT_ID_COUNT" -gt 0 ]]; then
            python3 validation_scripts/related_lifecycle_check.py \
              data/cards.full.json --require-contract --new-id-file "$ID_LEDGER"
            python3 validation_scripts/evidence_qc_v8_check.py \
              data/cards.full.json --new-id-file "$ID_LEDGER"
            python3 validation_scripts/date_role_freshness_check.py \
              data/cards.full.json --require-date-role --new-id-file "$ID_LEDGER"
          fi

          python3 validation_scripts/stage_artifact_contract_check.py \
            0.8 "$MERGE_PREP_REF"

          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check

          node scripts/apply_card_run.mjs \
            --run "$RUN" \
            --baseline data/cards.full.json \
            --canonical-path data/cards.full.json \
            --output data/cards.full.json \
            --report /tmp/nr26-verify-report.json \
            --lean-path public/data/cards.json \
            --base-main-sha "$BASE" \
            --verify

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json "$AUDIT"
          git diff --cached --quiet && { echo "No canonical changes to commit"; exit 1; }
          git commit -m "Materialize NR26 canonical outputs"
          git push origin HEAD:nr26-20260918-r1-formal
