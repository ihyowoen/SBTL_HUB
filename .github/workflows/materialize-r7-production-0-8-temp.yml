name: Materialize R7 production Prompt 0.8 temp

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-r7-production-0-8-temp.yml
      - validation_temp/20260903-r7-0-8/**

permissions:
  contents: write
  actions: read

concurrency:
  group: r7-production-0-8-materialization
  cancel-in-progress: false

jobs:
  materialize-and-push-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: builder
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout clean production branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/production-20260903-r7-33
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Verify production branch is exact frozen main
        working-directory: work
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5317bec055b88a26cffb136e7844eb488ae4db0d"
          test "$(git rev-parse 5317bec055b88a26cffb136e7844eb488ae4db0d:data/cards.full.json)" = "8b3d96b5c1fd779567ef8512f7123fc4310093ec"
          test "$(git hash-object data/cards.full.json)" = "8b3d96b5c1fd779567ef8512f7123fc4310093ec"
          test -z "$(git status --porcelain)"

      - name: Download exact full-schema-complete machine-PASS 0.7C R4 package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ihyowoen/SBTL_HUB/actions/artifacts/10004237023/zip \
            -o /tmp/r7-stage-0-7c-validated-r4.zip
          echo "81b23a28f3c8a73c5a63ccaccac9da6f3620e971aae0cf625c0930b21dcbb63b  /tmp/r7-stage-0-7c-validated-r4.zip" | sha256sum -c -
          mkdir -p work/runs/2026-09-06/r7-20260903-production-r1
          unzip -q /tmp/r7-stage-0-7c-validated-r4.zip -d work/runs/2026-09-06/r7-20260903-production-r1
          test -s work/runs/2026-09-06/r7-20260903-production-r1/card-run.json
          test -s work/runs/2026-09-06/r7-20260903-production-r1/stage-0-7c.json
          python - <<'PY'
          import hashlib,json
          root='work/runs/2026-09-06/r7-20260903-production-r1'
          run=json.load(open(root+'/card-run.json',encoding='utf-8'))
          c=json.load(open(root+'/stage-0-7c.json',encoding='utf-8'))
          sha='203f788ac48796fe9e790a70a30afa7bfcc8dd7143e56011548f00150d2e80a7'
          allowed={'Battery','ESS','Materials','EV','Charging','Policy','Manufacturing','AI','Robotics','PowerGrid','SupplyChain','Other'}
          def stable(v):
            if isinstance(v,list): return [stable(x) for x in v]
            if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
            return v
          op_sha=hashlib.sha256(json.dumps(stable(run['operations']),ensure_ascii=False,separators=(',',':')).encode('utf-8')).hexdigest()
          assert op_sha==sha
          assert c['reviewed_operations_sha256']==sha
          assert c['operation_freeze']['operations_sha256']==sha
          assert c['production_schema_projection']['status']=='PASS'
          assert c['production_schema_projection']['card_count']==33
          assert len(run['operations']['insert'])==33
          assert len(run['operations']['update'])==0
          assert len(run['operations']['related_add'])==3
          ins={x['card']['source_spec_id']:x['card'] for x in run['operations']['insert']}
          assert len(ins)==33
          for card in ins.values():
            assert card['cat'] in allowed
            assert isinstance(card.get('sub_cat'),str) and card['sub_cat'].strip()
          assert run['operations']['related_add'][2]['patches'][4]['op']=='replace'
          assert run['operations']['related_add'][2]['patches'][5]['op']=='replace'
          fields=('fresh_follow_up_anchor_class','fresh_follow_up_anchor','incremental_fact_vs_predecessor','changed_judgment_vs_predecessor')
          for sid in ('STD26_R7_003','STD26_R7_015'):
            assert all(isinstance(ins[sid]['related_lineage'].get(f),str) and ins[sid]['related_lineage'][f].strip() for f in fields)
          print('RESULT: PASS_EXACT_FULL_SCHEMA_COMPLETE_0_7C_R4_ARTIFACT_IMPORT')
          PY

      - name: Materialize and fully validate Prompt 0.8 production result
        working-directory: work
        run: |
          set -euo pipefail
          python ../builder/validation_temp/20260903-r7-0-8/materialize_production_0_8_r3.py

      - name: Active workflow regression suite
        working-directory: work
        run: |
          set -euo pipefail
          python validation_scripts/run_active_workflow_tests.py

      - name: Enforce production diff allowlist
        working-directory: work
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          test ${#changed[@]} -gt 0
          printf 'Changed paths:\n'
          printf ' - %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              data/cards.full.json|public/data/cards.json|runs/2026-09-06/r7-20260903-production-r1/*) ;;
              *) echo "FAIL: undeclared production path $path" >&2; exit 1 ;;
            esac
          done
          test -f data/cards.full.json
          test -f public/data/cards.json
          test -f runs/2026-09-06/r7-20260903-production-r1/card-run.json
          test -f runs/2026-09-06/r7-20260903-production-r1/stage-0-8.json
          test -f runs/2026-09-06/r7-20260903-production-r1/card-run-audit.json

      - name: Commit validated production package only after all gates pass
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add data/cards.full.json public/data/cards.json runs/2026-09-06/r7-20260903-production-r1
          git diff --cached --check
          git commit -m "Publish governed Sep 3 R7 33 cards"
          git push origin HEAD:chatgpt/production-20260903-r7-33
          echo "RESULT: PRODUCTION_BRANCH_PUSHED $(git rev-parse HEAD)"
