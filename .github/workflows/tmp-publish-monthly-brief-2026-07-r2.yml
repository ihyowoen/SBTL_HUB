name: tmp-publish-monthly-brief-2026-07-r2
on: push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-07
          fetch-depth: 0
      - name: Reuse validated publication build block
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-publish-monthly-brief-2026-07.yml').read_text()
          start="      - name: Build fail-closed July publication\n        run: |\n"
          end="      - name: Install dependencies\n"
          if start not in src or end not in src:
              raise SystemExit('publication build block markers not found')
          block=src.split(start,1)[1].split(end,1)[0]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/build-july-publication.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/build-july-publication.sh
      - name: Install and validate
        run: |
          npm ci
          npm run validate:monthly-briefs
          npm test
          npm run build
      - name: Check exact final output scope
        run: |
          git status --short
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          expected="$(printf '%s\n%s' 'public/data/monthly_briefs.json' 'runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')"
          printf 'changed:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit only publication outputs
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add public/data/monthly_briefs.json runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json
          git commit -m "feat: publish SBTL Monthly Brief 2026.07"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-07