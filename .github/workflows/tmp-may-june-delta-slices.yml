name: tmp-may-june-delta-slices
on:
  push:
    branches:
      - chatgpt/rebuild-monthly-brief-2026-06
permissions:
  contents: write
jobs:
  slice:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build compact delta slices
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='runs/2026-09-16/may-june-delta-rebuild-r1/delta-input.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const dir='runs/2026-09-16/may-june-delta-rebuild-r1/slices';
          fs.mkdirSync(dir,{recursive:true});
          const slim=x=>({id:x.id,date:x.date,region:x.region,signal:x.signal,score:x.score,title:x.title,category:x.category,summary:String(x.summary||'').slice(0,260),related:x.related||[]});
          const stats={official_monthly_brief_months:d.official_monthly_brief_months,may_official_brief_exists:!!d.may_official_brief,may:{card_count:d.may.card_count,region_distribution:d.may.region_distribution,signal_distribution:d.may.signal_distribution,top_high_count:d.may.top_high_count,closing_window_count:d.may.closing_window_count,sample_card_keys:d.may.sample_card_keys},june:{card_count:d.june.card_count,current_anchor_count:d.june.current_anchor_count},cross_month_related_count:d.cross_month_related.length};
          fs.writeFileSync(`${dir}/stats.json`,JSON.stringify(stats,null,2)+'\n');
          fs.writeFileSync(`${dir}/may-top40.json`,JSON.stringify(d.may.top_high.slice(0,40).map(slim),null,2)+'\n');
          fs.writeFileSync(`${dir}/may-closing40.json`,JSON.stringify(d.may.closing_window.slice(0,40).map(slim),null,2)+'\n');
          const buckets={}; for(const [k,v] of Object.entries(d.may.topic_buckets||{})) buckets[k]=v.slice(0,12).map(slim);
          fs.writeFileSync(`${dir}/may-buckets.json`,JSON.stringify(buckets,null,2)+'\n');
          fs.writeFileSync(`${dir}/cross-links.json`,JSON.stringify(d.cross_month_related,null,2)+'\n');
          fs.writeFileSync(`${dir}/june-anchors.json`,JSON.stringify(d.june.current_anchors.map(slim),null,2)+'\n');
          console.log(JSON.stringify(stats,null,2));
          NODE
      - name: Commit slices and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/2026-09-16/may-june-delta-rebuild-r1/slices
          git rm .github/workflows/tmp-may-june-delta-slices.yml
          git commit -m "chore: add compact May to June delta slices"
          git push
