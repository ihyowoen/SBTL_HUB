name: PR385 final Codex review repair
on:
  pull_request:
    paths:
      - docs/audits/pr385/final_review_stage/READY
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.number == 385 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'harden/0-6-visible-copy-delta-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact reviewed patch into an unpushed local commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='364fba3c6ecbc344400f15bfc9fc5f5b8d08e897'
          EXPECTED_PATCH_SHA='afcda492d9cecd680675c5b8b85d325ba8e62c7bc3f8e245c7bf4e0ba3d12255'
          STAGE='docs/audits/pr385/final_review_stage'
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          EXTRA="$(git diff --name-only "$EXPECTED_BASE"..HEAD | grep -Ev '^(.github/workflows/pr385-final-review-repair.yml|docs/audits/pr385/final_review_stage/(patch[.]b64|READY))$' || true)"
          test -z "$EXTRA"
          base64 -d "$STAGE/patch.b64" | gzip -d > /tmp/final-review.patch
          test "$(sha256sum /tmp/final-review.patch | awk '{print $1}')" = "$EXPECTED_PATCH_SHA"
          git apply --check /tmp/final-review.patch
          git apply /tmp/final-review.patch
          rm -rf "$STAGE" .github/workflows/pr385-final-review-repair.yml
          git add -A
          git diff --check --cached
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(0.6): address final Codex review findings'
      - name: Verify candidate before any push
        shell: bash
        run: |
          set -euo pipefail
          python validation_scripts/run_active_workflow_tests.py
          python validation_scripts/card_run_v4_binding_hardening.py --self-test
          node scripts/validate_card_run_v4_hardening.mjs --self-test
          python docs/audits/pr385/reproduce.py --repo "$PWD" --expect-head "$(git rev-parse HEAD)" --output /tmp/characterization.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/characterization.json'))
          s=d['summary']
          assert s['expectations_met']==32 and s['violations']==0 and s['runtime_errors']==0, s
          print(json.dumps(s, sort_keys=True))
          PY
          git diff --check HEAD^..HEAD
      - name: Push verified repair
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:harden/0-6-visible-copy-delta-20260919
