name: Manual add recovery 7

on:
  push:
    paths:
      - '.github/workflows/manual-add-recovery7-20260827.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add seven recovery cards and regenerate lean projection
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload_path = Path('runs/2026-08-27/manual-direct-add-recovery7/cards.recovery7.manual-inserts.json')
          full_path = Path('data/cards.full.json')
          lean_path = Path('public/data/cards.json')
          expected_specs = [
              '20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_01',
              '20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_02',
              '20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_03',
              '20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_04',
              '20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_05',
              '20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_07',
              '20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_08',
          ]
          expected_ids = [
              '2026-08-20_GL_01', '2026-08-20_GL_02', '2026-08-24_GL_03',
              '2026-08-21_GL_01', '2026-08-17_US_01', '2026-08-15_GL_01',
              '2026-08-20_EU_01',
          ]
          payload = json.loads(payload_path.read_text(encoding='utf-8'))
          assert payload['count'] == 7
          new_cards = payload['cards'][:7]
          assert [c['source_spec_id'] for c in new_cards] == expected_specs
          assert [c['id'] for c in new_cards] == expected_ids
          assert all(c.get('publish_ready') is True for c in new_cards)
          assert all(c.get('hard_fail_count') == 0 for c in new_cards)
          assert all(c.get('manual_direct_add_authorization', {}).get('authorized') is True for c in new_cards)

          full = json.loads(full_path.read_text(encoding='utf-8'))
          cards = full['cards']
          assert len(cards) == 1425, len(cards)
          before_ids = [c['id'] for c in cards]
          assert len(before_ids) == len(set(before_ids)) == 1425
          assert not (set(before_ids) & set(expected_ids))

          # Preserve every existing card's relative order; insert only the seven new cards.
          for c in sorted(new_cards, key=lambda x: (x['date'], x['id']), reverse=True):
              key = (c['date'], c['id'])
              pos = next((i for i, old in enumerate(cards) if (old.get('date',''), old.get('id','')) < key), len(cards))
              cards.insert(pos, c)

          assert len(cards) == 1432
          ids = [c['id'] for c in cards]
          assert len(ids) == len(set(ids)) == 1432
          # Existing 1,425 remain in exactly the same relative order.
          assert [i for i in ids if i in set(before_ids)] == before_ids
          idset = set(ids)
          for c in new_cards:
              for rid in c.get('related', []) or []:
                  assert rid in idset and rid != c['id']

          update_time = '2026-08-27T16:08:18+09:00'
          full['updated'] = update_time
          full['total'] = 1432
          full_path.write_text(json.dumps(full, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lean_keys = ['id','region','date','cat','sub_cat','signal','title','sub','gate','fact','implication','urls','related','fact_sources','source_tier','related_lineage']
          lean_cards = [{k: c[k] for k in lean_keys if k in c} for c in cards]
          lean = {
              'updated': update_time,
              'total': 1432,
              'schema': full.get('schema', 'cards_v1'),
              'sort': full.get('sort', 'date_desc_id_desc'),
              'cards': lean_cards,
          }
          lean_path.write_text(json.dumps(lean, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('PASS: 1425 + 7 = 1432; existing relative order preserved')
          PY
      - name: Validate generated data
        shell: bash
        run: |
          git diff --check -- data/cards.full.json public/data/cards.json
          node scripts/validate_cards_full.mjs data/cards.full.json || true
          python - <<'PY'
          import json
          f=json.load(open('data/cards.full.json', encoding='utf-8'))
          l=json.load(open('public/data/cards.json', encoding='utf-8'))
          assert f['total'] == l['total'] == 1432
          assert len(f['cards']) == len(l['cards']) == 1432
          assert [x['id'] for x in f['cards']] == [x['id'] for x in l['cards']]
          print('PASS: full/lean 1432 and ID order identical')
          PY
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json
          git diff --cached --check
          git commit -m 'data: add 7 recovery publish-ready cards'
          git push
