name: Workflow contract validation

on:
  pull_request:
    paths:
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review patch
        run: python scripts/patch_review_4850266559.py

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Focused regression
        run: python -m unittest validation_scripts.tests.test_review_4850266559_contracts -v

      - name: Run workflow-contract and exporter regression tests
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Restore read-only workflow and commit verified fix
        run: |
          cat > .github/workflows/workflow-contract-validation.yml <<'EOF'
          name: Workflow contract validation

          on:
            pull_request:
              paths:
                - "docs/RELATED_LIFECYCLE_CONTRACT.md"
                - "docs/SOURCE_AUDIT_CONTRACT.md"
                - "docs/llm_prompts/v1/**"
                - "validation_data/source_owner_registry.json"
                - "validation_scripts/**"
                - "scripts/lean_cards.mjs"
                - ".github/workflows/lean-cards.yml"
                - ".github/workflows/workflow-contract-validation.yml"
            push:
              branches:
                - agent/workflow-contract-related-source-audit
              paths:
                - "docs/RELATED_LIFECYCLE_CONTRACT.md"
                - "docs/SOURCE_AUDIT_CONTRACT.md"
                - "docs/llm_prompts/v1/**"
                - "validation_data/source_owner_registry.json"
                - "validation_scripts/**"
                - "scripts/lean_cards.mjs"
                - ".github/workflows/lean-cards.yml"
                - ".github/workflows/workflow-contract-validation.yml"

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Compile validators
                  run: python -m compileall -q validation_scripts

                - name: Run workflow-contract and exporter regression tests
                  run: python -m unittest discover -s validation_scripts/tests -v

                - name: Verify prompt overlays
                  run: python validation_scripts/apply_prompt_contract_overlays.py --check
          EOF
          sed -i 's/^          //' .github/workflows/workflow-contract-validation.yml
          rm -f scripts/patch_review_4850266559.py
          rm -f .github/workflows/patch-review-4850266559.yml
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scan full confirmation effect bridge"
          git push origin HEAD:agent/structural-news-value-v3
