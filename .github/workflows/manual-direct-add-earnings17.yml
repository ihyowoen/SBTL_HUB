name: manual-direct-add-earnings17

on:
  push:
    branches:
      - chatgpt/direct-add-earnings17-20260827
    paths:
      - .github/workflows/manual-direct-add-earnings17.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize user-authorized 17-card direct add
        shell: bash
        env:
          PAYLOAD_B64: 
        run: |
          set -euo pipefail
          actual_blob="$(git hash-object data/cards.full.json)"
          test "$actual_blob" = "6e373ed70a0bd659a34001dbcc45663ac5d7e265"
          printf '%s' "$PAYLOAD_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/manual-inserts-17.json"
          node <<'NODE'
          const fs = require('fs');
          const fullPath = 'data/cards.full.json';
          const publicPath = 'public/data/cards.json';
          const full = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
          const ins = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/manual-inserts-17.json', 'utf8'));
          if (full.total !== 1408 || full.cards.length !== 1408) throw new Error(`base count mismatch ${full.total}/${full.cards.length}`);
          if (ins.cards.length !== 17) throw new Error(`insert count mismatch ${ins.cards.length}`);
          const ids = new Set(full.cards.map(c => c.id));
          for (const c of ins.cards) {
            if (ids.has(c.id)) throw new Error(`id collision ${c.id}`);
            for (const k of ['id','date','title','region','signal','gate','fact','urls','implication','cat','sub','sub_cat','fact_sources']) {
              if (c[k] == null || c[k] === '' || (Array.isArray(c[k]) && c[k].length === 0)) throw new Error(`${c.id}: missing ${k}`);
            }
            ids.add(c.id);
            full.cards.push(c);
          }
          full.cards.sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
          full.total = full.cards.length;
          full.updated = '2026-08-27T15:45:00+09:00';
          if (full.total !== 1425 || new Set(full.cards.map(c=>c.id)).size !== 1425) throw new Error('result integrity failure');
          fs.writeFileSync(fullPath, JSON.stringify(full, null, 2) + '\n');
          const KEEP = ['id','region','date','cat','sub_cat','signal','title','sub','gate','fact','implication','urls','related','fact_sources','source_tier','related_lineage'];
          const projected = {...Object.fromEntries(Object.entries(full).filter(([k])=>k!=='cards')), cards: full.cards.map(c => Object.fromEntries(KEEP.filter(k=>c[k]!==undefined).map(k=>[k,c[k]])))};
          fs.writeFileSync(publicPath, JSON.stringify(projected));
          console.log(`materialized ${full.total} cards`);
          NODE
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Commit generated canonical and lean data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json
          git commit -m "Add 17 earnings cards to canonical"
          git push origin HEAD:${GITHUB_REF_NAME}
