name: TEMP Sep 7 Related anchor specificity probe

on:
  push:
    branches:
      - chatgpt/production-20260907-r7-21-baseline-rebind-work
    paths:
      - tmp/sep7-related-anchor-probe-trigger.txt

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact Related subject-specificity policy
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python3 - <<'PY'
          from validation_scripts.related_lifecycle_check import item_specific_lineage_assertion
          cases = {
            'sne_v1': 'SNE Research Jan–Jul 2026 EV-battery dataset extended the H1 608.5GWh predecessor measurement to 725.2GWh and added July as a new measured month.',
            'jp_ko1': 'Tensor Energy는 9월 7일 저압계통 연계형 ESS 신청이 5,000건, 합계 출력 250MW, 에너지 1GWh에 도달했다고 발표했다.',
            'jp_ko2': 'Tensor Energy 저압계통 연계형 ESS 신청 파이프라인은 9월 7일 5,000건·250MW·1GWh에 도달했다.',
            'jp_ko3': 'Tensor Energy의 저압계통 연계형 ESS 신청 파이프라인은 2028년 1,000대 집합화 계획의 후속으로 9월 7일 5,000건·250MW·1GWh에 도달했다.',
            'jp_release': 'PR Times release 000000043 records Tensor Energy low-voltage grid-connected ESS applications at 5,000 cases totaling 250MW/1GWh on Sep 7.',
            'jp_milestone': 'Tensor Energy 5,000-case low-voltage grid-connected ESS application milestone totals 250MW/1GWh on Sep 7.',
            'jp_domain': 'tensorenergy.jp low-voltage grid-connected ESS application pipeline reached 5,000 cases totaling 250MW/1GWh on Sep 7.',
          }
          for k,v in cases.items():
              print(f'{k}={item_specific_lineage_assertion(v)} :: {v}')
          assert item_specific_lineage_assertion(cases['sne_v1'])
          assert any(item_specific_lineage_assertion(cases[k]) for k in cases if k.startswith('jp_'))
          PY
