name: validate-tracker

# Gates any change to tracker data / region policy. Blocks merge on structural errors
# (dup id, bad status/region, banned emoji, dangling canonicalId, broken JSON).
# Migration WARNINGs (missing effectiveDate / instrumentType / accessedDate) do NOT block.
#
# cards.json 게이트(validate_cards.mjs): 카드 PR이 무검사로 머지되던 위장 통과를
# 차단한다 — 파싱·크기 하한·수량 감소·중복 id·필수 필드·깨진 related(신규 무관용,
# 레거시 동결)·id접두↔date. fetch-depth 0은 origin/main 기준본 비교(수량 감소·신규
# 카드 판별)에 필요하다.

on:
  pull_request:
    paths:
      - "public/data/**"
      - "data/cards.full.json"
      - "direct-adds/**/direct-add.json"
      - "scripts/validate.mjs"
      - "scripts/validate_cards.mjs"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/validate-tracker.yml"
  push:
    branches: [main]
    paths:
      - "public/data/**"
      - "data/cards.full.json"
      - "scripts/validate.mjs"
      - "scripts/validate_cards.mjs"
      - "scripts/lean_cards.mjs"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve declared direct-add ID migration
        id: direct_add
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --force
          mapfile -t manifests < <(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(glob)direct-adds/**/direct-add.json')
          [[ ${#manifests[@]} -le 1 ]] || { echo "FAIL: more than one direct-add manifest" >&2; exit 1; }
          allow_delete=0
          if [[ ${#manifests[@]} -eq 1 ]]; then
            test -f "${manifests[0]}"
            migration_count="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.operations?.id_migration||[]).length))' "${manifests[0]}")"
            [[ "$migration_count" -eq 0 ]] || allow_delete=1
          fi
          echo "allow_delete=$allow_delete" >> "$GITHUB_OUTPUT"
      - name: Validate tracker data
        run: node scripts/validate.mjs
      - name: Validate cards data
        env:
          CARDS_ALLOW_DELETE: ${{ steps.direct_add.outputs.allow_delete || '0' }}
        run: node scripts/validate_cards.mjs
      # 정본 아카이브도 같은 게이트로 — 감사 원천이 깨진 채 머지되는 것을 막는다
      - name: Validate full archive
        env:
          CARDS_ALLOW_DELETE: ${{ steps.direct_add.outputs.allow_delete || '0' }}
        run: test ! -f data/cards.full.json || node scripts/validate_cards.mjs data/cards.full.json
      # 발행본 ≡ 아카이브 사영 검증 — 여분 필드·값 괴리·id 집합 불일치 전부 실패.
      # 사람이 병합 스크립트 실행을 잊는 지점이라 기계가 지킨다
      - name: Check lean payload matches archive
        run: node scripts/lean_cards.mjs --check
