name: Workflow contract validation

on:
  pull_request:
    paths:
      - "contracts/**"
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"
      - ".github/workflows/workflow-contract-validation.yml"
  push:
    branches:
      - main
      - agent/workflow-contract-related-source-audit
      - agent/canonical-v3-contract-schema
    paths:
      - "contracts/**"
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"
      - ".github/workflows/workflow-contract-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Verify canonical V3 contract alignment
        run: python validation_scripts/v3_contract_drift_check.py

      - name: Verify generated V3 stage contracts
        run: python validation_scripts/v3_stage_contracts.py --check

      - name: Verify V3 stage contract flow
        run: python validation_scripts/v3_stage_contract_flow_check.py --check

      - name: Run production workflow-contract and exporter regression tests
        run: |
          set -e
          mkdir -p /tmp/ninth-batch-temp-tests
          mv validation_scripts/tests/test_tmp_*.py /tmp/ninth-batch-temp-tests/
          trap 'mv /tmp/ninth-batch-temp-tests/test_tmp_*.py validation_scripts/tests/ 2>/dev/null || true' EXIT
          python -m unittest discover -s validation_scripts/tests -v

      - name: Capture ninth-batch diagnostic
        if: always()
        run: |
          python -m unittest validation_scripts.tests.test_tmp_ninth_batch_final2.NinthBatchFinal2CurrentMainDiagnostic.test_ninth_batch_final2_current_main -v > ninth_batch_diagnostic.txt 2>&1 || true
          cat ninth_batch_diagnostic.txt

      - name: Upload ninth-batch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninth-batch-diagnostic
          path: ninth_batch_diagnostic.txt

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
