name: Fix review 4840431415 CI

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/fix_review_4840431415_ci.py
      - .github/workflows/fix-review-4840431415-ci.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci patch]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply compatibility patch
        run: python scripts/fix_review_4840431415_ci.py
      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -v
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Remove temporary artifacts
        run: |
          rm -f scripts/fix_review_4840431415_ci.py
          rm -f .github/workflows/fix-review-4840431415-ci.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit verified compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: align review 4840431415 regression expectations [skip ci patch]"
          git push origin HEAD:agent/structural-news-value-v3
