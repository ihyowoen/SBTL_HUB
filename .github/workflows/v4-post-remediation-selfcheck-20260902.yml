name: V4 post-remediation lifecycle self-check

on:
  push:
    branches:
      - chatgpt/v4-preflight-20260902
    paths:
      - '.github/workflows/v4-post-remediation-selfcheck-20260902.yml'

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V4 lifecycle closure candidate
        run: |
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          ALLOWED={'ACTIVE_CANONICAL','ACTIVE_VALIDATOR_CONTRACT','OPEN_REMEDIATION','ACTIVE_MIGRATION','SUPERSEDED','REFERENCE_ONLY','COMPLETED_REFERENCE','ARCHIVED'}
          reg=json.loads(Path('docs/llm_prompts/v1/GOVERNANCE_LIFECYCLE_REGISTRY.json').read_text())
          docs=subprocess.check_output(['git','ls-files','docs'],text=True).splitlines()
          mapping={}
          for p in reg['active_canonical']+reg['active_named_prompts']: mapping[p]='ACTIVE_CANONICAL'
          for p in reg['active_validator_contracts']: mapping[p]='ACTIVE_VALIDATOR_CONTRACT'
          for p in reg['open_remediations']: mapping[p]='OPEN_REMEDIATION'
          for p in reg['activation_required_migrations']: mapping[p]='ACTIVE_MIGRATION'
          for p in reg['superseded']: mapping[p]='SUPERSEDED'
          for p in reg['reference_only']: mapping[p]='REFERENCE_ONLY'
          def header(p):
              text=Path(p).read_text(encoding='utf-8-sig')
              if p.endswith('.json'):
                  try:o=json.loads(text)
                  except Exception:return None
                  for k in ('classification','status'):
                      if o.get(k) in ALLOWED:return o[k]
                  return None
              h='\n'.join(text.splitlines()[:120])
              for pat in (r'\*\*Status:\*\*\s*`([A-Z_]+)`',r'^Status:\s*`?([A-Z_]+)`?\s*$',r'\*\*Classification:\*\*\s*`([A-Z_]+)`'):
                  m=re.search(pat,h,re.M)
                  if m and m.group(1) in ALLOWED:return m.group(1)
              return None
          unclassified=[]; conflicts=[]; unregistered_active=[]
          for p in docs:
              h=header(p); r=mapping.get(p); c=r or h
              if not c: unclassified.append(p)
              if r and h and r!=h: conflicts.append((p,r,h))
              if not r and h in {'ACTIVE_CANONICAL','ACTIVE_VALIDATOR_CONTRACT','OPEN_REMEDIATION','ACTIVE_MIGRATION'}: unregistered_active.append(p)
          required=sorted(set(reg['active_canonical'])|set(reg['active_named_prompts'])|set(reg['active_validator_contracts'])|set(reg['open_remediations'])|set(reg['activation_required_migrations']))
          unread=[]
          for p in required:
              try:
                  text=Path(p).read_text(encoding='utf-8-sig')
                  if p.endswith('.json'): json.loads(text)
              except Exception as e: unread.append((p,str(e)))
          stagea=Path('docs/llm_prompts/v1/01_PROMPT_0_1_Stage_A.md').read_text()
          stagea_ok='**selection_policy_version:** `EMBEDDED_NEWS_VALUE_SELECTION_V4`' in stagea and 'Related pre-pass' in stagea
          summary={'docs_inventory_count':len(docs),'classified_count':len(docs)-len(unclassified),'required_full_read_count':len(required),'unclassified':unclassified,'conflicts':conflicts,'unregistered_active':unregistered_active,'unread_required':unread,'active_override_or_addendum_count':reg.get('active_override_or_addendum_count'),'stage_a_embedded_news_value_verified':stagea_ok}
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          assert len(docs)==90, summary
          assert not unclassified, summary
          assert not conflicts, summary
          assert not unregistered_active, summary
          assert not unread, summary
          assert len(required)==43, summary
          assert reg.get('active_override_or_addendum_count')==0, summary
          assert stagea_ok, summary
          PY
      - name: Remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v4-post-remediation-selfcheck-20260902.yml
          git commit -m "chore: remove temporary V4 lifecycle self-check"
          git push origin HEAD:chatgpt/v4-preflight-20260902
