name: pr283-bootstrap-export

on:
  push:
    branches:
      - agent/publish-batch1-35-20260825

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publish-batch1-35-20260825
          fetch-depth: 0

      - name: Inflate original transport ignoring damaged gzip trailer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr283"
          python - <<'PY'
          import base64, pathlib, zlib, os
          d=pathlib.Path('runs/2026-08-25/publish-batch1-35')
          s=''.join(''.join((d/f'.bootstrap.part{i:02d}').read_text(errors='replace').split()) for i in range(7))
          raw=base64.b64decode(s, validate=True)
          pos=10; flg=raw[3]
          if flg & 4:
              xlen=int.from_bytes(raw[pos:pos+2],'little'); pos += 2+xlen
          if flg & 8: pos=raw.index(b'\0',pos)+1
          if flg & 16: pos=raw.index(b'\0',pos)+1
          if flg & 2: pos+=2
          out=zlib.decompress(raw[pos:-8], -zlib.MAX_WBITS)
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr283'/'corrupt-card-run.raw'
          target.write_bytes(out)
          print('wrote',target,'bytes',len(out),'expected_isize',int.from_bytes(raw[-4:],'little'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pr283-corrupt-card-run-raw
          path: ${{ runner.temp }}/pr283/corrupt-card-run.raw
          if-no-files-found: error
          retention-days: 1
