name: TEMP Sep 7 baseline rebind run

on:
  push:
    branches:
      - chatgpt/production-20260907-r7-21-baseline-rebind-work
    paths:
      - tmp/sep7-baseline-rebind-run-trigger.txt

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebind unchanged canonical baseline and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          OLD=aa7400ae67b221d1ddd5e198293762caec389303
          NEW=b425151b348ed294ef1c4d5a6546cbe97f588137
          BLOB=920646b6b335f211bcd224962f8ac0cc42cd3a4f
          OLD_OPS=271a4bc41d42a871826b096dc0d69896b6fe3c4131116393486df198dbf0083d
          RUN=runs/2026-09-08/sep7-r7-current-main-production-r1
          RUN_PATH="$RUN/card-run.json"
          LOG=tmp/sep7-baseline-rebind-last-run.log
          git config user.name ihyowoen
          git config user.email hyowoen@hotmail.com
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            git add "$RUN" "$LOG" || true
            if ! git diff --cached --quiet; then
              git commit -m "Materialize Sep 7 current-main baseline rebind attempt" || true
              git push origin HEAD:chatgpt/production-20260907-r7-21-baseline-rebind-work || true
            fi
            exit "$rc"
          }
          trap finish EXIT

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$NEW"
          test "$(git rev-parse "$NEW:data/cards.full.json")" = "$BLOB"
          test "$(git rev-parse "$OLD:data/cards.full.json")" = "$BLOB"
          echo 'PASS canonical baseline bytes unchanged across main movement'

          python3 - <<'PY'
          from pathlib import Path
          old='aa7400ae67b221d1ddd5e198293762caec389303'
          new='b425151b348ed294ef1c4d5a6546cbe97f588137'
          root=Path('runs/2026-09-08/sep7-r7-current-main-production-r1')
          nfiles=nocc=0
          for p in sorted(root.rglob('*.json')):
              s=p.read_text()
              c=s.count(old)
              if c:
                  p.write_text(s.replace(old,new))
                  nfiles+=1; nocc+=c
          print(f'REBIND baseline SHA occurrences: files={nfiles} occurrences={nocc}')
          PY

          NEW_OPS="$(node - <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const run=JSON.parse(fs.readFileSync('runs/2026-09-08/sep7-r7-current-main-production-r1/card-run.json','utf8'));
          const stable=v=>Array.isArray(v)?v.map(stable):(v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v);
          process.stdout.write(crypto.createHash('sha256').update(JSON.stringify(stable(run.operations))).digest('hex'));
          NODE
          )"
          echo "reviewed operations SHA: $OLD_OPS -> $NEW_OPS"
          python3 - "$OLD_OPS" "$NEW_OPS" <<'PY'
          from pathlib import Path
          import sys
          old,new=sys.argv[1:3]
          root=Path('runs/2026-09-08/sep7-r7-current-main-production-r1')
          nfiles=nocc=0
          for p in sorted(root.rglob('*.json')):
              s=p.read_text(); c=s.count(old)
              if c:
                  p.write_text(s.replace(old,new)); nfiles+=1; nocc+=c
          print(f'REBIND operation hash occurrences: files={nfiles} occurrences={nocc}')
          PY

          test "$(grep -RFl "$OLD" "$RUN" | wc -l)" = "0"
          test "$(grep -RFl "$OLD_OPS" "$RUN" | wc -l)" = "0"

          echo '== formal card-run pre-baseline validators =='
          node scripts/validate_json_schema_subset.mjs --schema schemas/card-run.v1.schema.json --instance "$RUN_PATH"
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_v4_hardening.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_relations.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN_PATH" --canonical data/cards.full.json
          node scripts/validate_card_run_audits_dispatch.mjs --run "$RUN_PATH" --full data/cards.full.json --lean public/data/cards.json

          echo '== exact current-main baseline lock =='
          test "$(node -e 'const r=require("./'"$RUN_PATH"'");process.stdout.write(r.base_main_commit_sha)')" = "$NEW"
          test "$(node -e 'const r=require("./'"$RUN_PATH"'");process.stdout.write(r.base_full_blob_sha)')" = "$BLOB"

          echo '== Prompt 0.8 post-resolution semantic gate =='
          node scripts/validate_prompt_0_8_semantic_gate.mjs --run "$RUN_PATH" --full data/cards.full.json --ledger tmp/sep7-rebind-0-8-ledger.json
          python3 validation_scripts/stage_artifact_contract_check.py 0.8 "$RUN/stage-0-8.json"

          echo '== current-baseline governed apply verification (exact PR invocation) =='
          node scripts/apply_card_run.mjs --run "$RUN_PATH" --baseline data/cards.full.json --canonical-path data/cards.full.json --output data/cards.full.json --report "$RUN/apply-report.json" --lean-path public/data/cards.json --base-main-sha "$NEW" --verify
          node scripts/lean_cards.mjs --check
          PYTHONPATH=. python3 validation_scripts/run_active_workflow_tests.py
          git diff --check
          echo 'PASS FULL CURRENT-MAIN BASELINE REBIND VALIDATION'
