name: tmp-reconcile-pr288-pouch-20260828

on:
  push:
    branches:
      - chatgpt/reconcile-pr288-pouch-20260828
    paths:
      - .github/workflows/tmp-reconcile-pr288-pouch-20260828.yml
      - runs/2026-08-28/reconcile-pr288-pouch/reconcile.part1
      - runs/2026-08-28/reconcile-pr288-pouch/reconcile.part2
      - runs/2026-08-28/reconcile-pr288-pouch/reconcile.part3
      - runs/2026-08-28/reconcile-pr288-pouch/reconcile.part4

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply locked reconciliation on current main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "7d80d86606cf42358dc9c0157c782a98f02fbe8a"
          python <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from collections import defaultdict
          from datetime import datetime,timezone,timedelta
          prefix='runs/2026-08-28/reconcile-pr288-pouch/reconcile.part'
          expected_parts={
            1:'1c9c29f5e0eb71f900121f80905c37839547f9e231eaf4e7e5a80398f636e6a1',
            2:'3a33c573db9668e7635a8dff4e8041153071c49941f3f13217749fa96995eb4e',
            3:'e4c61b40a7cc0bdcc67861820841f73a68aaca1c61e0d87656e94033073acfaa',
            4:'f0bb4c5e7974f91a121e0a6e6635bdcb25c906caf4a9bebef8bc8ff8447b81a7',
          }
          parts=[]
          for i in range(1,5):
            b=open(prefix+str(i),'rb').read().strip()
            assert hashlib.sha256(b).hexdigest()==expected_parts[i], (i,hashlib.sha256(b).hexdigest())
            parts.append(b.decode())
          encoded=''.join(parts)
          assert len(encoded)==24252,len(encoded)
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='e40df1f367e66806d31fc7da1f57a56925045a47ec373e00d135c56bc209c7ee'
          patch=json.loads(raw)
          base=json.loads(subprocess.check_output(['git','show','origin/main:data/cards.full.json']))
          doc=json.load(open('data/cards.full.json',encoding='utf-8'))
          assert base['total']==len(base['cards'])==1485
          assert doc['total']==len(doc['cards'])==patch['baseline_count']==1485
          assert [c['id'] for c in doc['cards']]==[c['id'] for c in base['cards']]
          base_by={c['id']:c for c in base['cards']}
          cards=doc['cards']; by={c['id']:c for c in cards}
          update_ids={u['id'] for u in patch['update_cards']}
          assert update_ids=={'2026-07-05_KR_01','2026-07-07_KR_01'}
          new_ids=[c['id'] for c in patch['new_cards']]
          assert new_ids==[
            '2026-08-24_CN_02','2026-08-07_JP_01','2026-07-30_KR_01','2026-07-30_KR_02',
            '2026-07-31_KR_02','2026-07-31_KR_03','2026-07-31_KR_04','2026-08-25_KR_04',
            '2026-07-27_KR_03','2024-04-03_KR_01','2024-06-21_JP_01']
          assert all(cid not in by for cid in new_ids)
          base_specs={c.get('source_spec_id') for c in cards if c.get('source_spec_id')}
          new_specs=[c.get('source_spec_id') for c in patch['new_cards']]
          assert all(new_specs) and len(new_specs)==len(set(new_specs))==11
          assert not (base_specs & set(new_specs))
          base_ids=set(by)
          for c in patch['new_cards']:
            assert c['signal'] in {'top','high','mid','info'}
            assert c['assigned_id']==c['id']
            assert c['manual_direct_add_authorization']['authorized'] is True
            assert c['final_qc_provenance']['formal_prompt_0_8_authorized'] is False
            assert set(c['final_qc_gates'].values())=={'PASS'}
            assert all(r in base_ids for r in c.get('related',[]))
          for upd in patch['update_cards']:
            c=by[upd['id']]
            assert c['title']==upd['expected_title']
            for k,v in upd['set'].items(): c[k]=v
          old_index={c['id']:i for i,c in enumerate(cards)}
          cards.extend(patch['new_cards'])
          groups=defaultdict(list)
          for c in cards: groups[c['date']].append(c)
          ordered=[]
          for dt in sorted(groups,reverse=True):
            legacy=[c for c in groups[dt] if c['id'] not in new_ids]
            legacy.sort(key=lambda c:old_index.get(c['id'],10**9))
            added=sorted([c for c in groups[dt] if c['id'] in new_ids],key=lambda c:c['id'])
            ordered.extend(legacy+added)
          doc['cards']=ordered; doc['total']=len(ordered)
          doc['updated']=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          assert doc['total']==patch['target_count']==1496
          assert len({c['id'] for c in ordered})==1496
          assert all(ordered[i]['date']>=ordered[i+1]['date'] for i in range(len(ordered)-1))
          final_by={c['id']:c for c in ordered}
          assert set(base_by).issubset(final_by)
          untouched=[cid for cid in base_by if cid not in update_ids]
          changed=[cid for cid in untouched if final_by[cid]!=base_by[cid]]
          assert not changed, f'undeclared existing-card changes: {changed[:10]}'
          json.dump(doc,open('data/cards.full.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open('data/cards.full.json','a',encoding='utf-8').write('\n')
          print('PASS reconcile materialized: current main 1485 preserved + 11 new + 2 declared reinforcement = 1496')
          PY
          node scripts/lean_cards.mjs
          node scripts/lean_cards.mjs --check
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          git diff --check -- data/cards.full.json public/data/cards.json
          python <<'PY'
          import json,subprocess
          f=json.load(open('data/cards.full.json')); l=json.load(open('public/data/cards.json'))
          base=json.loads(subprocess.check_output(['git','show','origin/main:data/cards.full.json']))
          ids=['2026-08-24_CN_02','2026-08-07_JP_01','2026-07-30_KR_01','2026-07-30_KR_02','2026-07-31_KR_02','2026-07-31_KR_03','2026-07-31_KR_04','2026-08-25_KR_04','2026-07-27_KR_03','2024-04-03_KR_01','2024-06-21_JP_01']
          assert f['total']==1496==len(f['cards'])==len(l['cards'])
          assert [c['id'] for c in f['cards']]==[c['id'] for c in l['cards']]
          fb={c['id']:c for c in f['cards']}; bb={c['id']:c for c in base['cards']}
          assert set(bb).issubset(fb)
          assert all(i in fb for i in ids)
          assert fb['2026-08-24_CN_02']['title'].startswith('Putailai') or 'Putailai' in fb['2026-08-24_CN_02']['title']
          assert '삼아알미늄' in fb['2026-08-25_KR_04']['title']
          assert fb['2026-07-31_KR_02']['signal']=='mid'
          assert fb['2026-07-31_KR_04']['signal']=='mid'
          assert any('inside.lgensol.com' in s.get('source_url','') for s in fb['2026-07-07_KR_01'].get('fact_sources',[]))
          assert any('samsungsdi.com' in s.get('source_url','') for s in fb['2026-07-05_KR_01'].get('fact_sources',[]))
          print('PASS final reconcile assertions: 1496 synchronized; all 1485 main IDs preserved; 11 new; 2 reinforcement; no namespace collision')
          PY
      - name: Commit reconciled data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json
          git diff --cached --quiet && { echo 'No data changes'; exit 1; }
          git commit -m 'Reconcile pouch earnings overlay onto current main'
          git push origin HEAD:chatgpt/reconcile-pr288-pouch-20260828
