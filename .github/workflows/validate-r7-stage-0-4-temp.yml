name: Validate R7 Prompt 0.4 temp

on:
  pull_request:
    branches: [main]

jobs:
  validate-0-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked current baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "5317bec055b88a26cffb136e7844eb488ae4db0d"
          test "$(git hash-object data/cards.full.json)" = "8b3d96b5c1fd779567ef8512f7123fc4310093ec"
      - name: Materialize current-baseline 0.4
        run: |
          set -euo pipefail
          python validation_temp/20260903-r7-stage-0-4/materialize_0_4.py
          sha256sum /tmp/stage-0-4-r7.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stage-0-4-r7.json',encoding='utf-8'))
          a=p['accounting']
          assert a['input']==33 and a['unaccounted']==0
          assert a['input']==a['addable_merge_safe']+a['baseline_conflict']
          print('0.4 ACCOUNTING',a)
          for x in p.get('baseline_conflict',[]):
              print('HOLD',x['source_event_id'],x['baseline_revalidation']['hold_reasons'])
          print('RESULT: PASS_0_4_ACCOUNTING')
          PY
      - name: Prompt 0.4 artifact contract
        run: python validation_scripts/stage_artifact_contract_check.py 0.4 /tmp/stage-0-4-r7.json
      - name: Active workflow regression suite
        run: python validation_scripts/run_active_workflow_tests.py
      - name: Upload validated 0.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: r7-stage-0-4-validated
          path: /tmp/stage-0-4-r7.json
