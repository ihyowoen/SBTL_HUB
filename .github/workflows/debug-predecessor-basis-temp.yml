name: Debug predecessor_basis contract temp

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/debug-predecessor-basis-temp.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect validation_temp and runtime Related contract
        run: |
          set -euo pipefail
          echo '=== validation_temp predecessor/basis ==='
          grep -R -n -C 8 --exclude-dir=.git -E 'predecessor_basis|basis mapping|mapping per related_id' validation_temp | head -n 500 || true
          echo '=== all repo predecessor/basis ==='
          grep -R -n -C 6 --exclude-dir=.git -E 'predecessor_basis|basis mapping|mapping per related_id' validation_scripts docs schemas scripts data/cards.full.json | head -n 500 || true
          echo '=== R3 builder relevant commands ==='
          grep -R -n -C 5 -E 'related_lifecycle|predecessor|basis|check_card' validation_temp/20260903-r7-0-8 validation_temp/20260903-r7-0-7c | head -n 500 || true
          echo '=== runtime callable provenance/constants ==='
          python - <<'PY'
          import inspect, types
          import validation_scripts.related_lifecycle_check as m
          print('module_file',m.__file__)
          print('check_card_module',m.check_card.__module__)
          print('check_card_sourcefile',inspect.getsourcefile(m.check_card))
          print('check_card_firstlineno',m.check_card.__code__.co_firstlineno)
          const=' | '.join(str(x) for x in m.check_card.__code__.co_consts if isinstance(x,str))
          print('public_check_card_consts',const[:12000])
          PY
