name: tmp-sep9-reference-pack
on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - .github/workflows/tmp-sep9-reference-pack.yml
jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack Sep8 production references
        run: |
          mkdir -p /tmp/sep9-ref
          cp -a runs/2026-09-09/sep8-r7-current-main-production-r1 /tmp/sep9-ref/sep8-reference
          cp -a validation_scripts /tmp/sep9-ref/validation_scripts
          cp -a docs/llm_prompts/v1 /tmp/sep9-ref/prompts
          cp data/cards.full.json /tmp/sep9-ref/cards.full.json
          cp public/data/cards.json /tmp/sep9-ref/cards.json
      - uses: actions/upload-artifact@v4
        with:
          name: sep9-reference-pack
          path: /tmp/sep9-ref
          retention-days: 1
