name: R36 one-time source ledger precision (NO MERGE)
on:
  push:
    branches:
      - news/r28-20261017-source-verified-lfp
    paths:
      - 'scripts/.r36_temp_sk_source_ledger_patch.mjs'
      - '.github/workflows/r36-one-time-sk-source-ledger.yml'
permissions:
  contents: write
jobs:
  r36-audited-one-time-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frozen R35 exact SHA and main baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'news/r28-20261017-source-verified-lfp'
          test "$(git rev-parse HEAD^)" = 'dc3d5ca1a2a2708f0d35f495cd36c6fa533b33e3'
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = '6851fdbe4a25b30b7204d07708a1238123c14910'
          test "$(git rev-parse HEAD:data/cards.full.json)" = '4ac1939b485f24961dcc797807f33212d0b35f83'
          test "$(git rev-parse HEAD:public/data/cards.json)" = '92edea357a5bb97085d908b36abc2508521a0653'
          test "$(git rev-parse HEAD:direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json)" = '996c1ed52b1fda167c03a1249c6a759e3b0b1e10'
      - name: Tighten retained quote and source ledger attribution
        run: node scripts/.r36_temp_sk_source_ledger_patch.mjs
      - name: Validate governed delta against exact main
        shell: bash
        run: |
          set -euo pipefail
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > "$RUNNER_TEMP/base.full.json"
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/base.full.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/base.full.json" --full data/cards.full.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Native repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove staging tools and commit exactly three governed data files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r36_temp_sk_source_ledger_patch.mjs
          rm .github/workflows/r36-one-time-sk-source-ledger.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/r36-one-time-sk-source-ledger.yml data/cards.full.json direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json public/data/cards.json scripts/.r36_temp_sk_source_ledger_patch.mjs | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'BLOCK: unexpected R36 mutation scope:\n%s\n' "$actual" >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cards): R36 narrow SK On source ledger support (NO MERGE)'
          git push origin HEAD:news/r28-20261017-source-verified-lfp
