name: materialize-combined18-once

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: write

concurrency:
  group: materialize-combined18-once
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[combined18 materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reconstruct governed payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/combined18-payload/correct00a \
            .github/combined18-payload/correct00b \
            .github/combined18-payload/part01 \
            .github/combined18-payload/part02 \
            .github/combined18-payload/03a \
            .github/combined18-payload/03b \
            .github/combined18-payload/04a \
            .github/combined18-payload/04b \
            .github/combined18-payload/05 \
            > "$RUNNER_TEMP/payload.b64"
          base64 -d "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.tar.xz"
          echo "8a111f491c51cade63fb344e41ff602ff1e852a1f5a33668ad2e3bfe25c10224  $RUNNER_TEMP/payload.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/payload.tar.xz" -C .

      - name: Lock exact baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="937dce6429c8bf63535d8043c7f559c9f2001f5d"
          test "$(git rev-parse "$BASE:data/cards.full.json")" = "9278233be67240aac1cdf7963e12d8e2878319f0"
          test "$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("data/cards.full.json","utf8"));process.stdout.write(String(j.total))')" = "1496"

      - name: Validate governed run and materialize canonical
        shell: bash
        run: |
          set -euo pipefail
          RUN="runs/2026-08-29/card-run.json"
          BASE="937dce6429c8bf63535d8043c7f559c9f2001f5d"
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN"
          node scripts/validate_card_run_relations.mjs --run "$RUN"
          node scripts/apply_card_run.mjs --run "$RUN" --base-main-sha "$BASE" --check
          node scripts/apply_card_run.mjs --run "$RUN" --base-main-sha "$BASE" --apply
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN" --canonical data/cards.full.json
          node scripts/validate_card_run_audits.mjs --run "$RUN" --full data/cards.full.json --lean public/data/cards.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          node scripts/apply_card_run.mjs --run "$RUN" --base-main-sha "$BASE" --verify
          test "$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("data/cards.full.json","utf8"));process.stdout.write(String(j.total))')" = "1514"
          test "$(sha256sum data/cards.full.json | cut -d' ' -f1)" = "51cc3b1f5b87bc6c3598a61ce5eb4294cd7cc85048b5903b0affd7b078e60728"
          test "$(sha256sum public/data/cards.json | cut -d' ' -f1)" = "842dd628b6303d67e4ffb27fc38b621d08292fc7deb9160b60de4e93c3870cb4"

      - name: Commit materialized governed run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/combined18-payload
          rm -f .github/workflows/materialize-combined18-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add governed Aug 29 combined18 card run [combined18 materialized]"
          git push origin HEAD:chatgpt/20260829-combined18-governed-run
