name: tmp-pr380-may-june-delta
on:
  push:
    paths:
      - '.github/workflows/tmp-pr380-may-june-delta.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
      - name: Recalculate chronology metrics
        run: |
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const cards=data.cards||[];
          const may=cards.filter(c=>String(c.date||'').startsWith('2026-05-'));
          const june=cards.filter(c=>String(c.date||'').startsWith('2026-06-'));
          const closing=may.filter(c=>c.date>='2026-05-15'&&c.date<='2026-05-31');
          const closingTH=closing.filter(c=>['top','high'].includes(c.signal));
          const last7=may.filter(c=>c.date>='2026-05-25'&&c.date<='2026-05-31');
          const byId=new Map(cards.map(c=>[c.id,c]));
          const edgeSet=new Set();
          for(const c of cards){
            for(const r of (c.related||[])){
              const t=byId.get(r); if(!t) continue;
              const a=String(c.date||'').slice(0,7), b=String(t.date||'').slice(0,7);
              if(new Set([a,b]).has('2026-05')&&new Set([a,b]).has('2026-06')){
                edgeSet.add([c.id,r].sort().join('::'));
              }
            }
          }
          console.log(JSON.stringify({may:may.length,june:june.length,may_15_31_all:closing.length,may_15_31_top_high:closingTH.length,may_25_31_all:last7.length,may_june_unique_related_edges:edgeSet.size,edges:[...edgeSet]},null,2));
          NODE
