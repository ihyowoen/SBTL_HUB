name: PR289 Review Remediation Materializer

on:
  push:
    branches:
      - chatgpt/pr289-review-remediation-1496
    paths:
      - .github/workflows/remediation-materialize-1496.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/pr289-review-remediation-1496

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock exact 1496 baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3732ad9460b44329f0856591c29f166a39ebf5f8"
          test "$(git rev-parse 3732ad9460b44329f0856591c29f166a39ebf5f8:data/cards.full.json)" = "3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f"
          git show 3732ad9460b44329f0856591c29f166a39ebf5f8:data/cards.full.json > /tmp/base.cards.full.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/base.cards.full.json'))
          cards=d if isinstance(d,list) else d['cards']
          assert len(cards)==1496, len(cards)
          print('baseline cards:', len(cards))
          PY

      - name: Generate reviewed corrective operations
        run: python tools/remediation_1496/materialize.py

      - name: Apply bounded existing-card updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          full_path=Path('data/cards.full.json')
          run_path=Path('runs/2026-08-28/pr289-review-remediation-1496/card-run.json')
          full=json.loads(full_path.read_text(encoding='utf-8'))
          run=json.loads(run_path.read_text(encoding='utf-8'))
          cards=full['cards'] if isinstance(full,dict) else full
          by_id={c['id']:c for c in cards}
          updates=run['operations']['update']
          assert len(updates)==25, len(updates)
          assert not run['operations'].get('insert'), 'insert not allowed'
          assert not run['operations'].get('related_add'), 'related_add not allowed'

          def tokens(pointer):
              assert pointer.startswith('/')
              return [p.replace('~1','/').replace('~0','~') for p in pointer[1:].split('/')]

          def parent_and_key(obj,pointer):
              parts=tokens(pointer)
              cur=obj
              for part in parts[:-1]:
                  if isinstance(cur,list): cur=cur[int(part)]
                  else: cur=cur[part]
              return cur,parts[-1]

          for op in updates:
              cid=op['id']
              assert cid in by_id, cid
              card=by_id[cid]
              for change in op['changes']:
                  parent,key=parent_and_key(card,change['path'])
                  kind=change['op']
                  if isinstance(parent,list):
                      idx=int(key)
                      if kind=='remove': parent.pop(idx)
                      elif kind=='replace': parent[idx]=change['value']
                      elif kind=='add':
                          if key=='-': parent.append(change['value'])
                          else: parent.insert(idx,change['value'])
                      else: raise AssertionError(kind)
                  else:
                      if kind=='remove': parent.pop(key,None)
                      elif kind in ('replace','add'): parent[key]=change['value']
                      else: raise AssertionError(kind)

          # Latest Related specificity gate requires a concrete named subject,
          # not only a generic milestone phrase, for a distinct follow-up anchor.
          walmart=by_id['2026-08-21_US_01']
          assert walmart['related_lineage']['relation_type']=='distinct_follow_up'
          walmart['related_lineage']['fresh_follow_up_anchor']=(
              "Monument Supercenter became Walmart's 100th company-owned and operated EV fast-charging site"
          )

          output_updated='2026-08-29T13:15:00+09:00'
          assert isinstance(full,dict), 'canonical top-level object required'
          full['updated']=output_updated
          full['total']=len(cards)
          assert len(cards)==1496
          full_path.write_text(json.dumps(full,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          ids=[op['id'] for op in updates]
          Path('/tmp/target-ids.json').write_text(json.dumps({'ids':ids}),encoding='utf-8')
          manifest={
            'schema':'manual_direct_add_v1',
            'status':'PASS',
            'direct_add_id':'20260829_PR289_REVIEW_REMEDIATION_1496',
            'base_main_commit_sha':'3732ad9460b44329f0856591c29f166a39ebf5f8',
            'base_full_blob_sha':'3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f',
            'expected_before':1496,
            'expected_after':1496,
            'output_updated':output_updated,
            'operations':{'add':[],'update':ids,'id_migration':[]}
          }
          out=Path('direct-adds/pr289-review-remediation-1496/direct-add.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('bounded updates:',len(ids))
          PY
          node scripts/lean_cards.mjs

      - name: Validate manual direct-add contract and hard gates
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=direct-adds/pr289-review-remediation-1496/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest "$MANIFEST" --base /tmp/base.cards.full.json --full data/cards.full.json
          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file /tmp/target-ids.json
          python validation_scripts/evidence_qc_v8_check.py data/cards.full.json --new-id-file /tmp/target-ids.json
          python validation_scripts/related_lifecycle_check.py data/cards.full.json --require-contract --new-id-file /tmp/target-ids.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Remove superseded temporary remediation machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runs/2026-08-28/pr289-review-remediation-1496
          rm -rf tools/remediation_1496
          rm -f .github/workflows/remediation-materialize-1496.yml

      - name: Commit final exact three-file direct-add PR shape
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize bounded PR289 review remediation on 1496 baseline"
          python - <<'PY'
          import subprocess
          expected={
            'data/cards.full.json',
            'public/data/cards.json',
            'direct-adds/pr289-review-remediation-1496/direct-add.json',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          print('final PR files:',sorted(actual))
          assert actual==expected,(actual,expected)
          PY
          git diff --check origin/main...HEAD
          git push origin HEAD:chatgpt/pr289-review-remediation-1496
