name: Close PR293 Codex review5
on:
  push:
    branches:
      - chatgpt/pr289-review-remediation-1496
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close-review5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lock current main and canonical baseline
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          test "$(git rev-parse origin/main)" = "cedf3dbda66d8d3f9aeae7ef87e8e81f3da87396"
          test "$(git rev-parse origin/main:data/cards.full.json)" = "3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f"
          git show origin/main:data/cards.full.json > /tmp/pr293-base-full.json
      - name: Apply Codex review 5057807310 findings
        run: |
          node <<'NODE'
          const fs=require('fs');
          const fullPath='data/cards.full.json';
          const manifestPath='direct-adds/pr289-review-remediation-1496/direct-add.json';
          const full=JSON.parse(fs.readFileSync(fullPath,'utf8'));
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const cards=Array.isArray(full)?full:(full.cards||[]);

          // P2 #1: use dated official evidence for the SK representative event date.
          const sk=cards.find(x=>x.id==='2026-08-25_KR_01');
          if(!sk) throw new Error('SK card missing');
          const faqUrl='https://www.skinnovation.com/ir/faq?type=etc_ir';
          const faq=(sk.fact_sources||[]).find(s=>(s.source_url||s.url)===faqUrl);
          if(!faq) throw new Error('SK merger FAQ source missing');
          if(!sk.date_role) throw new Error('SK date_role missing');
          sk.date_role.event_date_source_url=faqUrl;
          sk.date_role.event_date_source_name='SK Innovation Merger FAQ';
          sk.date_role.event_date_source_quote='Board Resolution on the Execution of Merger Agreement — Aug 25, 2026';

          // P2 #2: preserve the full Supernode campus total in retained item-specific evidence.
          const ge=cards.find(x=>x.id==='2026-08-21_GL_02');
          if(!ge) throw new Error('GE/Supernode card missing');
          const es=(ge.fact_sources||[]).find(s=>((s.source_url||s.url)||'').includes('energy-storage.news/quinbrook-taps-ge-vernova-and-catl-for-the-third-stage-of-australias-largest-battery-storage-system'));
          if(!es) throw new Error('Energy-Storage.News Supernode source missing');
          const totalQuote='Stage 3 will add 260MW and 1,216MWh of 4-hour storage, bringing the full Supernode campus to 780MW/3,075MWh once complete.';
          es.source_quote=totalQuote;
          es.claim='Supernode Stage 3 adds 260MW/1,216MWh and brings the full campus to 780MW/3,075MWh once complete';
          es.source_contribution='Independent item-specific report directly supports Stage 3 capacity and the full-campus 780MW/3,075MWh total.';
          es.supports=['sub','fact','implication'];

          const esUrl=es.source_url||es.url;
          const esLedger=(ge.source_discovery_ledger||[]).find(r=>r.source_url===esUrl);
          if(esLedger){
            esLedger.unique_contribution=es.source_contribution;
            esLedger.visible_supports=[...es.supports];
          }
          for(const row of (ge.source_synthesis_audit||[])){
            const domain=(row.source_domain||row.source_hostname||row.domain||'').toLowerCase();
            const url=(row.source_url||row.url||'').toLowerCase();
            if(domain.includes('energy-storage.news') || url.includes('energy-storage.news/quinbrook-taps-ge-vernova')){
              if('source_contribution' in row) row.source_contribution=es.source_contribution;
              if('source_quote' in row) row.source_quote=totalQuote;
              if('claim' in row) row.claim=es.claim;
            }
          }

          // Advance synchronized output version time because evidence/provenance changed again.
          const now=new Date();
          const kst=new Date(now.getTime()+9*60*60*1000).toISOString().replace('Z','+09:00');
          full.updated=kst;
          manifest.output_updated=kst;

          fs.writeFileSync(fullPath,JSON.stringify(full,null,2)+'\n');
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          console.log('FINAL_OUTPUT_TIMESTAMP='+kst);
          NODE
      - name: Regenerate lean projection
        run: node scripts/lean_cards.mjs
      - name: Reviewer-specific assertions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const full=JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const lean=JSON.parse(fs.readFileSync('public/data/cards.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('direct-adds/pr289-review-remediation-1496/direct-add.json','utf8'));
          const cards=full.cards||full;
          const sk=cards.find(x=>x.id==='2026-08-25_KR_01');
          const ge=cards.find(x=>x.id==='2026-08-21_GL_02');
          const faqUrl='https://www.skinnovation.com/ir/faq?type=etc_ir';
          if(sk.date_role.event_date_source_url!==faqUrl) throw new Error('SK event-date source is not FAQ');
          if(!/Aug 25, 2026/.test(sk.date_role.event_date_source_quote||'')) throw new Error('SK event-date quote is not dated');
          const es=(ge.fact_sources||[]).find(s=>((s.source_url||s.url)||'').includes('energy-storage.news/quinbrook-taps-ge-vernova-and-catl-for-the-third-stage-of-australias-largest-battery-storage-system'));
          if(!es) throw new Error('Supernode independent source missing');
          if(!/780MW\/3,075MWh/.test(es.source_quote||'')) throw new Error('Supernode total absent from evidence quote');
          if(!/260MW/.test(es.source_quote||'')||!/1,216MWh/.test(es.source_quote||'')) throw new Error('Stage 3 metrics absent');
          for(const f of ['sub','implication']) if(!(es.supports||[]).includes(f)) throw new Error('Supernode source support missing '+f);
          if(full.updated!==manifest.output_updated||lean.updated!==full.updated) throw new Error('output timestamps not synchronized');
          console.log('PASS: Codex review5 assertions');
          NODE
      - name: Validate bounded direct-add and canonical data
        run: |
          node scripts/validate_manual_direct_add.mjs \
            --manifest direct-adds/pr289-review-remediation-1496/direct-add.json \
            --base /tmp/pr293-base-full.json \
            --full data/cards.full.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs
          node scripts/lean_cards.mjs --check
      - name: Restore exact three-file PR shape and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/close-pr293-review5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json direct-adds/pr289-review-remediation-1496/direct-add.json
          git commit -m "Close PR293 Codex review 5057807310"
          git push
