name: lean-cards

# Canonical full → lean public projection.
#
# data/cards.full.json is the sole card source of truth. This workflow never merges public data back
# into the full inventory. It regenerates public/data/cards.json from the committed canonical full,
# validates the exact generated tree, and pushes only the generated public projection when needed.
#
# Direct public-only edits are also included in the trigger so they are deterministically overwritten
# by the canonical projection rather than becoming an alternative source of truth.

on:
  pull_request:
    paths:
      - "data/cards.full.json"
      - "public/data/cards.json"
      - "direct-adds/**/direct-add.json"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"

permissions:
  contents: write
  actions: write

jobs:
  lean:
    # same-repository branches only; fork PRs do not have push permission
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve declared direct-add ID migration
        id: direct_add
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --force
          mapfile -t manifests < <(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(glob)direct-adds/**/direct-add.json')
          [[ ${#manifests[@]} -le 1 ]] || { echo "FAIL: more than one direct-add manifest" >&2; exit 1; }
          allow_delete=0
          if [[ ${#manifests[@]} -eq 1 ]]; then
            test -f "${manifests[0]}"
            migration_count="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.operations?.id_migration||[]).length))' "${manifests[0]}")"
            [[ "$migration_count" -eq 0 ]] || allow_delete=1
          fi
          echo "allow_delete=$allow_delete" >> "$GITHUB_OUTPUT"
      - name: Generate lean projection from canonical full
        run: node scripts/lean_cards.mjs
      # Validate the exact tree before any generated commit is pushed.
      - name: Validate tracker data
        run: node scripts/validate.mjs
      - name: Validate cards data
        env:
          CARDS_ALLOW_DELETE: ${{ steps.direct_add.outputs.allow_delete }}
        run: node scripts/validate_cards.mjs
      - name: Validate canonical full
        env:
          CARDS_ALLOW_DELETE: ${{ steps.direct_add.outputs.allow_delete }}
        run: node scripts/validate_cards.mjs data/cards.full.json
      - name: Check public projection matches canonical full
        run: node scripts/lean_cards.mjs --check
      - name: Commit generated projection and dispatch real checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/cards.json; then
            echo "변경 없음 — 생성 커밋 생략"
            exit 0
          fi
          if ! git diff --quiet -- data/cards.full.json; then
            echo "FAIL: lean exporter가 canonical full을 변경함"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cards.json
          git commit -m "chore: regenerate lean cards projection from canonical full"
          git push
          gh workflow run validate-tracker.yml --ref "${{ github.event.pull_request.head.ref }}"
