name: Locate historical 246 source artifacts

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-locate-historical-246-sources.yml'

permissions:
  contents: write

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search all repository refs
        shell: bash
        run: |
          git fetch --all --prune
          python3 - <<'PY'
          import subprocess
          refs=subprocess.check_output(['git','for-each-ref','--format=%(refname)','refs/remotes/origin'],text=True).splitlines()
          refs=[r for r in refs if r!='refs/remotes/origin/HEAD']
          print('REF_COUNT',len(refs))
          probes=['U0979','U1559','needs_user_decision_after_review','3ad9b135d2ac52ceee9b1c031fe3e191a20d5312831b26eb1a86167e114877ab','4b8cac6945977056728bf97ddacccf4ffc7596420396d6354f50fd4fd3d68fae']
          for probe in probes:
              print('=== PROBE',probe,'===')
              found=[]
              # Search each branch so one inaccessible/stale ref cannot abort the scan.
              for ref in refs:
                  p=subprocess.run(['git','grep','-l','-F',probe,ref,'--'],capture_output=True,text=True)
                  if p.returncode==0:
                      for line in p.stdout.splitlines():
                          found.append(line)
              for line in sorted(set(found))[:100]: print(line)
              print('MATCHES',len(set(found)))
          print('=== HISTORY FOR RECONSTRUCTED LEDGER ===')
          p=subprocess.run(['git','log','--all','--oneline','--decorate','--','runs/2026-09-02/historical_governed_carry_forward_20260825_active246_R1.json'],capture_output=True,text=True)
          print(p.stdout)
          print('=== STRING HISTORY U0979 ===')
          p=subprocess.run(['git','log','--all','--oneline','--name-only','-S','U0979','--'],capture_output=True,text=True)
          print(p.stdout[:30000])
          PY
      - name: Remove locator workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-locate-historical-246-sources.yml
          git commit -m 'chore: remove temporary historical source locator'
          git push origin HEAD:chatgpt/v4-run-baseline-20260831-20260901-r4
