name: clean-publish-r6-combined9

on:
  push:
    branches:
      - chatgpt/publish-r6-combined9-20260904
    paths:
      - '.tmp/clean-publish-r6-combined9/TRIGGER'

permissions:
  contents: write

concurrency:
  group: clean-publish-r6-combined9
  cancel-in-progress: false

jobs:
  replay-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lock exact baseline and exact validated recovery commit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4'
          BASE_BLOB='53219907cdb435c3822c41d097b23e475662aa8a'
          RECOVERY_BRANCH='chatgpt/recover-exact-425-artifacts-20260903'
          RECOVERY_COMMIT='621c753f32f8713bce25a02efc363a4bb437a68b'
          git fetch origin main "$RECOVERY_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          test "$(git rev-parse HEAD:data/cards.full.json)" = "$BASE_BLOB"
          git cat-file -e "${RECOVERY_COMMIT}^{commit}"
          test "$(git merge-base "$RECOVERY_COMMIT" "origin/$RECOVERY_BRANCH")" = "$RECOVERY_COMMIT"

      - name: Copy only the validated governed run package
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_COMMIT='621c753f32f8713bce25a02efc363a4bb437a68b'
          D='runs/2026-09-04/r6-combined9-production-r1'
          mapfile -t source_files < <(git ls-tree -r --name-only "$RECOVERY_COMMIT" -- "$D" | sort)
          test "${#source_files[@]}" -eq 19
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/card-run-audit.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/card-run.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/output-hash-binding.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/prepare-report.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/prompt-0-8-id-ledger.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/stage-0-0c.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/stage-0-0d.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/stage-0-7c.json"
          printf '%s\n' "${source_files[@]}" | grep -qx "$D/stage-0-8.json"
          for stage in \
            stage-0-4-combined9.json stage-0-5-combined9.json \
            stage-0-6-combined9.json stage-0-7-combined9.json \
            stage-a-promotion2.json stage-a-strict7.json \
            stage-b-promotion2.json stage-b-strict7.json \
            stage-c-promotion2.json stage-c-strict7.json; do
            printf '%s\n' "${source_files[@]}" | grep -qx "$D/stages/$stage"
          done
          if printf '%s\n' "${source_files[@]}" | grep -E 'candidate\.cards|apply-report|verify-report|\.tmp' ; then
            echo 'FAIL: recovery production package contains transient candidate output' >&2
            exit 1
          fi
          git checkout "$RECOVERY_COMMIT" -- "$D"
          mapfile -t copied_files < <(find "$D" -type f | sort)
          test "${#copied_files[@]}" -eq 19
          diff -u <(printf '%s\n' "${source_files[@]}") <(printf '%s\n' "${copied_files[@]}")

      - name: Validate governed run before canonical materialization
        shell: bash
        run: |
          set -euo pipefail
          D='runs/2026-09-04/r6-combined9-production-r1'
          RUN="$D/card-run.json"
          node scripts/validate_json_schema_subset.mjs --schema schemas/card-run.v1.schema.json --instance "$RUN"
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN"
          node scripts/validate_card_run_v4_hardening.mjs --run "$RUN"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN"
          node scripts/validate_card_run_relations.mjs --run "$RUN"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN" --canonical data/cards.full.json
          python3 validation_scripts/stage_artifact_contract_check.py 0.8 "$D/stage-0-8.json"

      - name: Replay exact operations onto frozen canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4'
          D='runs/2026-09-04/r6-combined9-production-r1'
          TMP_FULL="$RUNNER_TEMP/candidate.cards.full.json"
          TMP_LEAN="$RUNNER_TEMP/candidate.cards.json"
          TMP_REPORT="$RUNNER_TEMP/apply-report.json"
          node scripts/apply_card_run.mjs \
            --run "$D/card-run.json" \
            --baseline data/cards.full.json \
            --canonical-path data/cards.full.json \
            --output "$TMP_FULL" \
            --report "$TMP_REPORT" \
            --lean-path "$TMP_LEAN" \
            --base-main-sha "$BASE_SHA" \
            --apply
          test "$(sha256sum "$TMP_FULL" | awk '{print $1}')" = 'e3f90efefbee6c5ab5c81d36ab7549dd2ee0de25a0e2b12927464b894c350ef4'
          test "$(sha256sum "$TMP_LEAN" | awk '{print $1}')" = '7bca42fe064f430c7fe5dc9ca57eea2531d72e782e3b259488899f2b7a37a71c'
          cp "$TMP_FULL" data/cards.full.json
          cp "$TMP_LEAN" public/data/cards.json

      - name: Run exact post-resolution production QC
        shell: bash
        run: |
          set -euo pipefail
          D='runs/2026-09-04/r6-combined9-production-r1'
          node scripts/validate_card_run_audits_dispatch.mjs \
            --run "$D/card-run.json" \
            --full data/cards.full.json \
            --lean public/data/cards.json
          MERGE_PREP_REF="$(node scripts/validate_prompt_0_8_semantic_gate.mjs \
            --run "$D/card-run.json" \
            --full data/cards.full.json \
            --ledger "$D/prompt-0-8-id-ledger.json")"
          test "$MERGE_PREP_REF" = "$D/stage-0-8.json"
          python3 validation_scripts/related_lifecycle_check.py \
            data/cards.full.json --require-contract --new-id-file "$D/prompt-0-8-id-ledger.json"
          python3 validation_scripts/evidence_qc_v8_check.py \
            data/cards.full.json --new-id-file "$D/prompt-0-8-id-ledger.json"
          python3 validation_scripts/date_role_freshness_check.py \
            data/cards.full.json --require-date-role --new-id-file "$D/prompt-0-8-id-ledger.json"
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Verify submitted canonical outputs are byte-exact replay
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4'
          BASE_BLOB='53219907cdb435c3822c41d097b23e475662aa8a'
          D='runs/2026-09-04/r6-combined9-production-r1'
          git show "${BASE_SHA}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"
          test "$(git hash-object "$RUNNER_TEMP/cards.full.base.json")" = "$BASE_BLOB"
          node scripts/apply_card_run.mjs \
            --run "$D/card-run.json" \
            --baseline "$RUNNER_TEMP/cards.full.base.json" \
            --canonical-path data/cards.full.json \
            --output data/cards.full.json \
            --report "$RUNNER_TEMP/verify-report.json" \
            --lean-path public/data/cards.json \
            --base-main-sha "$BASE_SHA" \
            --verify
          test "$(sha256sum data/cards.full.json | awk '{print $1}')" = 'e3f90efefbee6c5ab5c81d36ab7549dd2ee0de25a0e2b12927464b894c350ef4'
          test "$(sha256sum public/data/cards.json | awk '{print $1}')" = '7bca42fe064f430c7fe5dc9ca57eea2531d72e782e3b259488899f2b7a37a71c'

      - name: Commit only clean governed production files
        shell: bash
        run: |
          set -euo pipefail
          D='runs/2026-09-04/r6-combined9-production-r1'
          WF='.github/workflows/clean-publish-r6-combined9.yml'
          TRIGGER='.tmp/clean-publish-r6-combined9/TRIGGER'
          rm -f "$WF" "$TRIGGER"
          rmdir .tmp/clean-publish-r6-combined9 2>/dev/null || true
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json "$D" "$WF" "$TRIGGER"
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only 'df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4')
          for path in "${changed[@]}"; do
            case "$path" in
              data/cards.full.json|public/data/cards.json|runs/2026-09-04/r6-combined9-production-r1/*) ;;
              *) echo "FAIL: undeclared final production path $path" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 21
          git commit -m 'data: publish governed R6 combined9 cards'
          git push origin HEAD:chatgpt/publish-r6-combined9-20260904
