name: tmp-sep9-production-card-details

on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - .github/workflows/tmp-sep9-production-card-details.yml

permissions:
  contents: write

jobs:
  detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode production payload details
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          root=Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          tmp=root/'tmp'
          text=''.join((tmp/f'production-cards.part{i:02d}').read_text().strip() for i in range(4))
          cards=json.loads(gzip.decompress(base64.b64decode(text,validate=True)).decode())
          keep=['id','source_spec_id','source_event_id','source_story_ids','region','date','cat','sub_cat','signal','title','sub','gate','fact','implication','urls','date_role','related_lineage','stage_b_lineage']
          out=[]
          for c in cards:
              out.append({k:c.get(k) for k in keep if k in c})
          (tmp/'production-cards.detail.json').write_text(json.dumps({'count':len(out),'cards':out},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit details
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/production-cards.detail.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Sep9 production card details'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
