name: extract-monthly-brief-universe-once

on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-08
    paths:
      - "scripts/extract_monthly_brief_universe_once.mjs"
      - ".github/workflows/extract-monthly-brief-universe-once.yml"

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[monthly-brief-universe-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-08
      - name: Extract governed August universe
        env:
          BASELINE_MAIN_SHA: e46f85c7be99548894549b97eea4bfcb0c9a3c66
          FULL_BLOB_SHA: cc5bc78ae5b27cb58b7bfa7a3ca3800c9d0085cb
        run: node scripts/extract_monthly_brief_universe_once.mjs
      - name: Sanity check extract
        run: |
          node -e "const x=require('./tmp/monthly_brief_2026-08_universe.json'); if(!x.counts.august) throw new Error('zero August cards'); console.log(x.counts)"
          git diff --check
      - name: Commit extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/monthly_brief_2026-08_universe.json
          git commit -m "chore: materialize August Monthly Brief universe [monthly-brief-universe-extracted]"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-08
