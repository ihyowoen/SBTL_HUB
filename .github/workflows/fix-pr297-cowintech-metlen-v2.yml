name: fix-pr297-cowintech-metlen-v2

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: write

env:
  RUN_PATH: runs/2026-08-29/card-run.json
  BASE_SHA: 937dce6429c8bf63535d8043c7f559c9f2001f5d
  BASE_BLOB: 9278233be67240aac1cdf7963e12d8e2878319f0

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260829-combined18-governed-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply reviewed evidence repair and synchronize audit counters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, textwrap
          p=pathlib.Path('.github/workflows/fix-pr297-cowintech-metlen-once.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(lines) if "python - <<'PY'" in l)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          code=textwrap.dedent('\n'.join(lines[start:end]))
          exec(compile(code,str(p),'exec'),{})
          PY

          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          RUN_DIR=Path('runs/2026-08-29')
          RUN_PATH=RUN_DIR/'card-run.json'
          SPECS={'NEW27_A_009','NEW27_TH_006'}

          def spec_of(o):
            if not isinstance(o,dict): return None
            return o.get('source_spec_id') or o.get('spec_id')

          def norm_url(u):
            return str(u or '').strip()

          def sync_card(o):
            if spec_of(o) not in SPECS: return
            facts=o.get('fact_sources')
            if not isinstance(facts,list) or not facts: return
            row_count=len(facts)

            dm=o.get('source_diversity_measure')
            if isinstance(dm,dict):
              dm['source_evidence_entry_count']=row_count

            resolutions=[]
            sr=o.get('source_url_resolution')
            if isinstance(sr,dict): resolutions.append(sr)
            if isinstance(dm,dict) and isinstance(dm.get('source_url_resolution'),dict):
              resolutions.append(dm['source_url_resolution'])
            ep=o.get('evidence_package')
            if isinstance(ep,dict) and isinstance(ep.get('source_url_resolution'),dict):
              resolutions.append(ep['source_url_resolution'])

            for res in resolutions:
              res['supporting_fact_source_count']=row_count
              for ent in res.get('resolution_entries') or []:
                if not isinstance(ent,dict): continue
                url=norm_url(ent.get('source_url') or ent.get('url'))
                inds=[]; owners=[]
                for i,fs in enumerate(facts):
                  if not isinstance(fs,dict): continue
                  fu=norm_url(fs.get('source_url') or fs.get('url'))
                  if fu==url:
                    inds.append(i)
                    owner=fs.get('source_owner_id_normalized') or fs.get('source_owner')
                    if owner and str(owner) not in owners: owners.append(str(owner))
                if inds:
                  ent['resolution_basis']='recomputed from current fact_sources; indices='+','.join(map(str,inds))+'; owners='+','.join(owners)
                  ent['canonical_complete']=all(facts[i].get('source_url_canonical_complete') is True for i in inds)
                  ent['resolved_article_matches_quote']=all(facts[i].get('resolved_article_matches_quote') is True for i in inds)

          def traverse(x):
            if isinstance(x,dict):
              sync_card(x)
              for v in x.values(): traverse(v)
            elif isinstance(x,list):
              for v in x: traverse(v)

          targets=sorted(RUN_DIR.glob('*.json'))
          for p in targets:
            d=json.loads(p.read_text(encoding='utf-8'))
            traverse(d)
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          run=json.loads(RUN_PATH.read_text(encoding='utf-8'))
          def canon(x):
            if isinstance(x,dict): return {k:canon(x[k]) for k in sorted(x)}
            if isinstance(x,list): return [canon(v) for v in x]
            return x
          ops_sha=hashlib.sha256(json.dumps(canon(run['operations']),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()

          for p in targets:
            d=json.loads(p.read_text(encoding='utf-8'))
            def bind(x):
              if isinstance(x,dict):
                for k,v in x.items():
                  if k=='reviewed_operations_sha256': x[k]=ops_sha
                  else: bind(v)
              elif isinstance(x,list):
                for v in x: bind(v)
            bind(d)
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          run=json.loads(RUN_PATH.read_text(encoding='utf-8'))
          cards={c.get('source_spec_id'):c for c in [x['card'] for x in run['operations']['insert']]}
          cow=cards['NEW27_A_009']; met=cards['NEW27_TH_006']
          assert len(cow['fact_sources'])==3, len(cow['fact_sources'])
          assert cow['source_diversity_measure']['source_evidence_entry_count']==3
          assert cow['source_url_resolution']['supporting_fact_source_count']==3
          assert cow['source_diversity_measure']['source_independent_owner_count']==2
          assert len(met['fact_sources'])==4, len(met['fact_sources'])
          assert met['source_diversity_measure']['source_evidence_entry_count']==4
          assert met['source_url_resolution']['supporting_fact_source_count']==4
          assert met['source_diversity_measure']['source_independent_owner_count']==1
          print('synchronized evidence counters; reviewed operations SHA256',ops_sha)
          PY

      - name: Re-materialize canonical from exact locked baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]] || { echo "main moved; rebase required" >&2; exit 1; }
          mkdir -p .tmp-pr297-final-evidence
          git show "$BASE_SHA:data/cards.full.json" > .tmp-pr297-final-evidence/cards.full.base.json
          [[ "$(git hash-object .tmp-pr297-final-evidence/cards.full.base.json)" == "$BASE_BLOB" ]] || { echo "baseline blob mismatch" >&2; exit 1; }
          node scripts/apply_card_run.mjs --apply --run "$RUN_PATH" --baseline .tmp-pr297-final-evidence/cards.full.base.json --output data/cards.full.json --report .tmp-pr297-final-evidence/apply-pre.json --base-main-sha "$BASE_SHA" --skip-lean
          node scripts/lean_cards.mjs
          node scripts/apply_card_run.mjs --verify --run "$RUN_PATH" --baseline data/cards.full.json --output data/cards.full.json --report runs/2026-08-29/apply-report.json --base-main-sha "$BASE_SHA" --lean-path public/data/cards.json

      - name: Refresh hashes and run full governed validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          run=json.load(open('runs/2026-08-29/card-run.json',encoding='utf-8'))
          cards=[x['card'] for x in run['operations']['insert']]
          Path('.tmp-pr297-final-evidence').mkdir(exist_ok=True)
          json.dump({'cards':cards},open('.tmp-pr297-final-evidence/current-run-scope.json','w'),ensure_ascii=False,indent=2)
          json.dump({'ids':[c['id'] for c in cards]},open('.tmp-pr297-final-evidence/current-run-ids.json','w'),ensure_ascii=False,indent=2)
          fh=hashlib.sha256(Path('data/cards.full.json').read_bytes()).hexdigest(); lh=hashlib.sha256(Path('public/data/cards.json').read_bytes()).hexdigest()
          p=Path('runs/2026-08-29/card_run_audit_20260829_CURRENT_MAIN_1496_COMBINED18.json')
          d=json.loads(p.read_text(encoding='utf-8')); d['full_output_sha256']=fh; d['lean_output_sha256']=lh
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('full',fh); print('lean',lh)
          PY
          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file .tmp-pr297-final-evidence/current-run-ids.json
          python validation_scripts/evidence_qc_v8_check.py .tmp-pr297-final-evidence/current-run-scope.json --new-id-file .tmp-pr297-final-evidence/current-run-ids.json --json-report .tmp-pr297-final-evidence/evidence-qc-v8.json
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_relations.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN_PATH" --canonical data/cards.full.json
          node scripts/validate_card_run_audits.mjs --run "$RUN_PATH" --full data/cards.full.json --lean public/data/cards.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Commit remediation and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-pr297-final-evidence
          rm -f .github/workflows/fix-pr297-cowintech-metlen-once.yml .github/workflows/fix-pr297-cowintech-metlen-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json runs/2026-08-29 .github/workflows/fix-pr297-cowintech-metlen-once.yml .github/workflows/fix-pr297-cowintech-metlen-v2.yml
          git commit -m "Repair Cowintech and METLEN evidence coverage for PR #297"
          git push origin HEAD:chatgpt/20260829-combined18-governed-run
