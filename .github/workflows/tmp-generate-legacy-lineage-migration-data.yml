name: tmp-generate-legacy-lineage-migration-data

on:
  push:
    branches:
      - agent/legacy-lineage-container-migration-data

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock baseline
        shell: bash
        env:
          BASE_SHA: 07f224d0b946c8708a890c876f6f8d2387a30148
          BASE_BLOB: ba7e680c9a3c3425f212ef29bcfd9055113cbdb0
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          actual_main="$(git rev-parse origin/main)"
          actual_blob="$(git rev-parse "${actual_main}:data/cards.full.json")"
          [[ "$actual_main" == "$BASE_SHA" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED main $actual_main != $BASE_SHA" >&2; exit 1; }
          [[ "$actual_blob" == "$BASE_BLOB" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED blob $actual_blob != $BASE_BLOB" >&2; exit 1; }

      - name: Generate bounded migration outputs
        shell: bash
        env:
          BASE_SHA: 07f224d0b946c8708a890c876f6f8d2387a30148
          BASE_BLOB: ba7e680c9a3c3425f212ef29bcfd9055113cbdb0
          OUTPUT_UPDATED: '2026-08-08T16:21:00+09:00'
          MANIFEST: migrations/20260808-legacy-related-lineage-container-init/legacy-related-lineage-container-migration.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MANIFEST")"
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/cards.full.json';
          const raw = fs.readFileSync(path, 'utf8');
          const crlfCount = (raw.match(/\r\n/g) || []).length;
          const lfOnlyCount = (raw.match(/(?<!\r)\n/g) || []).length;
          const eol = crlfCount > lfOnlyCount ? '\r\n' : '\n';
          console.log(`::notice title=baseline-eol::CRLF=${crlfCount} LF=${lfOnlyCount} selected=${eol === '\r\n' ? 'CRLF' : 'LF'}`);
          const doc = JSON.parse(raw.replace(/^\uFEFF/, ''));
          if (!doc || !Array.isArray(doc.cards) || doc.cards.length !== 1343) throw new Error('unexpected canonical card inventory');
          const ids = new Set(doc.cards.map((card) => card && card.id));
          if (ids.size !== doc.cards.length) throw new Error('duplicate/missing canonical IDs');
          const validContainer = (card) => card?.related_lineage && typeof card.related_lineage === 'object' && !Array.isArray(card.related_lineage) && Array.isArray(card.related_lineage.related_ids);
          let initialized = 0;
          const skipped = [];
          for (const card of doc.cards) {
            if (!Array.isArray(card.related)) throw new Error(`${card?.id}: related[] missing/invalid`);
            if (validContainer(card)) continue;
            const dangling = card.related.some((target) => !ids.has(target));
            if (dangling) {
              skipped.push(card.id);
              continue;
            }
            card.related_lineage = { related_ids: [...card.related] };
            initialized += 1;
          }
          if (initialized !== 1236) throw new Error(`initialized ${initialized} != 1236`);
          if (skipped.length !== 13) throw new Error(`skipped ${skipped.length} != 13`);
          doc.updated = process.env.OUTPUT_UPDATED;
          const out = JSON.stringify(doc, null, 2).replace(/\n/g, eol) + eol;
          fs.writeFileSync(path, out, 'utf8');
          const manifest = {
            schema: 'legacy_related_lineage_container_migration_v1',
            status: 'PASS',
            migration_id: 'LEGACY_RELATED_LINEAGE_CONTAINER_INIT_20260808',
            base_main_commit_sha: process.env.BASE_SHA,
            base_full_blob_sha: process.env.BASE_BLOB,
            expected_before: 1343,
            expected_after: 1343,
            expected_initialized_count: 1236,
            expected_skipped_dangling_card_ids: skipped,
            output_updated: process.env.OUTPUT_UPDATED
          };
          fs.writeFileSync(process.env.MANIFEST, JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          console.log(JSON.stringify({ initialized, skipped }, null, 2));
          NODE
          node scripts/lean_cards.mjs

      - name: Reconstruct migration baseline
        shell: bash
        env:
          BASE_SHA: 07f224d0b946c8708a890c876f6f8d2387a30148
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"

      - name: Validate exact migration transformation
        shell: bash
        env:
          MANIFEST: migrations/20260808-legacy-related-lineage-container-init/legacy-related-lineage-container-migration.json
        run: |
          set -euo pipefail
          node scripts/validate_legacy_related_lineage_migration.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json

      - name: Validate canonical document
        run: node scripts/validate.mjs

      - name: Validate full cards
        run: node scripts/validate_cards.mjs data/cards.full.json

      - name: Validate lean cards
        run: node scripts/validate_cards.mjs public/data/cards.json

      - name: Check lean byte exactness
        run: node scripts/lean_cards.mjs --check

      - name: Check diff whitespace
        shell: bash
        run: |
          set +e
          output="$(git diff --check 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [[ $status -ne 0 ]]; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error title=git diff --check::$line"
            done <<< "$output"
          fi
          exit $status

      - name: Commit generated payload
        shell: bash
        env:
          MANIFEST: migrations/20260808-legacy-related-lineage-container-init/legacy-related-lineage-container-migration.json
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json "$MANIFEST"
          git diff --cached --quiet && { echo 'FAIL: no generated migration diff' >&2; exit 1; }
          git commit -m 'data: initialize legacy Related lineage containers'
          git push origin "HEAD:${GITHUB_REF_NAME}"
