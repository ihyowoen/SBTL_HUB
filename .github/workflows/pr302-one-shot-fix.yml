name: pr302-one-shot-fix

on:
  push:
    branches:
      - rd-20260901-run

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pr302-fixbot-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rd-20260901-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch the remaining current-head review issue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('public/data/tracker_data.json')
          text = p.read_text(encoding='utf-8')
          data = json.loads(text)
          item = next(x for x in data['items'] if x['id'] == 'KR-020')

          old = item['detail']
          needle = "## WATCH 사유\n• 제작사 판매의무(수요측)로 SBTL 파우치 소재 직접 규율 아님\n• 목표비율·산입기준 확정 고시 및 이행연도 도래 시 재평가"
          replacement = "## 우선순위 판단\n• 제작사 판매의무(수요측)로 SBTL 파우치 소재 직접 규율은 아니므로 직접 노출도는 낮음\n• 다만 2026.01.05 개정 고시가 시행 중이므로 status는 ACTIVE로 유지하고, 목표비율·산입기준 변경은 후속 모니터링"
          if needle not in old:
              raise SystemExit('KR-020 WATCH rationale block not found exactly; refusing broad rewrite')
          new = old.replace(needle, replacement, 1)
          old_encoded = json.dumps(old, ensure_ascii=False)
          new_encoded = json.dumps(new, ensure_ascii=False)
          if text.count(old_encoded) != 1:
              raise SystemExit(f'KR-020 detail serialization count={text.count(old_encoded)}; refusing ambiguous replacement')
          p.write_text(text.replace(old_encoded, new_encoded, 1), encoding='utf-8')

          # Current-head assertions for review comments that were already fixed in later commits.
          refreshed = json.loads(p.read_text(encoding='utf-8'))
          cn21 = next(x for x in refreshed['items'] if x['id'] == 'CN-021')
          assert '6부처' in cn21['d'] and '6부처' in cn21['detail']
          kr20 = next(x for x in refreshed['items'] if x['id'] == 'KR-020')
          assert kr20['s'] == 'ACTIVE'
          assert '## WATCH 사유' not in kr20['detail']
          assert '## 우선순위 판단' in kr20['detail']
          PY

          grep -F '19.51→15→**10엔**' public/data/region_policy.json >/dev/null
          grep -F 'const dateOf = new Map();' ops/validate2.mjs >/dev/null
          grep -F 'verify.date(${v.date}) ≠ 원장 ${v.runId} 의 date(${d0})' ops/validate2.mjs >/dev/null
          grep -F '근거는 하나뿐이다' ops/RUNBOOK.md >/dev/null

      - name: Validate patched branch
        shell: bash
        env:
          RP_PATH: public/data/region_policy.json
          COV_PATH: ops/coverage.json
        run: |
          set -euo pipefail
          node scripts/validate.mjs public/data/tracker_data.json public/data/region_policy.json
          node ops/validate2.mjs public/data/tracker_data.json ops/runs/2026-09-01-RD.json

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-pr302-fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr302-one-shot-fix.yml
          git add public/data/tracker_data.json
          git diff --cached --check
          git commit -m 'fix(pr302): align KR-020 ACTIVE detail [pr302-fixbot-done]'
          git push origin HEAD:rd-20260901-run
