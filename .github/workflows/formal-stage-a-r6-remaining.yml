name: Formal Stage A V4 R6 Remaining Batches

on:
  push:
    branches:
      - chatgpt/recover-exact-425-artifacts-20260903
    paths:
      - '.tmp/formal-stage-a-r6-remaining/TRIGGER'

permissions:
  contents: write

jobs:
  formal-stage-a-remaining:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize shared remaining-batch contract metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/formal_stage_a_r6_remaining.py')
          s = p.read_text(encoding='utf-8')

          def repl(old, new):
              global s
              if old in s:
                  assert s.count(old) == 1, (old, s.count(old))
                  s = s.replace(old, new)
              assert new in s, new

          repl(
              '"earnings_deep_dive_pool_ids": [i["review_pool_item_id"] for i in review_items if i.get("earnings_deep_dive_required")],',
              '"earnings_deep_dive_pool_ids": [i["review_pool_item_id"] for i in pools["candidate_review_pool"] if i.get("review_pool_subtype") == "earnings_deep_dive"],'
          )

          repl(
              '    urls = source_urls(event)\n    primary = event["representative"].get("url") or urls[0]\n    if primary not in urls:\n        urls.insert(0, primary)\n    d = domains(urls)',
              '    urls = source_urls(event)\n    source_url_missing = not urls\n    primary = event["representative"].get("url") or (urls[0] if urls else f"source-bound-observation:{event[\'representative\'][\'observation_key\']}")\n    if primary not in urls:\n        urls.insert(0, primary)\n    d = domains(urls)'
          )
          repl(
              '"source_access_risk": "low" if len(urls) > 1 else "moderate",',
              '"source_access_risk": "high" if source_url_missing else ("low" if len(urls) > 1 else "moderate"),'
          )

          marker = '    route = "execution_anchor_route" if m["binding_exec"] else "structural_non_execution_route"\n'
          insertion = '''    # A source-bound observation without any supplied fetchable URL may never enter the strict Stage B queue.\n    # Rescue-before-delete keeps relevant rows in candidate review for authorized source recovery.\n    if not source_urls(event):\n        pool = "candidate_review_pool" if m["relevant"] else "reject_or_support_only_pool"\n\n'''
          if insertion not in s:
              assert s.count(marker) == 1
              s = s.replace(marker, insertion + marker)
          assert insertion in s

          marker2 = '    from validation_scripts import stage_lineage_contract_check as lineage\n'
          insertion2 = '''    # Zero-strict batches must not claim a Stage B handoff. Follow the canonical next-call safety contract.\n    if not pools["strict_passed_spec"]:\n        rec = artifact["next_call_recommendation"]\n        if pools["candidate_review_pool"]:\n            rec.update({\n                "recommended_next_call": "candidate_review_pool triage",\n                "recommended_prompt_id": "separate review_pool promotion prompt, not Prompt 0.2",\n                "recommended_input_universe": "Stage A candidate_review_pool[] only",\n                "reason": f"Formal Batch {batch:02d} has zero strict Stage A inputs; candidate-review items remain bounded and may not enter Stage B without authorized promotion.",\n            })\n        elif pools["watchlist_context_pool"]:\n            rec.update({\n                "recommended_next_call": "retrospective or watchlist context review",\n                "recommended_prompt_id": "Prompt 1.1 or separate context review prompt",\n                "recommended_input_universe": "watchlist_context_pool[] only, not Stage B",\n                "reason": f"Formal Batch {batch:02d} has zero strict/candidate inputs; watchlist context remains outside Stage B.",\n            })\n        else:\n            rec.update({\n                "recommended_next_call": "retrospective",\n                "recommended_prompt_id": "Prompt 1.1",\n                "recommended_input_universe": "reject_or_support_only_pool[] terminal accounting only",\n                "reason": f"Formal Batch {batch:02d} has no strict, candidate-review or watchlist inputs for downstream Stage B.",\n            })\n\n'''
          if insertion2 not in s:
              assert s.count(marker2) == 1
              s = s.replace(marker2, insertion2 + marker2)
          assert insertion2 in s

          p.write_text(s, encoding='utf-8')
          PY
          if ! git diff --quiet -- scripts/formal_stage_a_r6_remaining.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/formal_stage_a_r6_remaining.py
            git commit -m 'fix: align remaining Formal Stage A runner with shared contract'
            git push
          fi
      - name: Materialize and validate Formal Stage A batches 02-16
        run: python3 scripts/formal_stage_a_r6_remaining.py
      - name: Commit validated Formal Stage A outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-03/stage_a_formal_r6_batch*_20260903_R1.json \
                  runs/2026-09-03/stage_a_formal_r6_batch*_validation_20260903_R1.json \
                  runs/2026-09-03/stage_a_formal_r6_all_batches_20260903_R1.json
          git rm -r .tmp/formal-stage-a-r6-remaining
          git commit -m 'audit: complete Formal Stage A V4 R6 batches 02-16'
          git push
