name: r23-verified-card-factual-correction

# Runs on the proposed same-repo branch ONLY; never touches main.
# This is a factual correction of two existing cards, not a 0.0C/Stage A release.
on:
  pull_request:
    paths:
      - "scripts/remediation/r23_two_card_factual_correction.py"
      - ".github/workflows/r23-verified-card-factual-correction.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-verified-two-card-change:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/news-catchup-factual-fix-20261015' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pin unchanged production baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "b7847ca9885f6f27ae0566455b0a476ef1059d24"
          test -z "$(git status --porcelain)"
      - name: Generate immutable full + lean previews; check both SHA256 locks
        run: python3 scripts/remediation/r23_two_card_factual_correction.py
      - name: Stage exactly the two proposed updated card data files
        run: |
          set -euo pipefail
          cp /tmp/r23_hotfix_preview/cards.full.json data/cards.full.json
          cp /tmp/r23_hotfix_preview/cards.json public/data/cards.json
      - name: Verify ONLY two specific existing card IDs changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected={'R3_07','2026-08-24_GL_03'}
          for file in ('data/cards.full.json','public/data/cards.json'):
              original=json.loads(subprocess.check_output(['git','show',f'origin/main:{file}']))
              updated=json.loads(Path(file).read_text())
              assert original['total']==updated['total']==1674
              a,b=original['cards'],updated['cards']
              assert [r['id'] for r in a]==[r['id'] for r in b]
              assert {a0['id'] for a0,b0 in zip(a,b) if a0!=b0}==expected
          f={x['id']:x for x in json.loads(Path('data/cards.full.json').read_text())['cards']}
          g={x['id']:x for x in json.loads(Path('public/data/cards.json').read_text())['cards']}
          for id in expected:
              assert all(f[id][k]==v for k,v in g[id].items()),id
          assert '조건합의' in f['R3_07']['title']
          assert '전환사채' in f['2026-08-24_GL_03']['title']
          print('PASS: 1,674 cards; exactly two specified IDs changed; no silent loss')
          PY
          test "$(git diff --name-only | sort)" = "$(printf 'data/cards.full.json\npublic/data/cards.json')"
      - name: Validate bounded Full and Lean using repository native gates
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:public/data/cards.json > /tmp/r23_base_lean.json
          CARDS_BASE=/tmp/r23_base_lean.json node scripts/validate_cards.mjs data/cards.full.json
          CARDS_BASE=/tmp/r23_base_lean.json node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
      - name: Commit only the pair of card data changes to the draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/cards.full.json public/data/cards.json
          git commit -m "fix(cards): correct two first-party-verified financial claim stages"
          git push origin HEAD:refs/heads/ops/news-catchup-factual-fix-20261015
