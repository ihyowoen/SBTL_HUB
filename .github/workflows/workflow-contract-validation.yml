name: Workflow contract validation

on:
  pull_request:
    paths:
      - "contracts/**"
      - "docs/**"
      - "schemas/manual-direct-add.v*.schema.json"
      - "scripts/validate_manual_direct_add.mjs"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"
      - ".github/workflows/workflow-contract-validation.yml"
      - ".github/workflows/apply-card-run.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/**"
      - "schemas/manual-direct-add.v*.schema.json"
      - "scripts/validate_manual_direct_add.mjs"
      - "validation_scripts/**"
      - ".github/workflows/workflow-contract-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile validators and historical snapshots
        run: python -m compileall -q validation_scripts

      - name: Verify clean V4 architecture
        run: python validation_scripts/workflow_v4_architecture_check.py

      - name: Verify no legacy prompt overlay is active
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Run active semantic and machine regression tests
        run: python validation_scripts/run_active_workflow_tests.py

      - name: Validate direct-add V2 schema and validator
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("schemas/manual-direct-add.v2.schema.json","utf8"))'
          node --check scripts/validate_manual_direct_add.mjs
          node scripts/validate_manual_direct_add.mjs --self-test

      - name: Verify V3 machine-contract compatibility
        run: |
          python validation_scripts/v3_contract_drift_check.py
          python validation_scripts/v3_stage_contracts.py --check
          python validation_scripts/v3_stage_contract_flow_check.py --check

      - name: Verify lean projection contract
        run: node scripts/lean_cards.mjs --check
