name: Inspect PR293 SK review4
on:
  push:
    branches:
      - chatgpt/pr289-review-remediation-1496
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SK evidence metadata
        run: |
          node <<'NODE'
          const fs=require('fs');
          const full=JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const lean=JSON.parse(fs.readFileSync('public/data/cards.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('direct-adds/pr289-review-remediation-1496/direct-add.json','utf8'));
          const cards=Array.isArray(full)?full:(full.cards||[]);
          const c=cards.find(x=>x.id==='2026-08-25_KR_01');
          if(!c) throw new Error('SK card not found');
          const pick={
            full_updated:full.updated,
            lean_updated:lean.updated,
            manifest_output_updated:manifest.output_updated,
            source_published_date:c.source_published_date,
            visible_quote_date:c.visible_quote_date,
            urls:c.urls,
            fact_sources:c.fact_sources,
            source_discovery_ledger:c.source_discovery_ledger,
            source_url_resolution:c.source_url_resolution,
            source_url_resolutions:c.source_url_resolutions,
            source_diversity_measure:c.source_diversity_measure,
            source_diversity_roles:c.source_diversity_roles,
            evidence_resolution:c.evidence_resolution,
            single_source_exception:c.single_source_exception,
            date_role:c.date_role,
            source_synthesis_applied:c.source_synthesis_applied,
            source_synthesis_fields:c.source_synthesis_fields,
            source_synthesis_audit:c.source_synthesis_audit,
            sub:c.sub,
            fact:c.fact,
            gate:c.gate,
            implication:c.implication
          };
          console.log(JSON.stringify(pick,null,2));
          NODE