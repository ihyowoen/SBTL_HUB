name: Materialize 20260831 V4 0.0C
on:
  push:
    branches: [chatgpt/v4-run-20260831]
    paths: [runs/2026-09-02/.tmp_0_0c_seed_20260831.json, .github/workflows/tmp-materialize-0-0c-20260831.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4-run-20260831
          fetch-depth: 0
      - name: Generate and validate exact 0.0C ledgers
        shell: python
        run: |
          import json
          from pathlib import Path
          seed_path=Path('runs/2026-09-02/.tmp_0_0c_seed_20260831.json')
          seed=json.loads(seed_path.read_text())
          region_keys=['korea','north_america','china','japan','europe','material_global_markets']
          topic_keys=['cells_chemistries','materials_components','pouch_pouch_film_demand','ess_bess','ev_charging','manufacturing_capacity_utilisation','grid_ai_data_centre_power','critical_minerals_refining','recycling','policy_trade_sanctions_subsidies_localisation','competitors_customers','prices_costs_margins','financing','safety_recall_commissioning_operation']
          orig=[{'candidate_id':f"orig:{seed['run_tag']}:{sid}",'story_id':sid,'discovery_origin':'original_input'} for sid in seed['story_ids']]
          buckets={k:[] for k in ['discovered_missing_candidates','baseline_follow_up_candidates','existing_card_reinforcements','existing_card_update_candidates','correction_or_reversal_candidates','treasure_rescue_candidates']}
          for d in seed['discovered']:
            row={k:v for k,v in d.items() if k not in {'bucket','disposition'}}
            buckets[d['bucket']].append(row)
          expansion=[{'candidate_id':r['candidate_id'],'origin':'original_input','story_id':r['story_id']} for r in orig]
          expansion += [{'candidate_id':d['candidate_id'],'origin':'discovered','story_id':d.get('story_id'),'title':d['title'],'source_url':d.get('source_url')} for d in seed['discovered']]
          terminal=[]
          quarantine=set(seed.get('quarantine_story_ids',[])); date_review=set(seed.get('date_review_story_ids',[]))
          for r in orig:
            sid=r['story_id']
            if sid in quarantine: disp='quarantine_source_packet_retain_event_for_reconciliation'
            elif sid in date_review: disp='retain_for_event_reconciliation_with_date_role_review'
            else: disp='retain_for_authoritative_event_reconciliation'
            terminal.append({'candidate_id':r['candidate_id'],'disposition':disp})
          terminal += [{'candidate_id':d['candidate_id'],'disposition':d['disposition']} for d in seed['discovered']]
          out={
            'schema':'coverage_discovery_v4','stage':'0.0C','status':'PASS','run_id':seed['run_id'],
            'raw_input_audit_ref':seed['raw_input_audit_ref'],
            'document_universe_manifest_ref':'runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_f279295.json',
            'base_main_commit_sha':'f2792958a85470c11030211642012865c69f56ab',
            'base_full_blob_sha':'53219907cdb435c3822c41d097b23e475662aa8a',
            'original_input_accounted':True,'original_input_ledger':orig,**buckets,
            'regional_coverage_matrix':{k:{'status':'searched'} for k in region_keys},
            'topic_coverage_matrix':{k:{'status':'searched'} for k in topic_keys},
            'searched_but_no_material_event_ledger':[{'axis':'korea','note':'no additional external candidate beyond retained raw/rescue items after challenge'},{'axis':'material_global_markets','note':'no additional candidate retained beyond listed discoveries'}],
            'source_universe_expansion_ledger':expansion,
            'must_report_candidate_ledger':[{'candidate_id':d['candidate_id'],'reason':'material discovery or rescue requiring event-level reconciliation'} for d in seed['discovered'] if d['candidate_id']!='rescue:20260831:KR_2026-08-31_C37'],
            'known_unknowns':['upstream integrity groups are non-authoritative and must be reclustered by event','collector story_id is run-scoped and cannot be used as cross-run event identity'],
            'residual_coverage_risks':['cross-run duplicate/follow-up determination remains for authoritative event reconciliation','quarantined source-packet fields must not be used as evidence before repair'],
            'terminal_discovery_disposition_ledger':terminal,'stage_a_authorized':True
          }
          exp=[x['candidate_id'] for x in expansion]; term=[x['candidate_id'] for x in terminal]
          assert len(seed['story_ids'])==264 and len(set(seed['story_ids']))==264
          assert len(expansion)==270 and len(terminal)==270
          assert len(exp)==len(set(exp)) and len(term)==len(set(term)) and set(exp)==set(term)
          assert set(out['regional_coverage_matrix'])==set(region_keys)
          assert set(out['topic_coverage_matrix'])==set(topic_keys)
          assert all(v['status'] in {'searched','blocked'} for v in out['regional_coverage_matrix'].values())
          assert all(v['status'] in {'searched','blocked'} for v in out['topic_coverage_matrix'].values())
          Path('runs/2026-09-02/stage_0_0c_coverage_discovery_20260831_143419_V4.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print({'original':len(orig),'discovered':len(seed['discovered']),'expanded':len(expansion),'terminal':len(terminal),'status':out['status']})
      - name: Commit artifact and self-delete temporary inputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm runs/2026-09-02/.tmp_0_0c_seed_20260831.json
          rm .github/workflows/tmp-materialize-0-0c-20260831.yml
          git add -A
          git commit -m "audit: materialize 2026-08-31 V4 0.0C PASS"
          git push origin HEAD:chatgpt/v4-run-20260831
