name: Search Actions artifacts for handoff425 source

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-inspect-handoff425.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search artifact inventory and historical workflow blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          echo '=== ACTIONS ARTIFACT INVENTORY ==='
          gh api --paginate 'repos/${{ github.repository }}/actions/artifacts?per_page=100' \
            --jq '.artifacts[] | [.id,.name,.size_in_bytes,.expired,.created_at,.updated_at,.workflow_run.id,.workflow_run.head_branch,.workflow_run.head_sha] | @tsv' \
            | grep -Ei 'cross|stage.?a|event|handoff|preselect|membership|2026-09-02|20260831|20260901' \
            | head -500

          echo '=== ALL NON-EXPIRED ARTIFACTS AROUND 2026-09-02 ==='
          gh api --paginate 'repos/${{ github.repository }}/actions/artifacts?per_page=100' \
            --jq '.artifacts[] | select(.expired==false and (.created_at|startswith("2026-09-02"))) | [.id,.name,.size_in_bytes,.created_at,.workflow_run.id,.workflow_run.head_branch,.workflow_run.head_sha] | @tsv' \
            | head -500

          echo '=== HISTORICAL WORKFLOW BLOBS WITH UPLOAD/CROSSRUN TERMS ==='
          python3 - <<'PY'
          import subprocess
          needles=[b'upload-artifact',b'crossrun_event_membership',b'v4-crossrun-preselection-artifacts',b'event_membership_425',b'crossrun_event_membership_425.json']
          objs=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          rows=[]
          for line in objs:
              parts=line.split(' ',1); sha=parts[0]; path=parts[1] if len(parts)>1 else ''
              if path and not (path.startswith('.github/workflows/') or 'workflow' in path.lower()):
                  continue
              try:
                  if subprocess.check_output(['git','cat-file','-t',sha],text=True).strip()!='blob': continue
                  size=int(subprocess.check_output(['git','cat-file','-s',sha],text=True).strip())
                  if size>500000: continue
                  data=subprocess.check_output(['git','cat-file','blob',sha])
              except Exception:
                  continue
              hits=[n.decode() for n in needles if n in data]
              if hits: rows.append((sha,path,size,hits,data.decode('utf-8',errors='replace')))
          print('workflow_blob_hits=',len(rows))
          for sha,path,size,hits,text in rows:
              print('--- HIT',sha,path,size,hits)
              for i,line in enumerate(text.splitlines(),1):
                  if any(h.lower() in line.lower() for h in ['upload-artifact','crossrun_event_membership','v4-crossrun-preselection-artifacts','event_membership_425']):
                      lo=max(1,i-6); hi=min(len(text.splitlines()),i+12)
                      ls=text.splitlines()
                      print('\n'.join(f'{j}:{ls[j-1]}' for j in range(lo,hi+1)))
          PY
