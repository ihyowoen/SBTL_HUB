name: R27 one-time source-review repair (NO MERGE)

on:
  push:
    branches: [news/structural-misread-r25-4-cards-20261016]
    paths:
      - scripts/.r27_review_patch_20261016.py.gz.b64
      - .github/workflows/r27-one-time-review-fixes.yml

permissions:
  contents: write

jobs:
  fix-and-validate-pr392-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify script payload and immutable main lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "6851fdbe4a25b30b7204d07708a1238123c14910"
          test "$(git merge-base HEAD 65f62b8d56ecf990c034ad3408556afc19d0858f)" = "65f62b8d56ecf990c034ad3408556afc19d0858f"
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          raw=base64.b64decode(Path("scripts/.r27_review_patch_20261016.py.gz.b64").read_text().strip(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=="2550d04c25a6a7d2d11618fd05e7e1606345af334b3fdd42152ed42608f2288b"
          script=gzip.decompress(raw)
          assert hashlib.sha256(script).hexdigest()=="1548a4dff4d9fb99695bd345ebaca3f2591f3b844e8fe2efc965608bf5a257e3"
          Path("scripts/.r27_bootstrap_build.py").write_bytes(script)
          print("R27 compressed source provenance PASS")
          PY
      - name: Correct rollout stage and 2025 predecessor; preserve 3 issued cards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.r27_bootstrap_build.py
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > "$RUNNER_TEMP/r27-main-full.json"
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-16-structural-misread-4/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-16-structural-misread-4/direct-add.json --base "$RUNNER_TEMP/r27-main-full.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-16-structural-misread-4/direct-add.json --base "$RUNNER_TEMP/r27-main-full.json" --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          manifest={
          "data/cards.full.json":"c85c1ee8dcae09b0b17689b3b37a6355ef646cad19307602434102797a44a798",
          "public/data/cards.json":"4a394c312cd1e5fd331a58870e29c97f1fba64bec023c6eba5a194571a758e39",
          "direct-adds/2026-10-16-structural-misread-4/direct-add.json":"a6980ec79b93e6566942af4218b1e2fe8f2fe4afd3a482b1b74eaf8c19b8c377"
          }
          for path,expected in manifest.items():
            actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
            assert actual==expected, (path,actual)
          print("R27 byte-exact three-file stage and chronology corrections PASS")
          PY
      - name: Unit tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit ONLY Full, Lean and V2 manifest (no temp sources)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "6851fdbe4a25b30b7204d07708a1238123c14910"
          rm -f scripts/.r27_bootstrap_build.py
          rm scripts/.r27_review_patch_20261016.py.gz.b64
          rm .github/workflows/r27-one-time-review-fixes.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/r27-one-time-review-fixes.yml \
            data/cards.full.json \
            direct-adds/2026-10-16-structural-misread-4/direct-add.json \
            public/data/cards.json \
            scripts/.r27_review_patch_20261016.py.gz.b64 | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "FAIL unexpected tracked file changes" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(cards): correct OEM predecessor and policy-stage cap; verify grid execution"
          git push origin "HEAD:refs/heads/news/structural-misread-r25-4-cards-20261016"
          echo "R27 PASS: +3 cards, 1677 total, 0 merges; CN roadmap held as RESERVE pending item-specific owner override."
