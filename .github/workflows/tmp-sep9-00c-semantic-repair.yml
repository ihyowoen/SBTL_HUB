name: tmp-sep9-00c-semantic-repair
on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - '.github/workflows/tmp-sep9-00c-semantic-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sep9-r1-current-main-production-r1
      - name: Repair Prompt 0.0C semantic completeness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          covp=root/'coverage-discovery-final.json'
          stp=root/'stage-0-0c.json'
          valp=root/'stage-0-0c-validation.json'
          cov=json.loads(covp.read_text())
          st=json.loads(stp.read_text())

          rescues=[
            {
              'candidate_id':'SEP09_DISC_012',
              'published_date':'2026-09-08',
              'operative_event_date':'2026-09-02',
              'region':'US',
              'headline':'Cloudbreak Energy Partners announces strategic investment from GETEC Energie Holding to fund IPP transition and U.S. solar/storage portfolio',
              'discovery_origin':'coverage_discovery_preclean_rescue_plus_web',
              'raw_preclean_source_story_id':'EU_2026-09-08_C29',
              'anchor_hint':'data_financial_anchor',
              'event_stage_hint':'strategic_investment_announced',
              'source_candidate_urls':[
                'https://cloudbreakenergy.com/announcing-a-strategic-investment-from-getec-energie-holding-into-cloudbreak-energy/',
                'https://www.orrick.com/en/News/2026/09/Cloudbreak-Energy-Partners-Announces-Strategic-Investment-from-GETEC-to-Move-into-US-Market'
              ],
              'stage_a_routing':'candidate_review',
              'notes':'Exact Sep9 raw preserves this only in pre-clean, not the locked 393 original membership. Official Cloudbreak disclosure says GETEC investment funds Cloudbreak IPP transition, a 106 MWdc safe-harbored solar portfolio and solar/storage pipeline. Treat as provenance-distinct discovery; assess financing materiality separately from the canonical Sep4 Pueblo BESS NTP event.'
            },
            {
              'candidate_id':'SEP09_DISC_013',
              'published_date':'2026-09-08',
              'operative_event_date':'2026-09-03',
              'region':'US',
              'headline':'Elmet signs definitive agreement to acquire ams OSRAM Schwabmuenchen tungsten and molybdenum production operations',
              'discovery_origin':'coverage_discovery_preclean_rescue_plus_web',
              'raw_preclean_source_story_id':'US_2026-09-08_C30',
              'anchor_hint':'execution_event_anchor',
              'event_stage_hint':'definitive_asset_purchase_agreement_signed',
              'source_candidate_urls':[
                'https://investors.theelmetgroup.com/sec-filings/content/0001213900-26-097862/ea0304152-8k_elmet.htm',
                'https://www.elmettechnologies.com/manufacturing/elmet-signs-agreement-to-acquire-ams-osram-schwabmunchen/'
              ],
              'stage_a_routing':'candidate_review',
              'notes':'Exact Sep9 raw preserves this only in pre-clean, not the locked 393 original membership. The Sep8 filing states a material definitive asset-purchase agreement entered Sep3 for a fully integrated German tungsten/molybdenum operation; closing expected Q1 2027. Critical-minerals lane fit and battery/ESS decision relevance remain bounded for Stage A.'
            }
          ]
          ids={x['candidate_id'] for x in cov['discovered_missing_candidates']}
          for x in rescues:
            if x['candidate_id'] not in ids:
              cov['discovered_missing_candidates'].append(x)
              ids.add(x['candidate_id'])

          np=[
            {
              'topic':'Sep7 article describing Google, Tesla, Sunrun and PG&E California SHARE VPP',
              'disposition':'not_promoted_same_event_repeat',
              'reason':'PG&E official Sep3 launch already named Tesla and Sunrun as SHARE partners and nearly 21,000 flexible devices; no new Sep7 execution anchor beyond canonical 2026-09-03_US_03.',
              'raw_preclean_source_story_id':'GL_2026-09-07_C12'
            },
            {
              'topic':'Zeekr 7X 200,000th unit production milestone',
              'disposition':'not_promoted_routine_progression',
              'reason':'Round-number single-model production milestone does not independently change market-share, capacity or battery-demand judgment; related 85kWh model update remains ordinary product progression at this gate.',
              'raw_preclean_source_story_id':'CN_2026-09-08_C16'
            }
          ]
          existing={(x.get('topic'),x.get('raw_preclean_source_story_id')) for x in cov.get('searched_not_promoted',[])}
          for x in np:
            if (x['topic'],x['raw_preclean_source_story_id']) not in existing:
              cov.setdefault('searched_not_promoted',[]).append(x)
          cov['discovered_count']=len(cov['discovered_missing_candidates'])
          cov['sep9_discovered_count']=sum(1 for x in cov['discovered_missing_candidates'] if x['candidate_id'].startswith('SEP09_'))
          cov['sep10_discovered_count']=sum(1 for x in cov['discovered_missing_candidates'] if x['candidate_id'].startswith('SEP10_'))
          cov['semantic_completeness_repair']={
            'status':'PASS',
            'date':'2026-09-11',
            'preclean_candidates_reexamined':4,
            'rescued_as_discovery':2,
            'same_event_repeat_not_promoted':1,
            'routine_progression_not_promoted':1,
            'story_id_scope':'run_local',
            'repeat_audit_ref':str(root/'semantic-repeat-map-audit-r1.json')
          }
          covp.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n')

          # Repair the governed 0.0C universe without changing the locked 393 original-input membership.
          dids={x['candidate_id'] for x in st.get('discovered_missing_candidates',[])}
          for x in rescues:
            if x['candidate_id'] not in dids:
              st['discovered_missing_candidates'].append(x)
              dids.add(x['candidate_id'])
          st['discovered_missing_candidate_count']=len(st['discovered_missing_candidates'])
          st['searched_but_no_material_event_ledger']=cov['searched_not_promoted']

          exp=st['source_universe_expansion_ledger']
          expids={x['candidate_id'] for x in exp}
          term=st['terminal_discovery_disposition_ledger']
          termids={x['candidate_id'] for x in term}
          for x in rescues:
            cid=x['candidate_id']
            if cid not in expids:
              exp.append({'candidate_id':cid,'origin':'discovered'})
              expids.add(cid)
            if cid not in termids:
              term.append({'candidate_id':cid,'disposition':'retain_for_stage_a_selector'})
              termids.add(cid)
          mustids={x['candidate_id'] for x in st.get('must_report_candidate_ledger',[])}
          for x in rescues:
            if x['candidate_id'] not in mustids:
              st.setdefault('must_report_candidate_ledger',[]).append({
                'candidate_id':x['candidate_id'],
                'reason':'Pre-clean rescue with material financing/critical-mineral execution signal requiring explicit Stage A disposition'
              })

          origids={x['candidate_id'] for x in st['original_input_ledger']}
          assert len(origids)==393
          assert not (origids & {x['candidate_id'] for x in rescues})
          assert len(expids)==len(exp)==413
          assert len(termids)==len(term)==413
          assert expids==termids
          st['schema']='stage_0_0c_coverage_discovery_v4_current_main_r3'
          st['source_universe_expansion_count']=len(exp)
          st['terminal_discovery_disposition_count']=len(term)
          st['reconciliation']={
            'original_input_identity_count':393,
            'expanded_universe_identity_count':413,
            'terminal_identity_count':413,
            'duplicate_candidate_identity_count':0,
            'unknown_terminal_identity_count':0,
            'missing_terminal_identity_count':0,
            'original_input_all_in_expansion':origids.issubset(expids),
            'exact_expanded_terminal_identity_match':expids==termids
          }
          st['semantic_completeness_audit']={
            'status':'PASS',
            'repeat_map_ref':str(root/'semantic-repeat-map-audit-r1.json'),
            'repeat_mappings_semantically_confirmed':13,
            'false_repeat_mappings':0,
            'preclean_candidates_reexamined':4,
            'preclean_rescued_discoveries':['SEP09_DISC_012','SEP09_DISC_013'],
            'preclean_not_promoted':['GL_2026-09-07_C12','CN_2026-09-08_C16'],
            'story_id_scope':'run_local'
          }
          st['residual_coverage_risks']=[]
          st['stage_a_authorized']=True
          stp.write_text(json.dumps(st,ensure_ascii=False,indent=2)+'\n')

          val={
            'schema':'stage_0_0c_validation_v2_semantic_repair',
            'status':'PASS',
            'original_input_count':393,
            'discovered_count':20,
            'expanded_count':413,
            'terminal_count':413,
            'duplicate_candidate_identity_count':0,
            'missing_terminal_identity_count':0,
            'unknown_terminal_identity_count':0,
            'mandatory_region_axes':6,
            'mandatory_topic_axes':14,
            'semantic_repeat_mapping_count':13,
            'semantic_repeat_false_mapping_count':0,
            'preclean_candidates_reexamined':4,
            'preclean_rescued_discovery_count':2,
            'preclean_not_promoted_count':2,
            'stage_a_authorized':True
          }
          valp.write_text(json.dumps(val,indent=2)+'\n')
          print(json.dumps(val))
          PY
      - name: Commit repaired artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/coverage-discovery-final.json \
                  runs/2026-09-10/sep9-r1-current-main-production-r1/stage-0-0c.json \
                  runs/2026-09-10/sep9-r1-current-main-production-r1/stage-0-0c-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair Sep9 0.0C semantic completeness'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
