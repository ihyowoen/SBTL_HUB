name: V4 unresolved lifecycle inspection

on:
  push:
    branches:
      - chatgpt/v4-preflight-20260902
    paths:
      - '.github/workflows/v4-unresolved-doc-inspection-20260902.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify locked main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9fed8c67816dc0582061438e7dba38d164648176"
      - name: Inspect unresolved documents in full
        run: |
          python3 - <<'PY'
          import json, re, subprocess, hashlib
          from pathlib import Path

          LOCKED='9fed8c67816dc0582061438e7dba38d164648176'
          PROBE=Path('runs/2026-09-02/stage_0_0d_v4_preflight_probe_20260902_MAIN_9fed8c6.json')
          OUT=Path('runs/2026-09-02/stage_0_0d_v4_unresolved_lifecycle_inspection_20260902_MAIN_9fed8c6.json')
          REG='docs/llm_prompts/v1/GOVERNANCE_LIFECYCLE_REGISTRY.json'
          MAN='docs/llm_prompts/v1/LLM_PROMPT_GITHUB_CANONICAL_V1_MANIFEST.json'

          def git_bytes(p): return subprocess.check_output(['git','show',f'{LOCKED}:{p}'])
          def git_text(p): return git_bytes(p).decode('utf-8-sig')

          probe=json.loads(PROBE.read_text(encoding='utf-8'))
          unresolved=list(probe.get('unclassified_paths',[]))
          unresolved += [p for p in probe.get('unregistered_active_looking_paths',[]) if p not in unresolved]
          registry=json.loads(git_text(REG))
          manifest=json.loads(git_text(MAN))
          required=sorted(set(registry['active_canonical'])|set(registry['active_named_prompts'])|set(registry['active_validator_contracts'])|set(registry['open_remediations'])|set(registry['activation_required_migrations']))
          runtime=[]
          cp=manifest.get('canonical_paths',{})
          for key in ('manual_direct_add_schema','manual_direct_add_validator'):
              if isinstance(cp.get(key),str): runtime.append(cp[key])
          runtime += cp.get('runtime_contract_files',[])+cp.get('validation_scripts',[])
          authority_sources=sorted(set(required)|set(runtime))
          source_text={}
          for p in authority_sources:
              try: source_text[p]=git_text(p)
              except Exception: pass

          rows=[]
          for p in unresolved:
              raw=git_bytes(p); text=raw.decode('utf-8-sig')
              headings=[]
              for i,line in enumerate(text.splitlines(),1):
                  if re.match(r'^#{1,4}\s+',line): headings.append({'line':i,'text':line[:240]})
              lifecycle_mentions=[]
              for i,line in enumerate(text.splitlines(),1):
                  if re.search(r'ACTIVE_CANONICAL|ACTIVE_VALIDATOR_CONTRACT|OPEN_REMEDIATION|ACTIVE_MIGRATION|SUPERSEDED|REFERENCE_ONLY|COMPLETED_REFERENCE|ARCHIVED',line):
                      lifecycle_mentions.append({'line':i,'text':line[:300]})
              inbound=[]
              basename=p.rsplit('/',1)[-1]
              for src,body in source_text.items():
                  exact=body.count(p)
                  base=body.count(basename)
                  if exact or base:
                      inbound.append({'source':src,'exact_path_mentions':exact,'basename_mentions':base})
              # Heuristic only; final classification requires content review.
              if p.startswith('docs/validation/'):
                  hint='REFERENCE_ONLY'
              elif p.startswith('docs/archive/'):
                  hint='ARCHIVED'
              elif p.endswith('_legacy.md') or 'legacy' in p.lower():
                  hint='SUPERSEDED'
              elif p in (
                  'docs/llm_prompts/v1/SOURCE_DIVERSITY_V10_MASTER_RULE.md',
                  'docs/llm_prompts/v1/SOURCE_DIVERSITY_V1_IB_CODEX_20260708_MASTER_RULE.md',
                  'docs/llm_prompts/v1/SEARCH_BEFORE_DELETE_OVERRIDE_MANIFEST.json'):
                  hint='SUPERSEDED'
              elif p=='docs/llm_prompts/v1/entity_alias_map.json':
                  hint='REFERENCE_ONLY'
              elif p.startswith('docs/migrations/'):
                  hint='COMPLETED_REFERENCE_OR_ACTIVE_MIGRATION_REVIEW_REQUIRED'
              else:
                  hint='REFERENCE_ONLY_OR_ACTIVE_REVIEW_REQUIRED'
              rows.append({
                  'path':p,
                  'git_blob_sha':subprocess.check_output(['git','rev-parse',f'{LOCKED}:{p}'],text=True).strip(),
                  'sha256':hashlib.sha256(raw).hexdigest(),
                  'byte_count':len(raw),
                  'line_count':len(text.splitlines()),
                  'full_read_status':'READ_FULL_LOCKED_MAIN',
                  'headings':headings[:60],
                  'lifecycle_mentions':lifecycle_mentions[:40],
                  'inbound_authority_references':inbound,
                  'opening_excerpt':text[:2200],
                  'closing_excerpt':text[-1600:],
                  'heuristic_hint_not_authoritative':hint,
              })

          result={
              'schema':'stage_0_0d_v4_unresolved_lifecycle_inspection_v1',
              'locked_main_sha':LOCKED,
              'unresolved_input_count':len(unresolved),
              'full_read_completed_count':len(rows),
              'all_full_read':len(rows)==len(unresolved),
              'authority_source_count_for_inbound_reference_scan':len(source_text),
              'documents':rows,
          }
          OUT.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'unresolved_input_count':len(unresolved),'full_read_completed_count':len(rows),'paths':[r['path'] for r in rows]},ensure_ascii=False,indent=2))
          PY
      - name: Commit inspection and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/2026-09-02/stage_0_0d_v4_unresolved_lifecycle_inspection_20260902_MAIN_9fed8c6.json
          git rm .github/workflows/v4-unresolved-doc-inspection-20260902.yml
          git commit -m "audit: inspect unresolved V4 lifecycle documents"
          git push origin HEAD:chatgpt/v4-preflight-20260902
