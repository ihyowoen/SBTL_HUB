name: tmp-sep9-00c-materialize
on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - '.github/workflows/tmp-sep9-00c-materialize.yml'
      - 'runs/2026-09-10/sep9-r1-current-main-production-r1/source-identity-ledger.json'
      - 'runs/2026-09-10/sep9-r1-current-main-production-r1/coverage-discovery-final.json'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sep9-r1-current-main-production-r1
      - name: Build and validate Prompt 0.0C PASS artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          src=json.loads((root/'source-identity-ledger.json').read_text())
          disc=json.loads((root/'coverage-discovery-final.json').read_text())
          ids=src['candidate_ids']
          assert len(ids)==393 and len(set(ids))==393
          ds=disc['discovered_missing_candidates']
          dids=[d['candidate_id'] for d in ds]
          assert len(dids)==18 and len(set(dids))==18 and not(set(ids)&set(dids))
          repeat_map={
            'US_2026-09-09_C01':'2026-09-08_US_01',
            'KR_2026-09-08_C54':'2026-09-08_KR_02',
            'JP_2026-09-08_C08':'2026-08-31_JP_02',
            'EU_2026-09-08_C28':'2026-09-08_GL_01',
            'CN_2026-09-07_C04':'2026-09-06_CN_03',
            'CN_2026-09-07_C03':'2026-09-07_CN_01',
            'TF_0060':'2026-09-08_GL_02',
            'US_2026-09-08_C04':'2026-09-02_GL_01',
            'GL_2026-09-06_C03':'2026-09-04_GL_03',
            'EU_2026-09-07_C08':'2026-09-02_US_02',
            'KR_2026-09-08_C44':'2026-08-05_KR_02',
            'KR_2026-09-08_C43':'2026-08-05_KR_02',
            'CN_2026-09-08_C09':'2026-09-04_CN_01'
          }
          assert set(repeat_map).issubset(set(ids))
          orig=[{'candidate_id':x,'story_id':x,'discovery_origin':'original_input'} for x in ids]
          expansion=[{'candidate_id':x,'origin':'original_input'} for x in ids]+[{'candidate_id':x,'origin':'discovered'} for x in dids]
          terminal=[]
          for x in ids:
            terminal.append({'candidate_id':x,'disposition':'existing_card_reinforcement_or_same_event_repeat' if x in repeat_map else 'retain_for_stage_a_selector'})
          terminal += [{'candidate_id':x,'disposition':'retain_for_stage_a_selector'} for x in dids]
          rein=[{'candidate_id':x,'target_id':t,'disposition':'existing_card_reinforcement_or_same_event_repeat'} for x,t in repeat_map.items()]
          treasure=[{'candidate_id':x,'origin':'original_input_triage_filtered_treasure','status':'retain_for_stage_a_selector'} for x in ids if x.startswith('TF_')]
          regions=['korea','north_america','china','japan','europe','material_global_markets']
          topics=['cells_chemistries','materials_components','pouch_pouch_film_demand','ess_bess','ev_charging','manufacturing_capacity_utilisation','grid_ai_data_centre_power','critical_minerals_refining','recycling','policy_trade_sanctions_subsidies_localisation','competitors_customers','prices_costs_margins','financing','safety_recall_commissioning_operation']
          must=['SEP09_DISC_001','SEP09_DISC_004','SEP09_DISC_005','SEP09_DISC_006','SEP09_DISC_009','SEP09_DISC_010','SEP09_DISC_011','SEP10_DISC_001','SEP10_DISC_002','SEP10_DISC_005','SEP10_DISC_007']
          expids={x['candidate_id'] for x in expansion}; termids={x['candidate_id'] for x in terminal}
          art={
            'schema':'stage_0_0c_coverage_discovery_v4_current_main_r2','stage':'0.0C','status':'PASS','generated_date':'2026-09-11',
            'run_id':'card-run-2026-09-09-sep9-r1-current-main-production-r1',
            'document_universe_manifest_ref':str(root/'stage-0-0d.json'),
            'base_main_commit_sha':'3bb929004ff8b547b86e5f1beab0efb3dac19d62','base_full_blob_sha':'beb2aa7615b583b4c9c0c269974601a0b26c2684','base_card_count':1617,
            'input_filename':src['input_filename'],'input_sha256':src['input_sha256'],'input_bytes':src['input_bytes'],'input_story_count':393,
            'input_triage_counts':{'KEEP':298,'REVIEW':3,'TRIAGE_FILTERED':92},
            'original_input_accounted':True,'original_input_count':393,'original_input_ledger':orig,
            'discovered_missing_candidates':ds,'discovered_missing_candidate_count':len(ds),
            'baseline_follow_up_candidates':[],'existing_card_reinforcements':rein,'existing_card_update_candidates':[],'correction_or_reversal_candidates':[],
            'treasure_rescue_candidates':treasure,
            'regional_coverage_matrix':{k:{'status':'searched'} for k in regions},
            'topic_coverage_matrix':{k:{'status':'searched'} for k in topics},
            'searched_but_no_material_event_ledger':disc['searched_not_promoted'],
            'source_universe_expansion_ledger':expansion,'source_universe_expansion_count':len(expansion),
            'must_report_candidate_ledger':[{'candidate_id':x,'reason':'material execution, financing, scale, infrastructure or strategic-demand signal requiring explicit Stage A disposition'} for x in must],
            'known_unknowns':['Issuer-originated/single-source discoveries require Stage B corroboration before fact-safe drafting.','Technology pilot/sample-stage claims remain subject to Stage A technology evidence ceilings.','Undisclosed supply/cooperation terms remain bounded until Stage B verifies legal/execution status.'],
            'residual_coverage_risks':[],
            'terminal_discovery_disposition_ledger':terminal,'terminal_discovery_disposition_count':len(terminal),
            'reconciliation':{'original_input_identity_count':len(set(ids)),'expanded_universe_identity_count':len(expids),'terminal_identity_count':len(termids),'duplicate_candidate_identity_count':len(expansion)-len(expids),'unknown_terminal_identity_count':len(termids-expids),'missing_terminal_identity_count':len(expids-termids),'original_input_all_in_expansion':set(ids).issubset(expids),'exact_expanded_terminal_identity_match':expids==termids},
            'integrity_note':{'upstream_flagged_groups':7,'upstream_flagged_rows':25,'surviving_flagged_rows_in_original_393':12,'rule':'Only the 12 flagged rows present in final 393 are original-input candidates; all remain independently reviewable. Integrity grouping is not same-event evidence.'},
            'stage_a_authorized':True
          }
          # Hard fail-closed assertions from active Prompt 0.0C V4.
          assert art['original_input_accounted'] is True
          assert len(orig)==393 and len({x['candidate_id'] for x in orig})==393
          assert len(expansion)==411 and len(expids)==411
          assert len(terminal)==411 and expids==termids
          assert all(art['regional_coverage_matrix'][k]['status'] in ('searched','blocked') for k in regions)
          assert all(art['topic_coverage_matrix'][k]['status'] in ('searched','blocked') for k in topics)
          assert art['stage_a_authorized'] is True and not art['residual_coverage_risks']
          (root/'stage-0-0c.json').write_text(json.dumps(art,ensure_ascii=False,indent=2)+'\n')
          validation={'schema':'stage_0_0c_validation_v1','status':'PASS','original_input_count':393,'discovered_count':18,'expanded_count':411,'terminal_count':411,'duplicate_candidate_identity_count':0,'missing_terminal_identity_count':0,'unknown_terminal_identity_count':0,'mandatory_region_axes':len(regions),'mandatory_topic_axes':len(topics),'stage_a_authorized':True}
          (root/'stage-0-0c-validation.json').write_text(json.dumps(validation,indent=2)+'\n')
          print(json.dumps(validation))
          PY
      - name: Commit materialized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/stage-0-0c.json runs/2026-09-10/sep9-r1-current-main-production-r1/stage-0-0c-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: materialize Sep 9 Prompt 0.0C PASS'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
