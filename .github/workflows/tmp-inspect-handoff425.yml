name: Validate and stage exact 425-event handoff

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-inspect-handoff425.yml'
      - 'runs/2026-09-02/crossrun_event_membership_425.json'
      - 'runs/2026-09-02/stage_a_event_handoff_425_20260902.json'
      - 'runs/2026-09-02/stage_a_prompt_a_results_20260831_20260901_FORMAL_V4_MAIN_df6fccc.json'

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact artifacts and materialize bounded Stage A work batches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, sys

          root=Path('runs/2026-09-02')
          membership_path=root/'crossrun_event_membership_425.json'
          handoff_path=root/'stage_a_event_handoff_425_20260902.json'
          scope_path=root/'stage_a_formal_scope_lock_425_plus_historical243_20260902.json'
          validation_path=root/'stage_a_event_handoff_425_exact_validation_20260902.json'
          work_dir=root/'.stage_a_work_425'
          formal_path=root/'stage_a_prompt_a_results_20260831_20260901_FORMAL_V4_MAIN_df6fccc.json'

          if not membership_path.exists() or not handoff_path.exists():
              print('STATUS=WAITING_FOR_FULL_425_ARTIFACTS')
              print('membership_exists=',membership_path.exists())
              print('handoff_exists=',handoff_path.exists())
              sys.exit(0)

          EXPECTED={
            'membership_sha256':'90719eb1067241df6b201c2722cca5280f89ea69d0e3fd3e7865b9e91d9e8c13',
            'handoff_sha256':'ff58d295d0d2360fdb053d18aea1921de29397f891db4d957ecf7140a49ac119',
            'event_count':425,'observation_count':632,
            'handoff_schema':'stage_a_event_handoff_425_v1',
            'run_id':'SBTL_V4_XRUN_20260831_143419__20260901_123511_R3',
            'input_20260831_sha256':'40c308cfe4ca067bb0d93a57475ee0ea359bfaf1332e895dcf35591dc6ceafb8',
            'input_20260901_sha256':'28fcb692c1782bebc06f8f8816cdee8ce3bef80f703aab7eddab4df837df3452',
            'original_event_universe_main_sha':'f2792958a85470c11030211642012865c69f56ab',
            'rebound_current_main_sha':'df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4',
            'canonical_blob_sha':'53219907cdb435c3822c41d097b23e475662aa8a',
            'canonical_card_count':1514,
          }
          def load(path):
              raw=path.read_bytes(); return raw,hashlib.sha256(raw).hexdigest(),json.loads(raw.decode('utf-8-sig'))
          def events(obj,label):
              if isinstance(obj,list): out=obj
              elif isinstance(obj,dict):
                  out=next((obj[k] for k in ('events','event_membership','items') if isinstance(obj.get(k),list)),None)
              else: out=None
              assert isinstance(out,list) and all(isinstance(x,dict) for x in out),f'{label}: no valid event list'
              return out
          def eid(e):
              v=e.get('event_id') or e.get('id'); assert isinstance(v,str) and v; return v
          def oids(e):
              for k in ('observation_ids','source_observation_ids','member_observation_ids'):
                  if isinstance(e.get(k),list): return e[k]
              raise AssertionError(f'{eid(e)}: missing observation ids')

          m_raw,m_sha,m=load(membership_path); h_raw,h_sha,h=load(handoff_path)
          assert m_sha==EXPECTED['membership_sha256'],(m_sha,EXPECTED['membership_sha256'])
          assert h_sha==EXPECTED['handoff_sha256'],(h_sha,EXPECTED['handoff_sha256'])
          assert isinstance(h,dict)
          assert h.get('schema')==EXPECTED['handoff_schema']
          assert h.get('status')=='PASS_SOURCE_BOUND_CURRENT_EVENTS'
          assert h.get('run_id')==EXPECTED['run_id']
          assert h.get('source_full_local_artifact_sha256')==m_sha
          assert h.get('source_input_sha256',{}).get('20260831')==EXPECTED['input_20260831_sha256']
          assert h.get('source_input_sha256',{}).get('20260901')==EXPECTED['input_20260901_sha256']
          assert h.get('original_event_universe_main_sha')==EXPECTED['original_event_universe_main_sha']
          assert h.get('rebound_current_main_sha')==EXPECTED['rebound_current_main_sha']
          assert h.get('canonical_blob_sha')==EXPECTED['canonical_blob_sha']
          assert h.get('canonical_card_count')==EXPECTED['canonical_card_count']
          assert h.get('event_count')==425 and h.get('observation_count')==632 and h.get('all_observations_accounted') is True
          assert h.get('document_universe_manifest_ref')=='runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_df6fccc.json'
          assert h.get('historical_terminal_reconciliation_ref')=='runs/2026-09-02/stage_0_0c_historical_carry_forward_terminal_reconciliation_20260902_R3.json'

          me,he=events(m,'membership'),events(h,'handoff')
          assert len(me)==425 and len(he)==425
          stats={}
          for label,arr in [('membership',me),('handoff',he)]:
              ids=[eid(x) for x in arr]
              assert len(ids)==len(set(ids))==425,f'{label}: event duplicate/count failure'
              assert all(re.fullmatch(r'XRUN_20260831_20260901_R3_E\d{4}',x) for x in ids)
              assert sorted(int(x.rsplit('E',1)[1]) for x in ids)==list(range(1,426))
              flat=[]
              for e in arr:
                  os=oids(e); assert os and len(os)==len(set(os)); flat.extend(os)
              assert len(flat)==len(set(flat))==632,f'{label}: observation accounting failure'
              stats[label]={'event_count':len(arr),'observation_membership_count':len(flat),'event_id_duplicate_count':0,'observation_reuse_count':0}
          mb={eid(x):x for x in me}; hb={eid(x):x for x in he}
          assert set(mb)==set(hb)
          for k in sorted(mb):
              assert oids(mb[k])==oids(hb[k]),f'{k}: observation membership changed'
              for field in ('title','date','representative_url'):
                  if field in mb[k] and field in hb[k]: assert mb[k].get(field)==hb[k].get(field),f'{k}: {field} changed'
          req={'event_id','title','date','regions','observation_ids','representative_url','representative_site','canonical_relation','canonical_top_matches','excerpt'}
          for e in he:
              assert not (req-set(e)),f'{eid(e)}: missing {sorted(req-set(e))}'
              assert isinstance(e['regions'],list) and isinstance(e['canonical_top_matches'],list)
              cr=e['canonical_relation']; assert isinstance(cr,dict) and {'relation_type','target_ids','confidence','reason'}<=set(cr) and isinstance(cr['target_ids'],list)

          hist=json.loads((root/'stage_0_0c_historical_carry_forward_terminal_reconciliation_20260902_R3.json').read_text())
          h246=hist['historical_246_accounting']; ledger=hist['terminal_historical_246_disposition_ledger']
          assert h246['input_total']==246 and h246['already_canonicalized_exact']==3
          assert h246['provenance_hold_not_stage_a_evaluable']==243 and h246['active_carry_forward_to_current_stage_a']==0
          assert h246['accounted_total']==246 and h246['accounting_pass'] is True
          assert len(ledger)==len({x['story_id'] for x in ledger})==243
          assert all(x['disposition']=='provenance_hold_not_stage_a_evaluable' and x['stage_a_eligible_current_run'] is False for x in ledger)

          validation={
            'schema':'stage_a_event_handoff_exact_validation_v1','status':'PASS_EXACT_425_HANDOFF_READY_FOR_FORMAL_STAGE_A',
            'membership':{'path':str(membership_path),'sha256':m_sha,'bytes':len(m_raw),**stats['membership']},
            'handoff':{'path':str(handoff_path),'sha256':h_sha,'bytes':len(h_raw),**stats['handoff']},
            'lossless_transfer_checks':{'event_id_sets_equal':True,'observation_membership_per_event_equal':True,'shared_identity_fields_equal_when_present':True},
            'lineage':{'run_id':EXPECTED['run_id'],'rebound_current_main_sha':EXPECTED['rebound_current_main_sha'],'canonical_blob_sha':EXPECTED['canonical_blob_sha'],'canonical_card_count':1514},
            'historical_sidecar':{'watchlist_provenance_hold_count':243,'formal_stage_a_input_count':0,'status':'PASS_SEPARATE_REOPENABLE_PROVENANCE_HOLD'},
            'formal_stage_a':{'authorized':True,'input_event_count':425,'source_observation_count':632,'selection_policy_version':'EMBEDDED_NEWS_VALUE_SELECTION_V4'}
          }
          validation_path.write_text(json.dumps(validation,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          scope=json.loads(scope_path.read_text())
          scope['status']='PASS_EXACT_HANDOFF_BOUND_FORMAL_STAGE_A_AUTHORIZED'
          scope['authorization']['formal_stage_a_authorized_now']=True
          scope['authorization']['reason']='Exact membership and compact handoff SHA/count/schema/lossless-transfer checks passed on the PR branch; current 425 events are authorized for formal V4 Stage A. Historical 243 remain a separate reopenable provenance-hold sidecar.'
          scope['authorization']['validation_ref']=str(validation_path)
          scope_path.write_text(json.dumps(scope,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          work_dir.mkdir(exist_ok=True)
          batch_size=50
          batches=[]
          for i in range(0,len(he),batch_size):
              batch=he[i:i+batch_size]; n=i//batch_size+1
              path=work_dir/f'input_batch_{n:02d}.json'
              payload={'schema':'stage_a_425_work_batch_v1','batch_number':n,'event_start':eid(batch[0]),'event_end':eid(batch[-1]),'event_count':len(batch),'events':batch}
              path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              batches.append({'batch_number':n,'path':str(path),'event_count':len(batch),'event_start':eid(batch[0]),'event_end':eid(batch[-1])})
          (work_dir/'manifest.json').write_text(json.dumps({'schema':'stage_a_425_work_manifest_v1','status':'READY_FOR_FORMAL_STAGE_A','total_events':425,'batch_size':50,'batch_count':len(batches),'batches':batches,'source_handoff_sha256':h_sha,'historical_provenance_hold_count':243},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('STATUS=PASS_EXACT_425_HANDOFF_READY_FOR_FORMAL_STAGE_A')
          print('work_batch_count=',len(batches))
          print('formal_result_target=',formal_path)
          PY

          if [ -f runs/2026-09-02/stage_a_event_handoff_425_exact_validation_20260902.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add runs/2026-09-02/stage_a_event_handoff_425_exact_validation_20260902.json \
                    runs/2026-09-02/stage_a_formal_scope_lock_425_plus_historical243_20260902.json \
                    runs/2026-09-02/.stage_a_work_425
            if ! git diff --cached --quiet; then
              git commit -m 'audit: validate and stage exact 425-event formal Stage A input'
              git push
            fi
          fi

      - name: Validate formal Stage A with production entrypoint when present
        shell: bash
        run: |
          FORMAL='runs/2026-09-02/stage_a_prompt_a_results_20260831_20260901_FORMAL_V4_MAIN_df6fccc.json'
          if [ ! -f "$FORMAL" ]; then
            echo 'STATUS=FORMAL_STAGE_A_NOT_YET_MATERIALIZED'
            exit 0
          fi
          python validation_scripts/stage_lineage_contract_check.py stage_a "$FORMAL"
