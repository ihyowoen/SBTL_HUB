name: inspect-pr297-codex-5470089474

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260829-combined18-governed-run
          fetch-depth: 0
      - name: Compact targeted inspection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          run=json.loads(Path('runs/2026-08-29/card-run.json').read_text(encoding='utf-8'))
          cards=[x['card'] for x in run['operations']['insert']]
          groups={
            'ISO':re.compile(r'ISO\s*9001|ISO\s*14001',re.I),
            'TAIWAN':re.compile(r'Taiwan|Taipei|대만|2026-08-21|August 21|8월 21',re.I),
            'US':re.compile(r'46\.4|4\.883|9\.6%|6\.7\s*GW|73%',re.I),
          }
          def simp_fs(fs,i):
            return {'i':i,'name':fs.get('source_name'),'url':fs.get('source_url') or fs.get('url'),'pub':fs.get('source_published_date'),'quote':fs.get('source_quote'),'role':fs.get('source_role'),'origin':fs.get('source_origin_type'),'contrib':fs.get('source_contribution'),'supports':fs.get('supports')}
          for label,pat in groups.items():
            hits=[c for c in cards if pat.search(json.dumps({k:c.get(k) for k in ['title','sub','fact','gate','implication','date_role']},ensure_ascii=False))]
            print('TARGET',label,'COUNT',len(hits))
            for c in hits:
              print(json.dumps({'id':c.get('id'),'spec':c.get('source_spec_id'),'title':c.get('title'),'sub':c.get('sub'),'fact':c.get('fact'),'gate':c.get('gate'),'implication':c.get('implication'),'date_role':c.get('date_role'),'fact_sources':[simp_fs(fs,i) for i,fs in enumerate(c.get('fact_sources',[])) if isinstance(fs,dict)],'claim_map':c.get('source_claim_coverage_map')},ensure_ascii=False,separators=(',',':')))
          used=[]
          split=0
          for c in cards:
            rows=c.get('source_discovery_ledger') or []
            orig=[r for r in rows if isinstance(r,dict) and r.get('outcome')=='used_in_fact_sources']
            attempt=[r for r in rows if isinstance(r,dict) and r.get('attempt_type')=='used_in_fact_sources']
            for r in orig:
              used.append({'id':c.get('id'),'spec':c.get('source_spec_id'),'keys':sorted(r.keys()),'url':r.get('url') or r.get('source_url'),'role':r.get('source_role'),'origin':r.get('source_origin_type'),'checked':r.get('checked_at'),'contrib':r.get('unique_contribution'),'fields':r.get('visible_fields_supported') or r.get('supports')})
            if orig and attempt: split+=1
          print('LEDGER_ORIGINAL_COUNT',len(used),'CARDS_WITH_SPLIT',split)
          for r in used: print('LEDGER',json.dumps(r,ensure_ascii=False,separators=(',',':')))
          multi=[]
          for c in cards:
            if c.get('source_synthesis_applied') is True:
              multi.append({'id':c.get('id'),'spec':c.get('source_spec_id'),'fields':c.get('source_synthesis_fields'),'audit':c.get('source_synthesis_audit')})
          print('MULTI_COUNT',len(multi))
          for m in multi: print('SYNTH',json.dumps(m,ensure_ascii=False,separators=(',',':')))
          PY
