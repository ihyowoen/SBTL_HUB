name: tmp-extract-a027-card

on:
  push:
    branches:
      - chatgpt/a027-evidence-inspect-work

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract card
        run: |
          python3 - <<'PY'
          import json, pathlib
          doc=json.load(open('data/cards.full.json'))
          c=next(x for x in doc['cards'] if x['id']=='2026-09-06_CN_02')
          pathlib.Path('.tmp').mkdir(exist_ok=True)
          pathlib.Path('.tmp/a027-card.json').write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/a027-card.json
          git commit -m 'chore: extract A027 card snapshot'
          git push
