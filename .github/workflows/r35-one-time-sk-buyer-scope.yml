name: R35 one-time SK On source-scope correction (NO MERGE)
on:
  push:
    branches:
      - news/r28-20261017-source-verified-lfp
    paths:
      - "scripts/.r35_temp_sk_buyer_scope_patch.mjs"
      - ".github/workflows/r35-one-time-sk-buyer-scope.yml"
permissions:
  contents: write
jobs:
  r35-frozen-scope-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Exact frozen R34 input and main baseline guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "news/r28-20261017-source-verified-lfp"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "6851fdbe4a25b30b7204d07708a1238123c14910"
          test "$(git rev-parse HEAD:data/cards.full.json)" = "1d11d87dfb56b672c8b8a23553299d6f6d71daef"
          test "$(git rev-parse HEAD:public/data/cards.json)" = "b1f0ea4154a7db72db263441374a24b5cf163d7c"
          test "$(git rev-parse HEAD:direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json)" = "43bf1a7d359f12121b7d3f99e19dc5843ad7bdf8"
      - name: Narrow unsupported buyer identity and regenerate official Lean projection
        run: node scripts/.r35_temp_sk_buyer_scope_patch.mjs
      - name: Validate exact governed direct-add and projection
        shell: bash
        run: |
          set -euo pipefail
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > "$RUNNER_TEMP/base.full.json"
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/base.full.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/base.full.json" --full data/cards.full.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Run tracked repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Self-delete temporary tooling; commit only three final governed files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r35_temp_sk_buyer_scope_patch.mjs
          rm .github/workflows/r35-one-time-sk-buyer-scope.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/r35-one-time-sk-buyer-scope.yml data/cards.full.json direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json public/data/cards.json scripts/.r35_temp_sk_buyer_scope_patch.mjs | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'BLOCK: unexpected R35 mutation scope:\n%s\n' "$actual" >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cards): R35 remove unsupported August buyer distinction in SK On card (NO MERGE)"
          git push origin HEAD:news/r28-20261017-source-verified-lfp
