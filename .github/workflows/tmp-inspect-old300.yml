name: tmp-remediate-monthly-review
on:
  push:
    branches: [chatgpt/publish-monthly-brief-2026-08]
    paths:
      - '.github/workflows/tmp-inspect-old300.yml'
  workflow_dispatch:

jobs:
  remediate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply evidence-boundary remediation
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          prov_path = Path('lib/brief/monthlyProvenance.js')
          prov = prov_path.read_text()
          parse_anchor = 'function parseSnapshot(text) {'
          helper = '''function cardTitleSupportingUrls(card) {
            const mapped = new Set();
            for (const source of Array.isArray(card?.fact_sources) ? card.fact_sources : []) {
              const supports = Array.isArray(source?.supports) ? source.supports : [];
              if (!supports.includes("title")) continue;
              for (const candidate of [source?.source_url, source?.source_url_canonical]) {
                if (typeof candidate === "string" && candidate.trim()) mapped.add(candidate.trim());
              }
            }
            if (mapped.size) return mapped;
            const primary = cardPrimaryUrl(card);
            return primary ? new Set([primary]) : new Set();
          }

          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          if parse_anchor not in prov:
              raise SystemExit('parseSnapshot anchor not found')
          if 'function cardTitleSupportingUrls(card)' not in prov:
              prov = prov.replace(parse_anchor, helper + parse_anchor, 1)

          replacements = [
              ('      const expectedUrl = cardPrimaryUrl(card);', '      const allowedTitleUrls = cardTitleSupportingUrls(card);'),
              ('      if (Object.prototype.hasOwnProperty.call(ref, "url") && ref.url !== expectedUrl) {', '      if (Object.prototype.hasOwnProperty.call(ref, "url") && !allowedTitleUrls.has(ref.url)) {'),
              ('        errors.push(`${refPath}.url: expected locked card primary URL ${JSON.stringify(expectedUrl)}, got ${JSON.stringify(ref.url)}`);', '        errors.push(`${refPath}.url: expected locked card title-supporting governed evidence URL, got ${JSON.stringify(ref.url)}`);'),
          ]
          for old, new in replacements:
              if old not in prov:
                  raise SystemExit(f'provenance anchor not found: {old}')
              prov = prov.replace(old, new, 1)
          prov_path.write_text(prov)

          test_path = Path('__tests__/monthlyBriefProvenance.test.js')
          test = test_path.read_text()
          old_a = '    { id: "AUG_A", date: "2026-08-10", title: "August A", urls: ["https://example.com/a"] },'
          new_a = '''    {
            id: "AUG_A",
            date: "2026-08-10",
            title: "August A",
            urls: ["https://example.com/a"],
            fact_sources: [
              { source_url: "https://example.com/a", supports: ["title", "fact"] },
              { source_url: "https://example.com/a-title", supports: ["title", "fact"] },
              { source_url: "https://example.com/a-context", supports: ["sub"] },
            ],
          },'''
          new_a = '\n'.join(line[8:] if line.startswith('        ') else line for line in new_a.splitlines())
          if old_a not in test:
              raise SystemExit('test snapshot anchor not found')
          test = test.replace(old_a, new_a, 1)

          insert_anchor = '  it("allows an omitted optional reference URL while still binding title and date", () => {'
          added = '''  it("accepts a governed alternate source that explicitly supports the locked card title", () => {
            const lib = library();
            lib.items[0].refs[0].url = "https://example.com/a-title";
            expect(validateMonthlyBriefProvenance(lib, resolver())).toEqual([]);
          });

          it("rejects a governed source that does not support the locked card title", () => {
            const lib = library();
            lib.items[0].refs[0].url = "https://example.com/a-context";
            const errors = validateMonthlyBriefProvenance(lib, resolver()).join("\\n");
            expect(errors).toContain("refs[0].url");
            expect(errors).toContain("title-supporting governed evidence URL");
          });

          '''
          added = '\n'.join(line[10:] if line.startswith('          ') else line for line in added.splitlines())
          if insert_anchor not in test:
              raise SystemExit('test insertion anchor not found')
          test_path.write_text(test.replace(insert_anchor, added + insert_anchor, 1))

          brief_path = Path('public/data/monthly_briefs.json')
          brief = json.loads(brief_path.read_text())
          item = next((x for x in brief['items'] if x.get('id') == 'monthly-brief-2026-08-r1'), None)
          if not item:
              raise SystemExit('monthly brief issue not found')
          item['what_changed'] = '8월에는 ‘EV 둔화와 ESS 성장’만으로는 산업 변화를 설명하기 어려워졌다. EV 배터리 수요도 성장하고 있지만, ESS 관련 수요와 투자는 장기계약·은행금융·착공·상업운전으로 이어졌고 생산 측에서는 공장 생산개시와 제품 믹스 계획이 확인됐다. 따라서 앞으로는 단순 출하량보다 COD·가동률·장기계약 집행·현지조달 적격성·세후 원가와 수익성을 함께 봐야 한다.'
          old300 = next((r for r in item['refs'] if r.get('id') == '2026-08-05_US_03'), None)
          if not old300:
              raise SystemExit('Old 300 ref not found')
          old300['url'] = 'https://www.pv-magazine.com/2026/08/06/orsted-turns-on-500-mwh-battery-project-with-co-located-solar-in-texas/'
          brief_path.write_text(json.dumps(brief, ensure_ascii=False, indent=2) + '\n')

          audit_path = Path('runs/2026-09-09/monthly-brief-2026-08-editorial-audit.json')
          audit = json.loads(audit_path.read_text())
          audit['qc']['review_remediation'] = 'PASS — Lansing production start is separated from planned product mix; `what_changed` distinguishes ESS contract/finance/construction/COD execution from production-start/product-mix planning; black-mass wording is narrowed to the governed one-year export restriction; Old 300 public citation is bound to the governed pv magazine source that explicitly supports the title/commercial-operation claim; the Jianxiawo post-month-enriched ref is removed from official August evidence; non-canonical EU liquidity counterevidence carries source provenance; the September China approval-pause signal is bound to canonical card 2026-09-06_CN_02.'
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Targeted provenance tests
        run: npx vitest run __tests__/monthlyBriefProvenance.test.js
      - name: Validate official Monthly Brief library
        run: npm run validate:monthly-briefs
      - name: Full unit suite
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/brief/monthlyProvenance.js __tests__/monthlyBriefProvenance.test.js public/data/monthly_briefs.json runs/2026-09-09/monthly-brief-2026-08-editorial-audit.json
          git diff --cached --check
          git commit -m "fix: bind Monthly Brief claims to governed evidence"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-08
