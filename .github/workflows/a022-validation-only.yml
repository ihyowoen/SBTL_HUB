name: A022 validation only

on:
  push:
    branches:
      - agent/a022-supplemental-earnings-validator

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validators
        run: python -m compileall -q validation_scripts
      - name: A022 targeted supplemental closure
        run: python -m unittest validation_scripts.tests.test_a022_supplemental_earnings_closure_fixture -v
      - name: Verify canonical V3 contract alignment
        run: python validation_scripts/v3_contract_drift_check.py
      - name: Verify generated V3 stage contracts
        run: python validation_scripts/v3_stage_contracts.py --check
      - name: Verify V3 stage contract flow
        run: python validation_scripts/v3_stage_contract_flow_check.py --check
      - name: Run repository validation suite
        run: python -m unittest discover -s validation_scripts/tests -v
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
