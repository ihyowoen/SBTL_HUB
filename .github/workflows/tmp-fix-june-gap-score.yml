name: tmp-fix-june-gap-score
on:
  push:
    branches: [chatgpt/june-2026-gap-direct-add]
permissions:
  contents: write
jobs:
  fix-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Kansai score and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-june-gap-direct-add.yml')
          s = p.read_text(encoding='utf-8')
          old = "score:62,breakdown:{market_structure_competition:22,supply_demand_price_utilisation:18"
          new = "score:60,breakdown:{market_structure_competition:22,supply_demand_price_utilisation:18"
          if old not in s:
              raise SystemExit('target score pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-fix-june-gap-score.yml
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add .github/workflows/tmp-june-gap-direct-add.yml .github/workflows/tmp-fix-june-gap-score.yml
          git commit -m "fix: reconcile June gap direct-add score"
          git push origin HEAD:chatgpt/june-2026-gap-direct-add
