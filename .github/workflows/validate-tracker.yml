name: validate-tracker

# Gates any change to tracker data / region policy. Blocks merge on structural errors
# (dup id, bad status/region, banned emoji, dangling canonicalId, broken JSON).
# Migration WARNINGs (missing effectiveDate / instrumentType / accessedDate) do NOT block.
#
# validate2.mjs 게이트: v2 검사(verify↔원장 대조·coverage↔트래커 ID 동기·meta.totalItems·
# dt D-day 스테일·region_policy 스키마·스윕 근거 대조)를 CI에서 강제한다. 종전에는 수동
# 실행 전용이라 사람이 잊으면 무검사 통과였다. ops/** 를 paths 에 넣어 원장·coverage 변경도
# CI를 트리거한다.
#
# cards.json 게이트(validate_cards.mjs): 카드 PR이 무검사로 머지되던 위장 통과를
# 차단한다 — 파싱·크기 하한·수량 감소·중복 id·필수 필드·깨진 related(신규 무관용,
# 레거시 동결)·id접두↔date. fetch-depth 0은 origin/main 기준본 비교(수량 감소·신규
# 카드 판별)에 필요하다.

on:
  pull_request:
    paths:
      - "public/data/**"
      - "ops/**"
      - "data/cards.full.json"
      - "direct-adds/**/direct-add.json"
      - "scripts/validate.mjs"
      - "scripts/validate_cards.mjs"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/validate-tracker.yml"
  push:
    branches: [main]
    paths:
      - "public/data/**"
      - "ops/**"
      - "data/cards.full.json"
      - "scripts/validate.mjs"
      - "scripts/validate_cards.mjs"
      - "scripts/lean_cards.mjs"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve declared direct-add ID migration
        id: direct_add
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --force
          mapfile -t manifests < <(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(glob)direct-adds/**/direct-add.json')
          [[ ${#manifests[@]} -le 1 ]] || { echo "FAIL: more than one direct-add manifest" >&2; exit 1; }
          allow_delete=0
          if [[ ${#manifests[@]} -eq 1 ]]; then
            test -f "${manifests[0]}"
            migration_count="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.operations?.id_migration||[]).length))' "${manifests[0]}")"
            [[ "$migration_count" -eq 0 ]] || allow_delete=1
          fi
          echo "allow_delete=$allow_delete" >> "$GITHUB_OUTPUT"
      - name: Validate tracker data
        run: node scripts/validate.mjs
      # v2 게이트 — 운영 규약은 validate.mjs 와 validate2.mjs 둘 다 ERROR 0을 요구하지만
      # 지금까지 CI가 v2를 돌리지 않아 수동 실행에 의존했다(사람이 잊으면 무검사 통과).
      # PR이 원장(ops/runs/*.json)을 건드리면 그중 date 가 가장 최신인 원장을 넘긴다 —
      # 원장을 넘겨야 verify↔원장 대조(#6)와 스윕 근거 대조(#13)가 작동한다.
      - name: Validate tracker data (v2)
        shell: bash
        env:
          RP_PATH: public/data/region_policy.json
          COV_PATH: ops/coverage.json
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          LEDGER=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --force
            mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(glob)ops/runs/*.json' || true)
            if [[ ${#changed[@]} -gt 0 ]]; then
              LEDGER="$(node -e '
                const fs=require("fs");
                const fl=process.argv.slice(1).filter(f=>fs.existsSync(f));
                let best=null;
                for (const f of fl){ try{ const d=JSON.parse(fs.readFileSync(f,"utf8")).date; if(d&&(!best||d>best.d)) best={f,d}; }catch(e){} }
                process.stdout.write(best?best.f:"");
              ' "${changed[@]}")"
            fi
          fi
          if [[ -n "$LEDGER" ]]; then
            echo "validate2 — 원장 대조: $LEDGER"
            node ops/validate2.mjs public/data/tracker_data.json "$LEDGER"
          else
            # 원장이 안 바뀌었는데 tracker 의 verify 스탬프가 바뀌었다면, 원장 없이 통과시키면
            # 검사 #6(verify↔원장 대조)과 #13(스윕 근거)이 둘 다 꺼진다 — 근거 없는 검증 표기가
            # 그대로 머지된다. 이 조합을 실패로 만든다.
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              if git diff -U0 "origin/$BASE_REF...HEAD" -- public/data/tracker_data.json \
                   | grep -E '^\+.*"(verify|lastChecked)"' >/dev/null 2>&1; then
                echo "FAIL: tracker 의 verify/lastChecked 가 변경됐는데 ops/runs/*.json 원장이 없다." >&2
                echo "      원장 없이는 검사 #6·#13이 꺼져 근거 없는 검증 표기가 통과한다." >&2
                echo "      해당 run 의 원장을 같은 PR 에 착지시킬 것(F13)." >&2
                exit 1
              fi
            fi
            echo "validate2 — 원장 미변경·verify 스탬프 변경 없음, 구조 검사만"
            node ops/validate2.mjs public/data/tracker_data.json
          fi
      - name: Validate cards data
        env:
          CARDS_ALLOW_DELETE: ${{ steps.direct_add.outputs.allow_delete || '0' }}
        run: node scripts/validate_cards.mjs
      # 정본 아카이브도 같은 게이트로 — 감사 원천이 깨진 채 머지되는 것을 막는다
      - name: Validate full archive
        env:
          CARDS_ALLOW_DELETE: ${{ steps.direct_add.outputs.allow_delete || '0' }}
        run: test ! -f data/cards.full.json || node scripts/validate_cards.mjs data/cards.full.json
      # 발행본 ≡ 아카이브 사영 검증 — 여분 필드·값 괴리·id 집합 불일치 전부 실패.
      # 사람이 병합 스크립트 실행을 잊는 지점이라 기계가 지킨다
      - name: Check lean payload matches archive
        run: node scripts/lean_cards.mjs --check
