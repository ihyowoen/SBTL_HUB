name: fix-vol-strategic-selector-once

on:
  push:
    branches:
      - chatgpt/fix-vol-strategic-selector-20260908
    paths:
      - "scripts/fix_vol_strategic_selector.mjs"
      - ".github/workflows/fix-vol-strategic-selector-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[vol-selector-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-vol-strategic-selector-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply VOL selector patch
        run: node scripts/fix_vol_strategic_selector.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/chat/appCommand.js __tests__/strategicBriefEditionCommand.test.js
          git commit -m "Fix VOL Strategic Brief selector whitespace [vol-selector-fixed]"
          git push origin HEAD:chatgpt/fix-vol-strategic-selector-20260908
