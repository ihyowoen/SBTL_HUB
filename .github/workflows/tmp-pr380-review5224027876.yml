name: tmp-pr380-review5224027876
on:
  push:
    branches: [chatgpt/rebuild-monthly-brief-2026-06]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Patch review 5224027876
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pubPath = 'public/data/monthly_briefs.json';
          const auditPath = 'runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json';
          const pub = JSON.parse(fs.readFileSync(pubPath,'utf8'));
          const audit = JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const issue = pub.items.find(x => x.month === '2026-06');
          if (!issue) throw new Error('June issue missing');

          // Flow 02: preserve May FERMA award stage; June is design/policy differentiation, not deeper execution.
          issue.what_changed = issue.what_changed.replace(
            '장주기 정책에서는 5월 조달 신호가 6월 영국 Ofgem의 LDES 16개 프로젝트 잠정선정으로 구체화됐고, 이와 별개로 EU 17개국의 비구속 저장 배치 공약은 LDES로 한정되지 않은 기술중립적 일반 저장정책 신호로 추가됐다.',
            '장주기 정책에서는 5월에도 8시간 요건의 FERMA 6개 프로젝트 5.336GWh award가 이미 있었으므로, 6월 영국 Ofgem의 LDES 16개 프로젝트 잠정선정을 더 높은 실행단계로 보지 않는다. 대신 영국 cap-and-floor 방식과 기술구성의 차이, 그리고 EU 17개국의 비구속·기술중립 저장 배치 공약이 추가되며 정책설계가 더 다양해진 것으로 본다.'
          );
          const f2 = issue.key_flows.find(x => x.id === '02');
          f2.title = '저장 수요, 5월부터 있던 장주기 조달이 6월 정책설계·저장시간 축으로 더 분화';
          f2.summary = '5월에는 8시간 요건의 FERMA 6개 프로젝트 5.336GWh award와 AI 연계 ESS 계약이 이미 등장했다. 따라서 6월 영국 Ofgem의 LDES 16개 프로젝트 잠정선정을 5월보다 더 높은 집행단계로 보지 않는다. 6월의 변화는 글로벌 리튬이온 ESS 1분기 출하 195.5GWh(+78%)가 이어지는 가운데 영국 cap-and-floor 방식의 LDES 잠정선정, EU 17개국의 비구속·기술중립 저장 배치 공약, 일본의 축전지·전원 산업전략처럼 저장시간과 정책·전력시스템 설계가 더 다양한 형태로 나타난 데 있다. T1 Energy의 KORE Power 인수 본계약은 BESS·AI 데이터센터 인프라 진입을 추진하는 사례지만, AI 축은 5월 대형 공급계약보다 더 깊은 실행단계라기보다 선택적 수요축의 연속·확장으로 본다.';

          // Watch: CO2 is May->June contract-stage advance; iron-air alone is June-only.
          issue.watch[2] = '5월부터 계약·양산계획·가동 신호가 있었던 나트륨이온은 6월 제품별 인도 일정이 실제 납품·양산으로 이어지는지 보고, 전고체는 실차시험 이후 검증단계를 추적한다. CO₂ 저장은 5월 상용화 경로 논의에서 6월 장기 tolling·상업계약으로 진전된 만큼 착공·납품·COD 전환을 확인하고, 철공기는 6월 신규 1GWh 계약이 실제 실행으로 이어지는지 별도로 추적한다.';

          // Audit deep dive: AI continuation/broadening, not deeper execution.
          audit.independent_external_deep_dive.editorial_effect = 'The external June sweep remains additive to the chronological May→June comparison. It strengthens the evidence that May bankability signals developed into more differentiated revenue-contract structures in June, while LDES policy architecture diversified across jurisdictions and the AI/data-center axis continued or broadened rather than moving to a demonstrably deeper execution stage. Recycled-material certification operationalizes a May circularity direction, and Ford-CATL production-intent test cells provide an execution/validation example of the technology-transfer/localization axis already present in May. It does not make AI a new or singular June master narrative.';

          // Flow 02 audit classification synchronized.
          const sf2 = audit.selected_flows.find(x => x.id === '02');
          sf2.title = f2.title;
          sf2.delta_classification = 'POLICY_DESIGN_DIFFERENTIATED_WITH_CONTINUING_DEMAND';
          const d2 = audit.delta_classification.find(x => x.flow_id === '02');
          d2.classification = 'POLICY_DESIGN_DIFFERENTIATED_WITH_CONTINUING_DEMAND';
          d2.may_state = 'Long-duration procurement and AI-linked ESS demand were already concrete in May, including six FERMA awards totaling 5.336GWh with an eight-hour requirement and large AI/hyperscale-linked storage supply contracts.';
          d2.june_change = 'June does not represent a later execution stage merely because Ofgem provisionally selected 16 LDES projects. Instead, UK cap-and-floor design, a different technology mix, non-binding EU deployment pledges and Japan power-system strategy diversify the policy architecture, while AI/data-center demand remains a continuing/broadening selective axis.';

          // Add FERMA award specificity to previous-month baseline if present.
          const demandBaseline = audit.previous_month_baseline.baseline_state.find(x => /LDES|AI/.test(x.theme));
          if (demandBaseline) {
            demandBaseline.finding = 'May already contained concrete long-duration procurement and AI-linked ESS demand: six FERMA projects totaling 5.336GWh were awarded with an eight-hour requirement, while DTE/Oracle and Prevalon provided large AI/hyperscale-linked storage demand signals. June should therefore be read as policy-design diversification and continuation/broadening, not a simple execution-stage deepening.';
            if (!demandBaseline.evidence_card_ids.includes('2026-05-29_GL_07')) demandBaseline.evidence_card_ids.push('2026-05-29_GL_07');
          }

          // Flow 05: preserve proposal/review status of May EU IAA localization conditions.
          const d5 = audit.delta_classification.find(x => x.flow_id === '05');
          d5.may_state = 'Localization already included production-footprint/supply-chain themes, recycled-material production/use certification and lifecycle tracking. EU foreign-investment conditions mentioning joint ventures and technology transfer were Commission proposals under Parliament/Council review rather than operative rules.';
          d5.june_change = 'Korea certification piloting and Japan passport real-data validation operationalize existing circularity/traceability directions; Ford production-intent test cells show an existing CATL technology-licensing structure being applied in manufacturing validation. June is operationalization of existing localization axes, while the May EU technology-transfer condition remains proposal-stage context rather than an operative framework.';

          audit.codex_review_5224027876_remediation = {
            reviewed_head: 'b71cdd4e113c94db1d940ad78130263e47ca7b67',
            findings_addressed: [
              'watch_preserves_co2_may_to_june_contract_stage_advance_vs_iron_air_june_only_split',
              'flow05_audit_preserves_may_eu_iaa_proposal_under_parliament_council_review_stage',
              'flow02_reclassified_from_deepening_to_policy_design_differentiation_given_may_ferma_awards',
              'ai_axis_reclassified_from_deepening_to_continuation_broadening'
            ]
          };

          // Assertions against the exact concerns.
          if (!issue.watch[2].includes('CO₂ 저장은 5월') || !issue.watch[2].includes('철공기는 6월 신규')) throw new Error('watch split assertion failed');
          if (!f2.summary.includes('더 높은 집행단계로 보지 않는다')) throw new Error('Flow02 stage assertion failed');
          if (!d5.may_state.includes('Commission proposals under Parliament/Council review')) throw new Error('Flow05 proposal-stage assertion failed');
          if (/AI signals deepened|AI.*deepened/.test(audit.independent_external_deep_dive.editorial_effect)) throw new Error('AI deepening residue');

          fs.writeFileSync(pubPath, JSON.stringify(pub,null,2)+'\n');
          fs.writeFileSync(auditPath, JSON.stringify(audit,null,2)+'\n');
          NODE
      - name: Validate all
        shell: bash
        run: |
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const pub = JSON.parse(fs.readFileSync('public/data/monthly_briefs.json','utf8'));
          const audit = JSON.parse(fs.readFileSync('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json','utf8'));
          const issue = pub.items.find(x => x.month === '2026-06');
          const f2 = issue.key_flows.find(x => x.id === '02');
          const d2 = audit.delta_classification.find(x => x.flow_id === '02');
          const d5 = audit.delta_classification.find(x => x.flow_id === '05');
          if (d2.classification !== 'POLICY_DESIGN_DIFFERENTIATED_WITH_CONTINUING_DEMAND') throw new Error('Flow02 classification mismatch');
          if (!f2.summary.includes('FERMA')) throw new Error('Flow02 May FERMA evidence missing');
          if (!d5.may_state.includes('Commission proposals under Parliament/Council review')) throw new Error('Flow05 proposal stage missing');
          console.log('review 5224027876 assertions PASS');
          NODE
      - name: Commit remediation and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-pr380-review5224027876.yml
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git commit -m 'fix: align June brief chronology after Codex review 5224027876'
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
