name: PR301 R3 materializer

on:
  push:
    branches:
      - chatgpt/20260831-preflight-reconciliation-r2
    paths:
      - ".github/workflows/pr301-r3-fix.yml"

permissions:
  contents: write

jobs:
  materialize-r3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260831-preflight-reconciliation-r2
          fetch-depth: 0
      - name: Materialize byte-verified R3 and remove temporary workflow
        shell: bash
        env:
          P0: ''
          P1: ''
          P2: ''
          P3: ''
        run: |
          set -euo pipefail
          R2='runs/2026-08-31/stage_0_0d_document_universe_20260901_CURRENT_MAIN_1514_PREFLIGHT_RECONCILIATION_R2.json'
          R3='runs/2026-08-31/stage_0_0d_document_universe_20260901_CURRENT_MAIN_1514_PREFLIGHT_RECONCILIATION_R3.json'
          B64="${P0}${P1}${P2}${P3}"
          test "${#B64}" -eq 13876
          test "$(printf '%s' "$B64" | sha256sum | awk '{print $1}')" = 'cf6aaec7825e205be56d84661c7d2fba0472bd6a5a72fbcdff06e5b412813fe6'
          printf '%s' "$B64" | base64 -d > /tmp/r3.json.gz
          test "$(sha256sum /tmp/r3.json.gz | awk '{print $1}')" = 'd76a214ebbf33f79bf045278f1bb3e4dffac349ccec23d7a0012398b33e56725'
          gzip -dc /tmp/r3.json.gz > "$R3"
          test "$(wc -c < "$R3")" -eq 102499
          test "$(git hash-object "$R3")" = '0edb7d1ef9719dec3b9afa4a9bca0ec3ac85f2f3'
          python - <<'PY'
          import json
          from collections import Counter
          p='runs/2026-08-31/stage_0_0d_document_universe_20260901_CURRENT_MAIN_1514_PREFLIGHT_RECONCILIATION_R3.json'
          d=json.load(open(p))
          assert len(d['documents'])==88
          assert sum(x['read_status']=='READ_FULL_CURRENT_HEAD' for x in d['documents'])==5
          assert sum(x['read_status']=='UNREAD_CURRENT_RUN' for x in d['documents'])==83
          assert len({tuple(x.keys()) for x in d['documents']})==1
          assert len(d['governed_external_inventory'])==5
          expected={
            '.github/workflows/apply-card-run.yml':'8cfca96d1307044d273c87472c559af1226a6417',
            '.github/workflows/lean-cards.yml':'1f6a4e0d13df4c69cabcc727ea5b7702fa60be84',
            '.github/workflows/legacy-related-lineage-migration.yml':'fbe1652d097d47500e4758988b2cbdac608311ec',
            '.github/workflows/validate-tracker.yml':'c288682f0468e67058d4b01883e67892afa3772d',
            '.github/workflows/workflow-contract-validation.yml':'c035eece6001169e80ab57ff1ccef00f529db93a'}
          assert {x['path']:x['git_blob_sha'] for x in d['governed_external_inventory']}==expected
          assert len(d['unresolved_dependencies'])==25
          dep={x['dependency_path'] or x['dependency_family'] for x in d['unresolved_dependencies']}
          miss=[x['path'] for x in d['incomplete_universe_defects'] if x['type']=='MISSING_DEPENDENCY']
          assert len(dep)==25 and set(miss)==dep and len(miss)==25
          assert Counter(x['type'] for x in d['incomplete_universe_defects'])==Counter({'MISSING_DEPENDENCY':25,'UNREAD_DOCUMENT':1,'UNCLASSIFIED_DOCUMENT':1,'MISSING_COMPONENT':1,'UNCHECKED_OPEN_REMEDIATION':1})
          r=d['unchecked_open_remediations'][0]
          assert (r['review_verified_status'],r['affected_card_count'],r['dangling_edge_count'])==('LEGACY_REMEDIATION_REQUIRED',13,14)
          assert d['status']=='BLOCKED_DOCUMENT_UNIVERSE_INCOMPLETE' and d['document_universe_status']=='FAIL' and d['stage_0_0c_authorized'] is False
          pol=next(x for x in d['documents'] if x['path']=='docs/DOCUMENT_UNIVERSE_POLICY.md')
          evidence={e['rule_id']:e['evidence'] for e in pol['rule_evidence']}
          assert '132-150' in evidence['DU-POLICY-DEFECT-NORMALIZATION']
          PY
          git rm "$R2"
          git rm .github/workflows/pr301-r3-fix.yml
          git add "$R3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Address Codex Stage 0.0D inventory review'
          git push origin HEAD:chatgpt/20260831-preflight-reconciliation-r2
