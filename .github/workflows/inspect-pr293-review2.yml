name: Address PR293 second Codex review

on:
  push:
    branches:
      - chatgpt/pr289-review-remediation-1496
    paths:
      - .github/workflows/inspect-pr293-review2.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/pr289-review-remediation-1496
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply second-review corrections on exact baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3732ad9460b44329f0856591c29f166a39ebf5f8"
          test "$(git rev-parse 3732ad9460b44329f0856591c29f166a39ebf5f8:data/cards.full.json)" = "3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f"
          git show origin/main:data/cards.full.json > /tmp/base.cards.full.json
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          p=Path('data/cards.full.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          by={c['id']:c for c in d['cards']}
          m=json.load(open('direct-adds/pr289-review-remediation-1496/direct-add.json',encoding='utf-8'))
          target_ids=m['operations']['update']
          assert len(target_ids)==25 and len(d['cards'])==1496

          def host(url):
              return (urlparse(str(url)).hostname or '').lower()

          # P2-1: SK second source is corroborative only; do not claim a multi-source
          # pass without a distinct synthesized visible-field contribution.
          sk=by['2026-08-25_KR_01']
          prim=[s for s in sk.get('fact_sources',[]) if s.get('source_role')=='primary_event_evidence' and 'skinnovation.com' in host(s.get('source_url'))]
          sec=[s for s in sk.get('fact_sources',[]) if 'seoul.co.kr' in host(s.get('source_url'))]
          assert len(prim)==1 and len(sec)==1
          primary=prim[0]
          primary_url=primary['source_url']
          seoul_url=sec[0]['source_url']

          sk['fact_sources']=[primary]
          sk['urls']=[primary_url]
          sk['source_evidence_entry_count']=1
          sk['source_unique_url_count']=1
          sk['source_unique_domain_count']=1
          sk['source_independent_owner_count']=1
          sk['source_diversity_status']='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION'
          sk['single_source_exception']={
              'allowed': True,
              'reason': 'The durable item-specific SK Innovation shareholder merger notice is the authoritative primary event source; the checked Seoul report only corroborates the already-visible merger event and adds no distinct visible-field contribution.',
              'mitigation': 'Visible claims remain bounded to the official SK Innovation notice. The Seoul article is retained in the discovery ledger as corroboration but is not counted as visible evidence or multi-source synthesis.'
          }
          sk['source_diversity_roles']={
              'primary_event_evidence': True,
              'independent_event_confirmation': False,
              'policy_market_context': False,
          }
          sk['source_synthesis_applied']=False
          sk['source_synthesis_fields']=[]
          sk['source_synthesis_audit']=[{
              'source_domain': host(primary_url),
              'source_role': primary.get('source_role') or primary.get('evidence_role'),
              'unique_contribution': primary.get('source_contribution') or primary.get('claim') or '',
              'affected_visible_fields': [],
          }]

          found_primary_ledger=False
          found_seoul_ledger=False
          for row in sk.get('source_discovery_ledger') or []:
              h=host(row.get('source_url'))
              if 'skinnovation.com' in h and row.get('outcome')=='used_in_fact_sources':
                  found_primary_ledger=True
                  row['visible_supports']=list(primary.get('supports') or [])
              elif 'seoul.co.kr' in h:
                  found_seoul_ledger=True
                  row['outcome']='reviewed_not_used_for_visible_synthesis'
                  row['unique_contribution']='Corroborates the merger event but adds no distinct visible-field contribution beyond the official SK Innovation notice.'
                  row['visible_supports']=[]
                  row['reason']='Retained as checked corroboration; excluded from visible-source diversity because it does not add a distinct synthesized claim.'
          assert found_primary_ledger and found_seoul_ledger

          res=sk['source_url_resolution']
          entries=[e for e in res.get('resolution_entries',[]) if 'skinnovation.com' in host(e.get('source_url'))]
          assert len(entries)==1
          entries[0]['source_url_propagation_performed']=True
          res['resolution_entries']=entries
          res['supporting_fact_source_count']=1
          res['source_url_propagation_performed']=True
          res['canonical_complete']=True
          res['resolved_article_matches_quote']=True

          # P2-2: source_synthesis_audit must describe only fields actually synthesized.
          synth_ids=['2026-08-25_US_01','2026-08-24_US_01','2026-08-21_GL_02','2026-08-21_EU_01']
          for cid in synth_ids:
              c=by[cid]
              assert c.get('source_synthesis_applied') is True
              fields=list(c.get('source_synthesis_fields') or [])
              assert fields==['fact','gate'], (cid,fields)
              by_host={host(s.get('source_url')):s for s in c.get('fact_sources') or []}
              for a in c.get('source_synthesis_audit') or []:
                  s=by_host.get(str(a.get('source_domain','')).lower())
                  assert s is not None,(cid,a)
                  supports=set(s.get('supports') or [])
                  a['affected_visible_fields']=[f for f in fields if f in supports]
                  assert set(a['affected_visible_fields']).issubset(set(fields))

          # Closure assertions for the two fresh review findings.
          assert sk['source_diversity_status']=='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION'
          assert sk['single_source_exception']['allowed'] is True
          assert len(sk['fact_sources'])==1 and sk['urls']==[primary_url]
          assert sk['source_evidence_entry_count']==sk['source_unique_url_count']==sk['source_unique_domain_count']==sk['source_independent_owner_count']==1
          assert sk['source_synthesis_applied'] is False and sk['source_synthesis_fields']==[]
          assert sk['source_synthesis_audit'][0]['affected_visible_fields']==[]
          assert sk['source_diversity_roles']['independent_event_confirmation'] is False
          assert all('seoul.co.kr' not in host(s.get('source_url')) for s in sk['fact_sources'])
          assert all('seoul.co.kr' not in host(e.get('source_url')) for e in sk['source_url_resolution']['resolution_entries'])
          assert any('seoul.co.kr' in host(r.get('source_url')) and r.get('outcome')!='used_in_fact_sources' and not r.get('visible_supports') for r in sk['source_discovery_ledger'])
          for cid in synth_ids:
              c=by[cid]
              fields=set(c['source_synthesis_fields'])
              assert all(set(a.get('affected_visible_fields') or []).issubset(fields) for a in c['source_synthesis_audit'])

          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/ids.json').write_text(json.dumps({'ids':target_ids}),encoding='utf-8')
          PY
          node scripts/lean_cards.mjs

      - name: Re-run bounded governance gates
        shell: bash
        run: |
          set -euo pipefail
          M=direct-adds/pr289-review-remediation-1496/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest "$M" --base /tmp/base.cards.full.json --full data/cards.full.json
          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file /tmp/ids.json
          python validation_scripts/evidence_qc_v8_check.py data/cards.full.json --new-id-file /tmp/ids.json
          python validation_scripts/related_lifecycle_check.py data/cards.full.json --require-contract --new-id-file /tmp/ids.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Remove temporary workflow and commit exact three-file shape
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspect-pr293-review2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Address PR293 second Codex review findings"
          python - <<'PY'
          import subprocess
          expected={'data/cards.full.json','public/data/cards.json','direct-adds/pr289-review-remediation-1496/direct-add.json'}
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PY
          git push origin HEAD:chatgpt/pr289-review-remediation-1496
