name: Patch Final QC current-run scope

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_structural_v3_scope_final_qc.py
      - .github/workflows/patch-final-qc-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_structural_v3_scope_final_qc.py
      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest validation_scripts.tests.test_workflow_contracts validation_scripts.tests.test_review_4839991362_contracts
      - name: Verify overlays
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope Final QC strict lifecycle validation"
          git push origin HEAD:agent/structural-news-value-v3
