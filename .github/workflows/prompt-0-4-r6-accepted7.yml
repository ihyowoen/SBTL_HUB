name: Prompt 0.4 R6 Accepted 7

on:
  push:
    branches:
      - chatgpt/recover-exact-425-artifacts-20260903
    paths:
      - '.tmp/prompt-0-4-r6-accepted7/TRIGGER'

permissions:
  contents: write

jobs:
  prompt-0-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert current main baseline has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4"
          test "$(git rev-parse origin/main:data/cards.full.json)" = "53219907cdb435c3822c41d097b23e475662aa8a"
      - name: Run current-baseline addability revalidation
        run: python3 scripts/prompt_0_4_r6_accepted7.py
      - name: Commit validated 0.4 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-03/prompt_0_4_r6_accepted7_20260903_R1.json \
                  runs/2026-09-03/prompt_0_4_r6_accepted7_validation_20260903_R1.json
          git rm -r .tmp/prompt-0-4-r6-accepted7
          git commit -m 'audit: Prompt 0.4 R6 accepted7 baseline revalidation'
          git push
