name: audit-legacy-related

on:
  push:
    branches:
      - agent/audit-legacy-related-20260808
    paths:
      - .github/workflows/audit-legacy-related.yml
      - data/cards.full.json
      - docs/remediation/RELATED_LEGACY_DANGLING_MANIFEST_20260723.json

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit canonical Related containers and dangling edges
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const canonical = JSON.parse(fs.readFileSync('data/cards.full.json','utf8').replace(/^\uFEFF/,''));
          const cards = canonical.cards || [];
          const ids = new Set(cards.map(c => c && c.id).filter(Boolean));
          const oldManifestPath = 'docs/remediation/RELATED_LEGACY_DANGLING_MANIFEST_20260723.json';
          const oldManifest = fs.existsSync(oldManifestPath)
            ? JSON.parse(fs.readFileSync(oldManifestPath,'utf8').replace(/^\uFEFF/,''))
            : {items:[]};

          const out = {
            canonical_total_declared: canonical.total,
            canonical_cards_count: cards.length,
            cards_with_related_array: 0,
            cards_missing_related_array: 0,
            cards_with_related_edges: 0,
            cards_with_related_lineage_object: 0,
            cards_missing_related_lineage_object: 0,
            cards_with_valid_lineage_related_ids_array: 0,
            cards_missing_or_malformed_lineage_related_ids: 0,
            cards_fully_initialized_for_related_add: 0,
            cards_not_initialized_for_related_add: 0,
            cards_with_related_edges_but_missing_valid_lineage: 0,
            cards_with_top_level_related_ids: 0,
            related_edge_count: 0,
            lineage_edge_count: 0,
            dangling_related_edge_count: 0,
            dangling_lineage_edge_count: 0,
            self_related_edge_count: 0,
            duplicate_related_edge_count: 0,
            related_vs_lineage_set_mismatch_card_count: 0,
            old_manifest_affected_card_count: oldManifest.affected_card_count ?? null,
            old_manifest_dangling_edge_count: oldManifest.dangling_edge_count ?? null,
            old_manifest_items_present_now: 0,
            old_manifest_items_still_dangling_now: 0,
            old_manifest_items_resolved_now: 0,
            defect_ids: {
              missing_related_array: [],
              missing_or_malformed_lineage: [],
              related_edges_missing_valid_lineage: [],
              dangling_related_edges: [],
              dangling_lineage_edges: [],
              self_related_edges: [],
              duplicate_related_edges: [],
              related_vs_lineage_mismatch: [],
              top_level_related_ids: [],
              old_manifest_still_dangling: [],
              old_manifest_resolved: []
            }
          };

          for (const card of cards) {
            if (!card || typeof card !== 'object') continue;
            const id = card.id || '(missing-id)';
            const relatedOk = Array.isArray(card.related);
            const lineageObj = card.related_lineage && typeof card.related_lineage === 'object' && !Array.isArray(card.related_lineage);
            const lineageIdsOk = lineageObj && Array.isArray(card.related_lineage.related_ids);

            if (relatedOk) out.cards_with_related_array++;
            else { out.cards_missing_related_array++; out.defect_ids.missing_related_array.push(id); }

            const related = relatedOk ? card.related : [];
            if (related.length) out.cards_with_related_edges++;
            out.related_edge_count += related.length;

            if (lineageObj) out.cards_with_related_lineage_object++;
            else out.cards_missing_related_lineage_object++;
            if (lineageIdsOk) out.cards_with_valid_lineage_related_ids_array++;
            else { out.cards_missing_or_malformed_lineage_related_ids++; out.defect_ids.missing_or_malformed_lineage.push(id); }

            if (relatedOk && lineageIdsOk) out.cards_fully_initialized_for_related_add++;
            else out.cards_not_initialized_for_related_add++;

            if (related.length && !lineageIdsOk) {
              out.cards_with_related_edges_but_missing_valid_lineage++;
              out.defect_ids.related_edges_missing_valid_lineage.push(id);
            }

            if (Object.prototype.hasOwnProperty.call(card, 'related_ids')) {
              out.cards_with_top_level_related_ids++;
              out.defect_ids.top_level_related_ids.push(id);
            }

            const seen = new Set();
            for (const target of related) {
              if (target === id) {
                out.self_related_edge_count++;
                out.defect_ids.self_related_edges.push({source:id,target});
              }
              if (seen.has(target)) {
                out.duplicate_related_edge_count++;
                out.defect_ids.duplicate_related_edges.push({source:id,target});
              }
              seen.add(target);
              if (!ids.has(target)) {
                out.dangling_related_edge_count++;
                out.defect_ids.dangling_related_edges.push({source:id,target});
              }
            }

            const lineageIds = lineageIdsOk ? card.related_lineage.related_ids : [];
            out.lineage_edge_count += lineageIds.length;
            for (const target of lineageIds) {
              if (!ids.has(target)) {
                out.dangling_lineage_edge_count++;
                out.defect_ids.dangling_lineage_edges.push({source:id,target});
              }
            }

            if (relatedOk && lineageIdsOk) {
              const a = [...new Set(related)].sort();
              const b = [...new Set(lineageIds)].sort();
              if (JSON.stringify(a) !== JSON.stringify(b)) {
                out.related_vs_lineage_set_mismatch_card_count++;
                out.defect_ids.related_vs_lineage_mismatch.push({id,related:a,lineage_related_ids:b});
              }
            }
          }

          const byId = new Map(cards.map(c => [c?.id,c]));
          for (const item of oldManifest.items || []) {
            const card = byId.get(item.card_id);
            if (!card) continue;
            out.old_manifest_items_present_now++;
            const related = Array.isArray(card.related) ? card.related : [];
            const missing = related.filter(t => !ids.has(t));
            if (missing.length) {
              out.old_manifest_items_still_dangling_now++;
              out.defect_ids.old_manifest_still_dangling.push({id:item.card_id,missing});
            } else {
              out.old_manifest_items_resolved_now++;
              out.defect_ids.old_manifest_resolved.push(item.card_id);
            }
          }

          console.log('SBTL_LEGACY_RELATED_AUDIT_JSON_START');
          console.log(JSON.stringify(out,null,2));
          console.log('SBTL_LEGACY_RELATED_AUDIT_JSON_END');
          NODE
