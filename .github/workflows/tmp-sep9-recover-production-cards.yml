name: tmp-sep9-recover-production-cards

on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - .github/workflows/tmp-sep9-recover-production-cards.yml

permissions:
  contents: write

jobs:
  inspect-relations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect relation-card payload fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          text = ''.join((root/'tmp'/f'production-cards.part{i:02d}').read_text(encoding='utf-8').strip() for i in range(4))
          cards = json.loads(gzip.decompress(base64.b64decode(text, validate=True)).decode('utf-8'))
          byid = {c['id']: c for c in cards}
          detail = {}
          for cid in ['2026-09-09_GL_01','2026-09-07_CN_02']:
              c = byid[cid]
              detail[cid] = {
                  'source_spec_id': c.get('source_spec_id'),
                  'urls': c.get('urls'),
                  'related': c.get('related'),
                  'related_ids': c.get('related_ids'),
                  'related_lineage': c.get('related_lineage'),
                  'stage_b_lineage': c.get('stage_b_lineage'),
                  'date_role': c.get('date_role'),
              }
          payload = {
              'schema':'sep9_relation_payload_inspection_v1',
              'status':'PASS',
              'decoded_sha256': hashlib.sha256(gzip.decompress(base64.b64decode(text, validate=True))).hexdigest(),
              'details': detail,
          }
          p = root/'tmp'/'production-cards.relation-summary.json'
          p.write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Commit relation inspection summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/production-cards.relation-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Sep9 relation-card payload inspection'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
