          lib['items'].sort(key=lambda x:(str(x.get('month') or ''),int(x.get('revision') or 0),str(x.get('published_at') or '')),reverse=True)
          lib['updated_at']=DATE
          libp.write_text(json.dumps(lib,ensure_ascii=False,indent=2)+'\n')

          audit={
