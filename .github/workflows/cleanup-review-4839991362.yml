name: Cleanup review 4839991362

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/cleanup_review_4839991362.py
      - .github/workflows/cleanup-review-4839991362.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove generated bytecode and temporary files
        run: python scripts/cleanup_review_4839991362.py

      - name: Run workflow-contract regression tests
        run: python -m unittest validation_scripts.tests.test_workflow_contracts

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Assert no generated bytecode remains
        run: test -z "$(find validation_scripts -type f -name '*.pyc' -print -quit)"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated Python bytecode"
          git push origin HEAD:agent/structural-news-value-v3
