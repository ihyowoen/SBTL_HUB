name: R31 PR394 issuer quote body QC remediation (no merge)
on:
  push:
    branches: [news/r28-20261017-source-verified-lfp]
    paths:
      - 'scripts/.r31_pr394_source_stage_patch.py.gz.b64'
      - '.github/workflows/r31-pr394-review-remediation-qc.yml'
permissions:
  contents: write
jobs:
  repair-source-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact source script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,gzip,base64,hashlib
          b64=pathlib.Path('scripts/.r31_pr394_source_stage_patch.py.gz.b64').read_text().strip()
          compressed=base64.b64decode(b64,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='0632aa95c2f68a2dc7f1f66ab305a3ca386f5bc8652a16198e2804e7ca6440ed'
          original=gzip.decompress(compressed)
          assert hashlib.sha256(original).hexdigest()=='e0d44eb72960dbaae4f18563266e29adfe63a89a74b8fbe065bef2f3a1dcb04b'
          s=original.decode('utf-8')
          old="root=pathlib.Path('/tmp/R31_PR394')"
          assert s.count(old)==1
          pathlib.Path('/tmp/R31_PR394_safe_patch.py').write_text(s.replace(old,"root=pathlib.Path('.').resolve()"))
          print('Verified authored patch integrity')
          PY
      - name: Patch approved issuer quotes, validate Full Lean and direct add
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 60a8f47f99a71224e33eed00e9f64d810b9b0e32 HEAD
          python3 /tmp/R31_PR394_safe_patch.py
          node scripts/lean_cards.mjs
          node scripts/lean_cards.mjs --check
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > /tmp/R31_base_full.json
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base /tmp/R31_base_full.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base /tmp/R31_base_full.json --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          git diff --check
      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove staging and commit only three governed PR data files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r31_pr394_source_stage_patch.py.gz.b64
          rm .github/workflows/r31-pr394-review-remediation-qc.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/r31-pr394-review-remediation-qc.yml \
            data/cards.full.json \
            direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json \
            public/data/cards.json \
            scripts/.r31_pr394_source_stage_patch.py.gz.b64 | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected R31 changed files"; git diff --cached --name-only; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cards): ground 6tn and Non-PFE claims in exact issuer quotes (review only)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "PASS: PR394 contains exact governed 3 data files; user human review and merge approval still required."
