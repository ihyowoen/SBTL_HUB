name: tmp-fix-20260813-announcement-scope

on:
  push:
    branches:
      - chatgpt/direct-add-earnings17-20260827
    paths:
      - .github/workflows/tmp-inspect-20260813-card.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scope 2026-08-13_GL_01 to the public announcement
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/cards.full.json';
          const root = JSON.parse(fs.readFileSync(path,'utf8'));
          if (!root || !Array.isArray(root.cards)) throw new Error('canonical cards wrapper missing');
          if (root.cards.length !== 1460 || root.total !== 1460) throw new Error(`unexpected canonical count ${root.cards.length}/${root.total}`);
          const c = root.cards.find(x => x && x.id === '2026-08-13_GL_01');
          if (!c) throw new Error('target card not found');
          if (c.date !== '2026-08-13') throw new Error(`unexpected date ${c.date}`);
          if (c.title !== 'BW ESS, Yanco BESS 인수') throw new Error(`unexpected title ${c.title}`);
          if (!c.gate?.includes('실제 소유권 이전이 2026년 7월')) throw new Error('expected July ownership-transfer disclosure missing');
          if (!c.event_fingerprint || !c.date_role) throw new Error('date/fingerprint metadata missing');

          c.title = 'BW ESS, Yanco BESS 인수 발표';
          c.sub = 'BW ESS가 8월 13일 Yanco BESS 인수를 공식 발표했다. ACEnergy에 따르면 실제 소유권 이전은 2026년 7월 이뤄졌다.';
          c.gate = '이 카드의 대표 이벤트는 2026년 8월 13일 공개된 공식 인수 발표다. 실제 소유권 이전은 2026년 7월 이뤄졌지만 정확한 이전일이 공개되지 않아 7월의 임의 일자를 event date로 사용하지 않는다.';
          c.fact = 'BW ESS는 2026년 8월 13일 Yanco BESS 인수를 공식 발표했다. ACEnergy는 소유권을 2026년 7월 BW ESS로 이전했다고 밝혔다.';
          c.event_fingerprint.event_type_source_anchor = 'project_acquisition_announcement';
          c.event_fingerprint.factual_anchor = 'BW ESS, Yanco BESS 인수 발표';
          c.event_fingerprint.event_date = '2026-08-13';
          c.date_role.event_date_support_basis = 'official_public_acquisition_announcement_date';
          c.date_role.representative_date_basis = '2026-08-13 official public acquisition announcement date';
          c.date_role.underlying_transaction_timing = 'ownership transfer occurred in July 2026; exact transfer day not asserted because existing source gives month only';
          c.date_role.underlying_transaction_day_precision = 'month_only';
          c.date_role.date_ambiguity_resolved_by_scope = 'PASS — representative event is the 2026-08-13 official public acquisition announcement; July ownership transfer remains separately disclosed with month-only precision and no fabricated day';

          fs.writeFileSync(path, JSON.stringify(root, null, 2) + '\n');
          NODE
          node scripts/lean_cards.mjs
          node scripts/lean_cards.mjs --check
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node <<'NODE'
          const fs = require('fs');
          const full = JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const lean = JSON.parse(fs.readFileSync('public/data/cards.json','utf8'));
          const f = full.cards.find(x => x.id === '2026-08-13_GL_01');
          const l = lean.cards.find(x => x.id === '2026-08-13_GL_01');
          if (!f || !l) throw new Error('target missing after regeneration');
          if (f.title !== 'BW ESS, Yanco BESS 인수 발표' || l.title !== f.title) throw new Error('title scope repair failed');
          if (f.event_fingerprint.factual_anchor !== 'BW ESS, Yanco BESS 인수 발표') throw new Error('fingerprint scope repair failed');
          if (f.date !== '2026-08-13' || f.id !== '2026-08-13_GL_01') throw new Error('ID/date changed unexpectedly');
          if (full.cards.length !== 1460 || lean.cards.length !== 1460) throw new Error('card count changed');
          console.log('PASS: 2026-08-13_GL_01 scoped to Aug-13 announcement; July transfer preserved as month-only underlying transaction; 1460/1460 synchronized');
          NODE
          git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet -- data/cards.full.json public/data/cards.json; then
            echo 'No data changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json
          git commit -m 'Fix Yanco BESS announcement event scope'
          git push origin HEAD:chatgpt/direct-add-earnings17-20260827
