name: Apply PR233 review 4842006582

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - "scripts/patch_pr233_review_4842006582.py"
      - ".github/workflows/apply-pr233-review-4842006582.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused review patch
        run: python -B scripts/patch_pr233_review_4842006582.py

      - name: Run focused regression
        run: python -B -m unittest validation_scripts.tests.test_review_4842006582_contracts -v

      - name: Compile validators without bytecode
        run: |
          python -B - <<'PY'
          from pathlib import Path
          for path in Path('validation_scripts').rglob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Run full regression suite
        run: python -B -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python -B validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit verified fixes and remove temporary helpers
        run: |
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr233-review-4842006582.yml
          git rm scripts/patch_pr233_review_4842006582.py
          git add -A
          git commit -m "fix: address review 4842006582 validators"
          git push origin HEAD:agent/structural-news-value-v3
