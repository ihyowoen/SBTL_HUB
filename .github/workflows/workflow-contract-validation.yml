name: Workflow contract validation

on:
  pull_request:
    paths:
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review patch
        run: python scripts/patch_review_4850266559.py

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Focused regression
        run: python -m unittest validation_scripts.tests.test_review_4850266559_contracts -v

      - name: Run workflow-contract and exporter regression tests
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit verified code fix
        run: |
          rm -f scripts/patch_review_4850266559.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_scripts/stage_lineage_contract_check.py
          git add validation_scripts/tests/test_review_4850266559_contracts.py
          git add scripts/patch_review_4850266559.py
          git commit -m "fix: scan full confirmation effect bridge"
          git push origin HEAD:agent/structural-news-value-v3
