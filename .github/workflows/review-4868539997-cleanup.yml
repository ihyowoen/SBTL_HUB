name: Review 4868539997 cleanup

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - ".github/workflows/review-4868539997-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Restore pre-review bytecode state
        run: |
          git checkout d20e2c70cb92e0e77d890e88b26c389852cdf201 -- validation_scripts/__pycache__ validation_scripts/tests/__pycache__
          rm .github/workflows/review-4868539997-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove review 4868539997 bytecode noise"
          git push origin HEAD:agent/structural-news-value-v3
