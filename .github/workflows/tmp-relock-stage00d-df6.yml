name: Relock Stage 0.0D after PR321
on:
  push:
    branches: [chatgpt/v4-run-baseline-20260831-20260901-r4]
    paths: [.github/workflows/tmp-relock-stage00d-df6.yml]
permissions:
  contents: write
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and relock 0.0D
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          OLD=d631fccee308d7334095f843208517d5f3e11ef1
          NEW=$(git rev-parse origin/main)
          test "$NEW" = "df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4"
          git diff --name-only "$OLD" "$NEW" > /tmp/main_diff.txt
          printf 'main diff:\n'; cat /tmp/main_diff.txt
          test "$(wc -l < /tmp/main_diff.txt)" -eq 2
          grep -qx 'validation_scripts/stage_lineage_contract_check.py' /tmp/main_diff.txt
          grep -qx 'validation_scripts/tests/test_stage_a_v4_required_docs_authority.py' /tmp/main_diff.txt
          test "$(git rev-parse origin/main:data/cards.full.json)" = "53219907cdb435c3822c41d097b23e475662aa8a"
          git merge --no-edit origin/main
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          old_path=Path('runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_d631fcc.json')
          out_path=Path('runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_df6fccc.json')
          d=json.loads(old_path.read_text(encoding='utf-8'))
          assert d['status']=='PASS'
          assert d['repository_head_sha']=='d631fccee308d7334095f843208517d5f3e11ef1'
          assert d['canonical_full_blob_sha']=='53219907cdb435c3822c41d097b23e475662aa8a'
          assert d['canonical_card_count']==1514
          for row in d['full_read_evidence']:
              p=row['path']; b=Path(p).read_bytes()
              blob=subprocess.check_output(['git','rev-parse',f'origin/main:{p}'],text=True).strip()
              assert blob==row['git_blob_sha'], (p,blob,row['git_blob_sha'])
              assert len(b)==row['byte_count']
              assert hashlib.sha256(b).hexdigest()==row['sha256']
          runtime=d['runtime_dependency_evidence']
          paths=d['runtime_dependency_paths_from_machine_manifest']
          assert len(runtime)==37 and len(paths)==37
          assert {x['path'] for x in runtime}==set(paths)
          changed=0
          for row in runtime:
              p=row['path']; b=Path(p).read_bytes()
              blob=subprocess.check_output(['git','rev-parse',f'origin/main:{p}'],text=True).strip()
              if p=='validation_scripts/stage_lineage_contract_check.py':
                  assert blob=='6fc7b32327d4da31ee0ff3c00745c0562fc20d8f'
                  if blob!=row['git_blob_sha']: changed+=1
              row['read_status']='READ_FULL_LOCKED_MAIN'
              row['byte_count']=len(b)
              row['git_blob_sha']=blob
              row['sha256']=hashlib.sha256(b).hexdigest()
          assert changed==1
          d['repository_head_sha']='df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4'
          d['relock_reason']='PR #321 changed the active Stage A authority-boundary validator and its regression test; docs and canonical card data are unchanged, while all 37 runtime dependencies were re-read and re-hashed.'
          d['relocked_from_repository_head_sha']='d631fccee308d7334095f843208517d5f3e11ef1'
          d['stage_0_0c_authorized']=True
          assert not d['unclassified_paths'] and not d['unread_active_paths']
          assert not d['unresolved_dependencies'] and not d['unresolved_conflicts']
          assert not d['incomplete_universe_defects']
          out_path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS relocked', out_path)
          print('docs',d['docs_inventory_count'],d['classified_count'],'active',d['active_full_read_count'],'runtime',len(runtime))
          PY
          git add runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_df6fccc.json
          git rm .github/workflows/tmp-relock-stage00d-df6.yml
          git commit -m 'chore: relock V4 Stage 0.0D after PR321'
          git push origin HEAD:chatgpt/v4-run-baseline-20260831-20260901-r4
