name: tmp-fix-review-5220166060
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
          fetch-depth: 0
      - name: Apply fail-closed review remediation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          brief_path = Path('public/data/monthly_briefs.json')
          audit_path = Path('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json')
          brief = json.loads(brief_path.read_text())
          audit = json.loads(audit_path.read_text())

          issue = next(x for x in brief['items'] if x.get('id') == 'monthly-brief-2026-06-r1')
          flows = {x['id']: x for x in issue['key_flows']}

          old_f5_title = '현지화, 5월의 순환·추적성 의제가 6월 운영화되고 기술라이선스가 추가'
          if flows['05']['title'] != old_f5_title:
              raise SystemExit(f"FAIL_CLOSED unexpected flow05 title: {flows['05']['title']}")

          old_wc = '공급망·현지화 역시 기업단위 규칙이 6월에 처음 나타난 것이 아니라 5월의 공공조달·재정지원 적격성, 외국인투자 조건, FEOC 대응과 정책금융 위에 6월의 명단형 통제·G7 지원검토·EV 셀 생산금융·기술 라이선스·재생원료 인증·배터리패스포트가 추가로 분화한 것으로 본다.'
          new_wc = '공급망·현지화 역시 기업단위 규칙이나 기술이전·순환성·추적성 축이 6월에 처음 나타난 것이 아니다. 5월의 공공조달·재정지원 적격성, 외국인투자·기술이전 조건, FEOC 대응, 정책금융, 재생원료 인증·전주기 추적 방향 위에서 6월에는 명단형 통제·G7 지원검토·EV 셀 생산금융이 추가로 분화했고, 기술라이선스 적용 시험셀·재생원료 인증 시범·배터리패스포트 실데이터 검증이 기존 현지화 축의 실행 사례로 구체화됐다.'
          if old_wc not in issue['what_changed']:
              raise SystemExit('FAIL_CLOSED expected what_changed sentence not found')
          issue['what_changed'] = issue['what_changed'].replace(old_wc, new_wc, 1)

          new_f5_title = '현지화, 5월부터 있던 순환·추적성·기술이전 축이 6월 실행 사례로 구체화'
          new_f5_summary = '5월에는 생산기지·공급망 현지화뿐 아니라 재생원료 생산·사용 인증, 전주기 추적체계와 합작·기술이전 조건까지 이미 현지화 의제로 존재했다. 6월 한국의 재생원료 생산 인증제 시범사업과 일본 AESC ESS 배터리패스포트 실데이터 검증은 기존 순환성·추적성 의제를 실행 단계로 옮긴 사례다. Ford 미시간 LFP 공장의 생산의도 시험셀은 기존 CATL 기술라이선스 구조가 실제 제조·검증 단계에서 적용되는 사례를 보여준다. 따라서 6월의 변화는 새로운 기술권리 축이 추가된 것이 아니라 기존 순환·추적성·기술이전 축이 구체적 운영·검증 사례로 내려온 데 있다.'
          flows['05']['title'] = new_f5_title
          flows['05']['summary'] = new_f5_summary

          selected = {x['id']: x for x in audit['selected_flows']}
          selected['03']['title'] = flows['03']['title']
          selected['03']['delta_classification'] = 'MIXED_CONTINUATION_STAGE_ADVANCE_PLUS_JUNE_NEW_SIGNAL'
          selected['04']['title'] = flows['04']['title']
          selected['04']['delta_classification'] = 'TRANSACTION_LEVEL_RULES_DIVERSIFIED'
          selected['05']['title'] = new_f5_title
          selected['05']['delta_classification'] = 'OPERATIONALIZED_EXISTING_LOCALIZATION_AXES'

          deltas = {x['flow_id']: x for x in audit['delta_classification']}
          deltas['05']['classification'] = 'OPERATIONALIZED_EXISTING_LOCALIZATION_AXES'
          deltas['05']['may_state'] = 'Localization already included production-footprint/supply-chain themes, recycled-material production/use certification, lifecycle tracking, and foreign-investment conditions that explicitly included joint ventures and technology transfer.'
          deltas['05']['june_change'] = 'Korea certification piloting and Japan passport real-data validation operationalize existing circularity/traceability directions; Ford production-intent test cells show an existing CATL technology-licensing structure being applied in manufacturing validation. June is operationalization of existing localization axes, not evidence that a new rights axis first appeared.'

          audit['codex_review_5220166060_remediation'] = {
              'review_id': 5220166060,
              'reviewed_head': 'a56a57a123d6799284b74e80a32e04cbc6aaa9db',
              'findings_addressed': [
                  'selected_flows_03_04_05_synchronized_with_final_delta_classifications',
                  'ford_technology_license_reclassified_as_operationalization_of_existing_may_technology_transfer_axis'
              ]
          }

          brief_path.write_text(json.dumps(brief, ensure_ascii=False, indent=2) + '\n')
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate
        run: |
          npm ci
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s' 'public/data/monthly_briefs.json' 'runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json')"
          test "$changed" = "$expected"
      - name: Commit remediation outputs
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git commit -m "fix: align June brief delta classifications"
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
