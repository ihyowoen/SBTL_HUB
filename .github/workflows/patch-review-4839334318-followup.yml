name: Patch review 4839334318 follow-up

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_review_4839334318_followup.py
      - .github/workflows/patch-review-4839334318-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_review_4839334318_followup.py
      - name: Compile validators
        run: python -m compileall -q validation_scripts
      - name: Run regression suite
        run: python -m unittest discover -s validation_scripts/tests -p 'test_*.py'
      - name: Verify overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Remove temporary patch files
        run: |
          rm scripts/patch_review_4839334318_followup.py
          rm .github/workflows/patch-review-4839334318-followup.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: address latest PR 233 review feedback'
          git push origin HEAD:agent/structural-news-value-v3
