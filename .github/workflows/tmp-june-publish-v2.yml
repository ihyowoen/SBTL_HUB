name: tmp-june-publish-v2
on:
  push:
    branches: [chatgpt/rebuild-monthly-brief-2026-06]
    paths: [.github/workflows/tmp-june-publish-v2.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild June Monthly Brief from locked canonical baseline
        env:
          BASELINE_COMMIT: 1305dea1892b5b19ce5bad84e67407743e5b1c26
          BASELINE_BLOB: a9887cb2576cb4db195d0dddbc4db9b28c17847e
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const baseline = process.env.BASELINE_COMMIT;
          const expectedBlob = process.env.BASELINE_BLOB;
          const actualBlob = cp.execSync(`git rev-parse ${baseline}:data/cards.full.json`, {encoding:'utf8'}).trim();
          if (actualBlob !== expectedBlob) throw new Error(`baseline blob drift ${actualBlob}`);
          const full = JSON.parse(cp.execSync(`git show ${baseline}:data/cards.full.json`, {encoding:'utf8', maxBuffer:256*1024*1024}));
          const library = JSON.parse(fs.readFileSync('public/data/monthly_briefs.json','utf8'));
          const byId = new Map(full.cards.map(c => [c.id,c]));
          const monthCards = full.cards.filter(c => String(c.date||'').startsWith('2026-06'));
          if (full.cards.length !== 1640 || monthCards.length !== 197) throw new Error(`unexpected baseline counts ${full.cards.length}/${monthCards.length}`);
          if (library.items.some(x => x.month === '2026-06')) throw new Error('June item already exists on rebuild branch');

          const flows = [
            {
              id:'01',
              title:'ESS, 장기계약·자본·COD를 갖춘 전력자산으로',
              summary:'독일 300MW BESS의 5년 tolling, 애리조나 19MW·10시간 CO₂ 저장의 20년 tolling, 텍사스 120MW·480MWh BESS의 1억3,000만달러 세액공제 지분금융, 온타리오 8시간 BESS의 20년 용량계약, 호주 Orana 415MW·1,660MWh의 상업운전이 한 달 안에 이어졌다. 수익계약·자본조달·운영실적이 서로 다른 시장에서 동시에 채워지면서 ESS의 판단기준이 발표용량에서 현금흐름의 안정성과 실행단계의 질로 이동했다. 계약·금융종결은 COD와 구분하고, 장기계약도 실제 착공·가동으로 이어지는지 확인해야 한다.',
              card_ids:['2026-06-02_EU_01','2026-06-15_US_01','2026-06-22_US_01','2026-06-23_US_01','2026-06-30_GL_01']
            },
            {
              id:'02',
              title:'ESS 수요, 저장시간·정책조달·전력인프라 수요로 분화',
              summary:'1분기 글로벌 ESS 출하는 195.5GWh로 전년 대비 78% 늘었다. 영국은 LDES 16개 프로젝트를 잠정선정했고 EU는 17개국의 2026~2028 저장 배치 공약을 묶은 첫 Tripartite Agreement를 체결했다. 일본은 축전지 전략을 축전지·전원 산업전략으로 갱신했고, 미국에서는 T1 Energy가 KORE Power 인수 본계약을 통해 BESS·AI 데이터센터 인프라 진입을 추진했다. AI는 6월 ESS 전체를 설명하는 단일 원인이 아니라 전력망 제약과 저장 수요를 키우는 선택적 수요축으로 보는 편이 정확하다.',
              card_ids:['2026-06-08_GL_02','2026-06-26_EU_01','2026-06-26_EU_07','2026-06-02_JP_01','2026-06-02_US_01']
            },
            {
              id:'03',
              title:'차세대 저장, 상업계약과 검증단계가 갈리기 시작',
              summary:'CATL은 나트륨이온 ESS의 9월 중국 인도 일정과 연내 1GWh 목표를 제시했고, Energy Dome과 Google은 아일랜드 23MW·200MWh CO₂ 배터리에 상업계약을 체결했다. Ore Energy와 Buurttwice는 철공기 ESS 1GWh 계약을 맺었다. 반면 전고체는 Factorial이 Stellantis 차량 통합 후 도로시험에 들어간 단계다. 차세대 기술을 하나의 상용화 흐름으로 묶기보다 고객계약·인도·실차시험·실제 COD를 나눠 봐야 한다.',
              card_ids:['2026-06-22_CN_05','2026-06-23_EU_01','2026-06-22_EU_02','2026-06-17_US_02']
            },
            {
              id:'04',
              title:'공급망 규칙, 국가에서 기업별 조달적격성·생산금융으로 세분화',
              summary:'미 국방부 1260H 목록에는 CATL·BYD·Trina 등이 추가됐지만 이는 일반 제재가 아니라 국방조달 제한이다. 중국은 미국 방산·희토류 기업에 이중용도 수출통제와 정부조달 금지를 적용했고, G7은 핵심광물 가격격차 보조·공동조달·가격하한을 검토수단으로 제시했다. EU는 역내 배터리 셀 생산에 15억유로 무이자대출 시설을 출범시켰다. 통제와 지원 모두 국적 단위에서 기업명단·조달자격·금융조건 단위로 더 촘촘해지고 있다.',
              card_ids:['2026-06-09_US_02','2026-06-22_CN_01','2026-06-17_GL_07','2026-06-10_EU_01']
            },
            {
              id:'05',
              title:'현지화, 공장 위치에서 기술권리·재생원료·추적성까지 확대',
              summary:'Ford 미시간 LFP 공장은 CATL 기술라이선스를 적용한 생산의도 시험셀 단계에 들어갔다. 한국은 폐배터리 재활용 기업과 재생원료 생산 인증제 시범사업을 시작했고, 일본에서는 AESC ESS 배터리패스포트의 실데이터 검증이 진행됐다. LG에너지솔루션은 신왕다와 특허 라이선스 계약으로 독일·중국·한국 분쟁을 종결했다. 현지화의 경쟁 단위가 공장 주소를 넘어 기술사용권·순환원료 적격성·데이터 추적성과 IP 권리구조로 넓어지고 있다.',
              card_ids:['2026-06-30_US_02','2026-06-25_KR_02','2026-06-29_JP_01','2026-06-11_KR_01']
            }
          ];
          const sourceIds = flows.flatMap(f=>f.card_ids);
          if (sourceIds.length !== 22 || new Set(sourceIds).size !== 22) throw new Error('expected 22 unique source ids');
          for (const id of sourceIds) if (!byId.has(id)) throw new Error(`missing card ${id}`);

          function titleUrls(card) {
            const out=[];
            for (const s of Array.isArray(card.fact_sources)?card.fact_sources:[]) {
              const supports=Array.isArray(s?.supports)?s.supports:[];
              if (!supports.includes('title')) continue;
              for (const u of [s?.source_url,s?.source_url_canonical]) if (typeof u==='string' && u.trim() && !out.includes(u.trim())) out.push(u.trim());
            }
            if (!out.length) {
              if (Array.isArray(card.urls)) for (const u of card.urls) if (typeof u==='string'&&u.trim()&&!out.includes(u.trim())) out.push(u.trim());
              if (!out.length && typeof card.url==='string' && card.url.trim()) out.push(card.url.trim());
            }
            return out;
          }
          const refs=sourceIds.map((id,i)=>{
            const c=byId.get(id); const urls=titleUrls(c);
            const r={n:i+1,id,title:String(c.title||c.T||'').trim(),date:String(c.date||c.d||'').trim()};
            if (urls[0]) r.url=urls[0];
            return r;
          });
          const item={
            id:'monthly-brief-2026-06-r1', product_name:'SBTL Monthly Brief', month:'2026-06', revision:1, status:'published',
            publication_class:'official_editorial', publication_mode:'editorial_curated', published_at:'2026-09-15', title:'SBTL Monthly Brief · 2026.06',
            executive_diagnosis:'6월 배터리 산업의 핵심 변화는 ESS가 단순한 성장시장에서 장기계약·금융·운영실적을 갖춘 전력자산으로 이동했다는 점이다. 5년·20년 tolling, 20년 용량계약, 세액공제 지분금융과 상업운전이 한 달 안에 이어졌고 영국·EU에서는 LDES와 저장 배치를 제도적으로 끌어내는 장치가 구체화됐다. 차세대 저장에서는 나트륨·CO₂·철공기가 고객계약과 인도 일정으로 내려온 반면 전고체는 여전히 실차 검증 단계였다. 공급망에서는 미·중의 기업별 조달·수출 통제와 EU·G7의 생산·광물 지원수단이 함께 세분화됐고, 현지화는 기술권리·재생원료 인증·배터리패스포트와 IP까지 범위를 넓혔다. 따라서 6월은 ESS 성장률 자체보다 수익모델·저장시간·조달적격성·추적성이 동시에 분화된 달로 보는 편이 정확하다.',
            what_changed:'이전에는 GW·GWh와 공장 증설이 변화의 중심이었다면 6월에는 장기 수익계약, 금융조달, LDES 정책지원, 기업별 조달적격성과 재생원료·추적성 체계가 동시에 구체화됐다. AI·데이터센터는 T1–KORE와 Energy Dome–SRP/Google 같은 사례에서 전력 인프라 수요를 자극하는 축으로 확인되지만, ESS 전체 성장을 설명하는 단일 원인으로 보지는 않는다. SBTL 관점에서도 ESS·LFP 성장만으로 파우치필름 수요를 자동 환산하지 않는다. 6월 공식 anchor에는 직접 파우치필름 고객프로그램이나 공급계약이 없으므로 실제 셀 폼팩터·고객프로그램·필름 공급계약이 확인될 때만 직접 수요 신호로 해석한다.',
            source_baseline:{main_commit_sha:baseline,full_blob_sha:expectedBlob,source_month_count:197},
            source_card_ids:sourceIds,
            key_flows:flows,
            watch:[
              '5년·20년 tolling과 20년 용량계약이 실제 금융 인출·착공·COD·가동률·현금흐름으로 이어지는지 확인한다.',
              'Ofgem LDES 잠정선정과 EU 17개국 저장 공약, 일본 축전지·전원 산업전략이 실제 입찰·인허가·보조금·기업 투자로 전환되는지 추적한다.',
              'CATL 나트륨이온 ESS의 실제 고객 인도, Energy Dome·철공기 프로젝트의 착공·COD를 확인하고 전고체 실차시험과 양산 주장을 구분한다.',
              '미국 1260H와 중국 기업단위 수출·조달 제한의 실제 고객조달·금융 영향, G7·EU 지원수단의 구속적 기준과 자금집행을 확인한다.',
              'Ford LFP 시험셀이 고객승인·상업출하로 넘어가는지, 재생원료 인증·배터리패스포트·IP 라이선스가 실제 고객 적격성과 소재 조달조건을 바꾸는지 본다.'
            ],
            refs,
            qc:{evidence_status:'PASS',red_team_status:'PASS',editorial_coherence_status:'PASS',language_terminology_status:'PASS',reviewed_at:'2026-09-15',reviewer_role:'editorial_owner',notes:'Rebuilt from the post-#379 locked 1,640-card canonical baseline after an independent external June deep dive. Claims are stage-bounded; AI is treated as a selective grid-demand pull, and no direct pouch-film demand is inferred without form-factor/customer evidence.'},
            approval:{status:'APPROVED',approved_at:'2026-09-15',reviewer_role:'editorial_owner',notes:'Approved after 197-card June universe review, 99 top/high re-review, independent external gap closure, duplicate-event remediation, and governed title/date/source binding.'}
          };
          library.updated_at='2026-09-15';
          library.items.push(item);
          fs.writeFileSync('public/data/monthly_briefs.json',JSON.stringify(library,null,2)+'\n');

          const binding=sourceIds.map(id=>{const c=byId.get(id);const urls=titleUrls(c);return {id,selected_url:urls[0]||null,title_supporting_urls:urls};});
          const audit={
            schema:'monthly_brief_editorial_audit_v1',issue_id:item.id,month:'2026-06',audit_date:'2026-09-15',product:'SBTL Monthly Brief',
            baseline:{main_commit_sha:baseline,cards_full_blob_sha:expectedBlob,total_canonical_cards:1640,month_card_count:197,signal_distribution:{top:15,high:84,mid:98},region_distribution:{EU:48,CN:39,US:36,GL:35,KR:32,JP:7}},
            method:[
              'Lock the post-#379 main canonical snapshot and review all 197 June cards across top, high and mid tiers.',
              'Re-review all 99 top/high June cards after the independent external gap closure rather than restoring the reverted #377 publication.',
              'Treat the reverted June brief only as red-team context; derive the public thesis and anchor set from the updated canonical universe.',
              'Separate contract, financing, construction, commissioning and COD; announced GW/GWh is never treated as installed capacity.',
              'Treat AI/data-center demand as a selective power-infrastructure pull, not the master causal explanation for June ESS growth.',
              'Apply a strict SBTL pouch lens: no pouch-film demand inference without form-factor, customer-program or supply-contract evidence.',
              'Require every public reference to preserve the locked canonical title/date and use a governed title-supporting URL.'
            ],
            independent_external_deep_dive:{
              performed_after_initial_canonical_first_draft:true,
              candidate_count:14,
              canonicalized_net_new:7,
              same_event_duplicates_removed:2,
              watch_only_count:5,
              promoted_events:['Energy Dome–SRP 20-year CO2-storage tolling','T1 Energy–KORE Power definitive acquisition agreement','Korea recycled-material certification pilot','EU Energy Storage Tripartite Agreement','Kansai Electric BESS infrastructure fund','Trina Storage Kyushu 160MWh supply contract','ContourGlobal Wallace BESS conditional acquisition'],
              duplicate_findings:['Ofgem LDES Window 1 already canonical as 2026-06-26_EU_01','FERC June 18 show-cause event already canonical as 2026-07-03_US_01'],
              watch_only:['GM compound ESS/sodium-ion chemistry story','ESS Tech forward pipeline/target','Yulchon Chemical pouch-film patent family pending patent-family normalization','Moss Landing cleanup requiring lineage treatment','Japan sustainability demo with insufficient independent monthly decision value'],
              editorial_effect:'The external sweep strengthened the contracted/financeable ESS thesis, added LDES policy and a selective AI-power-infrastructure pull, and expanded the localization lens to recycled-material certification. It did not justify restoring AI as the single master June narrative.'
            },
            selected_flows:flows.map(f=>({id:f.id,title:f.title,decision:'SELECT',anchor_card_ids:f.card_ids})),
            rejected_or_narrowed_narratives:[
              {narrative:'AI data centers are the main causal driver of June ESS growth',decision:'NARROW',reason:'AI-linked cases are material but the broader cross-market pattern is long-duration storage, contracted revenues, financing and grid execution.'},
              {narrative:'ESS growth means EV demand has been replaced',decision:'REJECT',reason:'The evidence establishes storage growth and contracting, not one-for-one substitution from EV demand.'},
              {narrative:'Long-term contracts or announced GWh equal delivered operating capacity',decision:'REJECT',reason:'Contract, financing, construction, commissioning and COD are distinct execution stages.'},
              {narrative:'US 1260H listing is a general sanction or investment ban',decision:'REJECT',reason:'The canonical card limits the June action to Defense Department procurement restrictions.'},
              {narrative:'G7 adopted a binding critical-mineral price floor',decision:'REJECT',reason:'Price-gap support, joint procurement and price floors remain considered tools, not a finalized binding regime.'},
              {narrative:'Ford Michigan LFP is already in commercial mass production',decision:'NARROW',reason:'The governed card limits the June event to production-intent test cells.'},
              {narrative:'June ESS/LFP growth directly implies pouch-film demand',decision:'REJECT',reason:'No selected June anchor proves a pouch-form-factor customer program or pouch-film supply contract.'}
            ],
            editorial_exclusions:[
              {id:'2026-06-16_JP_01',reason:'Canonicalized and decision-relevant, but omitted from the compact public anchor set because stronger contracted-revenue and financing cases already prove Flow 01.'},
              {id:'2026-06-03_JP_02',reason:'Canonicalized supply contract retained in the universe; omitted to avoid duplicating Japan storage procurement evidence.'},
              {id:'2026-06-24_EU_03',reason:'Canonicalized single-company acquisition case retained as supporting evidence, but not needed to establish a market-wide M&A trend.'},
              {id:'2026-06-05_KR_01',reason:'Samsung SDI–VW supply report remains unconfirmed by VW in the card gate.'},
              {id:'2026-06-30_CN_02',reason:'52.522GWh is filing volume, not construction or COD.'},
              {id:'2026-06-17_CN_05',reason:'Useful solid-state caution, but the compact public set uses a stage-disciplined road-test anchor and keeps commercialization skepticism in red-team context.'}
            ],
            official_source_selection:{selected_card_count:22,selection_principle:'Compact decision-relevant anchors across bankability, storage-duration/policy demand, technology maturity, procurement eligibility and localization/traceability.',source_card_ids:sourceIds,binding},
            qc:{evidence:'PASS',red_team:'PASS',editorial_coherence:'PASS',language_terminology:'PASS',provenance:'PASS_BY_GENERATED_LOCKED_BINDING',pouch_inference:'PASS_NO_DIRECT_DEMAND_INFERENCE'}
          };
          fs.mkdirSync('runs/2026-09-15',{recursive:true});
          fs.writeFileSync('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json',JSON.stringify(audit,null,2)+'\n');
          console.log(JSON.stringify({sourceIds,refs:refs.map(r=>({id:r.id,url:r.url||null}))},null,2));
          NODE
      - name: Validate publication
        run: |
          set -euo pipefail
          npm ci
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
      - name: Commit publication and remove temporary analysis artifacts
        run: |
          set -euo pipefail
          git config user.name 'ihyowoen'
          git config user.email 'hyowoen@hotmail.com'
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git rm -f runs/2026-09-15/monthly-brief-2026-06-universe-snapshot-v2.json runs/2026-09-15/monthly-brief-2026-06-top-high-compact.json .github/workflows/tmp-june-publish-v2.yml
          git commit -m 'publish: rebuild SBTL Monthly Brief 2026-06'
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
