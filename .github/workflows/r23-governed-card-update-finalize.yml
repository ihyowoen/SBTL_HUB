name: r23-governed-card-update-finalize

# Do not weaken the card-run gate. This applies the documented manual_direct_add_v2
# UPDATE route for TWO existing cards, on the same-repo DRAFT PR branch only.
on:
  pull_request:
    types: [synchronize]
    paths:
      - "direct-adds/2026-10-15-r23-existing-claims/direct-add.json"
      - "scripts/remediation/r23_preserve_event_anchor.py"
      - ".github/workflows/r23-governed-card-update-finalize.yml"

permissions:
  contents: write

jobs:
  finalize-manifest-backed-correction:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/news-catchup-factual-fix-20261015' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lock main and materialize read-only baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "b7847ca9885f6f27ae0566455b0a476ef1059d24"
          git show origin/main:data/cards.full.json > /tmp/r23_base_full.json
          git show origin/main:public/data/cards.json > /tmp/r23_base_lean.json
          test -z "$(git status --porcelain)"
      - name: Restore original event identity fingerprint (fail-closed)
        run: python3 scripts/remediation/r23_preserve_event_anchor.py
      - name: Run actual governed manual-update validators (never fabricate a PASS)
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=direct-adds/2026-10-15-r23-existing-claims/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest "$MANIFEST" --base /tmp/r23_base_full.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest "$MANIFEST" --base /tmp/r23_base_full.json --full data/cards.full.json
      - name: Run native Full and Lean correctness gates
        shell: bash
        env:
          CARDS_BASE: /tmp/r23_base_lean.json
        run: |
          set -euo pipefail
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          test "$(git diff --name-only | sort)" = "data/cards.full.json" || test -z "$(git diff --name-only)"
      - name: Commit only the evidence-backed Full metadata correction to draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/cards.full.json; then
            echo "No remaining change: governed R23 Full was already verified"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json
          git commit -m "fix(cards): preserve Ganfeng event identity under governed update manifest"
          git push origin HEAD:refs/heads/ops/news-catchup-factual-fix-20261015
