name: TEMP Sep 7 scan anchor occurrences

on:
  push:
    branches:
      - chatgpt/production-20260907-r7-21-baseline-rebind-work
    paths:
      - tmp/sep7-promote-rebound-trigger.txt

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact governed anchor occurrences and artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          RUN=runs/2026-09-08/sep7-r7-current-main-production-r1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('runs/2026-09-08/sep7-r7-current-main-production-r1')
          needles={
            'GL':'SNE Research extended the measured period from H1 to Jan–Jul 2026, reporting 725.2GWh and 20.4% growth.',
            'JP':'Tensor Energy reported 5,000 low-voltage ESS applications totaling 250MW/1GWh on Sep 7.',
          }
          for key,needle in needles.items():
              print(f'== {key} exact occurrences ==')
              for p in sorted(root.rglob('*.json')):
                  text=p.read_text()
                  c=text.count(needle)
                  if c:
                      sha=hashlib.sha256(p.read_bytes()).hexdigest()
                      print(f'{p}\tcount={c}\tsha256={sha}')
          print('== stage artifacts hashes ==')
          for p in sorted((root/'stages').glob('*.json')):
              print(f'{p.name}\t{hashlib.sha256(p.read_bytes()).hexdigest()}')
          PY
