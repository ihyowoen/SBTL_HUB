name: apply-card-run-bootstrap-20260826

on:
  pull_request:
    paths:
      - ".github/workflows/apply-card-run.yml"

permissions:
  contents: write

jobs:
  materialize-governed-run:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'chatgpt/news-run-20260826-1485')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Materialize compact governed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap_payload/p* > "$RUNNER_TEMP/payload.b64"
          base64 -d "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.tar.gz"
          echo "6833346be16aad823f6339202235fe46c95ed9305fa78729b0a4b4408b92b25e  $RUNNER_TEMP/payload.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C .
          test -f runs/2026-08-26/card-run.json
      - name: Lock baseline and apply governed run
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          RUN="runs/2026-08-26/card-run.json"
          DECLARED_MAIN="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(r.base_main_commit_sha)' "$RUN")"
          [[ "$BASE_SHA" == "$DECLARED_MAIN" ]] || { echo "BLOCKED_BASELINE_MOVED_REBASE_REQUIRED: $BASE_SHA != $DECLARED_MAIN" >&2; exit 1; }
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN"
          node scripts/validate_card_run_relations.mjs --run "$RUN"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN" --canonical data/cards.full.json
          node scripts/apply_card_run.mjs --apply --run "$RUN" --base-main-sha "$BASE_SHA" --report runs/2026-08-26/apply-report.json
          node scripts/validate_card_run_audits.mjs --run "$RUN" --full data/cards.full.json --lean public/data/cards.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          node scripts/apply_card_run.mjs --verify --run "$RUN" --base-main-sha "$BASE_SHA" --report runs/2026-08-26/apply-report-verified.json
          node scripts/apply_card_run_test.mjs
          git diff --check
      - name: Commit byte-exact outputs and run artifacts
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap_payload
          git add data/cards.full.json public/data/cards.json runs/2026-08-26
          git commit -m "Apply governed 2026-08-26 card run (1460 to 1485)"
          git push origin "HEAD:$HEAD_REF"
