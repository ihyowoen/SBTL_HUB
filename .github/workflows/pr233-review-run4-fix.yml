name: PR233 review run4 fix

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_pr233_review_20260803_run4.py
      - .github/workflows/pr233-review-run4-fix.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: python scripts/patch_pr233_review_20260803_run4.py
      - name: Compile validators
        run: |
          python -m py_compile \
            validation_scripts/stage_lineage_contract_check.py \
            validation_scripts/related_lifecycle_check.py
      - name: Focused regression
        run: python -m unittest validation_scripts.tests.test_review_20260803_run4 -v
      - name: Full regression suite
        run: python -m unittest discover -s validation_scripts/tests -p 'test_*.py'
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch_pr233_review_20260803_run4.py .github/workflows/pr233-review-run4-fix.yml
          git add \
            validation_scripts/stage_lineage_contract_check.py \
            validation_scripts/related_lifecycle_check.py \
            docs/llm_prompts/v1/07_PROMPT_0_5_Evidence_QC.md \
            docs/llm_prompts/v1/08_PROMPT_0_6_Content_Polish.md \
            validation_scripts/tests/test_review_20260803_run4.py
          git commit -m 'fix: address latest PR233 review feedback'
          git push origin HEAD:agent/structural-news-value-v3
