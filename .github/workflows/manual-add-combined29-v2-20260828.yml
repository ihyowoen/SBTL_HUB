name: Manual add combined 29 v2

on:
  push:
    paths:
      - '.github/workflows/manual-add-combined29-v2-20260828.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize 29 cards and resolve four pre-merge QC findings
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, re
          from copy import deepcopy
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from difflib import SequenceMatcher

          FULL = Path('data/cards.full.json')
          LEAN = Path('public/data/cards.json')
          TRANSPORT = Path('runs/2026-08-28/manual-direct-add-29/cards29.transport.b64')
          EXPECTED_RAW_SHA = '54897b89d9ff3dedab2362dacd0e93849fc9e11a184ff9bf53883c81830201a8'
          STANDARD19 = ['STD26_A_010','STD26_A_016','STD26_A_001','STD26_A_012','STD26_A_022','STD26_A_004','STD26_A_006','STD26_A_007','STD26_A_008','STD26_A_013','STD26_A_015','STD26_A_002','STD26_A_018','STD26_A_009','STD26_A_019','STD26_A_017','STD26_A_003','STD26_A_011','STD26_A_005']
          PROMOTED10 = [f'PROMO26_{n:03d}' for n in [1,2,3,4,5,7,8,9,10,11]]
          assert len(STANDARD19)==19 and len(PROMOTED10)==10

          # Decode exact compact transport.
          b64 = ''.join(TRANSPORT.read_text(encoding='utf-8').split())
          raw = gzip.decompress(base64.b64decode(b64))
          assert hashlib.sha256(raw).hexdigest() == EXPECTED_RAW_SHA
          payload = json.loads(raw)
          assert payload['schema'] == 'sbtl_manual_direct_add_29_canonical_transport_v1'
          assert payload['count'] == 29 and len(payload['cards']) == 29
          incoming = [deepcopy(c) for c in payload['cards']]
          got_specs = [c['source_spec_id'] for c in incoming]
          assert got_specs[:19] == STANDARD19, got_specs[:19]
          assert got_specs[19:] == PROMOTED10, got_specs[19:]
          assert all(c.get('publish_ready') is True for c in incoming)
          assert all(c.get('hard_fail_count',0) == 0 for c in incoming)

          full = json.loads(FULL.read_text(encoding='utf-8'))
          cards = full['cards']
          assert full.get('total') == len(cards) == 1432, (full.get('total'), len(cards))
          ids0 = [c['id'] for c in cards]
          assert len(ids0) == len(set(ids0)) == 1432
          idset0=set(ids0)
          legacy_dangling_before={(c['id'],rid) for c in cards for rid in (c.get('related') or []) if rid not in idset0 or rid==c['id']}
          byid = {c['id']:c for c in cards}

          # --- Codex P2 #1: Factorial duplicate: remove Aug repetition, reinforce Jul original.
          dup_id = '2026-08-11_US_03'
          pred_id = '2026-07-24_US_01'
          assert dup_id in byid and pred_id in byid
          dup = byid[dup_id]
          pred = byid[pred_id]
          assert ('Factorial' in dup.get('title','') or '팩토리얼' in dup.get('title',''))
          assert ('Factorial' in pred.get('title','') or '팩토리얼' in pred.get('title',''))
          # Preserve the later shareholder-letter source as reinforcement only.
          for u in dup.get('urls',[]) or []:
              if u not in (pred.get('urls') or []):
                  pred.setdefault('urls',[]).append(u)
          def fs_identity(row):
              if not isinstance(row,dict): return json.dumps(row,ensure_ascii=False,sort_keys=True)
              return row.get('canonical_url') or row.get('source_url') or row.get('url') or json.dumps(row,ensure_ascii=False,sort_keys=True)
          seen = {fs_identity(x) for x in (pred.get('fact_sources') or [])}
          for row in dup.get('fact_sources',[]) or []:
              k=fs_identity(row)
              if k not in seen:
                  pred.setdefault('fact_sources',[]).append(deepcopy(row)); seen.add(k)
          pred['codex_review_fix'] = {
              'status':'PASS_REINFORCEMENT_ONLY',
              'removed_duplicate_id':dup_id,
              'reason':'2026-08-11 shareholder letter repeats the first commercial drone battery order already represented by 2026-07-24_US_01; later source retained as reinforcement only.'
          }
          cards[:] = [c for c in cards if c['id'] != dup_id]
          # Any relation to the removed duplicate now points to the representative event.
          for c in cards:
              rel=c.get('related') or []
              if dup_id in rel:
                  c['related']=[pred_id if x==dup_id else x for x in rel]
                  c['related']=list(dict.fromkeys(c['related']))
              rl=c.get('related_lineage')
              if isinstance(rl,dict) and isinstance(rl.get('related_ids'),list) and dup_id in rl['related_ids']:
                  rl['related_ids']=[pred_id if x==dup_id else x for x in rl['related_ids']]
                  rl['related_ids']=list(dict.fromkeys(rl['related_ids']))

          # refresh index after deletion
          byid = {c['id']:c for c in cards}
          assert len(cards)==1431 and dup_id not in byid and pred_id in byid

          # --- Codex P2 #2: L&F is a distinct follow-up to Jul 31 trial shipment.
          lnf=byid['2026-08-06_KR_04']; lnf_pred='2026-07-31_KR_01'
          assert lnf_pred in byid
          lnf['related']=list(dict.fromkeys((lnf.get('related') or [])+[lnf_pred]))
          lnf['related_lineage']={
              'status':'PASS','relation_type':'distinct_follow_up','related_ids':[lnf_pred],
              'related_candidate_spec_ids':[],
              'reason':'2026-07-31 first LFP trial-product shipment is the predecessor; the Aug-06 Q2 materials add a fresh end-Q3 North-America ESS shipment schedule.',
              'fresh_follow_up_anchor_class':'technology_commercialization_anchor',
              'fresh_follow_up_anchor':'North-America ESS LFP cathode shipment planned from end-Q3 2026.',
              'incremental_fact_vs_predecessor':'The new fact is a dated North-America ESS shipment plan after the first trial-product shipment.',
              'changed_judgment_vs_predecessor':'The commercialization path advances from trial shipment to a scheduled regional ESS supply step.',
              'same_event_checked':True,'earliest_same_event_date_checked':True,
              'follow_up_date_precedes_predecessor_justification':None,'rejected_relation_candidates':[],
              'structural_selector_policy_version':'STRUCTURAL_NEWS_VALUE_SELECTION_V3',
              'related_lifecycle_contract_version':'RELATED_LIFECYCLE_V2_20260802',
              'event_stage_relationship':'2026-07-31 first trial shipment → 2026-08-06 end-Q3 North-America ESS shipment plan',
              'direction':'directional'
          }
          lnf['codex_review_fix']={'status':'PASS_RELATED_REPAIRED','predecessor_id':lnf_pred}

          # Helper: next free production ID, never reusing an occupied NN.
          id_re=re.compile(r'^(\d{4}-\d{2}-\d{2})_(KR|US|CN|JP|EU|GL)_(\d{2})$')
          occupied=set(c['id'] for c in cards)
          def next_id(date,region):
              nums=[]
              for x in occupied:
                  m=id_re.match(x)
                  if m and m.group(1)==date and m.group(2)==region:
                      nums.append(int(m.group(3)))
              n=max(nums,default=0)+1
              while f'{date}_{region}_{n:02d}' in occupied: n+=1
              nid=f'{date}_{region}_{n:02d}'; occupied.add(nid); return nid

          # --- Codex P2 #3: Hunan earliest same-event disclosure is Aug 20, not Aug 25.
          hun_old='2026-08-25_CN_01'
          assert hun_old in byid
          hun=byid[hun_old]
          cards[:] = [c for c in cards if c['id'] != hun_old]
          occupied.discard(hun_old)
          hun['date']='2026-08-20'
          hun['sub']='8월 20일 공개된 상반기 실적 관련 보도에서 ESS용 제품 판매량이 총 판매량의 약 53%를 차지한 것으로 확인돼, ESS가 LFP 판매 믹스의 절반 이상을 차지하는 수요축으로 나타났다.'
          hun['gate']='ESS용 판매 비중 약 53%는 Hunan Yuneng의 제품 믹스에서 ESS 수요가 이미 큰 비중을 차지한다는 의미다. 이후 8월 25일 IR에서도 같은 수준이 재확인됐으며, 다음 반기에도 절반 수준이 유지되는지가 수요 구조의 지속성을 판단하는 기준이다.'
          hun['fact']='Hunan Yuneng의 상반기 LFP 판매에서 ESS용 제품 판매량이 총 판매량의 약 53%를 차지한 것으로 8월 20일 공개됐다. 이후 8월 25일 IR에서도 같은 수준의 판매 믹스가 재확인됐다.'
          hun['implication']=['LFP 판매 믹스에서 ESS가 절반을 넘는 핵심 수요처로 확인됐다.','다음 반기의 ESS 판매 비중이 이 수준을 유지하는지가 수요 믹스 안정성의 점검 대상이다.']
          hun_new=next_id('2026-08-20','CN')
          hun['id']=hun_new
          hun['assigned_id']=hun_new
          hun['codex_review_fix']={'status':'PASS_EARLIEST_EVENT_DATE_REPAIRED','old_id':hun_old,'earliest_same_event_date':'2026-08-20','later_reconfirmation_date':'2026-08-25'}
          # Update any references to the unmerged old candidate id.
          for c in cards:
              if hun_old in (c.get('related') or []):
                  c['related']=[hun_new if x==hun_old else x for x in c['related']]
              rl=c.get('related_lineage')
              if isinstance(rl,dict) and hun_old in (rl.get('related_ids') or []):
                  rl['related_ids']=[hun_new if x==hun_old else x for x in rl['related_ids']]

          # --- Codex P2 #4: EcoPro — do not attribute precursor-customer adoption to LMR/Na-ion.
          byid={c['id']:c for c in cards}
          eco=byid['2026-08-04_KR_02']
          eco['sub']='Q2 그룹 매출 8208억원을 기록한 가운데 경영진은 LFP보다 LMR과 나트륨이온 개발에 집중한다고 밝혀, 중저가 소재 대응 전략을 두 기술 경로로 제시했다.'
          eco['gate']='핵심은 중저가 소재 대응이 LFP 한 경로로 수렴하지 않고 LMR과 나트륨이온으로 분기된다는 회사 전략이다. 두 기술의 개발 방향은 확인되지만 고객 적용이나 대규모 양산매출까지 확인된 것은 아니므로, 실제 제품 검증과 양산 출하가 다음 판단 기준이다.'
          eco['fact']='EcoPro의 Q2 그룹 매출은 8208억원으로 확인됐다. 실적 Q&A에서 회사는 LFP보다 LMR과 나트륨이온 개발에 집중하고 있다고 설명했다. 별도 보도에서 언급된 비중국 고객의 양산 적용 단계는 전구체 사업 관련 내용으로, LMR·나트륨이온 소재의 상업화 단계와는 구분된다.'
          eco['implication']=['중저가 양극재 대응에서 LMR과 나트륨이온이라는 차별화된 기술 경로가 확인됐다.','두 기술의 실제 고객 검증과 양산 출하가 상업화 판단의 다음 기준이다.']
          eco['codex_review_fix']={'status':'PASS_CLAIM_SCOPE_SEPARATED','note':'Precursor customer-adoption commentary is no longer used as evidence of LMR/Na-ion commercialization.'}

          # Reinsert Hunan in date/id order without disturbing stable existing-card relative order.
          stable_ids=[c['id'] for c in cards]
          def insert_sorted(c):
              key=(c.get('date',''),c.get('id',''))
              pos=next((i for i,old in enumerate(cards) if (old.get('date',''),old.get('id','')) < key),len(cards))
              cards.insert(pos,c)
          insert_sorted(hun)
          assert len(cards)==1431
          assert [x for x in [c['id'] for c in cards] if x in set(stable_ids)] == stable_ids

          # Prepare 29 new cards. Namespace all 19 reused ordinal specs while preserving originals.
          existing_specs={c.get('source_spec_id') for c in cards if c.get('source_spec_id')}
          original_spec_collisions=[s for s in STANDARD19 if s in existing_specs]
          assert len(original_spec_collisions)==9, original_spec_collisions
          prepared=[]
          source_order={id(c):i for i,c in enumerate(incoming)}
          for idx,c in enumerate(incoming):
              orig=c['source_spec_id']
              if orig in STANDARD19:
                  new_spec='20260814_161240_STANDARD_NEW_RUN__'+orig
                  c['source_spec_id_original']=orig
                  c['source_spec_id']=new_spec
                  c['source_spec_namespace_repair']={
                      'status':'PASS_RUN_QUALIFIED',
                      'original_source_spec_id':orig,
                      'reason':'The ordinal STD26_A namespace was already used in canonical by an earlier run; run-qualified transport ID prevents global lineage collision without changing card content.'
                  }
              else:
                  new_spec=orig
              assert new_spec not in existing_specs
              existing_specs.add(new_spec)
              c['manual_direct_add_authorization']={
                  'authorized':True,'authorized_by':'user','authorized_at_kst':'2026-08-28',
                  'formal_prompt_0_8_claimed':False,
                  'note':'User-directed manual direct add; Prompt 0.7 content state preserved, formal Prompt 0.7C/0.8 completion is not claimed.'
              }
              c['final_qc_provenance']={
                  'manual_direct_add':True,
                  'formal_prompt_0_7_pass':True,
                  'formal_prompt_0_7c_status':'BLOCKED_EDITORIAL_COMPLETENESS_UNPROVEN' if orig in STANDARD19 else 'NOT_RUN_FOR_COMBINED_29',
                  'prompt_0_8_authorized':False,
                  'source_run':'20260814_161240_STANDARD_NEW_RUN' if orig in STANDARD19 else '20260827_CURRENT_MAIN_STAGE_B_R0_PROMOTED10_R3_SCHEMA_COMPLETE_METADATA_LINEAGE_RERUN_R2',
                  'transport_sha256':EXPECTED_RAW_SHA
              }
              c['_editorial_transport_order']=idx
              prepared.append(c)

          # Duplicate screen against corrected 1,431-card branch.
          def norm(s): return re.sub(r'\s+',' ',(s or '').strip().lower())
          old_titles={norm(c.get('title')):c['id'] for c in cards if c.get('title')}
          old_fps={json.dumps(c.get('event_fingerprint'),ensure_ascii=False,sort_keys=True):c['id'] for c in cards if c.get('event_fingerprint')}
          old_urls={}
          for c in cards:
              for u in c.get('urls',[]) or []: old_urls.setdefault(u,[]).append(c['id'])
          url_overlap=[]
          for c in prepared:
              nt=norm(c.get('title'))
              assert nt not in old_titles, (c['source_spec_id'],'exact title collision',old_titles.get(nt))
              fp=c.get('event_fingerprint')
              if fp:
                  k=json.dumps(fp,ensure_ascii=False,sort_keys=True)
                  assert k not in old_fps, (c['source_spec_id'],'event fingerprint collision',old_fps.get(k))
              overlaps=sorted({oid for u in (c.get('urls') or []) for oid in old_urls.get(u,[])})
              if overlaps: url_overlap.append((c['source_spec_id'],overlaps))
              # Same-date/region highly similar title backstop.
              for old in cards:
                  if old.get('date')==c.get('date') and old.get('region')==c.get('region'):
                      sim=SequenceMatcher(None,nt,norm(old.get('title'))).ratio()
                      assert sim < 0.94, (c['source_spec_id'],'high title similarity',old['id'],sim)
          print('INFO exact URL overlaps (allowed only as shared-source context):',url_overlap)

          # Assign IDs by CARD_ID_STANDARD: signal first, then final-QC input editorial order; no reuse.
          sig_rank={'top':0,'high':1,'mid':2}
          groups={}
          for c in prepared: groups.setdefault((c['date'],c['region']),[]).append(c)
          for (date,region),group in groups.items():
              group.sort(key=lambda c:(sig_rank.get(c.get('signal'),9),c['_editorial_transport_order']))
              for c in group:
                  nid=next_id(date,region)
                  c['id']=nid; c['assigned_id']=nid
                  c['production_id_assigned_0_8']=False
                  c['production_id_assigned_manual_direct_add']=True
                  c['production_verified']=True
                  c['github_ready']=True; c['pr_candidate_ready']=True; c['state']='publish_ready'
                  del c['_editorial_transport_order']

          # All related IDs must resolve either to existing or another new card after production assignment.
          idset_after=set(c['id'] for c in cards) | set(c['id'] for c in prepared)
          for c in prepared:
              for rid in c.get('related',[]) or []:
                  assert rid in idset_after and rid != c['id'], (c['source_spec_id'],rid)

          # Insert new 29; preserve relative order of all corrected existing cards.
          corrected_existing_ids=[c['id'] for c in cards]
          for c in sorted(prepared,key=lambda x:(x['date'],x['id']),reverse=True): insert_sorted(c)
          assert len(cards)==1460, len(cards)
          ids=[c['id'] for c in cards]
          assert len(ids)==len(set(ids))==1460
          assert [x for x in ids if x in set(corrected_existing_ids)] == corrected_existing_ids

          # Global lineage + relation integrity.
          specs=[c.get('source_spec_id') for c in cards if c.get('source_spec_id')]
          assert len(specs)==len(set(specs)), 'global source_spec_id collision remains'
          idset=set(ids)
          dangling_after={(c['id'],rid) for c in cards for rid in (c.get('related') or []) if rid not in idset or rid==c['id']}
          assert dangling_after <= legacy_dangling_before, ('new dangling related edge introduced', sorted(dangling_after-legacy_dangling_before)[:20])
          assert not any(c.get('source_spec_id')=='20260827_EVENT_UNIVERSE_RECOVERY_P01P_SPEC_06' for c in cards)
          assert dup_id not in idset and pred_id in idset
          assert lnf_pred in (next(c for c in cards if c['id']=='2026-08-06_KR_04').get('related') or [])
          assert hun_old not in idset and any(c.get('source_spec_id')=='20260826_EARNINGS_FORMAL_PROMO_04' and c.get('date')=='2026-08-20' for c in cards)
          eco2=next(c for c in cards if c['id']=='2026-08-04_KR_02')
          assert 'LMR' in eco2['fact'] and '전구체 사업 관련 내용' in eco2['fact']
          assert len([c for c in cards if c.get('source_spec_id','').startswith('20260814_161240_STANDARD_NEW_RUN__STD26_A_')])==19
          assert len([c for c in cards if c.get('source_spec_id') in PROMOTED10])==10

          update_time=datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds')
          full['updated']=update_time; full['total']=1460
          FULL.write_text(json.dumps(full,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          lean_keys=['id','region','date','cat','sub_cat','signal','title','sub','gate','fact','implication','urls','related','fact_sources','source_tier','related_lineage']
          lean_cards=[{k:c[k] for k in lean_keys if k in c} for c in cards]
          lean={'updated':update_time,'total':1460,'schema':full.get('schema','cards_v1'),'sort':full.get('sort','date_desc_id_desc'),'cards':lean_cards}
          LEAN.write_text(json.dumps(lean,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # Final parse/order/sort checks.
          f=json.loads(FULL.read_text(encoding='utf-8')); l=json.loads(LEAN.read_text(encoding='utf-8'))
          assert f['total']==l['total']==1460 and len(f['cards'])==len(l['cards'])==1460
          assert [x['id'] for x in f['cards']]==[x['id'] for x in l['cards']]
          assert all(f['cards'][i].get('date','') >= f['cards'][i+1].get('date','') for i in range(len(f['cards'])-1))
          print('PASS: 1432 - 1 duplicate + 29 = 1460; four Codex P2 findings resolved; full/lean order identical; source_spec unique')
          PY
      - name: Validate diff and JSON
        shell: bash
        run: |
          git diff --check -- data/cards.full.json public/data/cards.json
          python -m json.tool data/cards.full.json >/dev/null
          python -m json.tool public/data/cards.json >/dev/null
          git status --short
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json
          git diff --cached --check
          git commit -m 'data: integrate 29 cards and resolve pre-merge QC'
          git push
