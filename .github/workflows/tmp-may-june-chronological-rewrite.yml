name: tmp-may-june-chronological-rewrite
on:
  push:
    branches:
      - chatgpt/rebuild-monthly-brief-2026-06
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rewrite June issue from May closing state forward
        run: |
          node <<'NODE'
          const fs=require('fs');
          const briefPath='public/data/monthly_briefs.json';
          const auditPath='runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json';
          const lib=JSON.parse(fs.readFileSync(briefPath,'utf8'));
          const briefs=Array.isArray(lib)?lib:lib.items;
          const b=briefs.find(x=>x.id==='monthly-brief-2026-06-r1');
          if(!b) throw new Error('June brief not found');
          b.executive_diagnosis='5월 말까지 ESS는 이미 대형 공급계약·프로젝트금융·장주기 조달·상업운전이 동시에 늘고 있었고, AI·데이터센터도 일부 저장 수요와 연결되기 시작했다. 6월의 변화는 이 흐름이 새로 생긴 것이 아니라 더 긴 수익계약과 더 구체적인 제도·기술 단계로 깊어졌다는 데 있다. 5년·20년 tolling과 20년 용량계약, 세액공제 지분금융이 이어졌고 8~10시간 저장과 LDES 정책선정이 전면에 나왔다. 차세대 저장은 5월의 전망·실증 전 단계에서 나트륨이온 인도 일정, CO₂·철공기 상업계약, 전고체 실차시험으로 전진했다. 공급망도 5월의 중국 집중·현지화·핵심광물 리스크에서 6월의 기업별 조달적격성·생산금융·기술권리·재생원료 인증·추적성 규칙으로 구체화됐다.';
          b.what_changed='5월 canonical 214건을 기준으로 보면 ESS의 성장, 금융조달, 장주기 조달과 AI 연계 수요는 이미 확인되고 있었다. 6월에는 그 방향성이 계약기간과 저장시간, 제도 실행단계에서 한 단계 더 구체화됐다. 단기 merchant 노출을 줄이는 5년·20년 tolling과 20년 용량계약이 등장했고, LDES 지원은 개별 프로젝트 조달에서 영국 잠정선정과 EU의 비구속적 국가 배치 공약으로 넓어졌다. 차세대 기술은 전망에서 고객계약·인도·실차검증으로 내려왔으며, 공급망·현지화는 국가 단위 논의에서 기업명단·EV 셀 생산금융·특허 라이선스·재생원료 인증·배터리패스포트 같은 운영 규칙으로 이동했다. AI·데이터센터는 5월부터 이어진 선택적 전력인프라 수요축을 보강했을 뿐 6월 ESS 전체를 설명하는 단일 원인은 아니다. SBTL 관점에서도 ESS·LFP 성장만으로 파우치필름 수요를 자동 환산하지 않으며, 실제 셀 폼팩터·고객프로그램·필름 공급계약이 확인될 때만 직접 수요 신호로 본다.';
          const flows=Object.fromEntries((b.key_flows||[]).map(f=>[f.id,f]));
          Object.assign(flows['01'],{
            title:'ESS 자산화, 5월의 금융·조달에서 6월의 장기수익계약으로 심화',
            summary:'5월에도 프로젝트금융, 최저수익 구조와 상업운전이 확인됐지만 6월에는 수익 안정성의 깊이가 달라졌다. 독일 300MW BESS의 5년 tolling, 애리조나 19MW·10시간 CO₂ 저장의 20년 tolling, 온타리오 8시간 BESS의 20년 용량계약이 이어졌고 텍사스 120MW·480MWh는 1억3,000만달러 세액공제 지분금융을 종결했다. 호주 Orana 415MW·1,660MWh는 상업운전에 들어갔다. 6월의 전진은 ESS 금융화의 시작이 아니라 계약기간·수익구조·운영단계가 함께 깊어진 데 있다.'
          });
          Object.assign(flows['02'],{
            title:'저장 수요, 5월의 프로젝트 확대에서 6월의 저장시간·제도설계로 분화',
            summary:'5월에는 장주기 조달과 AI 연계 ESS 계약이 이미 등장했다. 6월에는 글로벌 ESS 1분기 출하가 195.5GWh로 전년 대비 78% 늘어난 가운데, 영국이 LDES 16개 프로젝트를 잠정선정하고 EU가 법적 의무를 수반하지 않는 17개국의 2026~2028 저장 배치 공약을 첫 Tripartite Agreement로 묶었다. 일본은 축전지 전략을 축전지·전원 산업전략으로 넓혔고 T1 Energy는 KORE Power 인수 본계약으로 BESS·AI 데이터센터 인프라 진입을 추진했다. AI는 5월부터 이어진 선택적 수요축이며, 6월의 핵심 변화는 저장시간과 정책·전력시스템 설계의 세분화다.'
          });
          Object.assign(flows['03'],{
            title:'차세대 저장, 5월의 전망에서 6월의 고객계약·인도·실차검증으로 전진',
            summary:'5월에는 나트륨이온이 보완재로 평가되고 전고체는 본격 실증 전이라는 전망이 중심이었다. 6월에는 CATL이 나트륨이온 ESS의 9월 중국 인도 일정과 연내 1GWh 목표를 제시했고, Energy Dome과 Google은 아일랜드 23MW·200MWh CO₂ 배터리에 상업계약을 체결했으며 Ore Energy와 Buurttwice는 철공기 ESS 1GWh 계약을 맺었다. 전고체도 Factorial이 Stellantis 차량 통합 후 도로시험에 들어갔다. 상용화를 한 묶음으로 보지 말고 고객계약·인도·실차시험·COD의 단계 전진을 각각 확인해야 한다.'
          });
          Object.assign(flows['04'],{
            title:'공급망, 5월의 현지화·광물 리스크에서 6월의 기업별 적격성·금융규칙으로 구체화',
            summary:'5월에는 중국 공급망 집중과 미국·EU의 현지화 대응, 핵심광물 갈등이 큰 축이었다. 6월에는 그 리스크가 기업과 거래 단위 규칙으로 내려왔다. 미 국방부 1260H 목록에는 CATL·BYD·Trina 등이 추가됐지만 이는 일반 제재가 아니라 국방조달 제한이고, 중국은 미국 방산·희토류 기업에 이중용도 수출통제와 정부조달 금지를 적용했다. G7은 가격격차 보조·공동조달·가격하한을 검토수단으로 제시했고 EU는 EEA의 EV 배터리 셀 생산을 대상으로 15억유로 무이자대출 시설을 출범시켰다.'
          });
          Object.assign(flows['05'],{
            title:'현지화, 5월의 공장·공급망에서 6월의 기술권리·순환원료·추적성으로 확장',
            summary:'5월의 현지화 논의가 생산기지와 공급망 재편에 무게를 뒀다면 6월에는 무엇을 생산할 권리가 있는지, 어떤 원료와 데이터를 적격으로 인정할지가 전면에 나왔다. Ford 미시간 LFP 공장은 CATL 기술라이선스를 적용한 생산의도 시험셀 단계에 들어갔고, 한국은 재생원료 생산 인증제 시범사업을 시작했으며 일본에서는 AESC ESS 배터리패스포트의 실데이터 검증이 진행됐다. Tulip Innovation은 LG에너지솔루션·Panasonic의 LFP 특허권을 대표해 신왕다와 라이선스 계약을 맺었고 이에 따라 LG에너지솔루션–신왕다 특허분쟁이 종결됐다.'
          });
          b.watch=[
            '5년·20년 tolling과 20년 용량계약이 실제 금융 인출·착공·COD·가동률·현금흐름으로 이어지는지 확인한다.',
            '5월의 장주기 조달이 6월의 Ofgem 잠정선정·EU 비구속 배치 공약으로 넓어진 뒤 실제 입찰·인허가·보조금·기업 투자로 전환되는지 추적한다.',
            '5월 전망 단계에서 6월 고객계약·인도 일정·실차시험으로 전진한 나트륨이온·CO₂·철공기·전고체가 실제 납품·착공·COD·양산으로 넘어가는지 확인한다.',
            '미국 1260H와 중국 기업단위 수출·조달 제한, G7·EU 지원수단이 실제 고객조달·금융·공급계약 조건을 바꾸는지 본다.',
            'Ford LFP 시험셀, 재생원료 인증, 배터리패스포트와 IP 라이선스가 고객승인·상업출하·소재 적격성으로 이어지는지 확인한다.'
          ];
          fs.writeFileSync(briefPath,JSON.stringify(lib,null,2)+'\n');

          const a=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          a.audit_date='2026-09-16';
          a.method=[
            'Lock the post-#379 main canonical snapshot and reconstruct the May closing state from all 214 May-dated canonical cards because no official May Monthly Brief exists.',
            'Use May as the sole previous-month baseline for June delta formation; classify June flows as deepened, advanced, operationalized or expanded rather than treating already-present May signals as new.',
            'Review all 197 June cards and all 99 June top/high cards after the independent external gap closure, while preserving the June-only public reference contract.',
            'Apply a hindsight firewall: July, August and September events or later Monthly Brief conclusions are not evidence for the June thesis and may only be used as red-team context.',
            'Separate contract, financing, construction, commissioning and COD; announced GW/GWh is never treated as installed capacity.',
            'Treat AI/data-center demand as a selective power-infrastructure pull already visible in May, not a new June master cause.',
            'Apply a strict SBTL pouch lens: no pouch-film demand inference without form-factor, customer-program or supply-contract evidence.',
            'Require every public June reference to preserve the locked canonical title/date and use a governed title-supporting URL.'
          ];
          a.previous_month_baseline={
            month:'2026-05',
            official_monthly_brief_exists:false,
            reconstruction_basis:'article-date May canonical universe in the same locked post-#379 snapshot',
            canonical_card_count:214,
            signal_distribution:{top:9,high:135,mid:70},
            region_distribution:{GL:69,KR:56,US:31,CN:28,EU:23,JP:7},
            closing_window_card_count:41,
            baseline_state:[
              {theme:'ESS bankability and execution already present',finding:'May already contained project-financing closes, minimum-revenue/optimization structures, utility-scale COD and large ESS supply contracts.',evidence_card_ids:['2026-05-04_EU_01','2026-05-05_GL_01','2026-05-14_US_01','2026-05-27_KR_02']},
              {theme:'Long-duration procurement and storage policy already present',finding:'May already showed multi-GWh long-duration procurement and preliminary storage-market rule design, so June LDES evidence is a deepening of an existing direction.',evidence_card_ids:['2026-05-29_GL_07','2026-05-27_EU_01','2026-05-13_US_01']},
              {theme:'AI/data-center pull already visible',finding:'AI-linked storage/infrastructure cases appeared in May; June evidence reinforces and broadens this pull but does not originate it.',evidence_card_ids:['2026-05-27_KR_02','2026-05-29_GL_06','2026-05-11_GL_06']},
              {theme:'Next-generation technology still mostly outlook/pre-commercial',finding:'May evidence framed sodium-ion as a complement and solid-state as not yet at full demonstration, creating the baseline for June stage progression.',evidence_card_ids:['2026-05-20_GL_04','2026-05-27_GL_01']},
              {theme:'Localization and supply-chain risk still macro-structural',finding:'May emphasized China concentration, localization responses, critical-mineral risk and production-footprint shifts more than company-level eligibility, rights and traceability rules.',evidence_card_ids:['2026-05-20_GL_02','2026-05-20_GL_08','2026-05-29_GL_02','2026-05-29_EU_01']},
              {theme:'Circularity regulation entering the agenda',finding:'Korea had already advanced used-battery legislation in May; June moves further into production-certification implementation.',evidence_card_ids:['2026-05-20_KR_01']}
            ]
          };
          a.hindsight_firewall={
            thesis_evidence_cutoff:'2026-06-30',
            later_month_events_used_for_june_thesis:false,
            later_month_briefs_used_as_publication_authority:false,
            permitted_later_use:'red-team only; no July-August-September event may establish or upgrade a June claim'
          };
          a.delta_classification=[
            {flow_id:'01',classification:'DEEPENED',may_state:'Financing, revenue-floor structures and COD already existed.',june_change:'Longer 5-year/20-year tolling and 20-year capacity contracts deepen revenue visibility while tax-equity and COD continue execution evidence.'},
            {flow_id:'02',classification:'DEEPENED_AND_DIFFERENTIATED',may_state:'LDES procurement and AI-linked ESS demand were already visible.',june_change:'Duration, provisional LDES selection, non-binding EU deployment pledges and power-system strategy make the demand architecture more differentiated.'},
            {flow_id:'03',classification:'STAGE_ADVANCED',may_state:'Sodium-ion was mainly an outlook/complement story and solid-state remained pre-full-demonstration.',june_change:'Delivery schedules, commercial contracts and vehicle road testing create observable stage progression.'},
            {flow_id:'04',classification:'OPERATIONALIZED',may_state:'China concentration, localization and critical-mineral risk were macro-structural themes.',june_change:'Named-company procurement restrictions, export controls, considered price-support tools and EV-cell production finance turn the risk into transaction-level rules.'},
            {flow_id:'05',classification:'EXPANDED',may_state:'Localization centered on production footprint and integrated supply chains.',june_change:'Technology licensing, recycled-material certification, battery-passport verification and patent-right structures expand the localization boundary.'}
          ];
          a.independent_external_deep_dive.editorial_effect='The external June sweep remains additive to the chronological May→June comparison. It strengthens the evidence that May bankability/LDES/AI signals deepened in June through longer revenue contracts and more explicit policy architecture, while recycled-material certification expands the localization delta. It does not make AI a new or singular June master narrative.';
          for(const f of a.selected_flows||[]){
            const src=flows[f.id]; if(src) f.title=src.title;
          }
          const cl=Object.fromEntries(a.delta_classification.map(x=>[x.flow_id,x.classification]));
          for(const f of a.selected_flows||[]) f.delta_classification=cl[f.id]||null;
          if(a.official_source_selection) a.official_source_selection.selection_principle='Compact June-only anchors selected for decision relevance and for their ability to prove what deepened, advanced, operationalized or expanded relative to the reconstructed May closing state.';
          fs.writeFileSync(auditPath,JSON.stringify(a,null,2)+'\n');

          const tmp='runs/2026-09-16/may-june-delta-rebuild-r1';
          if(fs.existsSync(tmp)) fs.rmSync(tmp,{recursive:true,force:true});
          NODE
      - name: Validate chronological rewrite
        run: |
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          node <<'NODE'
          const fs=require('fs');
          const lib=JSON.parse(fs.readFileSync('public/data/monthly_briefs.json','utf8'));
          const briefs=Array.isArray(lib)?lib:lib.items;
          const b=briefs.find(x=>x.id==='monthly-brief-2026-06-r1');
          if(!b) throw new Error('missing June brief');
          if(!b.what_changed.includes('5월 canonical 214건')) throw new Error('missing explicit May baseline');
          if(!b.key_flows.find(x=>x.id==='02').summary.includes('법적 의무를 수반하지 않는')) throw new Error('EU non-binding caveat lost');
          if(!b.key_flows.find(x=>x.id==='04').summary.includes('EV 배터리 셀')) throw new Error('Battery Booster EV scope lost');
          if(!b.key_flows.find(x=>x.id==='05').summary.includes('Tulip Innovation')) throw new Error('Tulip party fix lost');
          const ford=b.refs.find(r=>r.id==='2026-06-30_US_02');
          if(!ford || !ford.url.includes('battery-tech.net')) throw new Error('Ford test-cell source fix lost');
          const a=JSON.parse(fs.readFileSync('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json','utf8'));
          if(a.previous_month_baseline?.canonical_card_count!==214) throw new Error('May baseline audit missing');
          if(a.hindsight_firewall?.later_month_events_used_for_june_thesis!==false) throw new Error('hindsight firewall missing');
          NODE
          git fetch origin main
          actual=$(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "$actual"
          test "$actual" = $'public/data/monthly_briefs.json\nruns/2026-09-15/monthly-brief-2026-06-editorial-audit.json'
      - name: Commit rewrite and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git add -A runs/2026-09-16/may-june-delta-rebuild-r1
          git rm .github/workflows/tmp-may-june-chronological-rewrite.yml
          git commit -m "refactor: rebuild June brief as May-to-June delta"
          git push
