name: Stage C Canonical Native Audit 2026-10-27
on:
  push:
    branches:
      - ops/stage-c-native-audit-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-c-readonly-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm pinned starting main and candidate scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/2026-10-27/stage-c/STAGE_C_LATEST_ACCEPTED_NATIVE_SCHEMA_V2_20261027.json')
          o=json.loads(p.read_text())
          assert o['base_main_commit_sha']=='805c2718d6daf40a219ae94242d9687e33ac3e88'
          assert o['base_full_blob_sha']=='07a91714e56be2a8bfad10ab63822f0c5cb3f06e'
          assert len(o['accepted_fact_safe'])==7
          assert len({c['source_spec_id'] for c in o['accepted_fact_safe']})==7
          assert len(o['stage_b_blocked_specs_preserved'])==1
          print('PASS pinned main/full, seven unique Stage C candidates, LGES hold preserved')
          PY
      - name: Native Stage C artifact contract
        run: |
          python validation_scripts/stage_artifact_contract_check.py C runs/2026-10-27/stage-c/STAGE_C_LATEST_ACCEPTED_NATIVE_SCHEMA_V2_20261027.json
      - name: Native Stage C lineage contract
        run: |
          python validation_scripts/stage_lineage_contract_check.py stage_c runs/2026-10-27/stage-c/STAGE_C_LATEST_ACCEPTED_NATIVE_SCHEMA_V2_20261027.json
      - name: Exact-Full current-baseline addability 0.4
        run: |
          python runs/2026-10-27/stage-c/stage_0_4_current_baseline_check.py
      - name: Native 0.4 artifact contract
        if: success()
        run: |
          python validation_scripts/stage_artifact_contract_check.py 0.4 runs/2026-10-27/stage-c/STAGE_0_4_CURRENT_BASELINE_ADDABILITY_20261027.json
      - name: Native 0.5 source owner and URL evidence QC
        run: |
          python validation_scripts/evidence_qc_v8_check.py runs/2026-10-27/stage-c/STAGE_0_4_CURRENT_BASELINE_ADDABILITY_20261027.json --json-report runs/2026-10-27/stage-c/STAGE_0_5_SOURCE_AUDIT_20261028.json
      - name: Create 0.5 fact/source traceability from verified Stage C
        run: |
          python runs/2026-10-27/stage-c/stage_0_5_evidence_claim_qc.py
      - name: Fetch exact locked main for downstream Prompt 0.6 provenance
        run: |
          git fetch --no-tags --depth=1 origin 805c2718d6daf40a219ae94242d9687e33ac3e88
          git cat-file -e 805c2718d6daf40a219ae94242d9687e33ac3e88:docs/llm_prompts/v1/08_PROMPT_0_6_Content_Polish.md
      - name: Native 0.5 evidence and claim handoff contract
        run: |
          python validation_scripts/stage_artifact_contract_check.py 0.5 runs/2026-10-27/stage-c/STAGE_0_5_EVIDENCE_SOURCE_CLAIM_QC_20261028.json
      - name: Native 0.5 owner and URL source audit
        run: |
          python validation_scripts/evidence_qc_v8_check.py runs/2026-10-27/stage-c/STAGE_0_5_EVIDENCE_SOURCE_CLAIM_QC_20261028.json --json-report runs/2026-10-27/stage-c/STAGE_0_5_NATIVE_SOURCE_AUDIT_20261028.json
      - name: Native-approved final 0.5 artifact status
        run: |
          python - <<'PY'
          import json, pathlib, hashlib, subprocess
          p=pathlib.Path("runs/2026-10-27/stage-c/STAGE_0_5_EVIDENCE_SOURCE_CLAIM_QC_20261028.json")
          o=json.loads(p.read_text())
          assert o["status"]=="PENDING_NATIVE_STAGE_0_5_VALIDATION"
          assert len(o["evidence_complete_and_source_claim_covered"])==7
          assert not o["addable_hold_source_gap"] and not o["addable_hold_claim_gap"]
          o["status"]="PASS_EVIDENCE_COMPLETE_AND_SOURCE_CLAIM_COVERED_AFTER_NATIVE_CHECKS"
          p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+"\n")
          subprocess.run(["python","validation_scripts/stage_artifact_contract_check.py","0.5",str(p)],check=True)
          subprocess.run(["python","validation_scripts/evidence_qc_v8_check.py",str(p)],check=True)
          print("NATIVE 0.5 FINAL PASS SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Upload native 0.5 claim-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage05-native-evidence
          path: |
            runs/2026-10-27/stage-c/STAGE_0_5_EVIDENCE_SOURCE_CLAIM_QC_20261028.json
            runs/2026-10-27/stage-c/STAGE_0_5_NATIVE_SOURCE_AUDIT_20261028.json
          if-no-files-found: warn
      - name: Stage 0.6 V5 case-specific substantive editorial audit (fail-closed triage)
        run: |
          python runs/2026-10-27/stage-c/stage_0_6_v5_editorial_audit.py
      - name: Native stage 0.6 passing bucket check
        run: |
          python - <<'PY'
          import json,subprocess,sys
          p="runs/2026-10-27/stage-c/STAGE_0_6_V5_NATIVE_PASS_ONLY_20261028.json"
          d=json.load(open(p))
          if not d["content_enriched_and_language_polished"]:
              print("STAGE06_STAGE_EXIT_BLOCKED: no native V5 deep-accepted candidate; no PASS claim")
              sys.exit(0)
          subprocess.run(["python","validation_scripts/stage_artifact_contract_check.py","0.6",p],check=True)
          if d["content_polish_hold"]:
              print("STAGE06_PARTIAL_PASS: only deep-accepted items; held remain open; no 0.7 authorization")
          else:print("STAGE06_FULL_PASS")
          PY
      - name: Upload 0.6 V5 case review and held decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage06-v5-editorial-audit
          path: |
            runs/2026-10-27/stage-c/STAGE_0_6_V5_CASE_SPECIFIC_AUDIT_20261028.json
            runs/2026-10-27/stage-c/STAGE_0_6_V5_NATIVE_PASS_ONLY_20261028.json
          if-no-files-found: warn
      - name: Export isolated 0.6 validator modules for reproducible local audit
        if: always()
        run: |
          tar czf /tmp/stage06-validator-modules.tar.gz validation_scripts
          cp /tmp/stage06-validator-modules.tar.gz runs/2026-10-27/stage-c/stage06-validator-modules.tar.gz
      - name: Upload isolated 0.6 validator modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage06-local-validator-modules
          path: runs/2026-10-27/stage-c/stage06-validator-modules.tar.gz
          if-no-files-found: error
      - name: Upload stage 0.4 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage04-native-audit
          path: runs/2026-10-27/stage-c/STAGE_0_4_CURRENT_BASELINE_ADDABILITY_20261027.json
          if-no-files-found: warn
