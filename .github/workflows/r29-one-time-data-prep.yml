name: R29 one-shot EV structural data PR staging — NO MERGE

on:
  push:
    branches:
      - news/ev-demand-export-divergence-20261017
    paths:
      - scripts/.r29_ephemeral_new_card.py
      - .github/workflows/r29-one-time-data-prep.yml

permissions:
  contents: write

jobs:
  materialize-validated-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history and exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard immutable base and prepare source-backed single card
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 6851fdbe4a25b30b7204d07708a1238123c14910)" = "6851fdbe4a25b30b7204d07708a1238123c14910"
          test "$(git rev-parse 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json)" = "1af792e2e80516e1ec1d7d9660c150b312168b21"
          python3 scripts/.r29_ephemeral_new_card.py
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > "$RUNNER_TEMP/r29-original-full.json"
      - name: Verify native V2 and V4 governs, schema, public projection
        shell: bash
        run: |
          set -euo pipefail
          manifest=direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance "$manifest"
          node scripts/validate_manual_direct_add.mjs --manifest "$manifest" --base "$RUNNER_TEMP/r29-original-full.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest "$manifest" --base "$RUNNER_TEMP/r29-original-full.json" --full data/cards.full.json
          node scripts/lean_cards.mjs --check
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/validate_manual_direct_add.mjs --self-test
          node scripts/validate_manual_direct_add_v4_hardening.mjs --self-test
      - name: Run repository test suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Stage ONLY Full, Lean, and direct-add record; remove temporary generator
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r29_ephemeral_new_card.py
          rm .github/workflows/r29-one-time-data-prep.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
             .github/workflows/r29-one-time-data-prep.yml \
             data/cards.full.json \
             direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json \
             public/data/cards.json \
             scripts/.r29_ephemeral_new_card.py | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected staged file paths — refusing to push" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(cards): stage September global EV demand and China retail/export divergence"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo 'Only three card data files remain in net PR diff, NO MERGE.'
