name: patch-structural-v3-review-4838008669

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch_structural_v3_review_4838008669.py
      - .github/workflows/patch-structural-v3-review-4838008669.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair repeated governance block handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch_structural_v3_review_4838008669.py')
          text = path.read_text(encoding='utf-8')
          for prefix, label in [
              ('stage_c', 'Stage C'),
              ('evidence', 'Evidence'),
              ('content', 'Content'),
          ]:
              old = f'{prefix} = replace_once({prefix}, old_docs, new_docs, "{label} required docs")'
              new = f'{prefix} = replace_all({prefix}, old_docs, new_docs, "{label} required docs and hierarchy", minimum=2)'
              if old not in text:
                  raise SystemExit(f'missing repair target: {old}')
              text = text.replace(old, new, 1)
              hierarchy = f'{prefix} = replace_once({prefix}, old_hierarchy, new_hierarchy, "{label} governance hierarchy")\n'
              if hierarchy not in text:
                  raise SystemExit(f'missing hierarchy target: {hierarchy}')
              text = text.replace(hierarchy, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply intervening-stage V3 patch
        run: python scripts/patch_structural_v3_review_4838008669.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          python -m unittest validation_scripts.tests.test_workflow_contracts
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align intervening stages with V3 anchor paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
