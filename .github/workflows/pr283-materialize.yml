name: pr283-reference-export

on:
  push:
    branches:
      - agent/publish-batch1-35-20260825

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publish-batch1-35-20260825
          fetch-depth: 0

      - name: Export authoritative Batch 1 validator references
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr283-reference"
          mkdir -p "$out/0-7c" "$out/0-8"
          git show origin/agent/batch1-35-0-7c-validator:validation_scripts/tests/fixtures/batch1_0_7c_r1.b64 > "$out/0-7c/batch1_0_7c_r1.b64"
          git show origin/agent/batch1-35-0-7c-validator:validation_scripts/tests/test_batch1_prompt_0_7c_r1.py > "$out/0-7c/test_batch1_prompt_0_7c_r1.py"
          git show origin/agent/batch1-35-0-8-runtime-gate:validation_scripts/tests/fixtures/batch1_35_runtime/independent-completeness-batch1-35.json > "$out/0-8/independent-completeness-batch1-35.json"
          git show origin/agent/batch1-35-0-8-runtime-gate:validation_scripts/tests/test_batch1_prompt_0_8_runtime_gate.py > "$out/0-8/test_batch1_prompt_0_8_runtime_gate.py"
          find "$out" -type f -maxdepth 3 -print -exec wc -c {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: pr283-authoritative-validator-references
          path: ${{ runner.temp }}/pr283-reference
          if-no-files-found: error
          retention-days: 1
