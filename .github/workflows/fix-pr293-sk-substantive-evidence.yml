name: Fix PR293 SK substantive evidence
on:
  push:
    branches:
      - chatgpt/pr289-review-remediation-1496
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr289-review-remediation-1496
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch SK evidence and recompute source audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "cedf3dbda66d8d3f9aeae7ef87e8e81f3da87396"
          test "$(git rev-parse origin/main:data/cards.full.json)" = "3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f"
          git show origin/main:data/cards.full.json > /tmp/base.cards.full.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'validation_scripts')
          from card_audit_utils import source_audit_measure, load_owner_registry, canonical_url

          full=Path('data/cards.full.json')
          d=json.loads(full.read_text(encoding='utf-8'))
          by={c['id']:c for c in d['cards']}
          mp=Path('direct-adds/pr289-review-remediation-1496/direct-add.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          ids=m['operations']['update']
          assert len(ids)==25 and len(d['cards'])==1496
          assert m['base_main_commit_sha']=='cedf3dbda66d8d3f9aeae7ef87e8e81f3da87396'
          assert m['base_full_blob_sha']=='3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f'

          c=by['2026-08-25_KR_01']
          assert c['source_diversity_status']=='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION'
          assert c.get('source_synthesis_applied') is False
          assert c.get('source_synthesis_fields')==[]
          notice_url='https://www.skinnovation.com/ir/notice/105'
          faq_url='https://www.skinnovation.com/ir/faq?type=etc_ir'
          assert len(c.get('fact_sources') or [])==1
          notice=c['fact_sources'][0]
          assert canonical_url(notice.get('source_url',''))==canonical_url(notice_url)

          # Narrow the visible wording to claims directly covered by the official SK materials.
          c['sub']='SK이노베이션은 8월 25일 이사회에서 합병계약 체결안을 의결했고, 합병기일은 2027년 1월 1일로 제시됐다.'
          if isinstance(c.get('implication'),list) and len(c['implication'])>=3:
              c['implication'][2]='SK이노베이션의 소규모합병 이사회 승인·채권자보호 절차와 2027년 1월 합병 효력 발생 여부가 다음 확인점이다.'

          # Keep the durable item-specific notice, but only claim what its visible title establishes.
          notice['supports']=['title']
          notice['source_contribution']='Durable item-specific SK Innovation notice anchors the official merger announcement; substantive merger terms are covered by the official Merger FAQ.'

          # Add body-level official same-owner evidence for the substantive visible terms.
          faq={
              'source_name':'SK Innovation Merger FAQ',
              'source_owner':'SK Innovation',
              'source_url':faq_url,
              'url':faq_url,
              'source_type':'company_primary_faq',
              'claim':'SK이노베이션-SKIET 합병의 이사회 일정, 합병비율, 효력일 및 재무·운영 목적',
              'source_quote':'merger ratio was set at 1 : 0.1174540; Board Resolution on the Execution of Merger Agreement — Aug 25, 2026; Effective Date — Jan 1, 2027',
              'source_quote_status':'official_material_quote_verified',
              'quote_status':'official_material_quote_verified',
              'evidence_role':'primary_event_evidence',
              'supports':['sub','fact','gate','implication'],
              'fetched_at':'2026-08-29T15:24:00+09:00',
              'fetch_method':'web_official_body_fetch',
              'fetch_status':'success',
              'http_status':200,
              'body_level':True,
              'source_role':'primary_event_evidence',
              'source_origin_type':'company_primary_faq',
              'source_contribution':'Official merger FAQ confirms the Aug. 25 board-resolution timeline, 1:0.1174540 merger ratio, Jan. 1, 2027 effective date, and rationale of stronger financial stability, business-risk mitigation, and operational efficiency.',
              'source_owner_id_normalized':'skinnovation.com',
              'source_url_canonical_complete':True,
              'resolved_article_matches_quote':True,
          }
          c['fact_sources']=[notice,faq]
          c['urls']=[notice_url,faq_url]

          # Synchronize ledger rows to the two current visible official evidence URLs.
          ledger=c.get('source_discovery_ledger') or []
          for row in ledger:
              if isinstance(row,dict) and canonical_url(str(row.get('source_url','')))==canonical_url(notice_url) and row.get('outcome')=='used_in_fact_sources':
                  row['unique_contribution']=notice['source_contribution']
                  row['visible_supports']=['title']
                  row['source_role']='primary_event_evidence'
                  row['source_origin_type']='company_primary_announcement'
                  row['checked_at']='2026-08-28T19:30:00+09:00'
          ledger=[row for row in ledger if not (isinstance(row,dict) and canonical_url(str(row.get('source_url','')))==canonical_url(faq_url))]
          ledger.append({
              'source_url':faq_url,
              'canonical_url':canonical_url(faq_url),
              'source_name':'SK Innovation Merger FAQ',
              'source_owner':'skinnovation.com',
              'source_domain':'skinnovation.com',
              'outcome':'used_in_fact_sources',
              'unique_contribution':faq['source_contribution'],
              'visible_supports':['sub','fact','gate','implication'],
              'source_role':'primary_event_evidence',
              'source_origin_type':'company_primary_faq',
              'checked_at':'2026-08-29T15:24:00+09:00'
          })
          c['source_discovery_ledger']=ledger

          c['source_url_resolution']={
              'supporting_fact_source_count':2,
              'canonical_complete':True,
              'resolved_article_matches_quote':True,
              'source_url_propagation_performed':True,
              'resolution_entries':[
                  {
                      'source_url':notice_url,
                      'canonical_complete':True,
                      'resolved_article_matches_quote':True,
                      'resolution_basis':'recomputed from current fact_sources; indices=0; owners=skinnovation.com',
                      'source_url_propagation_performed':True,
                  },
                  {
                      'source_url':faq_url,
                      'canonical_complete':True,
                      'resolved_article_matches_quote':True,
                      'resolution_basis':'official body-level Merger FAQ added as substantive same-owner primary evidence; indices=1; owners=skinnovation.com',
                      'source_url_propagation_performed':True,
                  },
              ]
          }

          exc=c.get('single_source_exception')
          assert isinstance(exc,dict) and exc.get('allowed') is True
          exc['reason']='The visible evidence set uses two official SK Innovation URLs but remains one independent editorial owner; no independent source adds a distinct visible claim.'
          exc['mitigation']='Retain the item-specific merger notice as the durable event anchor, add the official body-level Merger FAQ for substantive terms, and retain Seoul only as checked non-visible date corroboration.'

          # Single-owner exception remains correct; recompute every derived source measure from fact_sources.
          c['source_diversity_roles']={
              'primary_event_evidence':True,
              'independent_event_confirmation':False,
              'policy_market_context':False,
          }
          c['source_synthesis_applied']=False
          c['source_synthesis_fields']=[]
          c['source_synthesis_audit']=[]
          registry=load_owner_registry(Path('validation_data/source_owner_registry.json'))
          measure=source_audit_measure(c,registry)
          measure['status']=c['source_diversity_status']
          c['source_diversity_measure']=measure
          c['source_evidence_entry_count']=measure['source_evidence_entry_count']
          c['source_unique_url_count']=measure['source_unique_url_count']
          c['source_unique_domain_count']=measure['source_unique_domain_count']
          c['source_independent_owner_count']=measure['source_independent_owner_count']

          # Reviewer-specific closure assertions.
          assert len(c['fact_sources'])==2
          assert c['fact_sources'][0]['supports']==['title']
          fq=c['fact_sources'][1]
          assert canonical_url(fq['source_url'])==canonical_url(faq_url)
          assert {'sub','fact','gate','implication'}==set(fq['supports'])
          q=fq['source_quote']
          assert '0.1174540' in q and 'Aug 25, 2026' in q and 'Jan 1, 2027' in q
          assert 'financial stability' in fq['source_contribution'] and 'operational efficiency' in fq['source_contribution']
          assert '각각 이사회' not in c['sub']
          assert '이사회 승인·채권자보호' in c['implication'][2]
          assert measure['source_evidence_entry_count']==2
          assert measure['source_unique_url_count']==2
          assert measure['source_unique_domain_count']==1
          assert measure['source_independent_owner_count']==1
          assert measure['status']=='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION'
          assert set(c['source_url_resolution']['resolution_entries'][i]['source_url'] for i in range(2))==set(c['urls'])
          assert any(canonical_url(str(r.get('source_url','')))==canonical_url(faq_url) and r.get('outcome')=='used_in_fact_sources' and r.get('source_role')=='primary_event_evidence' and r.get('source_origin_type')=='company_primary_faq' and r.get('checked_at') for r in c['source_discovery_ledger'] if isinstance(r,dict))

          full.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/ids.json').write_text(json.dumps({'ids':ids}),encoding='utf-8')
          PY
          node scripts/lean_cards.mjs
      - name: Run bounded governance and reviewer-specific gates
        shell: bash
        run: |
          set -euo pipefail
          M=direct-adds/pr289-review-remediation-1496/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest "$M" --base /tmp/base.cards.full.json --full data/cards.full.json
          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file /tmp/ids.json
          python validation_scripts/evidence_qc_v8_check.py data/cards.full.json --new-id-file /tmp/ids.json
          python validation_scripts/related_lifecycle_check.py data/cards.full.json --require-contract --new-id-file /tmp/ids.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Remove temporary workflow and commit exact three-file PR shape
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-pr293-sk-substantive-evidence.yml
          git add data/cards.full.json public/data/cards.json
          git commit -m 'Strengthen SK merger evidence for PR293'
          git push origin HEAD:chatgpt/pr289-review-remediation-1496
