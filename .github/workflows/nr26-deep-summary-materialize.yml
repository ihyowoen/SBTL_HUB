name: nr26-deep-summary-materialize

on:
  push:
    branches:
      - remediate/nr26-deep-summary-20260919
    paths:
      - ".github/workflows/nr26-deep-summary-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nr26-deep-summary-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediate/nr26-deep-summary-20260919
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply bounded Deep Summary remediation
        shell: bash
        run: |
          set -euo pipefail
          BASE="34386663f1795aef6cb730f9320f6cae715a5c79"
          PATCH="tmp/nr26-deep-summary-patch.json"
          MANIFEST="direct-adds/2026-09-19-nr26-deep-summary/direct-add.json"

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse "$BASE:data/cards.full.json")" = "02eaeba219e7aa13749e7cdd70d77c2775f11dee"
          git show "$BASE:data/cards.full.json" > /tmp/cards.full.base.json

          mkdir -p "$(dirname "$MANIFEST")"

          node <<'NODE'
          const fs = require("fs");
          const PATCH_PATH = "tmp/nr26-deep-summary-patch.json";
          const FULL_PATH = "data/cards.full.json";
          const MANIFEST_PATH = "direct-adds/2026-09-19-nr26-deep-summary/direct-add.json";
          const patch = JSON.parse(fs.readFileSync(PATCH_PATH, "utf8"));
          const doc = JSON.parse(fs.readFileSync(FULL_PATH, "utf8"));
          const allowed = [...patch.allowed_changed_fields].sort();
          const OUTPUT_UPDATED = "2026-09-19T05:00:00Z";\n          const cards = doc.cards;
          const beforeCount = cards.length;
          const byId = new Map(cards.map(c => [c.id, c]));
          const ids = Object.keys(patch.rewrites);
          if (ids.length !== 34) throw new Error("expected 34 rewrites, got " + ids.length);

          const updates = [];
          let minFact = Infinity, maxFact = 0, sumFact = 0;
          for (const id of ids) {
            const card = byId.get(id);
            if (!card) throw new Error("missing card " + id);
            const before = JSON.parse(JSON.stringify(card));
            const rewrite = patch.rewrites[id];
            for (const field of allowed) {
              if (!(field in rewrite)) throw new Error(id + ": missing rewrite field " + field);
              card[field] = rewrite[field];
            }
            const allKeys = new Set([...Object.keys(before), ...Object.keys(card)]);
            const changed = [...allKeys].filter(k => JSON.stringify(before[k]) !== JSON.stringify(card[k])).sort();
            if (JSON.stringify(changed) !== JSON.stringify(allowed)) {
              throw new Error(id + ": changed fields " + JSON.stringify(changed) + " != " + JSON.stringify(allowed));
            }
            if (!Array.isArray(card.implication) || card.implication.length !== 3) {
              throw new Error(id + ": implication must have exactly 3 items");
            }
            const factLen = [...String(card.fact)].length;
            minFact = Math.min(minFact, factLen);
            maxFact = Math.max(maxFact, factLen);
            sumFact += factLen;
            updates.push({
              id,
              change_type: "content_correction",
              changed_fields: ["sub","gate","fact","implication"],
              reason: "Restore Deep Summary density for " + card.title + " without changing event identity, date, taxonomy, evidence, or Related lineage.",
              evidence_review_summary: "Visible copy was rewritten only from already-reviewed Stage B/C evidence, verified quantitative anchors, event-stage/date boundaries, and existing canonical predecessor context where applicable. No new event, source, identity, or Related claim was introduced."
            });
          }

          if (cards.length !== beforeCount) throw new Error("card count changed");
          doc.updated = OUTPUT_UPDATED;\n          fs.writeFileSync(FULL_PATH, JSON.stringify(doc));

          const manifest = {
            schema: "manual_direct_add_v2",
            status: "PASS",
            direct_add_id: "nr26-deep-summary-remediation-20260919",
            review_mode: "already_reviewed_bounded_direct_add",
            formal_full_run_claimed: false,
            base_main_commit_sha: patch.base_main_commit_sha,
            base_full_blob_sha: patch.base_full_blob_sha,
            expected_before: beforeCount,
            expected_after: cards.length,
            output_updated: OUTPUT_UPDATED,
            operations: { add: [], update: ids, id_migration: [] },
            editorial_attestation: {
              policy_version: "EMBEDDED_NEWS_VALUE_SELECTION_V4",
              additions: [],
              updates
            }
          };
          fs.writeFileSync(MANIFEST_PATH, JSON.stringify(manifest, null, 2) + "\n");
          console.log(JSON.stringify({
            updates: ids.length,
            card_count: cards.length,
            fact_length_min: minFact,
            fact_length_max: maxFact,
            fact_length_avg: Math.round(sumFact / ids.length)
          }, null, 2));
          NODE

          node scripts/lean_cards.mjs

          node scripts/validate_json_schema_subset.mjs \
            --schema schemas/manual-direct-add.v2.schema.json \
            --instance "$MANIFEST"
          node scripts/validate_manual_direct_add.mjs \
            --manifest "$MANIFEST" --base /tmp/cards.full.base.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs \
            --manifest "$MANIFEST" --base /tmp/cards.full.base.json --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json "$MANIFEST"
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Restore Deep Summary density for NR26 cards"
          git push origin HEAD:remediate/nr26-deep-summary-20260919
