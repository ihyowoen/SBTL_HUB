name: tmp-sep9-find-stage-a-authority

on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - .github/workflows/tmp-sep9-find-stage-a-authority.yml

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search current tree and reachable history
        shell: bash
        run: |
          set -euo pipefail
          OUT=runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/stage-a-authority-search.txt
          : > "$OUT"
          echo '=== CURRENT TREE files containing A_021 ===' >> "$OUT"
          grep -RIl --exclude-dir=.git 'STD26_0909_A_021' . | sort >> "$OUT" || true
          echo >> "$OUT"
          echo '=== CURRENT TREE files containing A_021 + selection_policy_version ===' >> "$OUT"
          python3 - <<'PY' >> "$OUT"
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              if '.git' in p.parts: continue
              try: s=p.read_text(errors='ignore')
              except: continue
              if 'STD26_0909_A_021' in s and 'selection_policy_version' in s:
                  print(p)
          PY
          echo >> "$OUT"
          echo '=== REACHABLE HISTORY candidate blobs ===' >> "$OUT"
          python3 - <<'PY' >> "$OUT"
          import subprocess
          seen=set(); hits=[]
          commits=subprocess.check_output(['git','rev-list','--all'], text=True).splitlines()
          for c in commits:
              try:
                  names=subprocess.check_output(['git','ls-tree','-r','--name-only',c], text=True).splitlines()
              except: continue
              for n in names:
                  if not n.endswith('.json'): continue
                  low=n.lower()
                  if not ('stage-a' in low or 'stage_a' in low or '/stages/' in low): continue
                  key=(c,n)
                  try:
                      blob=subprocess.check_output(['git','rev-parse',f'{c}:{n}'], text=True).strip()
                  except: continue
                  if blob in seen: continue
                  seen.add(blob)
                  try:
                      s=subprocess.check_output(['git','show',f'{c}:{n}'], text=True, stderr=subprocess.DEVNULL)
                  except: continue
                  if 'STD26_0909_A_021' in s and 'selection_policy_version' in s:
                      hits.append((c,blob,n,len(s)))
          for row in hits:
              print('\t'.join(map(str,row)))
          print('HIT_COUNT',len(hits))
          PY
          cat "$OUT"
      - name: Commit search report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/stage-a-authority-search.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Sep9 Stage A authority search'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
