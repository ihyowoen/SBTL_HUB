name: cleanup-pr233-pyc

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/structural-news-value-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove generated bytecode and workflow
        run: |
          find validation_scripts -type f -path '*/__pycache__/*.pyc' -delete
          rm -f .github/workflows/cleanup-pr233-pyc.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove generated Python bytecode"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
