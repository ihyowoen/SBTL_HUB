name: tmp-audit-lineage-shape

on:
  push:
    branches:
      - agent/audit-lineage-shape-20260808

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit legacy related_lineage shapes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const counts = {
            total: doc.cards.length,
            valid_related_ids_array: 0,
            absent_related_lineage: 0,
            null_related_lineage: 0,
            non_object_related_lineage: 0,
            object_missing_related_ids: 0,
            related_ids_non_array: 0,
            invalid_objects_with_other_keys: 0,
          };
          const invalidKeyCounts = {};
          const samples = [];
          for (const card of doc.cards) {
            const has = Object.prototype.hasOwnProperty.call(card, 'related_lineage');
            if (!has) { counts.absent_related_lineage++; continue; }
            const rl = card.related_lineage;
            if (rl === null) { counts.null_related_lineage++; continue; }
            if (typeof rl !== 'object' || Array.isArray(rl)) { counts.non_object_related_lineage++; if (samples.length < 25) samples.push({id:card.id, shape:typeof rl, value:rl}); continue; }
            if (Array.isArray(rl.related_ids)) { counts.valid_related_ids_array++; continue; }
            if (Object.prototype.hasOwnProperty.call(rl, 'related_ids')) counts.related_ids_non_array++;
            else counts.object_missing_related_ids++;
            const keys = Object.keys(rl).filter(k => k !== 'related_ids');
            if (keys.length) {
              counts.invalid_objects_with_other_keys++;
              for (const key of keys) invalidKeyCounts[key] = (invalidKeyCounts[key] || 0) + 1;
              if (samples.length < 25) samples.push({id:card.id, keys, related:card.related, related_lineage:rl});
            }
          }
          const summary = { counts, invalidKeyCounts, samples };
          console.log(JSON.stringify(summary, null, 2));
          const compact = JSON.stringify({counts, invalidKeyCounts, samples});
          console.log(`::notice title=lineage-shape-audit::${compact}`);
          if (counts.valid_related_ids_array + counts.absent_related_lineage + counts.null_related_lineage + counts.non_object_related_lineage + counts.object_missing_related_ids + counts.related_ids_non_array !== counts.total) {
            throw new Error('accounting mismatch');
          }
          NODE
