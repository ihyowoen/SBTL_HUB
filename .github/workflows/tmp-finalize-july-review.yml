name: tmp-finalize-july-review
on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-07
    paths:
      - .github/workflows/tmp-finalize-july-review.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-07
          fetch-depth: 0
      - name: Apply fail-closed final review remediation
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "cdfdd3ec9dedad71dc2aac2d0f6b824e1e881448"
          python - <<'PY'
          import json
          from pathlib import Path

          brief_path=Path('public/data/monthly_briefs.json')
          audit_path=Path('runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')
          data=json.loads(brief_path.read_text())
          issue=next(x for x in data['items'] if x['id']=='monthly-brief-2026-07-r1')
          assert len(issue['refs'])==24
          refs={r['id']:r for r in issue['refs']}
          flows={f['id']:f for f in issue['key_flows']}
          assert refs['2026-07-22_US_01']['url'].startswith('https://blackstone.com/')
          assert refs['2026-07-16_CN_03']['url'].startswith('https://news.mysteel.com/')
          assert '83.3%' in flows['03']['summary']
          assert '15년 장기 PPA' in flows['01']['summary']
          assert '2026-07-22_GL_01' in issue['source_card_ids']
          assert '2026-07-01_CN_01' in issue['source_card_ids']

          # Keep Aypa's Blackstone binding for the ~$7bn transaction title; remove unsupported capacity figures from watch.
          issue['watch'][0]='Aypa Power 인수계약이 실제 거래종결로 이어지는지, 인수 이후 포트폴리오 실행이 COD 자산 확대로 이어지는지 확인한다.'

          # Elena: selected public ref proves the 1TWh PPA, not the separate 15-year duration.
          flows['01']['summary']=flows['01']['summary'].replace('Grenergy의 Elena는 15년 장기 PPA를,','Grenergy의 Elena는 1TWh 야간 PPA를,')

          # Spring Hill card is quarantined already; remove residual watch premise.
          issue['watch'][2]=issue['watch'][2].replace('Spring Hill·','',1)

          # China traction battery: narrow publication-layer visible claim to what Mysteel alone supports.
          lfp='2026-07-16_CN_03'
          refs[lfp]['title']='중국 6월 동력배터리 탑재 76.5GWh…전년 대비 31.5% 증가'
          flows['03']['summary']=flows['03']['summary'].replace('중국 6월 동력배터리 탑재량도 전년 대비 31.5% 증가했고 LFP 비중은 83.3%에 달했다.','중국 6월 동력배터리 탑재량도 76.5GWh로 전년 대비 31.5% 증가했다.')

          # Quarantine Mt Holland: locked article URL is truncated and cannot identify the cited article.
          mt='2026-07-22_GL_01'
          issue['source_card_ids']=[x for x in issue['source_card_ids'] if x!=mt]
          flows['04']['card_ids']=[x for x in flows['04']['card_ids'] if x!=mt]
          flows['04']['title']='핵심광물 현지화, 협력선언에서 오프테이크·가공·수익성으로 내려옴'
          flows['04']['summary']=flows['04']['summary'].replace('VHM은 Goschen 희토류 정광의 장기 오프테이크를 확보했고, Wesfarmers·SQM은 Mt Holland 리튬정광 생산능력을 연 38만톤에서 76만톤으로 확대하는 FID를 내렸다. 한국 Sangdong은','VHM은 Goschen 희토류 정광의 장기 오프테이크를 확보했고, 한국 Sangdong은')
          issue['executive_diagnosis']=issue['executive_diagnosis'].replace('핵심광물 현지화는 오프테이크·최종투자결정·가공·투자·수익성 확인으로 구체화됐다.','핵심광물 현지화는 오프테이크·가공·투자·수익성 확인으로 구체화됐다.')
          issue['what_changed']=issue['what_changed'].replace('핵심광물은 단순 협력선언보다 오프테이크·FID·가공·투자·수익성 확인 단계로 이동했다.','핵심광물은 단순 협력선언보다 오프테이크·가공·투자·수익성 확인 단계로 이동했다.')

          # Quarantine GB 38031 card: canonical URL is malformed; do not silently substitute a tracker-only URL in publication.
          gb='2026-07-01_CN_01'
          issue['source_card_ids']=[x for x in issue['source_card_ids'] if x!=gb]
          flows['05']['card_ids']=[x for x in flows['05']['card_ids'] if x!=gb]
          flows['05']['title']='관세·세제·접속 규칙, 원가를 넘어 시장진입과 기술선택을 분기'
          flows['05']['summary']=flows['05']['summary'].replace(' 중국은 9월부터 리튬이온 배터리에 2% 소비세를 적용하고 나트륨이온·고체전지에는 한시 면세를 두는 제도를 7월 확정했으며, EV 구동용 배터리 안전표준도 새 단계로 들어갔다.',' 중국은 9월부터 리튬이온 배터리에 2% 소비세를 적용하고 나트륨이온·고체전지에는 한시 면세를 두는 제도를 7월 확정했다.')
          issue['executive_diagnosis']=issue['executive_diagnosis'].replace('관세·세제·안전·접속 규칙도','관세·세제·접속 규칙도')

          issue['refs']=[r for r in issue['refs'] if r['id'] not in {mt,gb}]
          for n,r in enumerate(issue['refs'],1): r['n']=n

          issue['qc']['notes']='Rebuilt independently from the governed July universe of 365 cards (75 top, 239 high, 51 mid). Legacy Vol.09 was consulted only after the independent thesis was locked. Exact-head Codex red-team found compound-claim/source-binding and canonical URL defects; six non-indispensable cards are quarantined and 22 official canonical anchors remain. Publication-layer wording is narrowed where a governed source supports only a subset of a compound canonical title.'
          issue['approval']['notes']='Re-authorized after exact-head Codex remediation. Partial-source claims, malformed/truncated canonical URLs, quarantined-card watch residue and audit provenance inconsistencies were removed without silently mutating canonical cards inside the publication PR.'

          audit=json.loads(audit_path.read_text())
          # Method must describe the final evidence contract and final cardinality.
          audit['method']=[
            s.replace('Select a compact 24-card official evidence set and bind every public ref to a governed fact source that explicitly supports the card title.','Select a compact 22-card official evidence set and require each public URL to support the complete published reference title; quarantine a card or narrow only the publication-layer title when a compound canonical title exceeds one URL.')
            for s in audit['method']
          ]

          # August tax follow-up was already canonical at the declared baseline.
          pc=audit['post_month_counterevidence'][0]
          assert pc['status']=='LATE_NON_CANONICAL_RESEARCH_SIGNAL'
          pc['status']='LATE_CANONICAL_COUNTEREVIDENCE'
          pc['card_id']='2026-08-27_CN_02'

          oss=audit['official_source_selection']
          assert oss['selected_card_count']==24
          oss['selected_card_count']=22
          oss['selection_principle']='Decision-relevant canonical anchors proving the five flows under a complete-published-claim source-binding rule; compound cards are quarantined or publication-layer titles are narrowed when one governed URL does not support every canonical-title component.'
          oss['source_card_ids']=[x for x in oss['source_card_ids'] if x not in {mt,gb}]
          bindings={b['id']:b for b in oss['binding']}
          # Keep Aypa on Blackstone for transaction-value title; watch no longer carries Brookfield-only capacity claims.
          assert bindings['2026-07-22_US_01']['selected_url'].startswith('https://blackstone.com/')
          # Only complete-title sources may certify these rebound references.
          bindings['2026-07-29_US_02']['title_supporting_urls']=[bindings['2026-07-29_US_02']['selected_url']]
          bindings['2026-07-01_KR_05']['title_supporting_urls']=[bindings['2026-07-01_KR_05']['selected_url']]
          # Publication-layer narrowed LFP title is fully supported by Mysteel.
          bindings[lfp]['title_supporting_urls']=[bindings[lfp]['selected_url']]
          bindings[lfp]['publication_title_override']=refs[lfp]['title']
          bindings[lfp]['publication_title_scope_reason']='Canonical compound title includes an 83.3% LFP-share component supported by a separate source; the official brief publishes only the 76.5GWh / +31.5% claim supported by the selected Mysteel URL.'
          oss['binding']=[b for b in oss['binding'] if b['id'] not in {mt,gb}]

          af={f['id']:f for f in audit['selected_flows']}
          af['04']['title']='핵심광물 현지화, 협력선언에서 오프테이크·가공·수익성으로 내려옴'
          af['04']['reason']='Offtake, processing start and early profitability move localization from policy intent toward executable supply-chain assets without treating investment approval as production.'
          af['04']['anchor_card_ids']=[x for x in af['04']['anchor_card_ids'] if x!=mt]
          af['05']['title']='관세·세제·접속 규칙, 원가를 넘어 시장진입과 기술선택을 분기'
          af['05']['reason']='Tariff, tax, equipment-approval and connection rules change eligibility, landed cost and technology choice; scope precision is essential.'
          af['05']['anchor_card_ids']=[x for x in af['05']['anchor_card_ids'] if x!=gb]
          for item in audit['rejected_or_narrowed_narratives']:
            if item['narrative'].startswith('핵심광물 FID·가공개시'):
              item['narrative']='핵심광물 가공개시·초기 흑자는 곧바로 안정 생산과 장기 현금흐름을 뜻한다'
              item['reason']='Processing start and early quarterly profit represent different maturity stages and do not by themselves establish stable long-run output or cash flow.'

          tri=audit['card_integrity_triage']
          qids={x['id'] for x in tri['quarantined_cards']}
          if mt not in qids:
            tri['quarantined_cards'].append({'id':mt,'class':'CARD_SOURCE_BINDING','reason':'Locked The Australian URL is truncated at /news-story/ and cannot identify the cited article supporting the visible Mt Holland claim.'})
          if gb not in qids:
            tri['quarantined_cards'].append({'id':gb,'class':'CARD_SOURCE_BINDING','reason':'Locked English.gov.cn URL duplicates the hostname in the path and does not resolve to the cited GB 38031-2025 article; publication does not silently substitute tracker-only provenance.'})

          audit['qc']['codex_review_5195864531']='REMEDIATED_P1_P2_FINDINGS'
          audit['qc']['source_binding']='PASS_AFTER_COMPLETE_PUBLISHED_CLAIM_REMEDIATION'
          audit['qc']['post_month_classification']='PASS_LATE_CANONICAL_COUNTEREVIDENCE'
          audit['qc']['canonical_defect_quarantine']='PASS_WITH_SIX_NON_INDISPENSABLE_CARDS_QUARANTINED'

          # Fail closed on intended final state.
          assert len(issue['refs'])==22 and len(issue['source_card_ids'])==22
          assert mt not in issue['source_card_ids'] and gb not in issue['source_card_ids']
          assert mt not in flows['04']['card_ids'] and gb not in flows['05']['card_ids']
          assert refs['2026-07-22_US_01']['url'].startswith('https://blackstone.com/')
          assert '6.5GW' not in issue['watch'][0] and '20GW' not in issue['watch'][0]
          assert '15년' not in flows['01']['summary']
          assert 'Spring Hill' not in issue['watch'][2]
          assert '83.3%' not in flows['03']['summary'] and '83.3%' not in refs[lfp]['title']
          assert pc['status']=='LATE_CANONICAL_COUNTEREVIDENCE' and pc['card_id']=='2026-08-27_CN_02'
          assert bindings['2026-07-29_US_02']['title_supporting_urls']==[bindings['2026-07-29_US_02']['selected_url']]
          assert bindings['2026-07-01_KR_05']['title_supporting_urls']==[bindings['2026-07-01_KR_05']['selected_url']]
          assert oss['selected_card_count']==22
          assert len(oss['source_card_ids'])==22 and len(oss['binding'])==22
          assert all(x not in json.dumps(issue,ensure_ascii=False) for x in ['Wesfarmers·SQM','GB 38031-2025'])
          assert any(x['id']==mt for x in tri['quarantined_cards']) and any(x['id']==gb for x in tri['quarantined_cards'])

          brief_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate publication
        run: |
          npm ci
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s' 'public/data/monthly_briefs.json' 'runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')"
          test "$changed" = "$expected"
      - name: Commit remediated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/monthly_briefs.json runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json
          git commit -m "fix: close July Monthly Brief Codex findings"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-07
