name: tmp-monthly-brief-relock-20260910

on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-08

permissions:
  contents: write

jobs:
  relock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Relock official August Monthly Brief to remediated canonical
        shell: bash
        run: |
          set -euo pipefail
          BASE='8f3b6c3277d7cd13ccfc48f3c72a5d1ecb5d7c58'
          BLOB='beb2aa7615b583b4c9c0c269974601a0b26c2684'
          git fetch origin main --force
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" origin/main
          [[ "$(git rev-parse "${BASE}:data/cards.full.json")" == "$BLOB" ]]
          git show "${BASE}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.locked.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const locked=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cards.full.locked.json','utf8'));
          if (locked.total!==1617 || locked.cards.length!==1617) throw new Error(`locked total mismatch ${locked.total}/${locked.cards.length}`);
          const august=locked.cards.filter(c=>String(c.date||'').startsWith('2026-08-'));
          const countBy=(key)=>Object.fromEntries([...august.reduce((m,c)=>m.set(c[key],(m.get(c[key])||0)+1),new Map()).entries()].sort());
          const signals=countBy('signal');
          const regions=countBy('region');
          const expectedSignals={high:121,mid:16,top:31};
          const expectedRegions={CN:32,EU:26,GL:48,JP:2,KR:25,US:35};
          if(august.length!==168) throw new Error(`August universe changed: ${august.length}`);
          if(JSON.stringify(signals)!==JSON.stringify(expectedSignals)) throw new Error(`August signal distribution changed: ${JSON.stringify(signals)}`);
          if(JSON.stringify(regions)!==JSON.stringify(expectedRegions)) throw new Error(`August region distribution changed: ${JSON.stringify(regions)}`);
          const byId=new Map(locked.cards.map(c=>[c.id,c]));
          const old300=byId.get('2026-08-05_US_03');
          const j=byId.get('2026-08-26_CN_02');
          if(!old300 || old300.urls?.[0]!=='https://www.pv-magazine.com/2026/08/06/orsted-turns-on-500-mwh-battery-project-with-co-located-solar-in-texas/') throw new Error('Old300 canonical remediation missing');
          if(!j || j.title!=='CATL Jianxiawo EIA 접수 공시 철회…재가동 절차 다시 후퇴') throw new Error('Jianxiawo canonical remediation missing');

          const briefPath='public/data/monthly_briefs.json';
          const brief=JSON.parse(fs.readFileSync(briefPath,'utf8'));
          if(!Array.isArray(brief.items)||brief.items.length!==1) throw new Error('unexpected monthly brief library shape');
          const item=brief.items[0];
          if(item.id!=='monthly-brief-2026-08-r1') throw new Error(`unexpected issue ${item.id}`);
          const oldDiagnosis='8월 배터리 산업의 핵심 변화는 성장률 자체보다 어디에서 실제로 돈이 투입되고, 어떤 자산이 가동되며, 어떤 조건으로 공급망이 잠기는가로 판단 기준이 이동한 것이다. ESS는 장기 수익계약·금융종결·착공·상업운전이 여러 지역에서 동시에 이어지며 전력 인프라 자산으로 자리잡는 흐름이 뚜렷해졌고, 셀·소재 생산은 EV 단일 수요가 아니라 ESS·LFP·복수 화학계와 고객 믹스에 맞춰 재배치됐다. 동시에 정책과 전략자본은 원료·재활용·전력망 장비와 디지털 보안까지 공급망 통제 범위를 넓혔다.';
          if(item.executive_diagnosis!==oldDiagnosis) throw new Error('executive diagnosis changed upstream; refuse blind rewrite');
          item.executive_diagnosis='8월 배터리 산업의 핵심 변화는 성장률 자체보다 어디에서 실제로 돈이 투입되고, 어떤 자산이 가동되며, 어떤 조건으로 공급망이 잠기는가로 판단 기준이 이동한 것이다. ESS는 장기 수익계약·금융종결·착공·상업운전이 여러 지역에서 동시에 이어지며 전력 인프라 자산으로 자리잡는 흐름이 뚜렷해졌고, 셀·소재 공급전략에서는 EV 단일 수요에서 벗어나 ESS·LFP·복수 화학계와 고객 믹스를 함께 고려하는 재배치 방향이 생산개시·제품계획·공급계약을 통해 구체화됐다. 동시에 정책과 전략자본은 원료·재활용·전력망 장비와 디지털 보안까지 공급망 통제 범위를 넓혔다.';
          const flow2=item.key_flows?.find(f=>f.id==='02');
          if(!flow2 || flow2.title!=='생산자산, EV 단일축에서 용도·화학계 혼합으로 재배치') throw new Error('flow02 title changed upstream');
          flow2.title='생산자산, EV 단일축에서 용도·화학계 혼합 재배치 방향 구체화';
          brief.updated_at='2026-09-10';
          item.published_at='2026-09-10';
          item.source_baseline={main_commit_sha:'8f3b6c3277d7cd13ccfc48f3c72a5d1ecb5d7c58',full_blob_sha:'beb2aa7615b583b4c9c0c269974601a0b26c2684',source_month_count:168};
          if(item.qc?.notes) item.qc.notes=item.qc.notes.replace('locked 1,599-card baseline','locked 1,617-card baseline');
          fs.writeFileSync(briefPath,JSON.stringify(brief,null,2)+'\n');

          const auditPath='runs/2026-09-09/monthly-brief-2026-08-editorial-audit.json';
          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          if(audit.issue_id!=='monthly-brief-2026-08-r1') throw new Error('unexpected audit issue');
          audit.audit_date='2026-09-10';
          audit.baseline.main_commit_sha='8f3b6c3277d7cd13ccfc48f3c72a5d1ecb5d7c58';
          audit.baseline.cards_full_blob_sha='beb2aa7615b583b4c9c0c269974601a0b26c2684';
          audit.baseline.total_canonical_cards=1617;
          audit.baseline.month_card_count=168;
          audit.baseline.signal_distribution={top:31,high:121,mid:16};
          audit.baseline.region_distribution={GL:48,US:35,CN:32,EU:26,KR:25,JP:2};
          const af2=audit.selected_flows?.find(f=>f.id==='02');
          if(!af2 || af2.title!=='생산자산, EV 단일축에서 용도·화학계 혼합으로 재배치') throw new Error('audit flow02 title changed upstream');
          af2.title='생산자산, EV 단일축에서 용도·화학계 혼합 재배치 방향 구체화';
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          console.log('PASS relock:', {total:locked.total, august:august.length, signals, regions});
          NODE
          npm ci
          npm run validate:monthly-briefs
          npx vitest run __tests__/monthlyBriefPublication.test.js __tests__/monthlyBriefProvenance.test.js __tests__/monthlyBriefProductBoundary.test.js __tests__/monthlyBriefSelection.test.js __tests__/monthlyBriefActiveDomain.test.js __tests__/quickAnalysisLabels.test.js
          npm test
          npm run build
          git diff --check
      - name: Commit validated relock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/monthly_briefs.json runs/2026-09-09/monthly-brief-2026-08-editorial-audit.json
          git commit -m 'Relock August Monthly Brief to remediated canonical'
          git push
