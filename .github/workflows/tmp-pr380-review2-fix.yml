name: tmp-pr380-review2-fix
on:
  push:
    branches:
      - chatgpt/rebuild-monthly-brief-2026-06
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact-head review fixes
        shell: python
        run: |
          from pathlib import Path

          monthly = Path('public/data/monthly_briefs.json')
          audit = Path('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json')
          m = monthly.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')

          replacements = [
            (
              'EU는 역내 배터리 셀 생산에 15억유로 무이자대출 시설을 출범시켰다.',
              'EU는 역내 EV 배터리 셀 생산에 15억유로 무이자대출 시설을 출범시켰다.'
            ),
            (
              'LG에너지솔루션은 신왕다와 특허 라이선스 계약으로 독일·중국·한국 분쟁을 종결했다.',
              'Tulip Innovation은 LG에너지솔루션·Panasonic의 LFP 특허권을 대표해 신왕다와 라이선스 계약을 체결했고, 이에 따라 LG에너지솔루션과 신왕다의 관련 특허 분쟁도 종결됐다.'
            ),
          ]
          for old, new in replacements:
            if old not in m:
              raise SystemExit(f'missing monthly text: {old}')
            m = m.replace(old, new, 1)

          old_url = 'https://battery-news.de/en/2026/07/01/ford-catl-battery-project-in-michigan-begins-production'
          new_url = 'https://battery-tech.net/battery-markets-news/ford-launches-u-s-lfp-ev-battery-cell-production/'
          if old_url not in m:
            raise SystemExit('missing Ford URL in monthly brief')
          m = m.replace(old_url, new_url, 1)
          if old_url not in a:
            raise SystemExit('missing Ford URL in editorial audit')
          a = a.replace(old_url, new_url)

          monthly.write_text(m, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Validate Monthly Brief
        run: npm run validate:monthly-briefs
      - name: Run full tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit fixes and remove helper
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git rm .github/workflows/tmp-pr380-review2-fix.yml
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git commit -m "fix: tighten June brief review provenance"
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
