name: R28 prepare two source-verified card additions (never merge)

on:
  push:
    branches: [news/r28-20261017-source-verified-lfp]
    paths:
      - 'scripts/.r28_generator_20261017.py.gz.b64'
      - '.github/workflows/r28-one-time-prep.yml'

permissions:
  contents: write

jobs:
  generate-review-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify sealed builder content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,base64,gzip
          from pathlib import Path
          encoded=Path('scripts/.r28_generator_20261017.py.gz.b64').read_text().strip()
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='e76728108d1aab7d1029ee2836e8b51f44ec979f588c7042aacd8807036f0474'
          raw=gzip.decompress(compressed)
          assert len(raw)==16565
          assert hashlib.sha256(raw).hexdigest()=='ccd52da8ef2c40c6adfffbad04cd2c87333135c6aad750817852885a04f91dff'
          Path('scripts/.r28_bootstrap.py').write_bytes(raw)
          print('PASS: source builder SHA256 exact')
          PY
      - name: Generate canonical two-card direct add
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.r28_bootstrap.py
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > /tmp/r28-base-full.json
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base /tmp/r28-base-full.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base /tmp/r28-base-full.json --full data/cards.full.json
          node scripts/lean_cards.mjs --check
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          git diff --check
      - name: Unit tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove transient code and commit only governed three files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r28_bootstrap.py scripts/.r28_generator_20261017.py.gz.b64 .github/workflows/r28-one-time-prep.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/r28-one-time-prep.yml \
            data/cards.full.json \
            direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json \
            public/data/cards.json \
            scripts/.r28_generator_20261017.py.gz.b64 | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: unexpected data file scope" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat(cards): source-reviewed SK On and Samsung SDI LFP contract transitions"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "PASS: only Full / Lean / direct-add reviewed artifacts, no merge."
