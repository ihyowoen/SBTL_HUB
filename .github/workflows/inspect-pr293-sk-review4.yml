name: Close PR293 Codex review4
on:
  push:
    branches:
      - chatgpt/pr289-review-remediation-1496
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close-review4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lock current main and canonical baseline
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          test "$(git rev-parse origin/main)" = "cedf3dbda66d8d3f9aeae7ef87e8e81f3da87396"
          test "$(git rev-parse origin/main:data/cards.full.json)" = "3b2e86b320cac2b8ab9e9c1035aa026fc47fed2f"
          git show origin/main:data/cards.full.json > /tmp/pr293-base-full.json
      - name: Apply four Codex review findings atomically
        run: |
          node <<'NODE'
          const fs=require('fs');
          const fullPath='data/cards.full.json';
          const manifestPath='direct-adds/pr289-review-remediation-1496/direct-add.json';
          const full=JSON.parse(fs.readFileSync(fullPath,'utf8'));
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const cards=Array.isArray(full)?full:(full.cards||[]);
          const card=cards.find(x=>x.id==='2026-08-25_KR_01');
          if(!card) throw new Error('SK card missing');
          const faqUrl='https://www.skinnovation.com/ir/faq?type=etc_ir';
          const faq=(card.fact_sources||[]).find(s=>(s.source_url||s.url)===faqUrl);
          if(!faq) throw new Error('SK merger FAQ source missing');

          // Body-level snippets from the official SK Innovation Merger FAQ.
          // Keep the retained quote concise while directly covering rationale, ratio, board timing and effective date.
          faq.source_quote='"enhance the financial stability"; "proactively manage risks"; "improve overall operational efficiency"; "1 : 0.1174540"; "Board Resolution ... Aug 25, 2026"; "Effective Date ... Jan 1, 2027"';
          faq.claim='SK이노베이션-SKIET 합병의 재무안정성·위험관리·운영효율 목적, 1:0.1174540 합병비율, 8월 25일 이사회 결의 및 2027년 1월 1일 효력일';
          faq.source_contribution='Official merger FAQ directly supports the Aug. 25 board-resolution timing, 1:0.1174540 merger ratio, Jan. 1, 2027 effective date, and the stated rationale of financial stability, proactive risk management, and operational efficiency.';
          faq.source_published_date='2026-08-25';
          faq.visible_quote_date='2026-08-25';
          faq.supports=['sub','fact','gate','implication'];

          // Narrow the analytical follow-up to the dated merger execution point actually retained in evidence.
          if(Array.isArray(card.implication) && card.implication.length>=3){
            card.implication[2]='8월 25일 합병계약 이사회 의결 이후 2027년 1월 1일 합병 효력 발생 여부가 다음 확인점이다.';
          }

          // Keep discovery ledger contribution synchronized with the retained FAQ evidence.
          const faqLedger=(card.source_discovery_ledger||[]).find(r=>r.source_url===faqUrl);
          if(faqLedger){
            faqLedger.unique_contribution=faq.source_contribution;
            faqLedger.visible_supports=[...faq.supports];
          }

          // Card-level propagation remains true for the repaired notice URL; the newly added FAQ is not a propagated repair.
          const resolution=card.source_url_resolution;
          if(!resolution || !Array.isArray(resolution.resolution_entries)) throw new Error('SK source_url_resolution missing');
          const faqResolution=resolution.resolution_entries.find(r=>r.source_url===faqUrl);
          if(!faqResolution) throw new Error('FAQ resolution row missing');
          faqResolution.source_url_propagation_performed=false;
          resolution.source_url_propagation_performed=true;

          // Both retained official evidence URLs resolve to the same Aug. 25 event/publication date.
          if(card.date_role){
            card.date_role.publication_dates=['2026-08-25'];
            card.date_role.source_publication_dates=['2026-08-25'];
          }

          // One final mutation timestamp shared by canonical, public projection and manifest.
          const now=new Date();
          const kst=new Date(now.getTime()+9*60*60*1000).toISOString().replace('Z','+09:00');
          full.updated=kst;
          manifest.output_updated=kst;

          fs.writeFileSync(fullPath,JSON.stringify(full,null,2)+'\n');
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          console.log('FINAL_OUTPUT_TIMESTAMP='+kst);
          NODE
      - name: Regenerate lean projection
        run: node scripts/lean_cards.mjs
      - name: Reviewer-specific assertions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const full=JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const lean=JSON.parse(fs.readFileSync('public/data/cards.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('direct-adds/pr289-review-remediation-1496/direct-add.json','utf8'));
          const card=full.cards.find(x=>x.id==='2026-08-25_KR_01');
          const faqUrl='https://www.skinnovation.com/ir/faq?type=etc_ir';
          const faq=card.fact_sources.find(s=>(s.source_url||s.url)===faqUrl);
          const faqRes=card.source_url_resolution.resolution_entries.find(r=>r.source_url===faqUrl);
          const must=['financial stability','manage risks','operational efficiency','0.1174540','Aug 25, 2026','Jan 1, 2027'];
          for(const token of must) if(!faq.source_quote.includes(token)) throw new Error('FAQ quote missing '+token);
          if(faq.source_published_date!=='2026-08-25'||faq.visible_quote_date!=='2026-08-25') throw new Error('FAQ source dates not restored');
          if(faqRes.source_url_propagation_performed!==false) throw new Error('FAQ must not be marked propagated');
          if(card.source_url_resolution.source_url_propagation_performed!==true) throw new Error('card-level repaired-notice propagation must remain true');
          if(full.updated!==manifest.output_updated||lean.updated!==full.updated) throw new Error('output timestamps not synchronized');
          if(Date.parse(full.updated)<=Date.parse(faq.fetched_at)) throw new Error('output timestamp must postdate final evidence fetch');
          if((card.implication||[]).some(x=>/채권자보호|소규모합병/.test(x))) throw new Error('unsupported procedural implication remains');
          if(card.evidence_resolution!=='PASS_OFFICIAL_OR_PRIMARY_SINGLE_SOURCE_EXCEPTION') throw new Error('SK evidence resolution changed unexpectedly');
          if(card.source_synthesis_applied!==false||!Array.isArray(card.source_synthesis_fields)||card.source_synthesis_fields.length) throw new Error('SK synthesis state changed unexpectedly');
          console.log('PASS: Codex review4 assertions');
          NODE
      - name: Validate bounded direct-add and canonical data
        run: |
          node scripts/validate_manual_direct_add.mjs \
            --manifest direct-adds/pr289-review-remediation-1496/direct-add.json \
            --base /tmp/pr293-base-full.json \
            --full data/cards.full.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs
          node scripts/lean_cards.mjs --check
      - name: Restore exact three-file PR shape and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/inspect-pr293-sk-review4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json direct-adds/pr289-review-remediation-1496/direct-add.json
          git commit -m "Close PR293 Codex review 5057506141"
          git push