name: R25 one-time data PR preparation (no merge)

on:
  push:
    branches:
      - news/structural-misread-r25-4-cards-20261016
    paths:
      - scripts/.r25_generator_20261016.py.gz.b64
      - .github/workflows/r25-one-time-data-pr-prep.yml

permissions:
  contents: write

jobs:
  build-data-for-human-review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact R25 preparation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify and decompress source-reviewed card builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          data=base64.b64decode(Path('scripts/.r25_generator_20261016.py.gz.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='7edeef04e547e1375b682ba433b3714f664763022afd228aa4e027b4cdc749a7'
          builder=gzip.decompress(data)
          assert hashlib.sha256(builder).hexdigest()=='b31c3c9d3d7167eaf86fc567e825fbcbf25a8a87b5caadb5c39d3fd4a1d256cc'
          Path('scripts/.r25_bootstrap_build.py').write_bytes(builder)
          print('PASS: original verified builder 16,904 bytes')
          PY

      - name: Generate 4 actual structural cards in Full and Lean
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.r25_bootstrap_build.py
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > /tmp/r25-base-full.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-16-structural-misread-4/direct-add.json --base /tmp/r25-base-full.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-16-structural-misread-4/direct-add.json --base /tmp/r25-base-full.json --full data/cards.full.json
          node scripts/lean_cards.mjs --check
          node scripts/validate_json_schema_subset.mjs --self-test
          node scripts/validate_manual_direct_add.mjs --self-test
          node scripts/validate_manual_direct_add_v4_hardening.mjs --self-test

      - name: Run repository unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Remove temporary generator; commit only 3 governed data artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r25_bootstrap_build.py
          rm scripts/.r25_generator_20261016.py.gz.b64
          rm .github/workflows/r25-one-time-data-pr-prep.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/r25-one-time-data-pr-prep.yml \
            data/cards.full.json \
            direct-adds/2026-10-16-structural-misread-4/direct-add.json \
            public/data/cards.json \
            scripts/.r25_generator_20261016.py.gz.b64 | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected files in preparation commit:" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(cards): add four source-reviewed structural industry events (manual direct-add v2)"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "PASS: 1,674 → 1,678. Branch contains only Full, Lean, and V2 add-manifest relative to main; human review required; no merge."
