name: Inspect 0.0C observation structure

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-inspect-handoff425.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect both source 0.0C payloads
        shell: bash
        run: |
          git fetch origin chatgpt/v4-run-20260831 chatgpt/v4-run-20260901
          python3 - <<'PY'
          import json, subprocess
          sources=[
            ('20260831','origin/chatgpt/v4-run-20260831','runs/2026-09-02/stage_0_0c_coverage_discovery_20260831_143419_V4.json'),
            ('20260901','origin/chatgpt/v4-run-20260901','runs/2026-09-02/stage_0_0c_coverage_discovery_20260901_123511_V4.json'),
          ]
          for tag,ref,path in sources:
              raw=subprocess.check_output(['git','show',f'{ref}:{path}'])
              o=json.loads(raw.decode('utf-8-sig'))
              print('=== SOURCE',tag,'bytes',len(raw),'===')
              print('TOP_KEYS',sorted(o.keys()))
              for k,v in o.items():
                  if isinstance(v,list):
                      print('LIST',k,'count',len(v))
                      if v:
                          first=v[0]
                          print(' FIRST_TYPE',type(first).__name__)
                          if isinstance(first,dict):
                              print(' FIRST_KEYS',sorted(first.keys()))
                              print(' FIRST_SAMPLE',json.dumps(first,ensure_ascii=False)[:5000])
                  elif isinstance(v,dict):
                      print('DICT',k,'keys',sorted(v.keys())[:80])
                  elif k in ('run_id','status','story_count','candidate_count','event_count','observation_count','base_main_commit_sha'):
                      print('SCALAR',k,repr(v))
          PY
