name: tmp-polish-june-monthly-language

on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-06

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Polish Korean terminology
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('public/data/monthly_briefs.json')
          lib=json.loads(p.read_text())
          issue=next(x for x in lib['items'] if x.get('id')=='monthly-brief-2026-06-r1')
          issue['executive_diagnosis']=issue['executive_diagnosis'].replace('merchant 기대만으로 개발하는 설비','시장가격 수익만 기대하는 설비')
          issue['what_changed']=issue['what_changed'].replace('장기 capacity contract, tax equity','장기 용량계약, 세액공제 지분금융')
          issue['key_flows'][0]['title']='ESS, 수익계약·금융·COD로 자산화'
          p.write_text(json.dumps(lib,ensure_ascii=False,indent=2)+'\n')
          a=pathlib.Path('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json')
          audit=json.loads(a.read_text())
          audit['selected_flows'][0]['title']='ESS, 수익계약·금융·COD로 자산화'
          a.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          PY
          rm .github/workflows/tmp-polish-june-monthly-language.yml
      - name: Validate
        run: |
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
      - name: Commit polish
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add -A public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json .github/workflows/tmp-polish-june-monthly-language.yml
          git commit -m "fix: polish June Monthly Brief language"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-06
