name: Review 4868539997 remediation

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - ".github/workflows/review-4868539997-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused review fixes
        run: python validation_scripts/review_4868539997_remediation.py

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run focused review regression
        run: python -m unittest validation_scripts.tests.test_review_4868539997_contracts -v

      - name: Run full workflow-contract regression suite
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit remediation and remove temporary files
        run: |
          rm validation_scripts/review_4868539997_remediation.py
          rm .github/workflows/review-4868539997-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address review 4868539997"
          git push origin HEAD:agent/structural-news-value-v3
