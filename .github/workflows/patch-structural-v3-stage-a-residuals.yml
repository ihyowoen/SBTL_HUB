name: patch-structural-v3-stage-a-residuals

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch_structural_v3_stage_a_residuals.mjs
      - .github/workflows/patch-structural-v3-stage-a-residuals.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply residual wording patch
        run: node scripts/patch_structural_v3_stage_a_residuals.mjs
      - name: Validate and commit
        run: |
          set -euo pipefail
          python -m unittest validation_scripts.tests.test_workflow_contracts
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove residual Stage A execution-only wording"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
