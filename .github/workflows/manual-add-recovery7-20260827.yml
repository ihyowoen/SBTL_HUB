name: Manual add recovery 7

on:
  push:
    paths:
      - '.github/workflows/manual-add-recovery7-20260827.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add seven cards and regenerate lean projection
        shell: bash
        env:
          RECOVERY7_B64_GZ: ''
        run: |
          python - <<'PY'
          import base64, gzip, json, os, subprocess
          from pathlib import Path

          expected_before = 1425
          expected_after = 1432
          update_time = '2026-08-27T16:08:18+09:00'
          full_path = Path('data/cards.full.json')
          lean_path = Path('public/data/cards.json')
          new_cards = json.loads(gzip.decompress(base64.b64decode(os.environ['RECOVERY7_B64_GZ'])).decode('utf-8'))
          assert len(new_cards) == 7
          full = json.loads(full_path.read_text(encoding='utf-8'))
          cards = full['cards']
          assert len(cards) == expected_before, (len(cards), expected_before)
          before_ids = [c['id'] for c in cards]
          assert len(before_ids) == len(set(before_ids))
          new_ids = [c['id'] for c in new_cards]
          assert len(new_ids) == len(set(new_ids)) == 7
          assert not (set(before_ids) & set(new_ids)), sorted(set(before_ids) & set(new_ids))
          cards.extend(new_cards)
          cards.sort(key=lambda c: (c.get('date',''), c.get('id','')), reverse=True)
          assert len(cards) == expected_after
          ids = [c['id'] for c in cards]
          assert len(ids) == len(set(ids)) == expected_after
          assert set(before_ids).issubset(ids)
          idset = set(ids)
          for c in new_cards:
              assert c.get('publish_ready') is True
              assert c.get('manual_direct_add_authorization',{}).get('authorized') is True
              for rid in c.get('related',[]) or []:
                  assert rid in idset and rid != c['id']
          full['updated'] = update_time
          full['total'] = expected_after
          full_path.write_text(json.dumps(full, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lean_keys = ['id','region','date','cat','sub_cat','signal','title','sub','gate','fact','implication','urls','related','fact_sources','source_tier','related_lineage']
          lean_cards = []
          for c in cards:
              lean_cards.append({k:c[k] for k in lean_keys if k in c})
          lean = {
              'updated': update_time,
              'total': expected_after,
              'schema': full.get('schema','cards_v1'),
              'sort': full.get('sort','date_desc_id_desc'),
              'cards': lean_cards,
          }
          lean_path.write_text(json.dumps(lean, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print('materialized', len(new_cards), 'cards; total', len(cards))
          PY
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json
          git diff --cached --check
          git commit -m 'data: add 7 recovery publish-ready cards'
          git push
