name: tmp-monthly-card-remediation-r2

on:
  push:
    branches:
      - chatgpt/monthly-brief-card-remediation-20260910-r2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and validate bounded card remediation
        shell: bash
        run: |
          set -euo pipefail
          BASE='31a5129836c0ff1392a9d47319bd75ea25ff2f05'
          BLOB='eb094ac30f3d85ea95da197c157ad353ff892960'
          git cat-file -e "${BASE}^{commit}"
          [[ "$(git rev-parse "${BASE}:data/cards.full.json")" == "$BLOB" ]]
          git show "${BASE}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'data/cards.full.json';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (doc.total !== 1617 || doc.cards.length !== 1617) throw new Error(`expected 1617 cards, got total=${doc.total} cards=${doc.cards.length}`);
          const byId = new Map(doc.cards.map(c => [c.id, c]));
          const old300 = byId.get('2026-08-05_US_03');
          const j = byId.get('2026-08-26_CN_02');
          if (!old300 || !j) throw new Error('target card missing');
          const solar='https://www.solarpowerworldonline.com/2026/08/orsted-adds-500-mwh-of-tesla-bess-to-ercot-grid/';
          const pv='https://www.pv-magazine.com/2026/08/06/orsted-turns-on-500-mwh-battery-project-with-co-located-solar-in-texas/';
          const esn='https://www.energy-storage.news/orsted-puts-500mwh-old-300-texas-bess-into-operation/';
          const expectedUrls=[solar,pv,esn];
          if (JSON.stringify(old300.urls)!==JSON.stringify(expectedUrls)) throw new Error(`Old300 urls changed upstream: ${JSON.stringify(old300.urls)}`);
          old300.urls=[pv,esn,solar];
          const oldTitle='CATL Jianxiawo 환경절차 다시 후퇴…Benchmark, 2026 생산전망 3.2만t LCE로 하향';
          const oldSub='8월 26일 환경접수 예정 공시 철회…Benchmark 종전 6.25만t 전망 대비 약 절반';
          const oldGate='Jianxiawo 재가동 기대가 환경절차 재검증과 독립기관 공급전망 하향으로 다시 후퇴했다.';
          const oldActor='CATL Jianxiawo 환경절차 다시 후퇴…Benchmark';
          const oldAnchor='이춘시 환경당국은 8월 26일 Jianxiawo 광산 EIA 보고서의 접수 예정 공시를 철회하고 재검증 뒤 다시 공시하겠다고 밝혔다. Benchmark는 9월 1일 광산이 care and maintenance 상태로 돌아갔다고 평가하고 2026년 생산전망을 62,500t에서 32,000t LCE로 낮췄다. 후자의 생산전망은 Benchmark 추정치다.';
          if (j.title!==oldTitle || j.sub!==oldSub || j.gate!==oldGate || j?.event_fingerprint?.actor!==oldActor || j?.event_fingerprint?.factual_anchor!==oldAnchor) {
            throw new Error('Jianxiawo upstream state changed; refuse blind patch');
          }
          j.title='CATL Jianxiawo EIA 접수 공시 철회…재가동 절차 다시 후퇴';
          j.sub='8월 26일 환경접수 예정 공시 철회…재검증 뒤 재공시 예정';
          j.gate='Jianxiawo 재가동 기대가 EIA 접수 공시 철회로 다시 후퇴했다. 다음 확인 지점은 재공시·최종 환경승인·실제 재가동 여부다.';
          j.event_fingerprint.actor='CATL Jianxiawo EIA 접수 공시 철회';
          j.event_fingerprint.factual_anchor='이춘시 환경당국은 8월 26일 Jianxiawo 광산 EIA 보고서의 접수 예정 공시를 철회하고 재검증 뒤 다시 공시하겠다고 밝혔다.';
          const now = new Date().toISOString();
          doc.updated=now;
          fs.writeFileSync(path, JSON.stringify(doc,null,2)+'\n');
          const manifest={
            schema:'manual_direct_add_v2', status:'PASS', direct_add_id:'MONTHLY_BRIEF_CARD_REMEDIATION_20260910_R2',
            review_mode:'already_reviewed_bounded_direct_add', formal_full_run_claimed:false,
            base_main_commit_sha:'31a5129836c0ff1392a9d47319bd75ea25ff2f05',
            base_full_blob_sha:'eb094ac30f3d85ea95da197c157ad353ff892960',
            expected_before:1617, expected_after:1617, output_updated:now,
            operations:{add:[],update:['2026-08-05_US_03','2026-08-26_CN_02'],id_migration:[]},
            editorial_attestation:{policy_version:'EMBEDDED_NEWS_VALUE_SELECTION_V4',additions:[],updates:[
              {id:'2026-08-05_US_03',change_type:'evidence_update',changed_fields:['urls'],reason:'Monthly Brief downstream QC found that urls[0] pointed to a co-location/context source while the visible title is the commercial-operation claim. Reorder existing governed URLs so a title/fact-supporting COD source is primary without changing any fact or event identity.',evidence_review_summary:'The locked card already contains pv magazine and Energy-Storage.News evidence supporting title/fact for Old 300 commercial operation; Solar Power World remains retained for co-location/independent-operation context.'},
              {id:'2026-08-26_CN_02',change_type:'correction',changed_fields:['event_fingerprint','gate','sub','title'],reason:'Monthly Brief downstream QC found that the Aug-26 event card headline had absorbed a Sep-1 Benchmark forecast, blurring the representative-event/month boundary. Re-anchor the visible headline and event fingerprint to the Aug-26 EIA-acceptance-notice withdrawal while retaining later Benchmark evidence as dated reinforcement inside the governed evidence package.',evidence_review_summary:'The Aug-26 Eastmoney/Shanghai Securities News report establishes the EIA acceptance-notice withdrawal and re-verification step. Benchmark Sep-1 and Northern Miner Sep-2 remain valid later reinforcement but no longer control the Aug-26 card title, sub, gate, or event anchor.'}
            ]}
          };
          const dir='direct-adds/2026-09-10-monthly-brief-card-remediation-r2';
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(`${dir}/direct-add.json`,JSON.stringify(manifest,null,2)+'\n');
          NODE
          node scripts/lean_cards.mjs
          MANIFEST='direct-adds/2026-09-10-monthly-brief-card-remediation-r2/direct-add.json'
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance "$MANIFEST"
          node scripts/validate_manual_direct_add.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Commit validated canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.full.json public/data/cards.json direct-adds/2026-09-10-monthly-brief-card-remediation-r2/direct-add.json
          git commit -m 'Fix Monthly Brief card integrity findings on current main'
          git push
