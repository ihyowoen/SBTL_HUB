name: Address Codex review 4816445737

on:
  push:
    branches:
      - agent/og-image-enrichment

permissions:
  contents: write

concurrency:
  group: address-review-4816445737
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-image-enrichment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/address-review-4816445737.mjs
      - run: npm test
      - run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: address image enrichment review feedback"
          git pull --rebase origin agent/og-image-enrichment
          git push origin HEAD:agent/og-image-enrichment
