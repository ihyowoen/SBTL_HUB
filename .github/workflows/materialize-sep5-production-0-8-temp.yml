name: Materialize Sep5 production Prompt 0.8 temp
# R11 Codex remediation rebuild from exact frozen baseline

on:
  push:
    branches: [chatgpt/validate-20260905-r1]
    paths:
      - .github/workflows/materialize-sep5-production-0-8-temp.yml
      - validation_temp/20260905-r1/materialize_production_0_8.py

permissions:
  contents: write
  actions: read

concurrency:
  group: sep5-production-0-8-materialization
  cancel-in-progress: false

jobs:
  materialize-and-push-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: builder
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen production baseline
        uses: actions/checkout@v4
        with:
          ref: eb1a311ed378fcdf547b52ad5da0652cb9f1fc62
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact frozen baseline and live main
        working-directory: work
        run: |
          set -euo pipefail
          git fetch origin main chatgpt/production-20260905-r8-9 --quiet
          BASE=eb1a311ed378fcdf547b52ad5da0652cb9f1fc62
          OLD_HEAD=7466afe22d0a7c7016d34d71e8e0837c63256970
          BLOB=707fe5ea9836a0c2341771397da32c818a95cbed
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/chatgpt/production-20260905-r8-9)" = "$OLD_HEAD"
          test "$(git rev-parse ${BASE}:data/cards.full.json)" = "$BLOB"
          test "$(git hash-object data/cards.full.json)" = "$BLOB"
          test -z "$(git status --porcelain)"
          echo "RESULT: PASS_EXACT_FROZEN_MAIN_AND_STALE_PR_HEAD_LOCK"

      - name: Download exact R11 certified 0.7C artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ihyowoen/SBTL_HUB/actions/artifacts/10021379057/zip \
            -o /tmp/sep5-r11-0-7c.zip
          echo "5fe2a7ba0bec2a99d09a2456d6568cad5d769fe0b8cdcc4ffc31b086c2d8deb8  /tmp/sep5-r11-0-7c.zip" | sha256sum -c -
          mkdir -p work/runs/2026-09-07/r7-20260905-production-r1
          unzip -q /tmp/sep5-r11-0-7c.zip -d work/runs/2026-09-07/r7-20260905-production-r1
          test -s work/runs/2026-09-07/r7-20260905-production-r1/card-run.json
          test -s work/runs/2026-09-07/r7-20260905-production-r1/stage-0-7c.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('work/runs/2026-09-07/r7-20260905-production-r1')
          run=json.load(open(root/'card-run.json',encoding='utf-8'))
          c=json.load(open(root/'stage-0-7c.json',encoding='utf-8'))
          expected_ops='7899d373343332dac7b4e9e7000edc439a9c2b28ff5990f3d0d7088efbe1cd3e'
          expected_hashes={
            'stage_a':'5e2a35eba6f58155d3e8ce128c1cc2f72122a80295d188619cbcc64ae1b29d0e',
            'stage_b':'33dcc9600bc5ef60478f4bd8f22c129d22bbf83508676707cbb7b6e6be6583cd',
            'stage_c':'ce699c68e81af7b29a73e350fc710d66328e42c96951291262db377f09e4ecda',
            'stage_0_4':'c6dd3d2b5493360daf16a0d1b1a55593dbcc163f1be6bba027f7296906289972',
            'stage_0_5':'ab5b6033dc105a014ae9616e5f90098b197cd741c8889eeef06197d960436da9',
            'stage_0_6':'132e169d4685ad475e98c632e9b9624bc74e7612df2f26fbe3daf04b54c7c06f',
            'stage_0_7':'ca69e3952e0a617c312d951cdcb8a96244b5ab4188670c0eececbdbe0df0dd08',
          }
          def stable(v):
            if isinstance(v,list): return [stable(x) for x in v]
            if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
            return v
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          op_sha=hashlib.sha256(json.dumps(stable(run['operations']),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          assert op_sha==expected_ops
          assert c['reviewed_operations_sha256']==expected_ops
          assert c['operation_freeze']['operations_sha256']==expected_ops
          assert c['operation_freeze']['insert']==9 and c['operation_freeze']['update']==0 and c['operation_freeze']['related_add']==0
          assert c['operation_freeze']['expected_before']==1569 and c['operation_freeze']['expected_after']==1578
          assert c['hash_chain']==expected_hashes
          assert c['round_6_operation_binding']['stage_hashes']==expected_hashes
          assert c['round_6_operation_binding']['reviewed_operations_sha256']==expected_ops
          assert c['codex_p2_remediation']['status']=='PASS'
          paths={
            'stage_a':root/'stages/stage-a.json','stage_b':root/'stages/stage-b.json','stage_c':root/'stages/stage-c.json',
            'stage_0_4':root/'stages/stage-0-4.json','stage_0_5':root/'stages/stage-0-5.json',
            'stage_0_6':root/'stages/stage-0-6.json','stage_0_7':root/'stages/stage-0-7.json',
          }
          for key,path in paths.items(): assert sha(path)==expected_hashes[key],(key,sha(path))
          print('RESULT: PASS_EXACT_R11_CERTIFIED_0_7C_ARTIFACT_IMPORT')
          PY

      - name: Materialize and fully validate Prompt 0.8 R11 production result
        working-directory: work
        run: |
          set -euo pipefail
          python ../builder/validation_temp/20260905-r1/materialize_production_0_8.py

      - name: Active workflow regression suite
        working-directory: work
        run: |
          set -euo pipefail
          python validation_scripts/run_active_workflow_tests.py

      - name: Recheck live main and stale PR head before production commit
        working-directory: work
        run: |
          set -euo pipefail
          git fetch origin main chatgpt/production-20260905-r8-9 --quiet
          test "$(git rev-parse origin/main)" = "eb1a311ed378fcdf547b52ad5da0652cb9f1fc62"
          test "$(git rev-parse origin/chatgpt/production-20260905-r8-9)" = "7466afe22d0a7c7016d34d71e8e0837c63256970"
          echo "RESULT: PASS_PRECOMMIT_MAIN_AND_OLD_HEAD_STILL_FROZEN"

      - name: Enforce production diff allowlist
        working-directory: work
        run: |
          set -euo pipefail
          set +e
          git diff --check > /tmp/sep5-production-diff-check.txt 2>&1
          rc=$?
          set -e
          git status --porcelain=v1 -uall | tee /tmp/sep5-production-status.txt
          git diff --name-only | tee /tmp/sep5-production-tracked.txt
          git ls-files --others --exclude-standard | tee /tmp/sep5-production-untracked.txt
          { git diff --name-only; git ls-files --others --exclude-standard; } | awk 'NF && !seen[$0]++' > /tmp/sep5-production-changed-paths.txt
          mapfile -t changed < /tmp/sep5-production-changed-paths.txt
          test ${#changed[@]} -gt 0
          if [ "$rc" -ne 0 ]; then cat /tmp/sep5-production-diff-check.txt >&2; exit "$rc"; fi
          for path in "${changed[@]}"; do
            case "$path" in
              data/cards.full.json|public/data/cards.json|runs/2026-09-07/r7-20260905-production-r1/*) ;;
              *) echo "FAIL: undeclared production path $path" >&2; exit 1 ;;
            esac
          done
          echo "RESULT: PASS_PRODUCTION_DIFF_ALLOWLIST"

      - name: Upload production diff diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep5-r11-0-8-production-diff-diagnostic
          path: |
            /tmp/sep5-production-diff-check.txt
            /tmp/sep5-production-status.txt
            /tmp/sep5-production-tracked.txt
            /tmp/sep5-production-untracked.txt
            /tmp/sep5-production-changed-paths.txt
          if-no-files-found: warn

      - name: Replace stale PR branch with validated R11 production package
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add data/cards.full.json public/data/cards.json runs/2026-09-07/r7-20260905-production-r1
          git diff --cached --check
          git commit -m "Publish governed Sep 5 R8 9 cards (Codex P2 remediated)"
          NEW_HEAD=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/chatgpt/production-20260905-r8-9:7466afe22d0a7c7016d34d71e8e0837c63256970 origin HEAD:refs/heads/chatgpt/production-20260905-r8-9
          echo "RESULT: PRODUCTION_BRANCH_REPLACED_R11 ${NEW_HEAD}"
