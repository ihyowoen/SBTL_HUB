name: PR256 bounded remediation

on:
  push:
    branches:
      - agent/backlog-reconciliation-r2-20260811

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/backlog-reconciliation-r2-20260811

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lock main baseline
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Extend bounded Ofgem source-audit normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr256_bounded_remediation.py')
          text = path.read_text(encoding='utf-8')
          old = '''        ("/source_evidence_entry_count", 3),\n        ("/source_unique_url_count", 3),\n'''
          new = '''        ("/source_evidence_entry_count", 3),\n        ("/source_unique_url_count", 3),\n        ("/source_diversity_status", "PASS_MULTI_SOURCE"),\n'''
          if old not in text:
              raise SystemExit('expected bounded Ofgem tuple not found')
          text = text.replace(old, new, 1)
          marker = '''            changes.append({"op": "replace", "path": path, "value": value})\n\n\ndef replace_exact'''
          replacement = '''            changes.append({"op": "replace", "path": path, "value": value})\n\n    ledger_path = "/source_discovery_ledger_ref"\n    if not any(isinstance(change, dict) and change.get("path") == ledger_path for change in changes):\n        changes.append({\n            "op": "add",\n            "path": ledger_path,\n            "value": "runs/2026-08-11/backlog-reconciliation-r2/audit/ofgem-ldes-existing-card-update.json",\n        })\n\n\ndef replace_exact'''
          if marker not in text:
              raise SystemExit('expected Ofgem post-loop marker not found')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Apply bounded PR256 remediation and validate
        run: python scripts/pr256_bounded_remediation.py

      - name: Remove temporary helper files
        run: |
          rm -f scripts/pr256_bounded_remediation.py
          rm -f .github/workflows/pr256-bounded-remediation.yml

      - name: Commit remediated governed outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 0
          fi
          git commit -m "fix: address PR #256 merge-prep gates"
          git push origin HEAD:agent/backlog-reconciliation-r2-20260811
