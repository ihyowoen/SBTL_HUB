name: tmp-polish-pr376-audit
on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-07
    paths:
      - .github/workflows/tmp-polish-pr376-audit.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-07
          fetch-depth: 0
      - name: Remove stale quarantined-card wording
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')
          d=json.loads(p.read_text())
          d['method']=[
            s.replace('against July traction-battery and EV-material growth evidence', 'against July traction-battery growth and other counterevidence')
            if isinstance(s,str) else s for s in d.get('method',[])
          ]
          upgrades=d.get('legacy_comparison',{}).get('upgrades',[])
          d['legacy_comparison']['upgrades']=[
            'SBTL pouch inference narrowed to verified program evidence' if x=='SBTL pouch inference narrowed to direct evidence' else x
            for x in upgrades
          ]
          for item in d.get('rejected_or_narrowed_narratives',[]):
            if item.get('narrative')=='핵심광물 FID·금융종결은 곧바로 생산과 현금흐름을 뜻한다':
              item['narrative']='핵심광물 FID·가공개시는 곧바로 안정 생산과 현금흐름을 뜻한다'
              item['reason']='Mt Holland additional production is targeted later; processing start and early quarterly profit represent different maturity stages.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          npm ci
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          test "$(git diff --name-only)" = "runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json"
      - name: Commit audit polish
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json
          git commit -m "fix: remove stale quarantined-card audit wording"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-07
