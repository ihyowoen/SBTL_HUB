name: Apply PR233 review 4842006582

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - ".github/workflows/apply-pr233-review-4842006582.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused fixes and regression coverage
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          stage = root / 'validation_scripts/stage_lineage_contract_check.py'
          replace_once(
              stage,
              """    tokens = normalized.split()\n    if bool(tokens) and len(tokens) <= 5 and all(\n        token in STAGE_A_PLACEHOLDER_NARRATIVE_TOKENS for token in tokens\n    ):\n        return True\n""",
              """    # Modifier-only absence statements remain placeholders. This keeps\n    # `currently unknown` fail-closed without rejecting a substantive sentence\n    # that happens to describe a residual unknown in context.\n    english_modified_absence_patterns = (\n        r'(?:(?:currently|presently|still|now|yet)\\s+)?(?:unknown|undisclosed|unavailable)(?:\\s+(?:currently|presently|still|now|yet))?',\n        r'(?:(?:currently|presently|still|now|yet)\\s+)?not\\s+(?:yet\\s+)?(?:known|available|disclosed|provided|specified)',\n        r'(?:as\\s+of\\s+now|at\\s+present)\\s+(?:unknown|undisclosed|unavailable|not\\s+(?:known|available|disclosed))',\n    )\n    if any(re.fullmatch(pattern, normalized) for pattern in english_modified_absence_patterns):\n        return True\n\n    tokens = normalized.split()\n    if bool(tokens) and len(tokens) <= 5 and all(\n        token in STAGE_A_PLACEHOLDER_NARRATIVE_TOKENS for token in tokens\n    ):\n        return True\n""",
              'modified unknown placeholders',
          )

          related = root / 'validation_scripts/related_lifecycle_check.py'
          replace_once(
              related,
              """def validate_follow_up_chronology_justification(\n    lineage: dict[str, Any],\n) -> tuple[set[str], str | None]:\n""",
              """GENERIC_CHRONOLOGY_JUSTIFICATION_STEMS = (\n    'specific explanation',\n    'explanation of what event',\n    'explanation of why',\n    'insert explanation',\n    'provide explanation',\n    'representative date remains a later distinct follow-up judgment',\n    'earlier date represents',\n    'generic reason',\n)\n\nCHRONOLOGY_BASIS_TERMS = (\n    'filing', 'disclosure', 'announcement', 'publication', 'operating event',\n    'transaction', 'approval', 'effective date', 'decision date', 'retrospective',\n    'represented event', '공시', '발표', '공개', '거래', '승인', '효력일',\n    '결정일', '소급', '사건일',\n)\n\nCHRONOLOGY_REASON_TERMS = (\n    'later filing', 'later disclosure', 'new evidence', 'incremental fact',\n    'changed judgment', 'distinct follow-up', 'retrospective', 'predecessor',\n    'subsequent', '후속', '추가 근거', '신규 근거', '판단 변경', '선행 카드',\n    '후행 공시', '후행 공개',\n)\n\n\ndef _specific_chronology_justification_text(value: Any, role_terms: tuple[str, ...]) -> bool:\n    if not isinstance(value, str):\n        return False\n    normalized = ' '.join(value.strip().lower().split())\n    if not normalized:\n        return False\n    if any(stem in normalized for stem in GENERIC_CHRONOLOGY_JUSTIFICATION_STEMS):\n        return False\n    # A chronology waiver must identify the actual date-bearing event or the\n    # later evidence/judgment transition. Length alone is not specificity.\n    return any(term in normalized for term in role_terms)\n\n\ndef validate_follow_up_chronology_justification(\n    lineage: dict[str, Any],\n) -> tuple[set[str], str | None]:\n""",
              'chronology specificity helpers',
          )
          replace_once(
              related,
              """    basis = value.get(\"representative_date_basis\")\n    reason = value.get(\"reason\")\n    if not isinstance(basis, str) or len(basis.strip()) < 12:\n        return set(), \"follow-up chronology justification requires a specific representative_date_basis\"\n    if not isinstance(reason, str) or len(reason.strip()) < 20:\n        return set(), \"follow-up chronology justification requires a specific reason\"\n""",
              """    basis = value.get(\"representative_date_basis\")\n    reason = value.get(\"reason\")\n    if not _specific_chronology_justification_text(basis, CHRONOLOGY_BASIS_TERMS):\n        return set(), \"follow-up chronology justification requires an item-specific representative_date_basis\"\n    if not _specific_chronology_justification_text(reason, CHRONOLOGY_REASON_TERMS):\n        return set(), \"follow-up chronology justification requires an item-specific reason\"\n""",
              'chronology narrative validation',
          )

          test = root / 'validation_scripts/tests/test_review_4842006582_contracts.py'
          test.write_text('''"""Regression coverage for Codex review 4842006582."""\n\nfrom __future__ import annotations\n\nimport copy\nimport io\nimport sys\nimport unittest\nfrom contextlib import redirect_stdout\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom validation_scripts import related_lifecycle_check as related\nfrom validation_scripts import stage_lineage_contract_check as lineage\nfrom validation_scripts.tests.test_review_4841890896_contracts import (\n    TestReview4841890896Contracts,\n)\n\n\nclass TestReview4842006582Contracts(unittest.TestCase):\n    def base_spec(self):\n        return TestReview4841890896Contracts().base_spec()\n\n    def run_stage_a(self, spec):\n        stream = io.StringIO()\n        with redirect_stdout(stream):\n            result = lineage.check_stage_a({"strict_passed_spec": [spec]})\n        return result, stream.getvalue()\n\n    def test_modified_unknown_placeholder_fails(self):\n        for placeholder in ("currently unknown", "still unknown", "at present unavailable"):\n            with self.subTest(placeholder=placeholder):\n                spec = copy.deepcopy(self.base_spec())\n                for field in lineage.STAGE_A_V3_NARRATIVE_FIELDS:\n                    spec[field] = placeholder\n                result, output = self.run_stage_a(spec)\n                self.assertEqual(result, 1)\n                self.assertIn("must be item-specific narrative text", output)\n\n    def test_contextual_unknown_remains_valid(self):\n        spec = copy.deepcopy(self.base_spec())\n        spec["remaining_uncertainty"] = (\n            "The named customer's volume remains unknown pending the August filing."\n        )\n        result, output = self.run_stage_a(spec)\n        self.assertEqual(result, 0, output)\n\n    def provisional_cards(self):\n        return TestReview4841890896Contracts().provisional_cards(True)\n\n    def run_cards(self, parent, child):\n        by_id = {"PARENT_FINAL": parent, "CHILD_FINAL": child}\n        provisional_by_id, ambiguous = related.build_provisional_target_index([parent, child])\n        return related.check_card(\n            child,\n            by_id,\n            require_contract=True,\n            allow_provisional_related=True,\n            provisional_by_id=provisional_by_id,\n            ambiguous_provisional_ids=ambiguous,\n        )\n\n    def test_generic_chronology_scaffolding_does_not_waive_invariant(self):\n        parent, child = self.provisional_cards()\n        justification = child["related_lineage"][\n            "follow_up_date_precedes_predecessor_justification"\n        ]\n        justification["representative_date_basis"] = (\n            "specific explanation of what event the earlier date represents"\n        )\n        justification["reason"] = (\n            "specific explanation of why the earlier representative date remains a later distinct follow-up judgment"\n        )\n        errors, _ = self.run_cards(parent, child)\n        self.assertIn(\n            "follow-up chronology justification requires an item-specific representative_date_basis",\n            errors,\n        )\n        self.assertIn(\n            "follow-up date precedes provisional predecessor PARENT_SPEC",\n            errors,\n        )\n\n    def test_item_specific_chronology_justification_still_passes(self):\n        parent, child = self.provisional_cards()\n        errors, warnings = self.run_cards(parent, child)\n        self.assertEqual(errors, [])\n        self.assertEqual(warnings, [])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Run focused regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest validation_scripts.tests.test_review_4842006582_contracts -v

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run full regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit verified patch and remove temporary workflow
        run: |
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find validation_scripts -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr233-review-4842006582.yml
          git add -A
          git commit -m "fix: address review 4842006582 specificity gaps"
          git push origin HEAD:agent/structural-news-value-v3
