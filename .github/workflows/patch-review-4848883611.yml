name: Patch review 4848883611

on:
  workflow_dispatch:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - "scripts/patch_review_4848883611.py"
      - ".github/workflows/patch-review-4848883611.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review fixes
        run: python scripts/patch_review_4848883611.py

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run focused regression
        run: python -m unittest validation_scripts.tests.test_review_4848883611_contracts -v

      - name: Run full regression
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Remove temporary patch files
        run: |
          rm -f scripts/patch_review_4848883611.py
          rm -f .github/workflows/patch-review-4848883611.yml

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address review 4848883611 contracts"
          git push origin HEAD:agent/structural-news-value-v3
