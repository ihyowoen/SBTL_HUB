name: tmp-pr380-may-june-delta
on:
  push:
    paths:
      - '.github/workflows/tmp-pr380-may-june-delta.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build focused chronology proof set
        run: |
          mkdir -p runs/2026-09-16
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const cards=data.cards||[];
          const ids=[
            '2026-05-04_EU_01','2026-05-05_GL_01','2026-05-14_US_01','2026-05-27_KR_02',
            '2026-05-29_GL_07','2026-05-27_EU_01','2026-05-13_US_01',
            '2026-05-29_GL_06','2026-05-11_GL_06',
            '2026-05-20_GL_04','2026-05-27_GL_01',
            '2026-05-20_GL_02','2026-05-20_GL_08','2026-05-29_GL_02','2026-05-29_EU_01',
            '2026-05-20_KR_01',
            '2026-06-30_US_02','2026-06-10_EU_01','2026-06-11_KR_01'
          ];
          const compact=c=>({
            id:c.id,date:c.date,region:c.region,cat:c.cat,sub_cat:c.sub_cat,signal:c.signal,
            title:c.title,gate:c.gate,fact:c.fact,implication:c.implication,watchpoint:c.watchpoint,
            fact_sources:c.fact_sources,related:c.related
          });
          const selected=ids.map(id=>cards.find(c=>c.id===id)).filter(Boolean).map(compact);
          const missing=ids.filter(id=>!cards.some(c=>c.id===id));
          fs.writeFileSync('runs/2026-09-16/pr380-chronology-proof-temp.json',JSON.stringify({count:selected.length,missing,cards:selected},null,2)+'\n');
          console.log('selected',selected.length,'missing',missing);
          NODE
      - name: Commit report
        run: |
          git config user.name 'ihyowoen'
          git config user.email 'hyowoen@hotmail.com'
          git add runs/2026-09-16/pr380-chronology-proof-temp.json
          git commit -m 'chore: extract chronology proof set'
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
