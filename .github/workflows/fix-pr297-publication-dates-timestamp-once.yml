name: fix-pr297-publication-dates-timestamp-once

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: write

env:
  RUN_PATH: runs/2026-08-29/card-run.json
  BASE_SHA: 937dce6429c8bf63535d8043c7f559c9f2001f5d
  BASE_BLOB: 9278233be67240aac1cdf7963e12d8e2878319f0

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20260829-combined18-governed-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recompute retained publication dates and output chronology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          SPECS={
            'NEW27_A_004','NEW27_A_005','NEW27_A_007','NEW27_A_008','NEW27_A_009','NEW27_A_010','NEW27_A_012','NEW27_A_019',
            'NEW27_RP_001','NEW27_RP_002','NEW27_TH_001','NEW27_TH_002','NEW27_TH_003','NEW27_TH_004','NEW27_TH_005','NEW27_TH_006','NEW27_TH_007','NEW27_TH_008'
          }
          run_dir=Path('runs/2026-08-29')
          targets=sorted(run_dir.glob('*.json'))
          patched_by_file={}
          date_re=re.compile(r'^\d{4}-\d{2}-\d{2}$')

          def retained_dates(sources):
            dates=sorted({
              str(fs.get('source_published_date'))
              for fs in sources
              if isinstance(fs,dict) and fs.get('source_published_date') and date_re.match(str(fs.get('source_published_date')))
            })
            return dates

          def patch_card(card, seen):
            spec=card.get('source_spec_id') or card.get('spec_id')
            if spec not in SPECS:
              return
            sources=card.get('fact_sources')
            role=card.get('date_role') or card.get('date_role_alignment')
            if not isinstance(sources,list) or not isinstance(role,dict):
              return
            dates=retained_dates(sources)
            if not dates:
              raise SystemExit(f'{spec}: no retained fact-source publication dates')
            card['publication_dates']=dates
            role['source_publication_dates']=dates
            seen.add(spec)

          def traverse(o,seen):
            if isinstance(o,dict):
              patch_card(o,seen)
              for v in o.values():
                traverse(v,seen)
            elif isinstance(o,list):
              for v in o:
                traverse(v,seen)

          for p in targets:
            d=json.loads(p.read_text(encoding='utf-8'))
            seen=set(); traverse(d,seen)
            if seen:
              patched_by_file[p.name]=sorted(seen)
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          run_path=Path('runs/2026-08-29/card-run.json')
          run=json.loads(run_path.read_text(encoding='utf-8'))
          cards=[x['card'] for x in run['operations']['insert']]
          run_specs={c.get('source_spec_id') or c.get('spec_id') for c in cards}
          if run_specs != SPECS:
            raise SystemExit(f'run spec scope mismatch: missing={sorted(SPECS-run_specs)} extra={sorted(run_specs-SPECS)}')

          output_updated=datetime.now(ZoneInfo('Asia/Seoul')).replace(microsecond=0).isoformat()
          run['output_updated']=output_updated
          run_path.write_text(json.dumps(run,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def canon(x):
            if isinstance(x,dict): return {k:canon(x[k]) for k in sorted(x)}
            if isinstance(x,list): return [canon(v) for v in x]
            return x
          ops_sha=hashlib.sha256(json.dumps(canon(run['operations']),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()

          for p in targets:
            d=json.loads(p.read_text(encoding='utf-8'))
            if p == run_path:
              d=run
            def bind(o):
              if isinstance(o,dict):
                for k,v in list(o.items()):
                  if k=='reviewed_operations_sha256':
                    o[k]=ops_sha
                  else:
                    bind(v)
              elif isinstance(o,list):
                for v in o:
                  bind(v)
            bind(d)
            if p.name.startswith('card_run_audit'):
              d['inserted_ids']=[x['card']['id'] for x in run['operations']['insert']]
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('publication-date arrays patched:',json.dumps(patched_by_file,ensure_ascii=False))
          print('output_updated:',output_updated)
          print('reviewed operations SHA256:',ops_sha)
          PY

      - name: Re-materialize canonical from exact locked baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]] || { echo "main moved; rebase required" >&2; exit 1; }
          mkdir -p .tmp-pr297-pubdate
          git show "$BASE_SHA:data/cards.full.json" > .tmp-pr297-pubdate/cards.full.base.json
          [[ "$(git hash-object .tmp-pr297-pubdate/cards.full.base.json)" == "$BASE_BLOB" ]] || { echo "baseline blob mismatch" >&2; exit 1; }
          node scripts/apply_card_run.mjs \
            --apply \
            --run "$RUN_PATH" \
            --baseline .tmp-pr297-pubdate/cards.full.base.json \
            --output data/cards.full.json \
            --report .tmp-pr297-pubdate/apply-pre.json \
            --base-main-sha "$BASE_SHA" \
            --skip-lean
          node scripts/lean_cards.mjs
          node scripts/apply_card_run.mjs \
            --verify \
            --run "$RUN_PATH" \
            --baseline data/cards.full.json \
            --output data/cards.full.json \
            --report runs/2026-08-29/apply-report.json \
            --base-main-sha "$BASE_SHA" \
            --lean-path public/data/cards.json

      - name: Refresh hashes and validate publication-date chronology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, re
          from datetime import datetime
          from pathlib import Path

          run=json.load(open('runs/2026-08-29/card-run.json',encoding='utf-8'))
          cards=[x['card'] for x in run['operations']['insert']]
          Path('.tmp-pr297-pubdate').mkdir(exist_ok=True)
          json.dump({'cards':cards},open('.tmp-pr297-pubdate/current-run-scope.json','w'),ensure_ascii=False,indent=2)
          json.dump({'ids':[c['id'] for c in cards]},open('.tmp-pr297-pubdate/current-run-ids.json','w'),ensure_ascii=False,indent=2)

          def parse_ts(s):
            return datetime.fromisoformat(str(s).replace('Z','+00:00'))

          output_ts=parse_ts(run['output_updated'])
          max_evidence=None
          greenvolt=0
          for c in cards:
            fs=[x for x in c.get('fact_sources',[]) if isinstance(x,dict)]
            dates=sorted({str(x['source_published_date']) for x in fs if x.get('source_published_date')})
            if c.get('publication_dates') != dates:
              raise SystemExit(f"{c.get('id')}: publication_dates mismatch {c.get('publication_dates')} != {dates}")
            role=c.get('date_role') or c.get('date_role_alignment') or {}
            if role.get('source_publication_dates') != dates:
              raise SystemExit(f"{c.get('id')}: date_role.source_publication_dates mismatch {role.get('source_publication_dates')} != {dates}")
            for x in fs:
              for k in ('fetched_at','checked_at'):
                if x.get(k):
                  try:
                    ts=parse_ts(x[k])
                    max_evidence=ts if max_evidence is None or ts > max_evidence else max_evidence
                  except Exception:
                    pass
              u=str(x.get('source_url') or x.get('url') or '')
              if 'greenvolt-secures-financing-package' in u:
                greenvolt += 1
                if str(x.get('source_published_date')) != '2026-08-27':
                  raise SystemExit('Greenvolt retained source date is not 2026-08-27')
            if any('greenvolt-secures-financing-package' in str(x.get('source_url') or x.get('url') or '') for x in fs):
              if dates != ['2026-08-27']:
                raise SystemExit(f"Greenvolt publication dates must be only 2026-08-27, got {dates}")
          if greenvolt < 1:
            raise SystemExit('Greenvolt repaired source not found in governed inserts')
          if max_evidence and output_ts < max_evidence:
            raise SystemExit(f'output_updated {output_ts.isoformat()} predates evidence {max_evidence.isoformat()}')

          full=json.load(open('data/cards.full.json',encoding='utf-8'))
          lean=json.load(open('public/data/cards.json',encoding='utf-8'))
          if full.get('updated') != run['output_updated']:
            raise SystemExit(f"full.updated {full.get('updated')} != output_updated {run['output_updated']}")
          if lean.get('updated') != run['output_updated']:
            raise SystemExit(f"lean.updated {lean.get('updated')} != output_updated {run['output_updated']}")

          full_bytes=Path('data/cards.full.json').read_bytes(); lean_bytes=Path('public/data/cards.json').read_bytes()
          fh=hashlib.sha256(full_bytes).hexdigest(); lh=hashlib.sha256(lean_bytes).hexdigest()
          p=Path('runs/2026-08-29/card_run_audit_20260829_CURRENT_MAIN_1496_COMBINED18.json')
          d=json.loads(p.read_text(encoding='utf-8')); d['full_output_sha256']=fh; d['lean_output_sha256']=lh
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('output_updated',run['output_updated'])
          print('max_evidence_timestamp',max_evidence.isoformat() if max_evidence else None)
          print('full',fh); print('lean',lh)
          PY

          python validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file .tmp-pr297-pubdate/current-run-ids.json | tee .tmp-pr297-pubdate/date-role-report.json
          python validation_scripts/evidence_qc_v8_check.py .tmp-pr297-pubdate/current-run-scope.json --new-id-file .tmp-pr297-pubdate/current-run-ids.json --json-report .tmp-pr297-pubdate/evidence-qc-v8.json
          node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_status_consistency.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_relations.mjs --run "$RUN_PATH"
          node scripts/validate_card_run_lineage_containers.mjs --run "$RUN_PATH" --canonical data/cards.full.json
          node scripts/validate_card_run_audits.mjs --run "$RUN_PATH" --full data/cards.full.json --lean public/data/cards.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Commit remediation and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-pr297-pubdate
          rm -f .github/workflows/fix-pr297-publication-dates-timestamp-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.full.json public/data/cards.json runs/2026-08-29 .github/workflows/fix-pr297-publication-dates-timestamp-once.yml
          git commit -m "Align repaired source dates and output chronology for PR #297"
          git push origin HEAD:chatgpt/20260829-combined18-governed-run
