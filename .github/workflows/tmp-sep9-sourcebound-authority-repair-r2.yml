name: tmp-sep9-sourcebound-authority-repair-r2
on:
  push:
    branches: [chatgpt/sep9-r1-current-main-production-r1]
    paths: [.github/workflows/tmp-sep9-sourcebound-authority-repair-r2.yml]
permissions:
  contents: write
jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sep9-r1-current-main-production-r1
          fetch-depth: 0
      - name: Replay source-bound rebind and preserve subset identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          p=pathlib.Path('.github/workflows/tmp-sep9-sourcebound-authority-repair.yml').read_text()
          start=p.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end=p.index("\n          PY\n", start)
          lines=p[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          pathlib.Path('/tmp/rebind.py').write_text(code)
          subprocess.run(['python3','/tmp/rebind.py'],check=True)
          PY
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          for name in ('stage-a.json','stage-a-promotion2.json'):
            p=root/'stages'/name; d=json.loads(p.read_text())
            # These are formal production subsets, not the missing full 415 Stage A accounting artifact.
            # Never add full-artifact identity markers merely to satisfy validators.
            for k in ('stage','run_tag','summary','story_count','decision_ledger','source_universe'):
              d.pop(k,None)
            d['subset_scope']='production_candidates_only'
            d['full_stage_a_accounting_claimed']=False
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate source-bound subset and downstream chain
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runs/2026-09-10/sep9-r1-current-main-production-r1/stages
          python3 validation_scripts/stage_artifact_contract_check.py A "$ROOT/stage-a.json"
          python3 validation_scripts/stage_lineage_contract_check.py stage_a "$ROOT/stage-a.json"
          python3 validation_scripts/stage_artifact_contract_check.py A "$ROOT/stage-a-promotion2.json"
          python3 validation_scripts/stage_lineage_contract_check.py stage_a "$ROOT/stage-a-promotion2.json"
          python3 validation_scripts/stage_artifact_contract_check.py B "$ROOT/stage-b.json"
          python3 validation_scripts/stage_artifact_contract_check.py C "$ROOT/stage-c.json"
          python3 validation_scripts/stage_artifact_contract_check.py 0.4 "$ROOT/stage-0-4.json"
          python3 validation_scripts/stage_artifact_contract_check.py 0.5 "$ROOT/stage-0-5.json"
          python3 validation_scripts/stage_artifact_contract_check.py 0.6 "$ROOT/stage-0-6.json"
          python3 validation_scripts/stage_artifact_contract_check.py 0.7 "$ROOT/stage-0-7.json"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          p=root/'stage-a-sourcebound-repair-audit.json'; d=json.loads(p.read_text())
          d['status']='PASS_ALL_A_THROUGH_0_7'; d['artifact_mode']='production_subset_not_full_415_ledger'; d['downstream_evidence_backfill_used']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          q=root/'formal-chain-recertification-audit.json'; x=json.loads(q.read_text())
          x['status']='PASS'; x['validators']='PASS_ALL_A_THROUGH_0_7_SOURCEBOUND_SUBSET'; x['source_bound_stage_a_repair']=True; x['downstream_evidence_backfill_used']=False
          q.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit validated source-bound subset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-a.json \
                  runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-a-promotion2.json \
                  runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-0-4.json \
                  runs/2026-09-10/sep9-r1-current-main-production-r1/stage-a-sourcebound-repair-audit.json \
                  runs/2026-09-10/sep9-r1-current-main-production-r1/formal-chain-recertification-audit.json
          git diff --cached --quiet && { echo nothing-to-commit; exit 1; }
          git commit -m 'governance: validate Sep9 source-bound production subset'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
