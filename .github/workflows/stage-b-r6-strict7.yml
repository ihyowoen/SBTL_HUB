name: Stage B R6 Strict 7

on:
  push:
    branches:
      - chatgpt/recover-exact-425-artifacts-20260903
    paths:
      - '.tmp/stage-b-r6-strict7/TRIGGER'

permissions:
  contents: write

jobs:
  stage-b-strict7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate Stage B evidence packages
        run: python3 scripts/stage_b_r6_strict7.py
      - name: Commit validated Stage B outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-03/stage_b_r6_strict7_20260903_R1.json \
                  runs/2026-09-03/stage_b_r6_strict7_validation_20260903_R1.json
          git rm -r .tmp/stage-b-r6-strict7
          git commit -m 'audit: Stage B R6 strict7 evidence packages'
          git push
