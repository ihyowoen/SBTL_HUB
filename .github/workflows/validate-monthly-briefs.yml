name: validate-monthly-briefs

on:
  pull_request:
    paths:
      - "public/data/monthly_briefs.json"
      - "lib/brief/monthlyPublication.js"
      - "lib/brief/monthlyProvenance.js"
      - "schemas/monthly-brief.v1.schema.json"
      - "scripts/validate_monthly_briefs.mjs"
      - "api/brief.js"
      - "src/MonthlyBriefPanel.jsx"
      - "src/monthlyBriefSelection.js"
      - "src/quickAnalysisLabels.js"
      - "src/kang.js"
      - "lib/chat/appCommand.js"
      - "src/App.jsx"
      - "__tests__/monthlyBriefPublication.test.js"
      - "__tests__/monthlyBriefProvenance.test.js"
      - "__tests__/monthlyBriefProductBoundary.test.js"
      - "__tests__/monthlyBriefSelection.test.js"
      - "__tests__/monthlyBriefActiveDomain.test.js"
      - "__tests__/quickAnalysisLabels.test.js"
      - "product/MONTHLY_BRIEF_EDITORIAL_CONTRACT.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-monthly-briefs.yml"
  push:
    branches:
      - main
    paths:
      - "public/data/monthly_briefs.json"
      - "lib/brief/monthlyPublication.js"
      - "lib/brief/monthlyProvenance.js"
      - "schemas/monthly-brief.v1.schema.json"
      - "scripts/validate_monthly_briefs.mjs"
      - "api/brief.js"
      - "src/MonthlyBriefPanel.jsx"
      - "src/monthlyBriefSelection.js"
      - "src/quickAnalysisLabels.js"
      - "src/kang.js"
      - "lib/chat/appCommand.js"
      - "src/App.jsx"
      - "__tests__/monthlyBriefPublication.test.js"
      - "__tests__/monthlyBriefProvenance.test.js"
      - "__tests__/monthlyBriefProductBoundary.test.js"
      - "__tests__/monthlyBriefSelection.test.js"
      - "__tests__/monthlyBriefActiveDomain.test.js"
      - "__tests__/quickAnalysisLabels.test.js"
      - "product/MONTHLY_BRIEF_EDITORIAL_CONTRACT.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-monthly-briefs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate official Monthly Brief library
        run: npm run validate:monthly-briefs

      - name: Run Monthly Brief publication boundary tests
        run: npx vitest run __tests__/monthlyBriefPublication.test.js __tests__/monthlyBriefProvenance.test.js __tests__/monthlyBriefProductBoundary.test.js __tests__/monthlyBriefSelection.test.js __tests__/monthlyBriefActiveDomain.test.js __tests__/quickAnalysisLabels.test.js
