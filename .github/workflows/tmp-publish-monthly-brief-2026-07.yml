      - name: Install dependencies
        run: npm ci
      - name: Validate Monthly Brief
        run: npm run validate:monthly-briefs
      - name: Run unit tests
        run: npm test
      - name: Build app
        run: npm run build
      - name: Check final scope
        run: |
          git status --short
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "public/data/monthly_briefs.json runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json "
      - name: Commit publication and remove temporary workflow
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git rm .github/workflows/tmp-publish-monthly-brief-2026-07.yml
          git add public/data/monthly_briefs.json runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json
          git commit -m "feat: publish SBTL Monthly Brief 2026.07"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-07