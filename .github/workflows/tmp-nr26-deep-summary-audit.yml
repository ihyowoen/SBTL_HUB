name: tmp-nr26-deep-summary-audit

on:
  push:
    branches:
      - remediate/nr26-deep-summary-20260919

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit 34 Deep Summary cards against upstream evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');

          const manifest = JSON.parse(fs.readFileSync('direct-adds/2026-09-19-nr26-deep-summary/direct-add.json','utf8'));
          const current = JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const baseline = JSON.parse(cp.execFileSync('git',['show','origin/main:data/cards.full.json'],{encoding:'utf8'}));
          const stageB = JSON.parse(fs.readFileSync('runs/2026-09-18/nr26-20260911-v4-r1/stages/stage-b.json','utf8'));
          const stageC = JSON.parse(fs.readFileSync('runs/2026-09-18/nr26-20260911-v4-r1/stages/stage-c.json','utf8'));

          const ids = manifest.operations.update;
          const byId = xs => new Map(xs.map(x => [x.id,x]));
          const cur = byId(current.cards);
          const base = byId(baseline.cards);
          const bRows = stageB.draft_cards || stageB.draft_card || [];
          const cRows = stageC.accepted_fact_safe || [];
          const bBySpec = new Map(bRows.map(x => [x.source_spec_id,x]));
          const cBySpec = new Map(cRows.map(x => [x.source_spec_id,x]));
          const visible = ['sub','gate','fact','implication'];
          const allowed = new Set(visible);

          function stable(v){ return JSON.stringify(v); }
          function normToken(s){
            return s.toLowerCase().replaceAll(',','').replace(/\s+/g,'');
          }
          function numberTokens(value){
            const s = Array.isArray(value) ? value.join(' ') : String(value || '');
            const rx = /(?:c\$|us\$|€|\$|₩)?\d+(?:[.,]\d+)*(?:%|gwh|mwh|kwh|gw|mw|kw|twh|톤|만톤|억달러|만달러|백만달러|억유로|만유로|년|개월|개소|개|시간|분기|q\d)?/gi;
            return [...new Set((s.match(rx)||[]).map(normToken))];
          }
          function upstreamText(b,c){ return normToken(JSON.stringify({b,c})); }

          let badFieldDrift = [];
          let unsupportedNumbers = [];
          let records = [];
          for (const id of ids) {
            const a = base.get(id), z = cur.get(id);
            if (!a || !z) throw new Error('Missing target '+id);
            const spec = z.source_spec_id;
            const b = bBySpec.get(spec) || null;
            const c = cBySpec.get(spec) || null;
            if (!c) throw new Error('Missing Stage C row for '+id+' '+spec);

            const keys = new Set([...Object.keys(a),...Object.keys(z)]);
            const changed = [...keys].filter(k => stable(a[k]) !== stable(z[k]));
            const illegal = changed.filter(k => !allowed.has(k));
            if (illegal.length) badFieldDrift.push({id,illegal,changed});

            const allVisible = visible.flatMap(k => numberTokens(z[k]));
            const up = upstreamText(b,c);
            const unsupported = [...new Set(allVisible.filter(t => !up.includes(t)))];
            if (unsupported.length) unsupportedNumbers.push({id,title:z.title,unsupported});

            records.push({
              id,
              source_spec_id:spec,
              title:z.title,
              changed_fields:changed,
              final:{sub:z.sub,gate:z.gate,fact:z.fact,implication:z.implication},
              upstream:{
                prior_state:c.prior_state,
                new_verified_fact:c.new_verified_fact,
                changed_judgment:c.changed_judgment,
                remaining_uncertainty:c.remaining_uncertainty,
                related_lineage:c.related_lineage,
                fact:c.fact,
                source_contributions:(c.fact_sources||[]).map(x=>x.source_contribution).filter(Boolean)
              }
            });
          }

          const implicationBad = records.filter(r => !Array.isArray(r.final.implication) || r.final.implication.length !== 3);
          const emptyBad = records.filter(r => visible.some(k => Array.isArray(r.final[k]) ? r.final[k].some(x=>!String(x).trim()) : !String(r.final[k]||'').trim()));

          console.log('NR26_DEEP_SUMMARY_AUDIT_COUNTS '+JSON.stringify({
            targets:ids.length,
            records:records.length,
            badFieldDrift:badFieldDrift.length,
            implicationBad:implicationBad.length,
            emptyBad:emptyBad.length,
            unsupportedNumberCards:unsupportedNumbers.length
          }));
          console.log('NR26_UNSUPPORTED_NUMBER_TOKENS '+JSON.stringify(unsupportedNumbers));
          console.log('NR26_ILLEGAL_FIELD_DRIFT '+JSON.stringify(badFieldDrift));
          for (const r of records) console.log('NR26_CARD_AUDIT '+JSON.stringify(r));

          if (ids.length !== 34 || records.length !== 34 || badFieldDrift.length || implicationBad.length || emptyBad.length) {
            process.exit(1);
          }
          NODE
