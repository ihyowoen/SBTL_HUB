name: tmp-pr380-review5223840123-v2
on:
  push:
    paths:
      - '.github/workflows/tmp-pr380-review5223840123-v2.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Patch review 5223840123
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pubPath = 'public/data/monthly_briefs.json';
          const auditPath = 'runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json';
          const pub = JSON.parse(fs.readFileSync(pubPath,'utf8'));
          const audit = JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const issue = pub.items.find(x => x.month === '2026-06');
          if (!issue) throw new Error('June issue missing');

          issue.executive_diagnosis = '5월 말까지 ESS는 이미 대형 공급계약·프로젝트금융·장주기 조달·상업운전이 동시에 늘고 있었고, AI·데이터센터도 일부 저장 수요와 연결되기 시작했다. 6월의 변화는 이 흐름이 새로 생긴 것이 아니라 tolling·용량계약처럼 수익구조가 더 다양하고 구체적인 형태로 전개되고 제도·기술 단계가 한층 세분화됐다는 데 있다. 5년·20년 tolling과 20년 용량계약, 세액공제 지분금융이 이어졌고 8~10시간 저장과 LDES 정책선정이 전면에 나왔다. 차세대 저장에서는 5월에도 나트륨이온 공급계약·양산계획·가동 프로젝트가 이미 존재한 가운데 6월 CATL 제품의 인도 일정이 후속으로 구체화됐고, 전고체는 실차시험으로 단계 전진했다. CO₂ 저장은 5월 Energy Dome의 상용화 경로 논의에서 6월 장기 tolling·상업계약으로 한 단계 내려왔고, 철공기 계약은 6월에 추가된 별도 신규 계약 신호다. 공급망도 5월부터 기업·거래 단위 신호가 있었지만 단계는 같지 않았다. EU 공공조달·재정지원 적격성과 외국인투자 조건은 당시 입법 제안·심사 단계였고, FEOC 대응 지분구조 조정과 정책금융은 보다 구체적인 실행 사례였다. 6월에는 중국의 명단형 통제·조달제한, G7 지원수단 검토, EU EV 셀 생산금융 등 다른 수단이 추가로 분화했다.';

          issue.what_changed = '5월 canonical 214건을 기준으로 보면 ESS의 성장, 금융조달, 장주기 조달과 AI 연계 수요는 이미 확인되고 있었다. 또 일본에서는 19개 배터리저장 프로젝트 1,251MW가 20년 고정수익 계약을 확보해 장기계약 자체도 이미 존재했다. 6월에는 그 방향성이 계약기간의 단순 연장이 아니라 수익구조의 형태와 저장시간, 제도 실행단계에서 더 구체화됐다. 5년·20년 tolling과 20년 용량계약 같은 서로 다른 수익계약 구조가 추가로 확인됐다. 장주기 정책에서는 5월 조달 신호가 6월 영국 Ofgem의 LDES 16개 프로젝트 잠정선정으로 구체화됐고, 이와 별개로 EU 17개국의 비구속 저장 배치 공약은 LDES로 한정되지 않은 기술중립적 일반 저장정책 신호로 추가됐다. 차세대 기술도 하나의 단계전진으로 묶이지 않는다. 나트륨이온은 5월부터 공급계약·양산계획·가동 신호가 있었고 6월 CATL의 인도 일정은 제품별 후속 구체화다. 전고체는 실차검증으로 단계가 전진했다. CO₂ 저장은 5월 Energy Dome 상용화 경로 논의가 이미 있었고 6월 장기 tolling·상업계약으로 계약 단계가 구체화됐으며, 철공기 계약은 6월에 새로 확인된 별도 신규 신호다. 공급망·현지화 역시 기업단위 조건·대응이나 기술이전·순환성·추적성 축이 6월에 처음 나타난 것이 아니다. 다만 5월 EU 공공조달·재정지원 적격성과 외국인투자·기술이전 조건은 입법 제안이 의회·이사회 심사에 들어간 단계였고, FEOC 대응 지분구조 조정과 정책금융은 구체 실행 사례였다. 그 위에서 6월에는 명단형 통제·G7 지원검토·EV 셀 생산금융이 추가로 분화했고, 기술라이선스 적용 시험셀·재생원료 인증 시범·배터리패스포트 실데이터 검증이 기존 현지화 축의 실행 사례로 구체화됐다. AI·데이터센터는 5월부터 이어진 선택적 전력인프라 수요축을 보강했을 뿐 6월 ESS 전체를 설명하는 단일 원인은 아니다. SBTL 관점에서도 ESS·LFP 성장만으로 파우치필름 수요를 자동 환산하지 않으며, 실제 셀 폼팩터·고객프로그램·필름 공급계약이 확인될 때만 직접 수요 신호로 본다.';

          const f3 = issue.key_flows.find(x => x.id === '03');
          f3.title = '차세대 저장, 5월부터 엇갈린 실행단계가 6월 제품후속·계약진전·실차검증으로 더 분화';
          f3.summary = '5월 나트륨이온은 이미 3년 60GWh 공급계약, 4분기 양산계획과 100MW·200MWh 나트륨 BESS 가동 신호가 있어 단순 전망 단계로 볼 수 없다. 따라서 6월 CATL의 나트륨이온 ESS 9월 중국 인도 일정과 연내 1GWh 목표는 기술 전체의 단계상승이 아니라 특정 제품의 후속 구체화로 본다. 전고체는 5월 본격 실증 전 전망에서 Factorial이 Stellantis 차량 통합 후 도로시험에 들어가 단계 전진이 확인됐다. CO₂ 저장은 5월 Energy Dome의 상용화 경로 논의가 이미 존재했으므로 6월 Energy Dome의 20년 tolling과 Google 아일랜드 23MW·200MWh 상업계약을 계약 단계 진전으로 본다. 반면 Ore Energy·Budget Thuis의 철공기 ESS 1GWh 계약은 May progression anchor 없이 6월에 추가된 별도 신규 계약 신호다. 기술별로 기존 실행수준과 고객계약·인도·실차시험·COD를 분리해 후속 단계를 확인해야 한다.';

          const f4 = issue.key_flows.find(x => x.id === '04');
          f4.title = '공급망, 5월부터 기업·거래 단위 조건·대응 존재…6월 명단형 통제·지원수단으로 추가 분화';
          f4.summary = '5월에도 기업·거래 단위 신호는 이미 있었다. 다만 EU의 공공조달·재정지원 적격성과 외국인투자 조건은 당시 집행 중인 확정 규칙이 아니라 입법 제안이 유럽의회·이사회 심사에 들어간 단계였고, JinkoSolar의 FEOC 대응 지분구조 조정과 미국의 기업별 정책금융은 보다 구체적인 실행 사례였다. 따라서 6월을 거시 리스크가 처음 거래조건으로 내려온 달로 보지 않는다. 6월에는 중국이 미국 기업 10곳을 이중용도 수출통제 대상에 올리고 별도의 46개 미국 기업 제품에 정부조달 금지를 적용했으며, G7은 가격격차 보조·공동조달·가격하한을 검토수단으로 제시했다. EU는 EEA 내 연 10GWh 이상 EV 배터리 셀 생산 프로젝트를 대상으로 15억유로 무이자대출 시설을 출범시켰다. 즉 제안·대응·금융을 포함한 기업·거래 단위 수단이 5월부터 존재했고, 6월에는 명단형 제한·지원수단·생산금융의 조합이 추가로 분화했다.';

          const ng = audit.previous_month_baseline.baseline_state.find(x => x.theme === 'Next-generation technology already showed uneven maturity by technology');
          if (!ng) throw new Error('next-gen baseline missing');
          ng.finding = 'May sodium-ion already included a three-year 60GWh supply contract, a Q4 mass-production plan and a commissioned 100MW/200MWh sodium BESS; Energy Dome CO₂ storage already had a commercialization-path discussion; solid-state remained short of full demonstration. June sodium-ion is therefore a product-specific follow-up, CO₂ moves from commercialization discussion to signed tolling/commercial agreements, solid-state road testing is a clearer stage advance, and iron-air remains a June-only new-contract signal.';
          if (!ng.evidence_card_ids.includes('2026-05-01_GL_04')) ng.evidence_card_ids.unshift('2026-05-01_GL_04');

          const sc = audit.previous_month_baseline.baseline_state.find(x => x.theme.startsWith('Supply-chain policy'));
          if (!sc) throw new Error('supply-chain baseline missing');
          sc.theme = 'Supply-chain policy already included company- and transaction-level proposals, responses and financing';
          sc.finding = 'May combined macro concentration/mineral risk with company- and transaction-level signals, but their legal/execution stages differed: EU public-procurement / financial-support eligibility and foreign-investment conditions were Commission proposals under Parliament/Council review, while FEOC-linked ownership restructuring and named U.S. policy financing were concrete company-level responses/financing. June adds different named-company lists, considered support tools and EV-cell production finance rather than introducing transaction-level instruments for the first time.';

          const sf3 = audit.selected_flows.find(x => x.id === '03');
          sf3.title = f3.title;
          sf3.delta_classification = 'MIXED_CONTINUATION_STAGE_ADVANCES_PLUS_JUNE_NEW_SIGNAL';
          const sf4 = audit.selected_flows.find(x => x.id === '04');
          sf4.title = f4.title;
          sf4.delta_classification = 'TRANSACTION_LEVEL_INSTRUMENTS_DIVERSIFIED';

          const d3 = audit.delta_classification.find(x => x.flow_id === '03');
          d3.classification = 'MIXED_CONTINUATION_STAGE_ADVANCES_PLUS_JUNE_NEW_SIGNAL';
          d3.may_state = 'Sodium-ion already had a 60GWh supply contract, Q4 mass-production plan and a commissioned 100MW/200MWh BESS; Energy Dome CO₂ storage already had a commercialization-path discussion; solid-state remained pre-full-demonstration. The May baseline does not establish an iron-air progression anchor.';
          d3.june_change = 'CATL sodium-ion delivery scheduling is a product-specific follow-up; Energy Dome CO₂ storage advances from commercialization discussion to signed tolling/commercial agreements; solid-state road testing is a clearer stage advance; iron-air remains a separate June-only new-contract signal.';
          const d4 = audit.delta_classification.find(x => x.flow_id === '04');
          d4.classification = 'TRANSACTION_LEVEL_INSTRUMENTS_DIVERSIFIED';
          d4.may_state = 'Macro concentration/mineral risk coexisted with company/transaction-level signals at different stages: EU public-procurement / financial-support eligibility and foreign-investment conditions were Commission proposals under Parliament/Council review, while FEOC-linked ownership restructuring and named policy financing were concrete responses/financing.';
          d4.june_change = 'June adds a different mix of named-company export/procurement lists, considered G7 support tools and EU EV-cell production finance. The delta is diversification of transaction-level instruments and execution forms, not first-time appearance of binding EU rules.';

          audit.codex_review_5223840123_remediation = {
            reviewed_head: 'c9338f0aefd23dd050dbca1766f0d9f902c88f69',
            findings_addressed: [
              'co2_reclassified_from_june_only_to_may_commercialization_path_to_june_signed_contract_stage_advance_with_2026_05_01_GL_04_added_to_baseline',
              'may_eu_iaa_conditions_labeled_as_commission_proposals_under_parliament_council_review_not_binding_rules',
              'flow03_flow04_public_and_audit_classifications_synchronized'
            ]
          };

          if (!ng.evidence_card_ids.includes('2026-05-01_GL_04')) throw new Error('CO2 May anchor not recorded');
          if (!f4.summary.includes('입법 제안')) throw new Error('EU IAA proposal stage missing');
          fs.writeFileSync(pubPath, JSON.stringify(pub,null,2)+'\n');
          fs.writeFileSync(auditPath, JSON.stringify(audit,null,2)+'\n');
          NODE
      - name: Validate all
        run: |
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
      - name: Commit remediation and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git commit -m "fix: align CO2 and EU proposal chronology"
          git rm .github/workflows/tmp-pr380-review5223840123.yml .github/workflows/tmp-pr380-review5223840123-v2.yml
          git commit -m "chore: remove temporary review helpers"
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
