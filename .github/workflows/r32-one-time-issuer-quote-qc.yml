name: R32 issuer quote review remediation (no merge)

on:
  push:
    branches:
      - news/r28-20261017-source-verified-lfp
    paths:
      - "scripts/.r32_temp_issuer_quote_patch.py.gz.b64"
      - ".github/workflows/r32-one-time-issuer-quote-qc.yml"

permissions:
  contents: write

jobs:
  review-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Guard current main and original reviewed PR data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "6851fdbe4a25b30b7204d07708a1238123c14910"
          test "$(git merge-base HEAD 2b650bec8e52757ca9716434b276b41cc2515b7d)" = "2b650bec8e52757ca9716434b276b41cc2515b7d"
          test "$(git rev-parse HEAD:data/cards.full.json)" = "$(git rev-parse 2b650bec8e52757ca9716434b276b41cc2515b7d:data/cards.full.json)"
          test "$(git rev-parse HEAD:public/data/cards.json)" = "$(git rev-parse 2b650bec8e52757ca9716434b276b41cc2515b7d:public/data/cards.json)"

      - name: Restore checksum-locked source remediation program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          blob=base64.b64decode(Path("scripts/.r32_temp_issuer_quote_patch.py.gz.b64").read_text().strip(),validate=True)
          assert hashlib.sha256(blob).hexdigest()=="dfc1b7cad381f7e550305178f818ee38d3a880ca8159079e9efea11bdcd8cb21"
          raw=gzip.decompress(blob)
          assert hashlib.sha256(raw).hexdigest()=="e8a8a8e5256033ad5eafa54043762f9578e1b86a2ae63a38b308664f3cbbaff7"
          Path("scripts/.r32_review_edits.py").write_bytes(raw)
          print("R32 reviewed program integrity PASS",len(raw))
          PY

      - name: Apply source evidence corrections to two proposed cards only
        run: python3 scripts/.r32_review_edits.py

      - name: Verify full manual direct-add governance and no unintended mutations
        shell: bash
        run: |
          set -euo pipefail
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > "$RUNNER_TEMP/cards.full.base.json"
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/validate.mjs
          node scripts/lean_cards.mjs --check
          git diff --check

      - name: Run repository unit tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Remove all temporary stage code and commit exactly three data files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r32_review_edits.py
          rm scripts/.r32_temp_issuer_quote_patch.py.gz.b64
          rm .github/workflows/r32-one-time-issuer-quote-qc.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/r32-one-time-issuer-quote-qc.yml \
            data/cards.full.json \
            direct-adds/2026-10-17-r28-signed-lfp-source-verified/direct-add.json \
            public/data/cards.json \
            scripts/.r32_temp_issuer_quote_patch.py.gz.b64 | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'FAIL: unexpected files in PR staging commit:\n%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cards): repair literal issuer evidence and discovery ledger for two LFP cards"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "PASS: audited 1,674 -> 1,676 data-only review branch. NEVER AUTO-MERGE."
