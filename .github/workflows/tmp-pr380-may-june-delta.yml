name: tmp-pr380-may-june-delta
on:
  push:
    paths:
      - '.github/workflows/tmp-pr380-may-june-delta.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final chronological QC
        run: |
          node <<'NODE'
          const fs=require('fs');
          const briefPath='public/data/monthly_briefs.json';
          const auditPath='runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json';
          const briefs=JSON.parse(fs.readFileSync(briefPath,'utf8'));
          const issue=(briefs.items||[]).find(x=>x.month==='2026-06');
          if(!issue) throw new Error('June brief missing');
          issue.published_at='2026-09-16';
          const flow4=issue.key_flows.find(x=>x.id==='04');
          flow4.summary=flow4.summary.replace(
            'EU는 EEA의 EV 배터리 셀 생산을 대상으로 15억유로 무이자대출 시설을 출범시켰다.',
            'EU는 EEA 내 연 10GWh 이상 EV 배터리 셀 생산 프로젝트를 대상으로 15억유로 무이자대출 시설을 출범시켰다.'
          );
          issue.qc.reviewed_at='2026-09-16';
          issue.qc.notes='Rebuilt chronologically from the locked May canonical closing state into the June delta after the post-#379 external gap closure. Claims are stage-bounded; AI is treated as a selective grid-demand pull already visible in May, and no direct pouch-film demand is inferred without form-factor/customer evidence.';
          issue.approval.approved_at='2026-09-16';
          issue.approval.notes='Approved after reconstructing the 214-card May baseline, reviewing the 197-card June universe and 99 June top/high cards, independently closing June gaps, and revalidating exact title/date/source and May→June delta claims.';
          fs.writeFileSync(briefPath,JSON.stringify(briefs,null,2)+'\n');

          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          audit.audit_date='2026-09-16';
          const pm=audit.previous_month_baseline;
          if(!pm || pm.month!=='2026-05') throw new Error('May baseline missing');
          pm.closing_window={start:'2026-05-15',end:'2026-05-31',card_count:41,top_high_count:32};
          pm.may_june_unique_related_edge_count=21;
          delete pm.closing_window_card_count;
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          NODE
      - name: Remove temporary extraction files and workflow
        run: |
          git rm -f .github/workflows/tmp-pr380-may-june-delta.yml
          git rm -f runs/2026-09-16/pr380-may-june-delta-temp.json
          git rm -f runs/2026-09-16/pr380-chronology-proof-temp.json
      - name: Exact assertions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('public/data/monthly_briefs.json','utf8'));
          const x=b.items.find(v=>v.month==='2026-06');
          const a=JSON.parse(fs.readFileSync('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json','utf8'));
          const fail=m=>{throw new Error(m)};
          if(x.published_at!=='2026-09-16'||x.qc.reviewed_at!=='2026-09-16'||x.approval.approved_at!=='2026-09-16') fail('date lock');
          if(x.source_card_ids.length!==21) fail('anchor count');
          if(x.source_card_ids.some(id=>!id.startsWith('2026-06-'))) fail('non-June public anchor');
          if(x.source_card_ids.includes('2026-06-11_KR_01')) fail('defective-title card leaked');
          const f2=x.key_flows.find(v=>v.id==='02').summary;
          const f4=x.key_flows.find(v=>v.id==='04').summary;
          if(!f2.includes('법적 의무를 수반하지 않는')) fail('EU pledge caveat');
          if(!f4.includes('연 10GWh 이상 EV 배터리 셀')) fail('Battery Booster scope');
          const ford=x.refs.find(r=>r.id==='2026-06-30_US_02');
          if(!ford||!ford.url.includes('battery-tech.net')) fail('Ford test-cell URL');
          if(a.previous_month_baseline.canonical_card_count!==214) fail('May count');
          if(a.previous_month_baseline.closing_window.card_count!==41||a.previous_month_baseline.closing_window.top_high_count!==32) fail('May closing window');
          if(a.previous_month_baseline.may_june_unique_related_edge_count!==21) fail('May-June related edge count');
          if(a.hindsight_firewall.later_month_events_used_for_june_thesis!==false) fail('hindsight firewall');
          console.log('Exact chronology assertions PASS');
          NODE
      - name: Validate Monthly Briefs
        run: npm run validate:monthly-briefs
      - name: Full test suite
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit final chronology QC
        run: |
          git config user.name 'ihyowoen'
          git config user.email 'hyowoen@hotmail.com'
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git commit -am 'editorial: finalize May-to-June monthly brief delta'
          git push origin HEAD:chatgpt/rebuild-monthly-brief-2026-06
