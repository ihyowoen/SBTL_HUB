name: Sep8 final governed production closure
on:
  push:
    branches: [chatgpt/sep8-r7-current-main-production-r1]
    paths: ['.github/workflows/sep8-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Re-lock and materialize exact repaired run
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          BASE=e19f6c113ccb62906e7fdefaf3bae657c58b5637
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse "$BASE:data/cards.full.json")" = cc5bc78ae5b27cb58b7bfa7a3ca3800c9d0085cb
          python - <<'PY'
          import json,hashlib,pathlib
          R=pathlib.Path('runs/2026-09-09/sep8-r7-current-main-production-r1'); S=R/'stages'
          def L(p): return json.load(open(p))
          def W(p,d): p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          def H(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          promo=str(S/'stage-a-promotion5.json')
          old='미 교통부 장관 Sean Duffy는 9월 8일 Ford CEO에 보낸 공개 서한에서 중국 기술·제조 의존을 줄이라고 요구하면서 Michigan BlueOval Battery Park의 CATL 라이선스 기술 사용을 직접 지목했다. 이번 발표 자체는 라이선스 취소나 새로운 법적 금지를 발생시키는 조치는 아니다.'
          new='미 교통부는 9월 8일 공개한 Sean Duffy 장관의 Ford CEO 대상 서한에서 중국 기술·제조 의존 축소를 요구하면서 Michigan BlueOval Battery Park의 CATL 라이선스 기술 사용을 직접 지목했다. 이번 공개 요구 자체는 라이선스 취소나 새로운 법적 금지를 신설한 조치로 확인되지 않는다.'
          dot='https://www.transportation.gov/briefing-room/trumps-transportation-secretary-sean-p-duffy-urges-ford-cut-ties-china-and-prioritize'
          date_quote='U.S. Transportation Secretary Sean P. Duffy today warned Ford Motor Company against its embrace of Chinese technology and manufacturing'
          def repair_text(o):
            if isinstance(o,dict):
              for k,v in list(o.items()):
                if isinstance(v,str) and old in v: o[k]=v.replace(old,new)
                else: repair_text(v)
              if o.get('event_date_source_url')==dot: o['event_date_source_quote']=date_quote
            elif isinstance(o,list):
              for v in o: repair_text(v)
          def bind_b(o,bh):
            if isinstance(o,dict):
              z=o.get('stage_b_lineage')
              if isinstance(z,dict) and z.get('spec_id'): z['artifact_sha256']=bh
              for v in o.values(): bind_b(v,bh)
            elif isinstance(o,list):
              for v in o: bind_b(v,bh)
          pre={'status':'PASS','same_event_checked':True,'matched_baseline_candidate_ids':['2026-06-30_US_02'],'matched_current_batch_candidate_ids':[],'relation_candidates':[{'target_candidate_id':'2026-06-30_US_02','proposed_relation_type':'distinct_follow_up','confidence':'high','reason':'The June card records Ford battery-production intent using CATL licensed technology; the Sep 8 DOT public disclosure of federal pressure is a separate policy event rather than a repeat of the June milestone.','anchor_class_to_verify':'policy_regulatory_anchor','incremental_anchor_question':'Verify that the Sep 8 U.S. DOT public pressure on Ford/CATL is chronologically distinct from the June production milestone and materially changes the policy/strategic judgment without implying a new legal ban.'}],'duplicate_disposition':'no_duplicate_found','earliest_same_event_check_status':'PASS','fresh_anchor_questions':['Verify the Sep 8 public policy_regulatory_anchor against predecessor 2026-06-30_US_02 and confirm it is a distinct follow-up rather than same-event repetition.']}
          a=L(S/'stage-a-promotion5.json')
          for x in a['strict_passed_spec']:
            if x.get('spec_id')=='STD26_0908_P_005': x.update(related_prepass=pre,baseline_relation='distinct_follow_up',baseline_follow_up_relation='distinct_follow_up')
          for x in a['decision_ledger']:
            if x.get('spec_id')=='STD26_0908_P_005' or x.get('candidate_id')=='STD26_0908_P_005':
              x.update(baseline_relation='distinct_follow_up',follow_up_relation='distinct_follow_up',baseline_match='2026-06-30_US_02',duplicate_risk='bounded_recheck_completed_distinct_follow_up',notes='Promotion resolved; Stage A Related prepass identifies 2026-06-30_US_02 as a distinct predecessor. Sep 8 is the official public-disclosure policy event; the artifact does not treat Sep 8 as the letter document date.')
          a['summary']['follow_up_candidate_ids']=['STD26_0908_P_005']; W(S/'stage-a-promotion5.json',a); ah=H(S/'stage-a-promotion5.json')
          b=L(S/'stage-b.json'); repair_text(b)
          for x in b['strict_passed_spec']:
            if x.get('spec_id')=='STD26_0908_P_005': x.update(related_prepass=pre,baseline_relation='distinct_follow_up',baseline_follow_up_relation='distinct_follow_up')
          W(S/'stage-b.json',b); bh=H(S/'stage-b.json')
          c=L(S/'stage-c.json'); repair_text(c); bind_b(c,bh); W(S/'stage-c.json',c); ch=H(S/'stage-c.json')
          chain=[]
          for f,key,src in [('stage-0-4.json','stage_c_artifact_sha256',ch),('stage-0-5.json','stage_0_4_artifact_sha256',None),('stage-0-6.json','input_0_5_sha256',None),('stage-0-7.json','input_0_6_sha256',None)]:
            p=S/f; d=L(p); repair_text(d); bind_b(d,bh); d[key]=src if src is not None else chain[-1]; W(p,d); chain.append(H(p))
          r=L(R/'card-run.json'); repair_text(r); bind_b(r,bh)
          promoted=0
          for op in r['operations']['insert']:
            z=op['card'].get('stage_b_lineage'); sid=op['card'].get('source_spec_id') or (z.get('spec_id') if isinstance(z,dict) else None)
            if sid and '_P_' in sid:
              assert isinstance(op.get('stage_artifacts'),list) and op['stage_artifacts']; op['stage_artifacts'][0]=promo; promoted+=1
          assert promoted==5, promoted
          rel=r['operations'].get('related_add',[]); assert len(rel)==1
          assert (rel[0].get('source_spec_id') or rel[0].get('spec_id'))=='STD26_0908_P_005'
          assert isinstance(rel[0].get('stage_artifacts'),list) and rel[0]['stage_artifacts']; rel[0]['stage_artifacts'][0]=promo
          oph=hashlib.sha256(json.dumps(r['operations'],sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest(); W(R/'card-run.json',r)
          x=L(R/'stage-0-7c.json'); x['reviewed_operations_sha256']=oph; x['hash_chain'].update(stage_a_promotion5_sha256=ah,stage_b_sha256=bh,stage_c_sha256=ch,stage_0_4_sha256=chain[0],stage_0_5_sha256=chain[1],stage_0_6_sha256=chain[2],stage_0_7_sha256=chain[3]); W(R/'stage-0-7c.json',x)
          for f in ['stage-0-8.json','card-run-audit.json']:
            p=R/f; d=L(p); d['reviewed_operations_sha256']=oph; W(p,d)
          print('FINAL_OPERATION_SHA256',oph); print('STAGE_B_SHA256',bh)
          PY
      - name: Full V4 and governance chain
        shell: bash
        run: |
          set -euo pipefail
          R=runs/2026-09-09/sep8-r7-current-main-production-r1/card-run.json
          python validation_scripts/stage_artifact_contract_check.py A runs/2026-09-09/sep8-r7-current-main-production-r1/stages/stage-a-promotion5.json
          node scripts/validate_card_run_stage_artifacts.mjs --run "$R"
          node scripts/validate_card_run_v4_hardening.mjs --run "$R"
          node scripts/validate_card_run_status_consistency.mjs --run "$R"
          node scripts/validate_card_run_relations.mjs --run "$R"
          node scripts/validate_card_run_lineage_containers.mjs --run "$R" --canonical data/cards.full.json
      - name: Exact apply, independent delta, and official Prompt 0.8 strict gate
        shell: bash
        run: |
          set -euo pipefail
          R=runs/2026-09-09/sep8-r7-current-main-production-r1/card-run.json; B=e19f6c113ccb62906e7fdefaf3bae657c58b5637
          git checkout "$B" -- data/cards.full.json public/data/cards.json
          node scripts/apply_card_run.mjs --apply --run "$R" --baseline data/cards.full.json --output data/cards.full.json --report runs/2026-09-09/sep8-r7-current-main-production-r1/apply-report.json --base-main-sha "$B" --lean-path public/data/cards.json
          node scripts/apply_card_run.mjs --verify --run "$R" --baseline data/cards.full.json --output data/cards.full.json --report runs/2026-09-09/sep8-r7-current-main-production-r1/apply-report.json --base-main-sha "$B" --lean-path public/data/cards.json
          python - <<'PY'
          import json,hashlib,pathlib,subprocess
          R=pathlib.Path('runs/2026-09-09/sep8-r7-current-main-production-r1'); full=pathlib.Path('data/cards.full.json'); lean=pathlib.Path('public/data/cards.json')
          fh=hashlib.sha256(full.read_bytes()).hexdigest(); lh=hashlib.sha256(lean.read_bytes()).hexdigest()
          audit=json.load(open(R/'card-run-audit.json')); audit['full_output_sha256']=fh; audit['lean_output_sha256']=lh; (R/'card-run-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          bd=json.loads(subprocess.check_output(['git','show','e19f6c113ccb62906e7fdefaf3bae657c58b5637:data/cards.full.json'])); od=json.load(open(full)); base=bd['cards']; out=od['cards']; bm={x['id']:x for x in base}; om={x['id']:x for x in out}
          new=sorted(set(om)-set(bm)); removed=sorted(set(bm)-set(om)); changed=[i for i in bm if i in om and bm[i]!=om[i]]
          assert len(base)==1599 and len(out)==1617 and len(new)==18 and not removed and not changed and len(om)==len(out), (len(base),len(out),len(new),removed[:3],changed[:3])
          urls={}
          for x in out:
            for e in x.get('evidence',[]):
              u=e.get('url') if isinstance(e,dict) else None
              if u: urls.setdefault(u,[]).append(x['id'])
          cross={u:ids for u,ids in urls.items() if len(set(ids))>1 and any(i in new for i in ids) and any(i not in new for i in ids)}; assert not cross, list(cross.items())[:3]
          ford=om['2026-09-08_US_01']; assert '9월 8일 공개한 Sean Duffy' in ford.get('fact',''); assert '9월 8일 Ford CEO에 보낸' not in ford.get('fact','')
          print('DEEP_INVARIANTS_PASS',{'base':1599,'out':1617,'new':18,'removed':0,'existing_changed':0,'full_sha256':fh,'lean_sha256':lh})
          PY
          node scripts/validate_card_run_audits_dispatch.mjs --run "$R" --full data/cards.full.json --lean public/data/cards.json
          ID_LEDGER="$RUNNER_TEMP/prompt-0-8-id-ledger.json"
          MERGE_PREP_REF="$(node scripts/validate_prompt_0_8_semantic_gate.mjs --run "$R" --full data/cards.full.json --ledger "$ID_LEDGER")"
          test -s "$ID_LEDGER"; test -n "$MERGE_PREP_REF"; test -f "$MERGE_PREP_REF"
          STRICT_ID_COUNT="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.ids||[]).length))' "$ID_LEDGER")"
          OPERATION_ID_COUNT="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.operation_ids||[]).length))' "$ID_LEDGER")"
          test "$STRICT_ID_COUNT" -eq 18
          test "$OPERATION_ID_COUNT" -eq 18
          python3 validation_scripts/related_lifecycle_check.py data/cards.full.json --require-contract --new-id-file "$ID_LEDGER"
          python3 validation_scripts/evidence_qc_v8_check.py data/cards.full.json --new-id-file "$ID_LEDGER"
          python3 validation_scripts/date_role_freshness_check.py data/cards.full.json --require-date-role --new-id-file "$ID_LEDGER"
          python3 validation_scripts/stage_artifact_contract_check.py 0.8 "$MERGE_PREP_REF"
          echo "PROMPT_0_8_STRICT_GATE_PASS strict_ids=$STRICT_ID_COUNT operation_ids=$OPERATION_ID_COUNT artifact=$MERGE_PREP_REF"
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          git diff --check
      - name: Commit final governed state and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .promotion-fix-bootstrap .card-run-bootstrap-fix
          rm -f .github/workflows/sep8-promotion-identity-fix.yml .github/workflows/sep8-finalize.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Sep 8 governed production run'
          git push origin HEAD:chatgpt/sep8-r7-current-main-production-r1
