name: tmp-sep9-related-lineage-repair-r2

on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - .github/workflows/tmp-sep9-related-lineage-repair-r2.yml

permissions:
  contents: write

jobs:
  repair-related-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact two source-bound relations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          cfg={
            'STD26_0909_A_010':{'target':'2026-09-07_GL_01','type':'program_lineage','reason':'Fresh Jan-Jul ex-China battery dataset extends the same SNE market-tracker program lineage.','event_stage_relationship':'same_program_new_measurement_window'},
            'STD26_0909_P_002':{'target':'2026-09-04_CN_01','type':'distinct_follow_up','reason':'Fresh production-vehicle rollout is a distinct execution milestone after Li Auto strategic battery-supply/investment lineage.','event_stage_relationship':'later_distinct_event'}
          }
          def rows(node):
            if isinstance(node,dict):
              if node.get('source_spec_id') in cfg: yield node
              for v in node.values(): yield from rows(v)
            elif isinstance(node,list):
              for v in node: yield from rows(v)
          # Source-bound Stage A authorization is mandatory.
          arows={}
          for fn in ('stage-a.json','stage-a-promotion2.json'):
            d=json.loads((root/'stages'/fn).read_text())
            for r in d.get('strict_passed_spec',[]):
              if r.get('spec_id') in cfg: arows[r['spec_id']]=r
          for sid,c in cfg.items():
            r=arows.get(sid)
            if not r: raise SystemExit(f'missing Stage A authority {sid}')
            pre=r.get('related_prepass') or {}; candidates=pre.get('relation_candidates') or []
            if pre.get('status')!='PASS' or not any(x.get('target_candidate_id')==c['target'] and x.get('proposed_relation_type')==c['type'] for x in candidates if isinstance(x,dict)):
              raise SystemExit(f'{sid}: source-bound relation not authorized')
          # Stage B evidence resolution.
          p=root/'stages/stage-b.json'; d=json.loads(p.read_text()); found={r['source_spec_id']:r for r in rows(d)}
          if set(found)!=set(cfg): raise SystemExit(f'Stage B rows mismatch {set(found)}')
          for sid,c in cfg.items():
            r=found[sid]
            if not r.get('fact_sources'): raise SystemExit(f'{sid}: no Stage B fact_sources')
            rev=r.get('related_evidence_review')
            if not isinstance(rev,dict): raise SystemExit(f'{sid}: no related_evidence_review')
            rev.clear(); rev.update({'status':'PASS','same_event_checked':True,'earliest_same_event_date_checked':True,'relation_type':c['type'],'matched_baseline_current_candidates':[c['target']],'incremental_fact':c['reason'],'changed_judgment':'Stage B evidence confirms the distinct current event and preserves the source-bound predecessor/program lineage.','related_target_required':True,'related_target_id':c['target'],'reason':c['reason'],'related_ids':[c['target']],'direction':'directional','event_stage_relationship':c['event_stage_relationship']})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          # C..0.7 exact preservation.
          for fn in ('stage-c.json','stage-0-4.json','stage-0-5.json','stage-0-6.json','stage-0-7.json'):
            p=root/'stages'/fn; d=json.loads(p.read_text()); found={r['source_spec_id']:r for r in rows(d)}
            if set(found)!=set(cfg): raise SystemExit(f'{fn}: rows mismatch {set(found)}')
            for sid,c in cfg.items():
              lin=found[sid].get('related_lineage')
              if not isinstance(lin,dict): raise SystemExit(f'{fn}:{sid}: no related_lineage')
              lin.clear(); lin.update({'status':'PASS','relation_type':c['type'],'related_ids':[c['target']],'reason':c['reason'],'event_stage_relationship':c['event_stage_relationship'],'direction':'directional'})
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          audit={'schema':'sep9_related_lineage_repair_v2','status':'PASS_PENDING_BINDING_VALIDATION','facts_changed':False,'dates_changed':False,'acceptance_decisions_changed':False,'source_authority':'Stage A related_prepass + Stage B fact_sources','relations':[{'source_spec_id':sid,**c} for sid,c in cfg.items()]}
          (root/'related-lineage-repair-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Validate exact binding semantics and stage contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runs/2026-09-10/sep9-r1-current-main-production-r1/stages
          python3 validation_scripts/stage_artifact_contract_check.py B "$ROOT/stage-b.json"
          python3 validation_scripts/stage_artifact_contract_check.py C "$ROOT/stage-c.json"
          for S in 0.4 0.5 0.6 0.7; do
            F="$ROOT/stage-${S//./-}.json"
            python3 validation_scripts/stage_artifact_contract_check.py "$S" "$F"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          import validation_scripts.card_run_v4_binding_hardening as v4
          root=Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          cfg={
            'STD26_0909_A_010':{'target':'2026-09-07_GL_01','type':'program_lineage','reason':'Fresh Jan-Jul ex-China battery dataset extends the same SNE market-tracker program lineage.','event_stage_relationship':'same_program_new_measurement_window'},
            'STD26_0909_P_002':{'target':'2026-09-04_CN_01','type':'distinct_follow_up','reason':'Fresh production-vehicle rollout is a distinct execution milestone after Li Auto strategic battery-supply/investment lineage.','event_stage_relationship':'later_distinct_event'}
          }
          def rows(node):
            if isinstance(node,dict):
              if node.get('source_spec_id') in cfg: yield node
              for val in node.values(): yield from rows(val)
            elif isinstance(node,list):
              for val in node: yield from rows(val)
          docs={fn:{r['source_spec_id']:r for r in rows(json.loads((root/'stages'/fn).read_text()))} for fn in ('stage-b.json','stage-c.json','stage-0-4.json','stage-0-5.json','stage-0-6.json','stage-0-7.json')}
          for sid,c in cfg.items():
            op={'relation_type':c['type'],'lineage_reason':c['reason'],'direction':'directional','event_stage_relationship':c['event_stage_relationship']}
            tokens={c['target']}
            v4.require_target_and_type(docs['stage-b.json'][sid]['related_evidence_review'],op,tokens,f'{sid} Stage B',require_reason=False)
            for fn in ('stage-c.json','stage-0-4.json','stage-0-5.json','stage-0-6.json','stage-0-7.json'):
              v4.require_target_and_type(docs[fn][sid]['related_lineage'],op,tokens,f'{sid} {fn}',require_reason=True)
          p=root/'related-lineage-repair-audit.json'; d=json.loads(p.read_text()); d['status']='PASS'; d['binding_validator']='validation_scripts.card_run_v4_binding_hardening.require_target_and_type'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('PASS: exact Related binding semantics preserved B through 0.7 for both operations')
          PY
          git diff --check

      - name: Commit repaired lineage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-b.json \
            runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-c.json \
            runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-0-4.json \
            runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-0-5.json \
            runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-0-6.json \
            runs/2026-09-10/sep9-r1-current-main-production-r1/stages/stage-0-7.json \
            runs/2026-09-10/sep9-r1-current-main-production-r1/related-lineage-repair-audit.json
          git diff --cached --check
          git commit -m 'fix: restore Sep9 Related lineage through Stage 0.7'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
