name: Patch review 4850266559

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_review_4850266559.py
      - .github/workflows/patch-review-4850266559.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_review_4850266559.py
      - name: Compile validators
        run: python -m py_compile validation_scripts/stage_lineage_contract_check.py validation_scripts/stage_lineage_contract_check_base.py
      - name: Focused regression
        run: python -m unittest validation_scripts.tests.test_review_4850266559_contracts
      - name: Full workflow-contract regression
        run: python validation_scripts/run_workflow_contract_suite.py
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified fix and remove temporary files
        run: |
          rm scripts/patch_review_4850266559.py
          rm .github/workflows/patch-review-4850266559.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scan full confirmation effect bridge"
          git push origin HEAD:agent/structural-news-value-v3
