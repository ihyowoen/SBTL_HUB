name: R32 PR393 market evidence quote remediation (no merge)
on:
  push:
    branches: [news/ev-demand-export-divergence-20261017]
    paths:
      - 'scripts/.r32_pr393_precise_populations.py.gz.b64'
      - '.github/workflows/r32-pr393-population-coverage-qc.yml'
permissions:
  contents: write
jobs:
  repair-market-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify authored patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,gzip,base64,hashlib
          data=base64.b64decode(pathlib.Path('scripts/.r32_pr393_precise_populations.py.gz.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='e4d44a9a56a4c5ff417415a42b1c4dd3635731c7c754ee04258b9c18059b2788'
          src=gzip.decompress(data)
          assert hashlib.sha256(src).hexdigest()=='d832e766ff76f95d078d70623f91654309aa73031c80d3212d4d64d40403bf17'
          code=src.decode('utf8')
          old="root=pathlib.Path('/tmp/R32_PR393')"
          assert code.count(old)==1
          pathlib.Path('/tmp/R32_pr393_verified_patch.py').write_text(code.replace(old,"root=pathlib.Path('.').resolve()"))
          print('Verified independent R32 original patch')
          PY
      - name: Add exact market-structure source quotes and validate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0e2b3008246ca18039df034c6410907f12673e72 HEAD
          python3 /tmp/R32_pr393_verified_patch.py
          node scripts/lean_cards.mjs
          node scripts/lean_cards.mjs --check
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > /tmp/R32_base_full.json
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json --base /tmp/R32_base_full.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json --base /tmp/R32_base_full.json --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          git diff --check
      - name: Repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Self-remove staging and commit exact three governed PR files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r32_pr393_precise_populations.py.gz.b64
          rm .github/workflows/r32-pr393-population-coverage-qc.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
             .github/workflows/r32-pr393-population-coverage-qc.yml \
             data/cards.full.json \
             direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json \
             public/data/cards.json \
             scripts/.r32_pr393_precise_populations.py.gz.b64 | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected files in R32 PR393 source patch'; git diff --cached --name-only; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cards): pin EV growth and export-share claims to source-body quotes (no merge)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "PASS: 1 independent market card; no deletions; only 3 governed data artifacts; review required."
