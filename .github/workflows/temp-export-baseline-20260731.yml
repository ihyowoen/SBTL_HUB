name: temp-export-baseline-20260731

on:
  push:
    branches:
      - temp/export-baseline-20260731

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and package baseline
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('data/cards.full.json')
          data = p.read_bytes()
          obj = json.loads(data)
          cards = obj if isinstance(obj, list) else obj.get('cards', [])
          print('bytes', len(data), 'cards', len(cards), 'sha256', hashlib.sha256(data).hexdigest())
          assert len(cards) == 1343
          PY
          gzip -9 -c data/cards.full.json > cards.full.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-cards-full-20260731
          path: cards.full.json.gz
          if-no-files-found: error
          retention-days: 1
