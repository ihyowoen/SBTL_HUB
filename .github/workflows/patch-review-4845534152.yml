name: Patch review 4845534152

on:
  pull_request:
    paths:
      - ".github/workflows/patch-review-4845534152.yml"
      - "scripts/patch_review_4845534152.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'agent/structural-news-value-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review fixes
        run: python scripts/patch_review_4845534152.py

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run focused regression
        run: python -m unittest validation_scripts.tests.test_review_4845534152_contracts -v

      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit verified fixes and remove temporary files
        run: |
          rm -f scripts/patch_review_4845534152.py
          rm -f .github/workflows/patch-review-4845534152.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_scripts/related_lifecycle_check.py \
                  validation_scripts/stage_lineage_contract_check.py \
                  validation_scripts/tests/test_review_4845534152_contracts.py \
                  scripts/patch_review_4845534152.py \
                  .github/workflows/patch-review-4845534152.yml
          git commit -m "fix: address review 4845534152 validator edge cases"
          git push origin HEAD:agent/structural-news-value-v3
