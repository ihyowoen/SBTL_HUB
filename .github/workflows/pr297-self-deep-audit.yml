name: pr297-self-deep-audit

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent semantic and lineage audit
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, re, sys

          root = pathlib.Path('.')
          run_path = root/'runs/2026-08-29/card-run.json'
          audit_path = root/'runs/2026-08-29/card_run_audit_20260829_CURRENT_MAIN_1496_COMBINED18.json'
          apply_path = root/'runs/2026-08-29/apply-report.json'
          full_path = root/'data/cards.full.json'
          lean_path = root/'public/data/cards.json'

          def load(p):
              with open(p, encoding='utf-8') as f: return json.load(f)
          def sha256(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''): h.update(b)
              return h.hexdigest()
          def cards_of(x):
              if isinstance(x,list): return x
              if isinstance(x,dict):
                  for k in ('cards','data','items'):
                      if isinstance(x.get(k),list): return x[k]
              raise AssertionError('cannot locate cards array')
          def visible(c):
              vals=[c.get('title',''),c.get('sub',''),c.get('gate',''),c.get('fact',''),c.get('sub_cat','')]
              vals += c.get('implication',[]) if isinstance(c.get('implication'),list) else []
              return '\n'.join(str(v) for v in vals)
          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)

          run=load(run_path); aud=load(audit_path); app=load(apply_path)
          full=cards_of(load(full_path)); lean=cards_of(load(lean_path))
          inserts=[x['card'] for x in run['operations']['insert']]
          ids=[c['id'] for c in inserts]
          fidx={c.get('id'):c for c in full}; lidx={c.get('id'):c for c in lean}
          errors=[]; warnings=[]
          def check(cond,msg):
              if not cond: errors.append(msg)

          check(len(inserts)==18, f'insert count {len(inserts)} != 18')
          check(len(set(ids))==18, 'insert ids not unique')
          check(len(full)==1514, f'full count {len(full)} != 1514')
          check(len(lean)==1514, f'lean count {len(lean)} != 1514')
          check(app['expected_before']==1496 and app['expected_after']==1514, 'apply count contract mismatch')
          check(app['insert_count']==18 and app['update_count']==0 and app['delete_count']==0, 'operation count contract mismatch')
          check(app['related_add_count']==3 and app['related_remove_count']==0, 'related operation contract mismatch')
          check(app['undeclared_existing_card_change_count']==0, 'undeclared existing change nonzero')
          check(aud['new_dangling_related_count']==0, 'new dangling related nonzero')
          check(aud['zero_deletion_assertion'] is True and aud['zero_related_remove_assertion'] is True, 'destructive-op assertion failed')
          check(sha256(full_path)==app['full_output_sha256'], 'full raw SHA256 differs from apply report')
          check(sha256(lean_path)==app['lean_output_sha256'], 'lean raw SHA256 differs from apply report')

          post_flags={}
          semantic=[]
          for c in inserts:
              cid=c['id']
              check(cid in fidx, f'{cid}: absent from canonical full')
              check(cid in lidx, f'{cid}: absent from lean projection')
              check(c.get('publish_ready') is True, f'{cid}: publish_ready != true')
              check(c.get('needs_publish_readiness_qc') is False, f'{cid}: needs_publish_readiness_qc != false')
              check(c.get('publish_ready_reset') is False, f'{cid}: publish_ready_reset != false')
              check(c.get('hard_fail_count',0)==0, f'{cid}: hard_fail_count != 0')
              gates=c.get('final_qc_gates',{})
              check(gates and all(v=='PASS' for v in gates.values()), f'{cid}: final_qc_gates not all PASS')
              dr=c.get('date_role',{})
              check(dr.get('date_role_locked') is True, f'{cid}: date_role not locked')
              check(dr.get('earliest_same_event_date_checked') is True, f'{cid}: earliest same-event date not checked')
              check(bool(dr.get('event_date_source_url')) and bool(dr.get('event_date_source_quote')), f'{cid}: missing event-date proof')
              scm=c.get('source_claim_coverage_map')
              check(isinstance(scm,list) and len(scm)>0, f'{cid}: missing claim coverage map')
              if isinstance(scm,list):
                  check(all(x.get('status')=='PASS' for x in scm), f'{cid}: non-PASS claim coverage row')
              sur=c.get('source_url_resolution',{})
              check(sur.get('canonical_complete') is True and sur.get('resolved_article_matches_quote') is True, f'{cid}: source URL resolution incomplete')
              for row in c.get('source_discovery_ledger',[]):
                  if row.get('outcome')=='used_in_fact_sources':
                      for k in ('source_role','source_origin_type','checked_at'):
                          check(bool(row.get(k)), f'{cid}: used discovery row missing {k}')
              rl=c.get('related_lineage',{})
              check(rl.get('status')=='PASS', f'{cid}: related lineage not PASS')
              if rl.get('relation_type')=='new_unrelated_event':
                  check(not c.get('related'), f'{cid}: unrelated event has related IDs')
              et=(c.get('event_fingerprint') or {}).get('event_type')
              txt=visible(c)
              if '커미셔닝' in txt and et=='production_start':
                  semantic.append(f'{cid}: visible commissioning but event_type=production_start')
              if re.search(r'상업.?가동|commercial operation', txt, re.I) and '커미셔닝' in txt:
                  semantic.append(f'{cid}: commissioning card contains commercial-operation wording')
              for k in ('needs_post_acceptance_duplicate_review','needs_post_acceptance_evidence_qc'):
                  if c.get(k) is True: post_flags[k]=post_flags.get(k,0)+1

          # Targeted remediations
          tata=next(c for c in inserts if c.get('source_spec_id')=='NEW27_TH_001')
          check(tata.get('sub_cat')=='인도FDRE·BESS커미셔닝', 'Tata sub_cat is not commissioning')
          ttxt=visible(tata)
          check('상업가동' not in ttxt and 'commercial operation' not in ttxt.lower(), 'Tata visible copy still claims commercial operation')
          tq='\n'.join(str(s.get('source_quote','')) for s in tata.get('fact_sources',[]))
          for needle in ('190.5 MW','460 MW','115 MWHr','HPPC','MSEDCL','NPCL'):
              check(needle in tq, f'Tata retained official quotes missing {needle}')

          us=next(c for c in inserts if c.get('source_spec_id')=='NEW27_RP_001')
          ustxt=json.dumps(us,ensure_ascii=False).lower()
          check('grid-synchronized' not in ustxt and 'grid synchronized' not in ustxt, 'US card retains grid-synchronized wording')
          check('operating-base' not in ustxt and 'operating base' not in ustxt, 'US card retains operating-base wording')
          check('55.81gw' in visible(us).lower() and '4.883gw' in visible(us).lower(), 'US visible capacity metrics missing')

          cnesa=next(c for c in inserts if c.get('source_spec_id')=='NEW27_TH_003')
          check((cnesa.get('event_fingerprint') or {}).get('event_type')=='market_data_release', 'CNESA event_type != market_data_release')

          # Search every referenced stage artifact for targeted source-spec copies and semantic drift.
          refs=sorted({r for op in run['operations']['insert'] for r in op.get('stage_artifacts',[]) if isinstance(r,str) and r.endswith('.json')})
          tata_stage=[]; cnesa_stage=[]
          for r in refs:
              p=root/r
              if not p.exists():
                  errors.append(f'missing stage artifact {r}'); continue
              try: obj=load(p)
              except Exception as e:
                  errors.append(f'cannot parse stage artifact {r}: {e}'); continue
              for d in walk(obj):
                  if d.get('source_spec_id')=='NEW27_TH_001' and isinstance(d.get('event_fingerprint'),dict):
                      tata_stage.append((r,d['event_fingerprint'].get('event_type')))
                  if d.get('source_spec_id')=='NEW27_TH_003' and isinstance(d.get('event_fingerprint'),dict):
                      cnesa_stage.append((r,d['event_fingerprint'].get('event_type')))
          check(cnesa_stage and all(v=='market_data_release' for _,v in cnesa_stage), f'CNESA stage artifact event_type drift: {cnesa_stage}')

          print('SELF_AUDIT_COUNTS', {'insert':len(inserts),'full':len(full),'lean':len(lean),'refs':len(refs)})
          print('POST_ACCEPTANCE_TRUE_FLAGS', post_flags)
          print('TATA_STAGE_EVENT_TYPES', tata_stage)
          print('CNESA_STAGE_EVENT_TYPES', cnesa_stage)
          print('SEMANTIC_FINDINGS', semantic)
          print('ERROR_COUNT', len(errors))
          for e in errors: print('ERROR',e)

          # commissioning vs production_start is treated as a semantic hard finding for this merge audit
          if semantic:
              for s in semantic: print('SEMANTIC_ERROR',s)
              sys.exit(3)
          if errors: sys.exit(2)
          print('SELF_DEEP_AUDIT_PASS')
          PY
