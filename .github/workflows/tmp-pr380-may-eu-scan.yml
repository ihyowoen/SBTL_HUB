name: tmp-pr380-may-eu-scan
on:
  push:
    paths:
      - '.github/workflows/tmp-pr380-may-eu-scan.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rebuild-monthly-brief-2026-06
      - name: Print May EU cards
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const cards=Array.isArray(root)?root:(root.cards||root.items||[]);
          const mayEU=cards.filter(c=>String(c.date||'').startsWith('2026-05') && String(c.region||'').toUpperCase()==='EU');
          console.log('COUNT',mayEU.length);
          for(const c of mayEU){
            const s=JSON.stringify(c);
            const low=s.toLowerCase();
            const hit=['조달','procurement','투자','investment','적격','eligib','foreign','외국','입찰','bid','subsid','보조','screening','심사','non-eu','비유럽'].some(k=>low.includes(k));
            if(hit) console.log(JSON.stringify({id:c.id,date:c.date,title:c.title,fact:c.fact,summary:c.summary,why:c.why_it_matters,implication:c.implication,region:c.region}));
          }
          console.log('ALL_IDS',mayEU.map(c=>[c.id,c.title]));
          NODE