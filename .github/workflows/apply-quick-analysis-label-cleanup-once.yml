name: apply-quick-analysis-label-cleanup-once

on:
  push:
    branches:
      - chatgpt/monthly-brief-domain-cleanup-20260908
    paths:
      - "scripts/apply_quick_analysis_label_cleanup.mjs"
      - ".github/workflows/apply-quick-analysis-label-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[quick-labels-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/monthly-brief-domain-cleanup-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply Quick Analysis label cleanup
        run: node scripts/apply_quick_analysis_label_cleanup.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Quick Analysis label tests
        run: npx vitest run __tests__/quickAnalysisLabels.test.js __tests__/monthlyBriefProductBoundary.test.js __tests__/monthlyBriefActiveDomain.test.js
      - name: Full unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated label cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/kang.js
          git commit -m "Separate Quick Analysis labels from Monthly Brief [quick-labels-applied]"
          git push origin HEAD:chatgpt/monthly-brief-domain-cleanup-20260908
