name: Validate exact 425-event handoff artifacts

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-inspect-handoff425.yml'
      - 'runs/2026-09-02/crossrun_event_membership_425.json'
      - 'runs/2026-09-02/stage_a_event_handoff_425_20260902.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact hash count schema and lossless-transfer validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, sys

          membership_path = Path('runs/2026-09-02/crossrun_event_membership_425.json')
          handoff_path = Path('runs/2026-09-02/stage_a_event_handoff_425_20260902.json')

          if not membership_path.exists() or not handoff_path.exists():
              print('STATUS=WAITING_FOR_FULL_425_ARTIFACTS')
              print('membership_exists=', membership_path.exists())
              print('handoff_exists=', handoff_path.exists())
              sys.exit(0)

          EXPECTED = {
              'membership_sha256': '90719eb1067241df6b201c2722cca5280f89ea69d0e3fd3e7865b9e91d9e8c13',
              'handoff_sha256': 'ff58d295d0d2360fdb053d18aea1921de29397f891db4d957ecf7140a49ac119',
              'event_count': 425,
              'observation_count': 632,
              'handoff_schema': 'stage_a_event_handoff_425_v1',
              'run_id': 'SBTL_V4_XRUN_20260831_143419__20260901_123511_R3',
              'input_20260831_sha256': '40c308cfe4ca067bb0d93a57475ee0ea359bfaf1332e895dcf35591dc6ceafb8',
              'input_20260901_sha256': '28fcb692c1782bebc06f8f8816cdee8ce3bef80f703aab7eddab4df837df3452',
              'original_event_universe_main_sha': 'f2792958a85470c11030211642012865c69f56ab',
              'rebound_current_main_sha': 'df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4',
              'canonical_blob_sha': '53219907cdb435c3822c41d097b23e475662aa8a',
              'canonical_card_count': 1514,
          }

          def load_exact(path):
              raw = path.read_bytes()
              sha = hashlib.sha256(raw).hexdigest()
              obj = json.loads(raw.decode('utf-8-sig'))
              return raw, sha, obj

          def extract_events(obj, label):
              if isinstance(obj, list):
                  events = obj
              elif isinstance(obj, dict):
                  events = None
                  for key in ('events', 'event_membership', 'items'):
                      if isinstance(obj.get(key), list):
                          events = obj[key]
                          break
                  if events is None:
                      raise AssertionError(f'{label}: no event list found')
              else:
                  raise AssertionError(f'{label}: unsupported top-level type {type(obj).__name__}')
              if not all(isinstance(e, dict) for e in events):
                  raise AssertionError(f'{label}: every event must be an object')
              return events

          def event_id(e):
              for k in ('event_id', 'id'):
                  v=e.get(k)
                  if isinstance(v,str) and v:
                      return v
              raise AssertionError('event missing event_id/id')

          def obs_ids(e):
              for k in ('observation_ids','source_observation_ids','member_observation_ids'):
                  v=e.get(k)
                  if isinstance(v,list):
                      return v
              raise AssertionError(f'{event_id(e)}: missing observation_ids list')

          m_raw, m_sha, membership = load_exact(membership_path)
          h_raw, h_sha, handoff = load_exact(handoff_path)
          print('membership_bytes=', len(m_raw))
          print('membership_sha256=', m_sha)
          print('handoff_bytes=', len(h_raw))
          print('handoff_sha256=', h_sha)
          assert m_sha == EXPECTED['membership_sha256'], (m_sha, EXPECTED['membership_sha256'])
          assert h_sha == EXPECTED['handoff_sha256'], (h_sha, EXPECTED['handoff_sha256'])

          assert isinstance(handoff, dict)
          assert handoff.get('schema') == EXPECTED['handoff_schema']
          assert handoff.get('status') == 'PASS_SOURCE_BOUND_CURRENT_EVENTS'
          assert handoff.get('run_id') == EXPECTED['run_id']
          assert handoff.get('source_full_local_artifact_sha256') == EXPECTED['membership_sha256']
          assert handoff.get('source_input_sha256',{}).get('20260831') == EXPECTED['input_20260831_sha256']
          assert handoff.get('source_input_sha256',{}).get('20260901') == EXPECTED['input_20260901_sha256']
          assert handoff.get('original_event_universe_main_sha') == EXPECTED['original_event_universe_main_sha']
          assert handoff.get('rebound_current_main_sha') == EXPECTED['rebound_current_main_sha']
          assert handoff.get('canonical_blob_sha') == EXPECTED['canonical_blob_sha']
          assert handoff.get('canonical_card_count') == EXPECTED['canonical_card_count']
          assert handoff.get('event_count') == EXPECTED['event_count']
          assert handoff.get('observation_count') == EXPECTED['observation_count']
          assert handoff.get('all_observations_accounted') is True
          assert handoff.get('document_universe_manifest_ref') == 'runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_df6fccc.json'
          assert handoff.get('historical_terminal_reconciliation_ref') == 'runs/2026-09-02/stage_0_0c_historical_carry_forward_terminal_reconciliation_20260902_R3.json'

          m_events = extract_events(membership, 'membership')
          h_events = extract_events(handoff, 'handoff')
          assert len(m_events) == EXPECTED['event_count']
          assert len(h_events) == EXPECTED['event_count']

          for label, events in [('membership',m_events),('handoff',h_events)]:
              ids=[event_id(e) for e in events]
              assert len(ids) == len(set(ids)), f'{label}: duplicate event ids'
              assert all(re.fullmatch(r'XRUN_20260831_20260901_R3_E\d{4}',x) for x in ids), f'{label}: malformed event id'
              nums=sorted(int(x.rsplit('E',1)[1]) for x in ids)
              assert nums == list(range(1, EXPECTED['event_count']+1)), f'{label}: event ids are not exactly E0001..E0425'
              flat=[]
              for e in events:
                  oids=obs_ids(e)
                  assert oids, f'{event_id(e)}: empty observation_ids'
                  assert len(oids)==len(set(oids)), f'{event_id(e)}: duplicate observation id within event'
                  flat.extend(oids)
              assert len(flat) == EXPECTED['observation_count'], f'{label}: observation membership total={len(flat)}'
              assert len(set(flat)) == EXPECTED['observation_count'], f'{label}: observations reused across events'
              print(label+'_events=',len(events))
              print(label+'_observations=',len(flat))

          m_by={event_id(e):e for e in m_events}
          h_by={event_id(e):e for e in h_events}
          assert set(m_by)==set(h_by), 'membership/handoff event id sets differ'
          for eid in sorted(m_by):
              assert obs_ids(m_by[eid]) == obs_ids(h_by[eid]), f'{eid}: observation membership changed in handoff'
              for key in ('title','date','representative_url'):
                  if key in m_by[eid] and key in h_by[eid]:
                      assert m_by[eid].get(key) == h_by[eid].get(key), f'{eid}: {key} changed in handoff'

          required_handoff_event_keys={
              'event_id','title','date','regions','observation_ids','representative_url',
              'representative_site','canonical_relation','canonical_top_matches','excerpt'
          }
          for e in h_events:
              missing=required_handoff_event_keys-set(e)
              assert not missing, f'{event_id(e)}: missing handoff event keys {sorted(missing)}'
              assert isinstance(e['regions'],list)
              assert isinstance(e['canonical_top_matches'],list)
              cr=e['canonical_relation']
              assert isinstance(cr,dict)
              assert {'relation_type','target_ids','confidence','reason'} <= set(cr)
              assert isinstance(cr['target_ids'],list)

          hist = json.loads(Path('runs/2026-09-02/stage_0_0c_historical_carry_forward_terminal_reconciliation_20260902_R3.json').read_text(encoding='utf-8'))
          h246=hist['historical_246_accounting']
          assert h246['input_total']==246
          assert h246['already_canonicalized_exact']==3
          assert h246['provenance_hold_not_stage_a_evaluable']==243
          assert h246['active_carry_forward_to_current_stage_a']==0
          assert h246['accounted_total']==246 and h246['accounting_pass'] is True
          ledger=hist['terminal_historical_246_disposition_ledger']
          assert len(ledger)==243
          assert len({x['story_id'] for x in ledger})==243
          assert all(x['disposition']=='provenance_hold_not_stage_a_evaluable' for x in ledger)
          assert all(x['stage_a_eligible_current_run'] is False for x in ledger)

          print('historical_provenance_hold_count=',len(ledger))
          print('STATUS=PASS_EXACT_425_HANDOFF_READY_FOR_FORMAL_STAGE_A')
          PY
