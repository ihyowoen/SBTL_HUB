name: Workflow contract validation

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - "scripts/patch_review_4841064772.py"
      - ".github/workflows/workflow-contract-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review 4841064772 fixes
        run: python -B scripts/patch_review_4841064772.py

      - name: Compile validators without bytecode
        run: |
          python -B - <<'PY'
          from pathlib import Path
          for path in Path('validation_scripts').rglob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Run focused review tests
        run: python -B -m unittest validation_scripts.tests.test_review_4841064772_contracts -v

      - name: Run workflow-contract and exporter regression tests
        run: python -B -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python -B validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Restore workflow and remove temporary files
        run: |
          git checkout HEAD^ -- .github/workflows/workflow-contract-validation.yml
          rm -f scripts/patch_review_4841064772.py
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address review 4841064772 contracts"
          git push origin HEAD:agent/structural-news-value-v3
