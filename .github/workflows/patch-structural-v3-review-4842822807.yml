name: patch-structural-v3-review-4842822807

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/structural-news-value-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review patch
        run: python scripts/patch_structural_v3_review_4842822807.py
      - name: Validate
        run: |
          python -m py_compile validation_scripts/related_lifecycle_check.py validation_scripts/stage_lineage_contract_check.py
          python -m unittest validation_scripts.tests.test_review_4842822807
          python -m unittest validation_scripts.tests.test_workflow_contracts
          python validation_scripts/apply_prompt_contract_overlays.py --verify
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: close review 4842822807 gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
