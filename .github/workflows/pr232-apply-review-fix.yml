name: pr232-apply-review-fix

on:
  pull_request:
    paths:
      - "scripts/.pr232-payload/**"
      - "scripts/pr232_apply_review_fix.mjs"
      - ".github/workflows/pr232-apply-review-fix.yml"

permissions:
  contents: write

concurrency:
  group: pr232-review-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-reviewed-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore reviewed implementation
        run: node scripts/pr232_apply_review_fix.mjs
      - name: Validate restored implementation
        run: |
          set -euo pipefail
          node --check scripts/apply_card_run.mjs
          node --check scripts/apply_card_run_test.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("schemas/card-run.v1.schema.json", "utf8")); console.log("PASS: schema JSON")'
          node scripts/apply_card_run_test.mjs
          git diff --check
      - name: Commit reviewed implementation
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address card-run engine review findings"
          git push origin "HEAD:${HEAD_REF}"
