name: tmp-remediate-pr376-codex-r3
on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-07
    paths:
      - .github/workflows/tmp-remediate-pr376-codex-r3.yml
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-07
          fetch-depth: 0
      - name: Apply second-pass Codex remediation
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5147e5bfbe7cadbf03782ef68805444227afaf1e"
          python - <<'PY'
          import json
          from pathlib import Path

          MONTH='2026-07'
          SPRING='2026-07-07_US_02'
          SANGDONG='2026-07-01_KR_05'
          SANGDONG_URL='https://www.nasdaq.com/press-release/almonty-commences-processing-operations-sangdong-mine-marking-transition-saleable'

          p=Path('public/data/monthly_briefs.json')
          doc=json.loads(p.read_text())
          issue=next(x for x in doc['items'] if x.get('month')==MONTH)
          issue['source_card_ids']=[x for x in issue['source_card_ids'] if x!=SPRING]
          issue['executive_diagnosis']=(
            '7월 배터리 산업의 핵심 변화는 ESS가 단순 설치 전망을 넘어 계약·프로젝트금융·플랫폼 M&A·가동을 갖춘 독립적인 인프라 자산군으로 자본화되기 시작한 점이다. '
            '동시에 AI 데이터센터와 계통 병목은 BESS를 전력 인프라 설계요소로 끌어들였다. 공급 측에서는 EV 수요가 유지되는 가운데 ESS가 별도 생산축으로 확대됐고, 중국에서는 LFP 비중이 높은 수준을 유지했다. '
            '핵심광물 현지화는 오프테이크·최종투자결정·가공·투자·수익성 확인으로 구체화됐다. 관세·세제·안전·접속 규칙도 제품 경제성과 시장진입을 가르는 변수로 작동했다. '
            '따라서 7월을 ‘EV 둔화→ESS 대체’로 읽기보다 수요·자본·생산·공급망이 여러 축으로 재편된 달로 보는 편이 정확하다.'
          )
          issue['what_changed']=(
            '7월에는 발표된 용량의 크기보다 어느 단계까지 실제로 내려왔는지가 더 중요해졌다. ESS에서는 장기 수익계약·금융종결·플랫폼 인수계약·통전·상업운전이 동시에 확인됐고, '
            'AI·배전망 제약이 저장장치의 새로운 수요 논리를 만들었다. 생산에서는 EV 축이 유지된 채 ESS 생산이 추가로 확대됐으며, 핵심광물은 단순 협력선언보다 오프테이크·FID·가공·투자·수익성 확인 단계로 이동했다. '
            'SBTL 관점에서는 ESS 성장률을 파우치필름 수요로 자동 환산하지 않고, 실제 셀 폼팩터·고객 프로그램·공급계약이 확인되는 경우에만 직접 수요 신호로 해석해야 한다.'
          )
          flows={x['id']:x for x in issue['key_flows']}
          flows['03']['title']='EV 성장축은 유지되고, ESS가 별도 생산·수요축으로 확대'
          flows['03']['card_ids']=[x for x in flows['03']['card_ids'] if x!=SPRING]
          flows['03']['summary']=(
            'LG에너지솔루션-Honda 오하이오 합작공장은 ESS 셀 양산을 개시했고, CATL의 상반기 ESS 시스템 매출은 87.54% 늘었다. 동시에 중국 6월 동력배터리 탑재량도 전년 대비 31.5% 증가했고 LFP 비중은 83.3%에 달했다. '
            '즉 EV가 사라지고 ESS가 대체한 것이 아니라 생산·화학계·고객 믹스가 넓어진 것이다. SBTL 관점에서는 ESS 성장률을 파우치필름 수요로 자동 환산하지 않고, '
            '실제 셀 폼팩터·고객 프로그램·공급계약이 확인되는 경우에만 직접 수요 신호로 해석해야 한다.'
          )
          flows['05']['summary']=(
            '미국은 강제노동 규제 집행과 연계한 Section 301 관세 최종조치를 발표했고, FCC는 외국산 connected power inverter의 신규 장비승인 제한을 강화했다. '
            'Lazard의 4시간 BESS 경제성 분석에서는 관세와 외국기업 제한이 저가 셀 조달의 변수가 됐다. 중국은 9월부터 리튬이온 배터리에 2% 소비세를 적용하고 나트륨이온·고체전지에는 한시 면세를 두는 제도를 7월 확정했으며, EV 구동용 배터리 안전표준도 새 단계로 들어갔다. '
            '규칙은 단순 컴플라이언스 비용이 아니라 제품구성·조달경로·시장진입 조건을 바꾸는 변수다. 제품별 관세·세율·표준 적용범위를 구분해야 한다.'
          )
          issue['watch']=[
            ('중국 리튬이온 배터리 소비세와 면세 화학계의 실제 제품경계·세후 원가, 미국 관세·FCC 승인 제한의 제품별 적용이 셀·PCS·인버터 조달과 기술선택에 어떤 영향을 만드는지 확인한다.'
             if w.startswith('중국 배터리 소비세의 실제 제품경계') else w)
            for w in issue.get('watch',[])
          ]
          refs=[]
          for r in issue['refs']:
            if r['id']==SPRING:
              continue
            if r['id']==SANGDONG:
              r['url']=SANGDONG_URL
            refs.append(r)
          for i,r in enumerate(refs,1): r['n']=i
          issue['refs']=refs
          issue['qc']['notes']=(
            'Rebuilt independently from the current governed July universe of 365 cards (75 top, 239 high, 51 mid). Legacy Vol.09 was consulted only after the independent thesis was locked and was used solely for omission/overreach red-team. '
            'After two exact-head Codex review passes, four non-indispensable cards with compound-title/source-binding or geography defects were quarantined from publication; 24 official canonical anchors remain. '
            'Paducah and Sangdong were rebound to governed sources covering their full visible claims. Unsupported vanadium-flow tax scope and the misclassified Paducah late-check audit entry were removed.'
          )
          issue['approval']['notes']=(
            'Re-authorized after second exact-head Codex remediation: full-claim source bindings were corrected, non-indispensable compound-title defects were quarantined, and unsupported policy/audit scope was removed without mutating canonical cards inside the publication PR.'
          )
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')

          ap=Path('runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')
          audit=json.loads(ap.read_text())
          audit['method']=[s.replace('25-card','24-card') if isinstance(s,str) else s for s in audit.get('method',[])]
          for f in audit.get('selected_flows',[]):
            if f.get('id')=='03':
              f['title']=flows['03']['title']
              f['anchor_card_ids']=[x for x in f.get('anchor_card_ids',[]) if x!=SPRING]
              f['reason']='ESS production and revenue expansion coexist with positive China traction-battery installation growth. The supported conclusion is production/customer diversification rather than simple EV-to-ESS substitution; compound-title bindings that cannot be proven by one public URL are excluded from the official evidence set.'
          audit['post_month_counterevidence']=[x for x in audit.get('post_month_counterevidence',[]) if x.get('status')!='LATE_STATUS_CHECK']
          sel=audit['official_source_selection']
          sel['selected_card_count']=24
          sel['source_card_ids']=[x for x in sel['source_card_ids'] if x!=SPRING]
          nb=[]
          for b in sel.get('binding',[]):
            if b.get('id')==SPRING:
              continue
            if b.get('id')==SANGDONG:
              b['selected_url']=SANGDONG_URL
            nb.append(b)
          sel['binding']=nb
          tri=audit['card_integrity_triage']
          q=tri.get('quarantined_cards',[])
          if not any(x.get('id')==SPRING for x in q):
            q.append({
              'id':SPRING,
              'class':'CARD_SOURCE_BINDING',
              'reason':'Locked visible title combines a prior $70M conversion figure from the March Ultium source with the July production-start event; no single selected governed URL proves the complete compound title under the publication provenance contract.'
            })
          tri['quarantined_cards']=q
          tri['publication_binding_fixes']=[
            {'id':'2026-07-29_US_02','action':'REBIND_TO_GOVERNED_FULL_CLAIM_SOURCE','url':'https://www.investor.nexteraenergy.com/news-and-events/news-releases/2026/07-29-2026-133109921'},
            {'id':SANGDONG,'action':'REBIND_TO_GOVERNED_FULL_CLAIM_SOURCE','url':SANGDONG_URL}
          ]
          audit['qc']['source_binding']='PASS_AFTER_SECOND_CODEX_REMEDIATION'
          audit['qc']['policy_scope_precision']='PASS_AFTER_SECOND_CODEX_REMEDIATION'
          audit['qc']['post_month_classification']='PASS_AFTER_SECOND_CODEX_REMEDIATION'
          audit['qc']['codex_second_pass_head_3d5d31816d']='REMEDIATED_P1_X3_P2_X1'
          ap.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')

          assert len(issue['source_card_ids'])==24
          assert len(issue['refs'])==24
          assert SPRING not in issue['source_card_ids']
          assert all(r['id']!=SPRING for r in issue['refs'])
          assert next(r for r in issue['refs'] if r['id']==SANGDONG)['url']==SANGDONG_URL
          assert '바나듐흐름전지' not in json.dumps(issue,ensure_ascii=False)
          assert not any(x.get('status')=='LATE_STATUS_CHECK' for x in audit['post_month_counterevidence'])
          print('PR376 second-pass remediation prepared: 24 refs; Sangdong rebound; Spring Hill quarantined')
          PY
          npm ci
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s' 'public/data/monthly_briefs.json' 'runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')"
          test "$changed" = "$expected"
      - name: Commit remediation
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add public/data/monthly_briefs.json runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json
          git commit -m "fix: remediate second PR376 Codex review"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-07
