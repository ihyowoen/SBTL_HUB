name: Workflow contract validation

on:
  pull_request:
    paths:
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"
      - ".github/workflows/workflow-contract-validation.yml"
  push:
    branches:
      - agent/workflow-contract-related-source-audit
    paths:
      - "docs/RELATED_LIFECYCLE_CONTRACT.md"
      - "docs/SOURCE_AUDIT_CONTRACT.md"
      - "docs/llm_prompts/v1/**"
      - "validation_data/source_owner_registry.json"
      - "validation_scripts/**"
      - "scripts/lean_cards.mjs"
      - ".github/workflows/lean-cards.yml"
      - ".github/workflows/workflow-contract-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused review patch
        run: python -B scripts/patch_pr233_review_4842556549.py

      - name: Run focused regression
        run: python -B -m unittest validation_scripts.tests.test_review_4842556549_contracts -v

      - name: Compile validators
        run: |
          python -B - <<'PY'
          from pathlib import Path
          for path in Path('validation_scripts').rglob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Run workflow-contract and exporter regression tests
        run: python -B -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python -B validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit verified review fixes
        run: |
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address review 4842556549 validators"
          git push origin HEAD:agent/structural-news-value-v3
