name: tmp-monthly-brief-relock-20260910

on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-08

permissions:
  contents: write

jobs:
  relock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-review and relock official August Monthly Brief
        shell: bash
        run: |
          set -euo pipefail
          BASE='8f3b6c3277d7cd13ccfc48f3c72a5d1ecb5d7c58'
          BLOB='beb2aa7615b583b4c9c0c269974601a0b26c2684'
          git fetch origin main --force
          [[ "$(git rev-parse origin/main)" == "$BASE" ]]
          [[ "$(git rev-parse "${BASE}:data/cards.full.json")" == "$BLOB" ]]
          git show "${BASE}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.locked.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const locked=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cards.full.locked.json','utf8'));
          if(locked.total!==1617 || locked.cards.length!==1617) throw new Error(`locked total mismatch ${locked.total}/${locked.cards.length}`);
          const august=locked.cards.filter(c=>String(c.date||'').startsWith('2026-08-'));
          const countBy=(key)=>Object.fromEntries([...august.reduce((m,c)=>m.set(c[key],(m.get(c[key])||0)+1),new Map()).entries()].sort());
          const signals=countBy('signal');
          const regions=countBy('region');
          if(august.length!==171) throw new Error(`August universe changed again: ${august.length}`);
          if(JSON.stringify(signals)!==JSON.stringify({high:122,mid:16,top:33})) throw new Error(`signal distribution drift ${JSON.stringify(signals)}`);
          if(JSON.stringify(regions)!==JSON.stringify({CN:34,EU:26,GL:48,JP:3,KR:25,US:35})) throw new Error(`region distribution drift ${JSON.stringify(regions)}`);
          const byId=new Map(locked.cards.map(c=>[c.id,c]));
          const need=(id,title,signal,region)=>{
            const c=byId.get(id);
            if(!c || c.title!==title || c.signal!==signal || c.region!==region) throw new Error(`locked card drift ${id}: ${JSON.stringify(c&&{title:c.title,signal:c.signal,region:c.region})}`);
            return c;
          };
          const old300=need('2026-08-05_US_03','외르스테드 Old 300 Storage, 텍사스 250MW/500MWh 상업운전','top','US');
          if(old300.urls?.[0]!=='https://www.pv-magazine.com/2026/08/06/orsted-turns-on-500-mwh-battery-project-with-co-located-solar-in-texas/') throw new Error('Old300 primary binding drift');
          need('2026-08-26_CN_02','CATL Jianxiawo EIA 접수 공시 철회…재가동 절차 다시 후퇴','top','CN');
          const jp=need('2026-08-31_JP_02','丸紅新電力, FIP 태양광 연계 BESS로 조정력시장 진입','high','JP');
          const xinlun=need('2026-08-31_CN_02','新纶新材, 알루미늄 파우치필름 열법 2호선 양산 개시','top','CN');
          const mingguan=need('2026-08-26_CN_04','明冠新材, H1 알루미늄 파우치필름 매출 +266%','top','CN');
          const late=[jp,xinlun,mingguan];
          const addUnique=(arr,ids)=>{ for(const id of ids) if(!arr.includes(id)) arr.push(id); };
          const refFrom=(c,n)=>{
            const out={n,id:c.id,title:c.title,date:c.date};
            const u=Array.isArray(c.urls)?c.urls.find(v=>typeof v==='string'&&v.trim()):c.url;
            if(u) out.url=u.trim();
            return out;
          };

          const briefPath='public/data/monthly_briefs.json';
          const lib=JSON.parse(fs.readFileSync(briefPath,'utf8'));
          if(lib.items?.length!==1 || lib.items[0].id!=='monthly-brief-2026-08-r1') throw new Error('unexpected library shape');
          const item=lib.items[0];
          if(item.source_card_ids.length!==17 || item.refs.length!==17) throw new Error('upstream evidence set changed');
          if(!item.executive_diagnosis.includes('셀·소재 생산은 EV 단일 수요가 아니라 ESS·LFP·복수 화학계와 고객 믹스에 맞춰 재배치됐다.')) throw new Error('diagnosis upstream drift');
          item.executive_diagnosis='8월 배터리 산업의 핵심 변화는 성장률 자체보다 어디에서 실제로 돈이 투입되고, 어떤 자산이 가동되며, 어떤 조건으로 공급망이 잠기는가로 판단 기준이 이동한 것이다. ESS는 장기 수익계약·금융종결·착공·상업운전뿐 아니라 일본 조정력시장 실제 진입까지 이어지며 전력 인프라 자산으로 자리잡는 흐름이 뚜렷해졌다. 공급 측에서는 셀의 EV·ESS 복수 용도와 화학계 전략이 구체화되는 동시에 파우치필름에서도 ESS·3C·고체전지로 고객·용도 믹스가 넓어지고 신규 라인이 가동되면서 다변화 방향이 확인됐다. 동시에 정책과 전략자본은 원료·재활용·전력망 장비와 디지털 보안까지 공급망 통제 범위를 넓혔다.';
          item.what_changed='8월에는 ‘EV 둔화와 ESS 성장’만으로는 산업 변화를 설명하기 어려워졌다. EV 배터리 수요도 성장하는 가운데 ESS는 장기계약·은행금융·착공·상업운전과 전력시장 참여로 실행 단계가 넓어졌고, 셀 생산에서는 복수 용도·화학계 전략이, 파우치필름에서는 신규 생산라인 가동과 매출 급증·고체전지용 배치 출하가 확인됐다. 따라서 앞으로는 단순 출하량보다 COD·가동률·장기계약 집행·고객·제품 믹스·현지조달 적격성·세후 원가와 수익성을 함께 봐야 한다.';
          item.source_baseline={main_commit_sha:'8f3b6c3277d7cd13ccfc48f3c72a5d1ecb5d7c58',full_blob_sha:'beb2aa7615b583b4c9c0c269974601a0b26c2684',source_month_count:171};
          addUnique(item.source_card_ids,late.map(c=>c.id));

          const f1=item.key_flows.find(f=>f.id==='01');
          const f2=item.key_flows.find(f=>f.id==='02');
          if(!f1||!f2) throw new Error('missing flow');
          f1.summary='텍사스 Old 300의 250MW/500MWh 상업운전, 사우디 Red Sea의 1.2GWh BESS 상업운전, 네덜란드 Sirius 200MW/800MWh의 금융종결·Vattenfall 장기 tolling, 독일 Boxberg 400MW/1.6GWh 착공이 한 달 안에 이어졌다. 일본에서는 FIP 태양광 연계 BESS가 8월부터 수급조정시장에 실제 조정력을 제공하기 시작했다. 단순 프로젝트 발표가 아니라 수익계약·금융·건설·운영·전력시장 참여까지 여러 실행 단계가 동시에 채워졌다는 점이 핵심이다.';
          addUnique(f1.card_ids,[jp.id]);
          f2.title='생산·소재 공급전략, EV 단일축에서 복수 용도·화학계로 다변화 방향 구체화';
          f2.summary='Lansing 공장은 생산을 시작했고, LG에너지솔루션은 이 공장에서 EV용 NCM과 ESS용 LFP를 함께 생산하는 제품 믹스를 계획하고 있다. SK온은 미국산 LFP 9GWh 장기 공급계약으로 ESS 수요를 계약화했고, 현대차는 EREV용 자체 셀과 EV용 미드니켈 NCM을 병행하는 로드맵을 제시했다. 중국에서는 ESS·EV용 70GWh 공장과 3GWh 나트륨이온 셀 공장이 생산 단계에 들어갔다. 소재 측에서는 新纶新材의 월 300만㎡ 파우치필름 신규 라인이 EV·ESS·3C용으로 가동됐고, 明冠新材의 상반기 파우치필름 매출은 266.01% 증가했으며 고체전지용 제품의 배치 출하도 확인됐다. EV 수요가 사라진 것이 아니라 셀과 포장소재 공급전략이 복수 용도·화학계·고객군을 함께 흡수하는 방향으로 넓어지는 변화다.';
          addUnique(f2.card_ids,[xinlun.id,mingguan.id]);
          const wi=item.watch.indexOf('Lansing과 미국 LFP 공급계약이 실제 ESS 출하·가동률·제품 믹스로 연결되는지 확인한다.');
          if(wi<0) throw new Error('watch upstream drift');
          item.watch[wi]='Lansing·미국 LFP 공급계약과 중국 파우치필름 신규 라인이 실제 출하·가동률·제품·고객 믹스로 연결되는지 확인한다.';
          let n=item.refs.length+1;
          for(const c of late) item.refs.push(refFrom(c,n++));
          if(item.source_card_ids.length!==20 || item.refs.length!==20) throw new Error('20-card evidence set not formed');
          lib.updated_at='2026-09-10';
          item.published_at='2026-09-10';
          item.qc.reviewed_at='2026-09-10';
          item.qc.notes='Full August canonical universe re-reviewed at the locked 1,617-card baseline: 171 August cards (33 top, 122 high, 16 mid). Three late-admitted August cards were explicitly assessed. The Japan balancing-market operation strengthens Flow 01; two China pouch-film cards materially strengthen Flow 02 without requiring a fifth flow. Xinlun is treated as an August representative event because its Sep-8 disclosure locks an Aug-31 production-start fact rather than importing a September event; Jianxiawo remains excluded because its former enrichment imported later September facts into the August headline. September lineage and counterevidence did not overturn the four-flow diagnosis.';
          item.approval.approved_at='2026-09-10';
          item.approval.notes='Publication re-authorized after exact canonical relock and explicit re-review of the three late-admitted August representative events.';
          fs.writeFileSync(briefPath,JSON.stringify(lib,null,2)+'\n');

          const auditPath='runs/2026-09-09/monthly-brief-2026-08-editorial-audit.json';
          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          audit.audit_date='2026-09-10';
          audit.baseline={main_commit_sha:'8f3b6c3277d7cd13ccfc48f3c72a5d1ecb5d7c58',cards_full_blob_sha:'beb2aa7615b583b4c9c0c269974601a0b26c2684',total_canonical_cards:1617,month_card_count:171,signal_distribution:{top:33,high:122,mid:16},region_distribution:{GL:48,US:35,CN:34,EU:26,KR:25,JP:3}};
          audit.method[1]='Review all 171 August cards, using the 33 top cards as candidate structural anchors and the 122 high cards as reinforcement/counterevidence rather than article-count votes.';
          if(!audit.method.some(x=>x.includes('late-admitted August'))) audit.method.splice(2,0,'Explicitly re-review the three late-admitted August representative events introduced by the Sep-8 governed production run before preserving or changing the monthly-flow architecture.');
          const a1=audit.selected_flows.find(f=>f.id==='01');
          const a2=audit.selected_flows.find(f=>f.id==='02');
          a1.reason='Multiple regions supplied independent execution stages in the same month: long-term revenue contracts, financial close, construction start, commercial operation and actual balancing-market participation in Japan. This is stronger than shipment growth alone.';
          addUnique(a1.anchor_card_ids,[jp.id]);
          a2.title=f2.title;
          a2.reason='The month showed U.S. cell production starting alongside planned EV-NCM/ESS-LFP mix, a binding U.S. LFP supply contract, OEM multi-chemistry strategy and sodium-ion manufacturing. Two late-admitted top-signal pouch-film cards add a material-layer confirmation: a new line entered production across EV/ESS/3C uses, while H1 pouch-film revenue surged and solid-state-specific product reached batch shipment. Simultaneous EV-battery growth rules out an EV-disappearance interpretation.';
          addUnique(a2.anchor_card_ids,[xinlun.id,mingguan.id]);
          audit.baseline_relock_review={status:'PASS',prior_month_card_count:168,current_month_card_count:171,architecture_decision:'KEEP_FOUR_FLOWS_STRENGTHEN_01_02',official_ref_count_before:17,official_ref_count_after:20,publication_boundary_rule:'Representative-event date governs locked August membership. A later disclosure may support an August event when it only locks the August occurrence; later facts that change the event claim remain post-month reinforcement and are excluded from the August headline/ref set.',newly_admitted_august_cards:[{id:jp.id,signal:jp.signal,disposition:'ADD_TO_FLOW_01_AND_OFFICIAL_REFS'},{id:xinlun.id,signal:xinlun.signal,disposition:'ADD_TO_FLOW_02_AND_OFFICIAL_REFS',source_note:'Sep-8 disclosure locks Aug-31 production-start event; no September event fact imported.'},{id:mingguan.id,signal:mingguan.signal,disposition:'ADD_TO_FLOW_02_AND_OFFICIAL_REFS'}]};
          audit.official_source_selection.selected_card_count=20;
          audit.official_source_selection.source_card_ids=[...item.source_card_ids];
          audit.official_source_selection.selection_principle='Use decision-relevant anchors that collectively prove the four flows. The three late-admitted August representative events are included after explicit re-review because they add distinct execution evidence. Later disclosures may support an August event only when they lock the August occurrence itself; post-month facts that alter the claim remain excluded.';
          audit.qc.review_remediation='PASS — causal language is narrowed from completed asset reallocation to a supported diversification direction; Old 300 remains bound to title-supporting evidence; Jianxiawo later-September claim enrichment remains excluded; the three late-admitted August events were explicitly re-reviewed, strengthening Flow 01 and Flow 02 without creating a fifth flow.';
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          console.log('PASS editorial relock', {total:locked.total,august:august.length,signals,regions,refs:item.refs.length});
          NODE
          npm ci
          npm run validate:monthly-briefs
          npx vitest run __tests__/monthlyBriefPublication.test.js __tests__/monthlyBriefProvenance.test.js __tests__/monthlyBriefProductBoundary.test.js __tests__/monthlyBriefSelection.test.js __tests__/monthlyBriefActiveDomain.test.js __tests__/quickAnalysisLabels.test.js
          npm test
          npm run build
          git diff --check
      - name: Commit validated relock and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-monthly-brief-relock-20260910.yml
          git add public/data/monthly_briefs.json runs/2026-09-09/monthly-brief-2026-08-editorial-audit.json .github/workflows/tmp-monthly-brief-relock-20260910.yml
          git commit -m 'Relock August Monthly Brief after 171-card review'
          git push
