name: Generate formal V4 Stage 0.0D

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901
    paths:
      - '.github/workflows/v4-formal-0-0d-20260902.yml'

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock current main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "f2792958a85470c11030211642012865c69f56ab"
      - name: Generate and fail-closed validate formal 0.0D
        run: |
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path

          LOCKED='f2792958a85470c11030211642012865c69f56ab'
          OUT=Path('runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_f279295.json')
          REG='docs/llm_prompts/v1/GOVERNANCE_LIFECYCLE_REGISTRY.json'
          MAN='docs/llm_prompts/v1/LLM_PROMPT_GITHUB_CANONICAL_V1_MANIFEST.json'
          STAGE_A='docs/llm_prompts/v1/01_PROMPT_0_1_Stage_A.md'
          ALLOWED={'ACTIVE_CANONICAL','ACTIVE_VALIDATOR_CONTRACT','OPEN_REMEDIATION','ACTIVE_MIGRATION','SUPERSEDED','REFERENCE_ONLY','COMPLETED_REFERENCE','ARCHIVED'}

          def gbytes(path):
              return subprocess.check_output(['git','show',f'{LOCKED}:{path}'])
          def gtext(path):
              return gbytes(path).decode('utf-8-sig')
          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'{LOCKED}:{path}'],text=True).strip()
          def sha256(raw): return hashlib.sha256(raw).hexdigest()

          docs=subprocess.check_output(['git','ls-tree','-r','--name-only',LOCKED,'--','docs'],text=True).splitlines()
          docs=[x.strip() for x in docs if x.strip()]
          reg=json.loads(gtext(REG))
          man=json.loads(gtext(MAN))

          active_canonical=sorted(set(reg['active_canonical']) | set(reg['active_named_prompts']))
          active_validators=sorted(set(reg['active_validator_contracts']))
          applicable=sorted(set(reg['open_remediations']) | set(reg['activation_required_migrations']))
          superseded_reference=sorted(set(reg['superseded']) | set(reg['reference_only']))
          required=sorted(set(active_canonical) | set(active_validators) | set(applicable))

          mapping={}
          for p in reg['active_canonical']+reg['active_named_prompts']: mapping[p]='ACTIVE_CANONICAL'
          for p in reg['active_validator_contracts']: mapping[p]='ACTIVE_VALIDATOR_CONTRACT'
          for p in reg['open_remediations']: mapping[p]='OPEN_REMEDIATION'
          for p in reg['activation_required_migrations']: mapping[p]='ACTIVE_MIGRATION'
          for p in reg['superseded']: mapping[p]='SUPERSEDED'
          for p in reg['reference_only']: mapping[p]='REFERENCE_ONLY'

          def header_class(path,text):
              if path.endswith('.json'):
                  try:o=json.loads(text)
                  except Exception:return None
                  for k in ('classification','status'):
                      v=o.get(k)
                      if isinstance(v,str) and v in ALLOWED:return v
                  return None
              head='\n'.join(text.splitlines()[:140])
              for pat in (r'\*\*Status:\*\*\s*`([A-Z_]+)`',r'^Status:\s*`?([A-Z_]+)`?\s*$',r'\*\*Classification:\*\*\s*`([A-Z_]+)`'):
                  m=re.search(pat,head,re.M)
                  if m and m.group(1) in ALLOWED:return m.group(1)
              return None

          inventory=[]; unclassified=[]; conflicts=[]; unregistered=[]; parse_failures=[]
          for p in docs:
              raw=gbytes(p); text=raw.decode('utf-8-sig')
              h=header_class(p,text); r=mapping.get(p); c=r or h
              if not c: unclassified.append(p)
              if r and h and r!=h: conflicts.append({'path':p,'registry':r,'header':h})
              if not r and h in {'ACTIVE_CANONICAL','ACTIVE_VALIDATOR_CONTRACT','OPEN_REMEDIATION','ACTIVE_MIGRATION'}:
                  unregistered.append(p)
              if p.endswith('.json'):
                  try:json.loads(text)
                  except Exception as e:parse_failures.append({'path':p,'error':str(e)})
              inventory.append({'path':p,'classification':c,'registry_classification':r,'header_classification':h,'git_blob_sha':blob(p),'sha256':sha256(raw)})

          full_read=[]; unread=[]
          for p in required:
              try:
                  raw=gbytes(p); text=raw.decode('utf-8-sig')
                  parse='TEXT_PASS'
                  if p.endswith('.json'):
                      json.loads(text); parse='JSON_PARSE_PASS'
                  full_read.append({'path':p,'read_status':'READ_FULL_LOCKED_MAIN','structured_parse_status':parse,'byte_count':len(raw),'git_blob_sha':blob(p),'sha256':sha256(raw)})
              except Exception as e:
                  unread.append({'path':p,'error':str(e)})

          cp=man.get('canonical_paths',{})
          runtime=[]
          for k in ('manual_direct_add_schema','manual_direct_add_validator'):
              if isinstance(cp.get(k),str): runtime.append(cp[k])
          runtime += cp.get('runtime_contract_files',[])
          runtime += cp.get('validation_scripts',[])
          runtime=sorted(set(runtime))
          runtime_evidence=[]; runtime_missing=[]
          for p in runtime:
              try:
                  raw=gbytes(p)
                  runtime_evidence.append({'path':p,'read_status':'READ_FULL_LOCKED_MAIN','byte_count':len(raw),'git_blob_sha':blob(p),'sha256':sha256(raw)})
              except Exception as e:
                  runtime_missing.append({'path':p,'error':str(e)})

          stagea=gtext(STAGE_A)
          stagea_ok=(
              '**selection_policy_version:** `EMBEDDED_NEWS_VALUE_SELECTION_V4`' in stagea
              and 'Related pre-pass' in stagea
              and 'No separate Structural News Value' in stagea
          )

          full_raw=gbytes('data/cards.full.json')
          full_obj=json.loads(full_raw.decode('utf-8-sig'))
          card_count=len(full_obj if isinstance(full_obj,list) else full_obj.get('cards',[]))
          full_blob=blob('data/cards.full.json')

          defects=[]
          if unclassified: defects.append({'type':'UNCLASSIFIED_PATHS','paths':unclassified})
          if conflicts: defects.append({'type':'LIFECYCLE_CONFLICTS','items':conflicts})
          if unregistered: defects.append({'type':'UNREGISTERED_ACTIVE_LOOKING','paths':unregistered})
          if unread: defects.append({'type':'UNREAD_ACTIVE_PATHS','items':unread})
          if parse_failures: defects.append({'type':'DOC_JSON_PARSE_FAILURE','items':parse_failures})
          if runtime_missing: defects.append({'type':'RUNTIME_DEPENDENCY_MISSING','items':runtime_missing})
          if reg.get('active_override_or_addendum_count') != 0: defects.append({'type':'ACTIVE_OVERRIDE_OR_ADDENDUM_NONZERO'})
          if not stagea_ok: defects.append({'type':'STAGE_A_EMBEDDED_POLICY_NOT_VERIFIED'})
          if len(docs)!=len(inventory): defects.append({'type':'DOC_INVENTORY_MISMATCH'})
          if len(full_read)!=len(required): defects.append({'type':'REQUIRED_FULL_READ_COUNT_MISMATCH'})

          status='PASS' if not defects else 'BLOCKED'
          artifact={
              'schema':'stage_0_0d_v4_document_universe_manifest_v1',
              'stage':'0.0D',
              'status':status,
              'repository_head_sha':LOCKED,
              'canonical_full_blob_sha':full_blob,
              'canonical_card_count':card_count,
              'registry_version':reg.get('registry_version'),
              'docs_inventory_count':len(docs),
              'classified_count':len(docs)-len(unclassified),
              'active_full_read_count':len(full_read),
              'active_canonical_paths':active_canonical,
              'active_validator_contract_paths':active_validators,
              'applicable_remediation_or_migration':applicable,
              'superseded_or_reference_paths':superseded_reference,
              'unclassified_paths':unclassified,
              'unread_active_paths':unread,
              'unresolved_dependencies':runtime_missing,
              'unresolved_conflicts':conflicts,
              'unregistered_active_looking_paths':unregistered,
              'active_override_or_addendum_count':reg.get('active_override_or_addendum_count'),
              'stage_a_embedded_news_value_verified':stagea_ok,
              'all_docs_files_read_or_parsed':not defects,
              'unresolved_rule_conflicts':conflicts,
              'incomplete_universe_defects':defects,
              'stage_0_0c_authorized':not defects,
              'required_active_dependency_paths':required,
              'full_read_evidence':full_read,
              'runtime_dependency_paths_from_machine_manifest':runtime,
              'runtime_dependency_evidence':runtime_evidence,
              'documents_inventory':inventory,
              'provenance':{
                  'governance_launcher':'docs/llm_prompts/v1/00_NEW_RUN_MASTER_PROMPT.md',
                  'document_universe_prompt':'docs/llm_prompts/v1/00D_PROMPT_0_0D_DOCUMENT_UNIVERSE_PREFLIGHT.md',
                  'lifecycle_registry':REG,
                  'machine_manifest':MAN,
                  'baseline_rule':'locked GitHub main + data/cards.full.json',
                  'intended_reuse':'shared governance baseline for separate 2026-08-31 and 2026-09-01 intake lineages while main remains unchanged'
              }
          }

          # Fail-closed assertions mirror production hardener semantics.
          assert status=='PASS', defects
          assert len(docs)==90
          assert artifact['classified_count']==artifact['docs_inventory_count']==90
          assert len(required)==43 and artifact['active_full_read_count']==43
          assert not artifact['unclassified_paths']
          assert not artifact['unread_active_paths']
          assert not artifact['unresolved_dependencies']
          assert not artifact['unresolved_conflicts']
          assert not artifact['unregistered_active_looking_paths']
          assert not artifact['unresolved_rule_conflicts']
          assert not artifact['incomplete_universe_defects']
          assert artifact['active_override_or_addendum_count']==0
          assert artifact['stage_a_embedded_news_value_verified'] is True
          assert artifact['all_docs_files_read_or_parsed'] is True
          assert artifact['stage_0_0c_authorized'] is True
          assert sorted(artifact['active_canonical_paths'])==active_canonical
          assert sorted(artifact['active_validator_contract_paths'])==active_validators
          assert sorted(artifact['applicable_remediation_or_migration'])==applicable
          assert sorted(artifact['superseded_or_reference_paths'])==superseded_reference

          OUT.parent.mkdir(parents=True,exist_ok=True)
          OUT.write_text(json.dumps(artifact,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'status':status,'repository_head_sha':LOCKED,'canonical_full_blob_sha':full_blob,
              'canonical_card_count':card_count,'docs_inventory_count':len(docs),'classified_count':artifact['classified_count'],
              'active_full_read_count':artifact['active_full_read_count'],'applicable_count':len(applicable),
              'stage_0_0c_authorized':artifact['stage_0_0c_authorized']
          },indent=2))
          PY
          python3 validation_scripts/workflow_v4_architecture_check.py
      - name: Commit formal preflight and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/2026-09-02/stage_0_0d_v4_document_universe_20260902_MAIN_f279295.json
          git rm .github/workflows/v4-formal-0-0d-20260902.yml
          git commit -m "audit: lock formal V4 Stage 0.0D PASS"
          git push origin HEAD:chatgpt/v4-run-baseline-20260831-20260901
