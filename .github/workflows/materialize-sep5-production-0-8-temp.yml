name: Materialize Sep5 production Prompt 0.8 temp
# retrigger after exact frozen production branch creation

on:
  push:
    branches: [chatgpt/validate-20260905-r1]
    paths:
      - .github/workflows/materialize-sep5-production-0-8-temp.yml
      - validation_temp/20260905-r1/materialize_production_0_8.py

permissions:
  contents: write
  actions: read

concurrency:
  group: sep5-production-0-8-materialization
  cancel-in-progress: false

jobs:
  materialize-and-push-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: builder
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout clean production branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/production-20260905-r8-9
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Verify production branch and live main equal exact frozen baseline
        working-directory: work
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          BASE=eb1a311ed378fcdf547b52ad5da0652cb9f1fc62
          BLOB=707fe5ea9836a0c2341771397da32c818a95cbed
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse ${BASE}:data/cards.full.json)" = "$BLOB"
          test "$(git hash-object data/cards.full.json)" = "$BLOB"
          test -z "$(git status --porcelain)"
          echo "RESULT: PASS_EXACT_FROZEN_MAIN_NO_DRIFT"

      - name: Download exact certified 0.7C artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ihyowoen/SBTL_HUB/actions/artifacts/10013536223/zip \
            -o /tmp/sep5-r8-0-7c.zip
          echo "4e8e4c4ab9c1f5be09320ef9c0901b796a186143b01ea9659a1a8a85dc9d97b3  /tmp/sep5-r8-0-7c.zip" | sha256sum -c -
          mkdir -p work/runs/2026-09-07/r7-20260905-production-r1
          unzip -q /tmp/sep5-r8-0-7c.zip -d work/runs/2026-09-07/r7-20260905-production-r1
          test -s work/runs/2026-09-07/r7-20260905-production-r1/card-run.json
          test -s work/runs/2026-09-07/r7-20260905-production-r1/stage-0-7c.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('work/runs/2026-09-07/r7-20260905-production-r1')
          run=json.load(open(root/'card-run.json',encoding='utf-8'))
          c=json.load(open(root/'stage-0-7c.json',encoding='utf-8'))
          expected_ops='236b86f3a0cc7c0a862074884dc06303b0875a73337067e4d8e7a2f3d8e2ed86'
          expected_hashes={
            'stage_a':'bafd91ebcbd5fcdc246c8fcc0ee1865d2489e77f94d9f1723f9da34a41f74bee',
            'stage_b':'c0407a7ab09cfdc501ef19f474598903a815d23e5a551566152f96efb96350f2',
            'stage_c':'a1861b35f9865f2a4672e9d2ecc300d3a771d31d24ca2f319dc063a6cb76c961',
            'stage_0_4':'6549427c4babdf94c38ff10a58bb9038fe46637e6b0c60d97c41e550bd2c6b33',
            'stage_0_5':'eccffdc19d1b2b9426896ccaf795189f38a37f4f2dfabc89f8c5c8bc15e7ba74',
            'stage_0_6':'e8c277544369405d6be14bafb14bec7f024b313145ef81de2bfb802f33fe809d',
            'stage_0_7':'34a9f92858646da3b5d42d97011a772b2be0dba504f9dab12de22ee6ee57c8cb',
          }
          def stable(v):
            if isinstance(v,list): return [stable(x) for x in v]
            if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
            return v
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          op_sha=hashlib.sha256(json.dumps(stable(run['operations']),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          assert op_sha==expected_ops
          assert c['reviewed_operations_sha256']==expected_ops
          assert c['operation_freeze']['operations_sha256']==expected_ops
          assert c['operation_freeze']['insert']==9 and c['operation_freeze']['update']==0 and c['operation_freeze']['related_add']==0
          assert c['operation_freeze']['expected_before']==1569 and c['operation_freeze']['expected_after']==1578
          assert c['hash_chain']==expected_hashes
          paths={
            'stage_a':root/'stages/stage-a.json','stage_b':root/'stages/stage-b.json','stage_c':root/'stages/stage-c.json',
            'stage_0_4':root/'stages/stage-0-4.json','stage_0_5':root/'stages/stage-0-5.json',
            'stage_0_6':root/'stages/stage-0-6.json','stage_0_7':root/'stages/stage-0-7.json',
          }
          for key,path in paths.items(): assert sha(path)==expected_hashes[key],(key,sha(path))
          print('RESULT: PASS_EXACT_CERTIFIED_0_7C_ARTIFACT_IMPORT')
          PY

      - name: Materialize and fully validate Prompt 0.8 production result
        working-directory: work
        run: |
          set -euo pipefail
          python ../builder/validation_temp/20260905-r1/materialize_production_0_8.py

      - name: Active workflow regression suite
        working-directory: work
        run: |
          set -euo pipefail
          python validation_scripts/run_active_workflow_tests.py

      - name: Recheck live main before production commit
        working-directory: work
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "eb1a311ed378fcdf547b52ad5da0652cb9f1fc62"
          echo "RESULT: PASS_PRECOMMIT_MAIN_STILL_FROZEN"

      - name: Enforce production diff allowlist
        working-directory: work
        run: |
          set -euo pipefail
          set +e
          git diff --check > /tmp/sep5-production-diff-check.txt 2>&1
          rc=$?
          set -e
          git status --porcelain=v1 -uall | tee /tmp/sep5-production-status.txt
          git diff --name-only | tee /tmp/sep5-production-tracked.txt
          git ls-files --others --exclude-standard | tee /tmp/sep5-production-untracked.txt
          { git diff --name-only; git ls-files --others --exclude-standard; } | awk 'NF && !seen[$0]++' > /tmp/sep5-production-changed-paths.txt
          mapfile -t changed < /tmp/sep5-production-changed-paths.txt
          test ${#changed[@]} -gt 0
          if [ "$rc" -ne 0 ]; then cat /tmp/sep5-production-diff-check.txt >&2; exit "$rc"; fi
          for path in "${changed[@]}"; do
            case "$path" in
              data/cards.full.json|public/data/cards.json|runs/2026-09-07/r7-20260905-production-r1/*) ;;
              *) echo "FAIL: undeclared production path $path" >&2; exit 1 ;;
            esac
          done
          echo "RESULT: PASS_PRODUCTION_DIFF_ALLOWLIST"

      - name: Upload production diff diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep5-0-8-production-diff-diagnostic
          path: |
            /tmp/sep5-production-diff-check.txt
            /tmp/sep5-production-status.txt
            /tmp/sep5-production-tracked.txt
            /tmp/sep5-production-untracked.txt
            /tmp/sep5-production-changed-paths.txt
          if-no-files-found: warn

      - name: Commit validated production package only after all gates pass
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add data/cards.full.json public/data/cards.json runs/2026-09-07/r7-20260905-production-r1
          git diff --cached --check
          git commit -m "Publish governed Sep 5 R8 9 cards"
          git push origin HEAD:chatgpt/production-20260905-r8-9
          echo "RESULT: PRODUCTION_BRANCH_PUSHED $(git rev-parse HEAD)"
