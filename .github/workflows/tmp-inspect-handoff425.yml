name: Recover cross-run clustering generator

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-inspect-handoff425.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search historical blobs and commits for clustering implementation
        shell: bash
        run: |
          set +e
          echo '=== PICKAXE COMMITS ==='
          for needle in \
            'XRUN_EVENT_FINGERPRINT_V4_20260902_R2' \
            'prior_provisional_event_count' \
            'canonicalize URL without dropping article-id/query parameters' \
            'query-preserving' \
            'multilingual event reconciliation'
          do
            echo "--- $needle ---"
            git log --all --oneline --decorate --name-status -S"$needle" -- . | head -250
          done

          echo '=== BLOB CONTENT HITS ==='
          python3 - <<'PY'
          import subprocess
          needles=[
            b'XRUN_EVENT_FINGERPRINT_V4_20260902_R2',
            b'prior_provisional_event_count',
            b'canonicalize URL without dropping article-id/query parameters',
            b'query-preserving',
            b'multilingual event reconciliation',
          ]
          objs=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          rows=[]; seen=set()
          for line in objs:
              parts=line.split(' ',1); sha=parts[0]; path=parts[1] if len(parts)>1 else ''
              if sha in seen: continue
              seen.add(sha)
              try:
                  if subprocess.check_output(['git','cat-file','-t',sha],text=True).strip()!='blob': continue
                  size=int(subprocess.check_output(['git','cat-file','-s',sha],text=True).strip())
                  if size>2_000_000: continue
                  data=subprocess.check_output(['git','cat-file','blob',sha])
              except Exception:
                  continue
              hits=[n.decode('utf-8',errors='replace') for n in needles if n.lower() in data.lower()]
              if hits: rows.append((sha,path,size,hits,data.decode('utf-8',errors='replace')))
          print('hit_count=',len(rows))
          for sha,path,size,hits,text in rows:
              print('=== HIT',sha,path,size,hits)
              ls=text.splitlines()
              printed=set()
              for i,line in enumerate(ls,1):
                  if any(n.lower() in line.lower() for n in ['XRUN_EVENT_FINGERPRINT','prior_provisional_event_count','canonicalize URL','query-preserving','multilingual event reconciliation']):
                      lo=max(1,i-18); hi=min(len(ls),i+40)
                      key=(lo,hi)
                      if key in printed: continue
                      printed.add(key)
                      print('\n'.join(f'{j}:{ls[j-1]}' for j in range(lo,hi+1)))
          PY
