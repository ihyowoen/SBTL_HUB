              'NatPower-테슬라 25GWh와 중국 OEM 659GWh 오프테이크가 개별 프로젝트의 금융종결·발주·인도·설치로 전환되는 속도를 추적한다.',
              'CATL 나트륨이온 ESS의 9월 실제 고객 인도와 Energy Dome 아일랜드 프로젝트의 인허가·착공을 확인하고, 전고체 실차시험·고객검증과 양산 주장을 구분한다.',
