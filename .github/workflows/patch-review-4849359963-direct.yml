name: Patch review 4849359963 direct

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_review_4849359963_direct.py
      - .github/workflows/patch-review-4849359963-direct.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fix
        run: python scripts/patch_review_4849359963_direct.py
      - name: Compile validator
        run: python -m py_compile validation_scripts/stage_lineage_contract_check.py
      - name: Run focused regression
        run: python -m unittest validation_scripts.tests.test_review_4849359963_contracts -v
      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -p 'test_*.py' -v
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified fix and remove temporary helpers
        run: |
          rm -f scripts/patch_review_4849359963_direct.py .github/workflows/patch-review-4849359963-direct.yml
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation_scripts/stage_lineage_contract_check.py \
            validation_scripts/tests/test_review_4840783305_contracts.py \
            validation_scripts/tests/test_review_4848883611_contracts.py \
            validation_scripts/tests/test_review_4849359963_contracts.py \
            scripts/patch_review_4849359963_direct.py \
            .github/workflows/patch-review-4849359963-direct.yml
          git commit -m 'fix: require interpretation effect in free-text confirmations'
          git push origin HEAD:agent/structural-news-value-v3
