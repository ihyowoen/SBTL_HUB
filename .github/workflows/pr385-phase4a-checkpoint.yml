name: PR385 phase4a checkpoint
on:
  pull_request:
    paths:
      - 'docs/audits/pr385/phase4a_stage/**'
      - '.github/workflows/pr385-phase4a-checkpoint.yml'
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.event.pull_request.number == 385 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'harden/0-6-visible-copy-delta-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify bounded candidate and publish a fresh proof branch only
        env:
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python docs/audits/pr385/phase4a_stage/prepare.py
      - name: Preserve exact source identities and residual failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr385-phase4a-proof-${{ github.run_id }}
          path: .pr385_phase4a_proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Do not label residual semantic failures as a release pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.pr385_phase4a_proof/receipt.json').read_text())
          if not result['checkpoint_verified']:
              raise SystemExit(2)
          remaining = result['remaining_characterization']['violations']
          print(f'Bounded checkpoint verified; remaining characterization violations: {remaining}')
          raise SystemExit(1 if remaining else 0)
          PY
