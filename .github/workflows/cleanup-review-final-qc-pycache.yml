name: Cleanup review Final QC pycache

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - .github/workflows/cleanup-review-final-qc-pycache.yml

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore tracked bytecode state
        run: git checkout b050242843a469893ffa032d71fe54bac0191a99 -- validation_scripts/__pycache__ validation_scripts/tests/__pycache__
      - name: Verify focused and full regressions without bytecode writes
        run: |
          python -m unittest validation_scripts.tests.test_review_current_run_final_qc_scope -v
          python -m unittest discover -s validation_scripts/tests -p 'test*.py'
          python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Remove temporary cleanup workflow
        run: rm .github/workflows/cleanup-review-final-qc-pycache.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated Python bytecode"
          git push origin HEAD:agent/structural-news-value-v3
