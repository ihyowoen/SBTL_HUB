name: tmp-sep9-recover-production-cards
on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - '.github/workflows/tmp-sep9-recover-production-cards.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sep9-r1-current-main-production-r1
      - name: Decode preserved production-card payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json, pathlib, hashlib
          root=pathlib.Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          parts=[root/'tmp/production-cards.part00',root/'tmp/production-cards.part01']
          enc=''.join(p.read_text().strip() for p in parts)
          raw=gzip.decompress(base64.b64decode(enc))
          data=json.loads(raw.decode())
          out=root/'recovered-production-cards.json'
          out.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          meta={
            'schema':'sep9_recovered_production_cards_meta_v1',
            'status':'RECOVERED_NOT_AUTHORIZED',
            'source_parts':[str(p) for p in parts],
            'decoded_sha256':hashlib.sha256(raw).hexdigest(),
            'decoded_bytes':len(raw),
            'top_level_type':type(data).__name__,
            'item_count':len(data) if isinstance(data,list) else None,
            'authority_note':'Recovered legacy payload for per-item salvage/revalidation only. Does not restore superseded Stage A/0.7C or production authorization.'
          }
          (root/'recovered-production-cards-meta.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta))
          PY
      - name: Commit recovered payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/recovered-production-cards.json runs/2026-09-10/sep9-r1-current-main-production-r1/recovered-production-cards-meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: recover Sep9 legacy production-card payload for revalidation'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
