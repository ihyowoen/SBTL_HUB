name: Review 4869087245 validation

on:
  push:
    branches:
      - agent/structural-news-value-v3

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validators
        run: >-
          python -m py_compile
          validation_scripts/stage_lineage_contract_check.py
          validation_scripts/related_lifecycle_check.py
      - name: Focused regressions
        run: >-
          python -m unittest
          validation_scripts.tests.test_review_4869087245_contracts -v
      - name: Full validation suite
        run: >-
          python -m unittest discover -s validation_scripts/tests -p 'test_*.py'
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Verify clean patch
        run: git diff --check
      - name: Verify production card data unchanged
        run: git diff --quiet origin/main -- data/cards.full.json public/data/cards.json
