name: R30 PR393 market evidence quote remediation (no merge)
on:
  push:
    branches: [news/ev-demand-export-divergence-20261017]
    paths:
      - 'scripts/.r30_pr393_quote_grounding.py.gz.b64'
      - '.github/workflows/r30-pr393-market-evidence-qc.yml'
permissions:
  contents: write
jobs:
  repair-market-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify authored patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,gzip,base64,hashlib
          data=base64.b64decode(pathlib.Path('scripts/.r30_pr393_quote_grounding.py.gz.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='bea3b828797bcbc4de6a65283ff89cbe12a2bf84aad5c3e29654c3a4725c9ea3'
          src=gzip.decompress(data)
          assert hashlib.sha256(src).hexdigest()=='c2be37cbbd66685976e706857d6b949d148590ae6443369d98695949c03e64a2'
          code=src.decode('utf8')
          old="root=Path('/tmp/R30_PR393')"
          assert code.count(old)==1
          pathlib.Path('/tmp/R30_pr393_verified_patch.py').write_text(code.replace(old,"root=Path('.').resolve()"))
          print('Verified independent R30 original patch')
          PY
      - name: Add exact market-structure source quotes and validate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c29a76237b922bf22a8073136a007e5e80216751 HEAD
          python3 /tmp/R30_pr393_verified_patch.py
          node scripts/lean_cards.mjs
          node scripts/lean_cards.mjs --check
          git show 6851fdbe4a25b30b7204d07708a1238123c14910:data/cards.full.json > /tmp/R30_base_full.json
          node scripts/validate_json_schema_subset.mjs --schema schemas/manual-direct-add.v2.schema.json --instance direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json
          node scripts/validate_manual_direct_add.mjs --manifest direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json --base /tmp/R30_base_full.json --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json --base /tmp/R30_base_full.json --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          git diff --check
      - name: Repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Self-remove staging and commit exact three governed PR files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.r30_pr393_quote_grounding.py.gz.b64
          rm .github/workflows/r30-pr393-market-evidence-qc.yml
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
             .github/workflows/r30-pr393-market-evidence-qc.yml \
             data/cards.full.json \
             direct-adds/2026-10-17-global-ev-regional-divergence/direct-add.json \
             public/data/cards.json \
             scripts/.r30_pr393_quote_grounding.py.gz.b64 | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected files in R30 PR393 source patch'; git diff --cached --name-only; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cards): pin EV growth and export-share claims to source-body quotes (no merge)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "PASS: 1 independent market card; no deletions; only 3 governed data artifacts; review required."
