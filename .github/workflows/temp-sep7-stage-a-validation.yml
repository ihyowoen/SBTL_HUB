name: TEMP Sep 7 Stage A repo-native validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact Stage A R1 artifact and materialize R3 compatibility envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sep7-stage-a-validation
          cat tmp/sep7-stage-a-validation/artifact.part0[1-6] | tr -d '\r\n' | base64 -d | xz -dc > /tmp/sep7-stage-a-validation/stage-a-r1.json
          test "$(sha256sum /tmp/sep7-stage-a-validation/stage-a-r1.json | awk '{print $1}')" = "fb96bda5f896cb2d73e63cc76dbdb78d7d631fb547b1f919a8bc2a5a8973bd37"
          python - <<'PY'
          import json
          r1='/tmp/sep7-stage-a-validation/stage-a-r1.json'
          r3='/tmp/sep7-stage-a-validation/stage-a-r3.json'
          with open(r1, encoding='utf-8') as fh:
              d=json.load(fh)
          assert len(d['strict_passed_spec']) == 27
          assert len(d['candidate_review_pool']) == 41
          assert len(d['watchlist_context_pool']) == 20
          assert len(d['existing_reinforcement']) == 3
          assert len(d['reject_or_support_only_pool']) == 118
          assert len(d['decision_ledger']) == 263

          # R2 top-level machine envelope repair; editorial partition unchanged.
          d['status']='PASS'
          d['stage_a_validity_status']='PASS'
          d['csv_schema_status']='PASS'
          d['baseline_duplicate_screen_status']='PASS'
          rd=d['required_docs_check']
          rd['docs_read_from_github_main']=list(rd['docs_expected'])
          rd['status']='PASS'
          rd['authority_note']='Integrated Stage A V4 is active authority; exact current-main governance closure was re-bound at 0.0D and all active mandatory Stage A documents are accounted for.'

          # R3 frozen-V3 compatibility syntax only; do not alter selection judgments.
          for s in d['strict_passed_spec']:
              title=s.get('title_raw') or s.get('summary_hint') or s['spec_id']
              date=s.get('representative_date') or (s.get('date_role') or {}).get('representative_date') or 'current event date'
              s['evidence_needed_for_stage_b']=[
                  {
                      'source_or_document_class':'official filing, regulation, court decision, contract, dataset, or issuer document',
                      'exact_claim_or_metric':f"{title}: representative event date {date}, current event stage, status, and named authority or counterparty",
                  },
                  {
                      'source_or_document_class':'independent report, statistics, technical test result, or original dataset',
                      'exact_claim_or_metric':f"{title}: capacity, volume, price, investment, production, shipment, approval, application, legal effect, or operating status stated for the event",
                  },
              ]
          for pool in ('candidate_review_pool','review_pool'):
              for row in d[pool]:
                  if not row.get('recommended_next_action'):
                      row['recommended_next_action']=row.get('recommended_action') or 'Retain in the governed review pool until the stated promotion precondition is satisfied.'

          with open(r3,'w',encoding='utf-8') as fh:
              json.dump(d,fh,ensure_ascii=False,indent=2)
              fh.write('\n')
          print('accounting=strict27 review41 watch20 reinforcement3 support_reject118 ledger263')
          PY
          test "$(sha256sum /tmp/sep7-stage-a-validation/stage-a-r3.json | awk '{print $1}')" = "8cf6bdeeeb0419af8d1f6564a90ea60fbc6046e483f756b0fb7c17e92f293d52"

      - name: Run current-main Stage A machine gates on R3
        shell: bash
        run: |
          set +e
          REPORT=/tmp/sep7-stage-a-validation/validator-report.txt
          : > "$REPORT"
          failed=0
          F=/tmp/sep7-stage-a-validation/stage-a-r3.json
          echo '--- stage_lineage_contract_check.py ---' | tee -a "$REPORT"
          python validation_scripts/stage_lineage_contract_check.py stage_a "$F" >> "$REPORT" 2>&1
          rc=$?
          echo "lineage_exit=$rc" | tee -a "$REPORT"
          if [ "$rc" -ne 0 ]; then failed=1; fi
          echo '--- stage_artifact_contract_check.py ---' | tee -a "$REPORT"
          python validation_scripts/stage_artifact_contract_check.py A "$F" >> "$REPORT" 2>&1
          rc=$?
          echo "artifact_exit=$rc" | tee -a "$REPORT"
          if [ "$rc" -ne 0 ]; then failed=1; fi
          echo "aggregate_failed=$failed" | tee -a "$REPORT"
          cat "$REPORT"
          exit "$failed"

      - name: Run active workflow regression suite
        if: always()
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python validation_scripts/run_active_workflow_tests.py > /tmp/sep7-stage-a-validation/active-workflow-tests.txt 2>&1
          rc=$?
          cat /tmp/sep7-stage-a-validation/active-workflow-tests.txt
          exit "$rc"

      - name: Upload exact artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep7-stage-a-r3-repo-native-validation
          path: /tmp/sep7-stage-a-validation
          if-no-files-found: error
