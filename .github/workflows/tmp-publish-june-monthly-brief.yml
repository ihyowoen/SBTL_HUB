            'publication_class':'official_editorial','publication_mode':'editorial_curated','published_at':DATE,'title':'SBTL Monthly Brief · 2026.06',
            'executive_diagnosis':'6월 배터리 산업의 핵심 변화는 ESS의 성장률 자체보다 돈이 어떻게 잠기고 실제 자산으로 내려오는지가 더 선명해진 점이다. tolling·20년 용량계약·세액공제 지분금융·대형 금융종결·상업운전이 한 달 안에 이어지며 저장장치는 merchant 기대만으로 개발하는 설비에서 계약·금융·운영 실적을 갖춘 전력자산으로 이동했다. 동시에 수요는 지역과 저장시간으로 넓어지고 나트륨·CO₂ 저장은 상업계약 단계로 내려왔지만, 전고체는 실차시험과 TRL4 평가가 공존했다. 공급망에서는 미·중의 기업단위 조달·수출 통제가 강화되고 유럽·G7의 생산·광물 지원수단이 구체화됐다. 따라서 6월은 단순한 ESS 성장의 달이라기보다 수익모델·저장시간·기술성숙도·조달적격성이 함께 분화된 달로 보는 편이 정확하다.',
            'what_changed':'이전에는 GW·GWh와 공장 증설이 변화의 중심이었다면 6월에는 tolling, 장기 capacity contract, tax equity, 대형 금융종결과 COD가 동시에 나타났다. 기술도 나트륨·CO₂는 고객 인도 일정과 상업계약으로 내려온 반면 전고체는 도로시험과 기술성숙도 논쟁이 병존했다. 공급망 규칙은 국가별 관세에서 특정 기업의 조달자격·수출통제·생산금융으로 더 세분화됐다. SBTL 관점에서는 ESS·LFP 성장률을 파우치필름 수요로 자동 환산하지 않는다. 6월 공식 근거세트에는 직접 파우치필름 고객프로그램이 없으므로 실제 셀 폼팩터·고객 프로그램·공급계약이 확인되는 경우에만 직접 수요 신호로 해석해야 한다.',
            'source_baseline':{'main_commit_sha':BASE,'full_blob_sha':BLOB,'source_month_count':190},
