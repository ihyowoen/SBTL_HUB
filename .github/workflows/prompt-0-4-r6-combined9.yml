name: Prompt 0.4 R6 Combined 9

on:
  push:
    branches:
      - chatgpt/recover-exact-425-artifacts-20260903
    paths:
      - '.tmp/prompt-0-4-r6-combined9/TRIGGER'

permissions:
  contents: write

jobs:
  prompt-0-4-combined9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-lock exact main and canonical blob
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4"
          test "$(git rev-parse origin/main:data/cards.full.json)" = "53219907cdb435c3822c41d097b23e475662aa8a"
      - name: Build and validate Prompt 0.4 combined9
        run: python3 scripts/prompt_0_4_r6_combined9.py
      - name: Commit validated Prompt 0.4 combined9 outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='runs/2026-09-03/prompt_0_4_r6_combined9_validation_20260903_R1.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['status']=='PASS', r
          assert r['input_count']==9 and r['addable_count']==9 and r['hold_count']==0
          assert r['base_main_commit_sha']=='df6fcccf3a69464ff0a43a8ba5897d71b6a4d9c4'
          assert r['base_full_blob_sha']=='53219907cdb435c3822c41d097b23e475662aa8a'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-03/prompt_0_4_r6_combined9_20260903_R1.json \
                  runs/2026-09-03/prompt_0_4_r6_combined9_validation_20260903_R1.json
          git rm -r .tmp/prompt-0-4-r6-combined9
          git commit -m 'audit: Prompt 0.4 R6 combined9 baseline revalidation'
          git push
