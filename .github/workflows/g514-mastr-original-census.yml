name: G5.14 frozen MaStR bounded checkpoint census
on:
  push:
    branches: [research/g514-mastr-census-20261123]
    paths:
      - .github/workflows/g514-mastr-original-census.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g514-mastr-official-audit
  cancel-in-progress: false
jobs:
  census:
    if: github.ref == 'refs/heads/research/g514-mastr-census-20261123' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lxml==5.4.0
      - name: Recover pinned original receipt without contacting BNetzA
        run: |
          mkdir -p g514_evidence
          base64 -d research/g514_resume_tools/R23_PINNED_INVENTORY_ARCHIVE.zip.b64 > g514_evidence/R23_SOURCE.zip
          echo '5d613791ccd32f8f7cd427ed7b8f4d813fb56f6efd266657a2d92ed9e347c299  g514_evidence/R23_SOURCE.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile, pathlib, hashlib
          with zipfile.ZipFile('g514_evidence/R23_SOURCE.zip') as z:
              assert z.testzip() is None
              b=z.read('g514_output/official_source_inventory.json')
          assert hashlib.sha256(b).hexdigest()=='804ef23894cbc829a31a51e435d7e730861a9c9f1e03639a950d3c15d631915b'
          pathlib.Path('g514_evidence/inventory.json').write_bytes(b)
          PY
      - name: Reject any already-preserved successor to this exact predecessor
        uses: actions/cache/restore@v4
        id: successor
        with:
          path: g514_state
          key: g514-20261001-r26-successor-45917023923-1
          lookup-only: true
      - name: Fail closed if successor already exists
        run: test '${{ steps.successor.outputs.cache-hit }}' != 'true'
      - name: Restore exact previous state (no restart on miss)
        uses: actions/cache/restore@v4
        id: previous
        with:
          path: g514_state
          key: g514-20261001-r26-successor-45916624461-1
          fail-on-cache-miss: true
      - name: Verify restored predecessor identity and committed members
        run: |
          python - <<'PY'
          import json, sqlite3, pathlib
          p=pathlib.Path('g514_state')
          r=json.loads((p/'RUN_RECEIPT.json').read_text())
          assert r['fixture'] is False and not r['full_complete']
          assert r['completed_members']=={'catalog':1,'sse':15}
          assert r['identity']['etag']=='"e83d3f664451dd1:0"'
          assert r['identity']['checkpoint_code_sha256']=='ca574c9c13b6a411fb7f14ef83af086ba3f0aab7861e2630f648ed57e57953b5'
          assert r['identity']['parser_sha256']=='32d263b354b115aeed39e8777fae8d5d8b9c325492a4f871e204978041e9ad73'
          with sqlite3.connect('file:g514_state/checkpoint.sqlite?mode=ro', uri=True) as db:
              assert dict(db.execute('select kind,count(*) from r26_members group by kind'))=={'catalog':1,'sse':15}
              assert db.execute('select count(*) from sse').fetchone()[0]==1500000
              assert db.execute('select count(*) from r26_catalog').fetchone()[0]==1737
              assert db.execute('select count(*) from see').fetchone()[0]==0
              assert json.loads(db.execute("select value from r26_meta where key='identity'").fetchone()[0])==r['identity']
          pathlib.Path('g514_evidence/restored_predecessor.json').write_text(json.dumps(r,indent=2))
          PY
      - name: Single bounded source operation
        id: process
        run: |
          set +e
          python -u research/g514_resume_tools/G5_14_R26_MASTR_CHECKPOINT.py --parser research/germany_ess_g514/G5_14_R23_BATTERY_RAW_REAGGREGATION_20261123.py --inventory g514_evidence/inventory.json --work g514_state --max-members 24 --max-requests 70 > g514_evidence/source.log 2>&1
          rc=$?
          cat g514_evidence/source.log
          echo "$rc" > g514_evidence/process_exit.txt
          if [ -f g514_state/RUN_RECEIPT.json ]; then cp g514_state/RUN_RECEIPT.json g514_evidence/; fi
          if [ -f g514_state/RESULT.json ]; then cp g514_state/RESULT.json g514_evidence/; fi
          test -f g514_evidence/RUN_RECEIPT.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('g514_evidence/RUN_RECEIPT.json').read_text()); assert x['fixture'] is False
          assert x['completed_members'].get('catalog',0)==1 and x['completed_members'].get('sse',0)>=15
          import sqlite3
          with sqlite3.connect('file:g514_state/checkpoint.sqlite?mode=ro',uri=True) as db:
              rows=[dict(zip(('name','kind','crc','rows'),r)) for r in db.execute('select name,kind,crc,rows from r26_members order by kind,name')]
              counts={t:db.execute('select count(*) from '+t).fetchone()[0] for t in ('sse','see','see_link','r26_catalog')}
          Path('g514_evidence/member_manifest.json').write_text(json.dumps({'members':rows,'table_counts':counts},indent=2))
          PY
      - name: Preserve checkpoint under immutable run key
        if: always() && steps.process.outcome == 'success'
        uses: actions/cache/save@v4
        id: save
        with:
          path: g514_state
          key: g514-20261001-r26-successor-45917023923-1
      - name: Record durable checkpoint key and evidence
        if: always()
        run: |
          mkdir -p g514_evidence
          printf '%s\n' 'g514-20261001-r26-successor-45917023923-1' > g514_evidence/checkpoint_key.txt
          printf '%s\n' '${{ steps.save.outcome }}' > g514_evidence/cache_save_outcome.txt
          (cd g514_evidence && sha256sum *.json *.txt *.log *.zip 2>/dev/null > SHA256SUMS.txt) || true
      - name: Upload receipt and source log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g514-r26-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g514_evidence/
          retention-days: 90
      - name: Require genuine full census for full success
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('g514_evidence/RUN_RECEIPT.json')
          assert p.exists(), 'No actual source receipt; no completion claim'
          x=json.loads(p.read_text())
          assert not x['fixture']
          print('Actual completed members:',x['completed_members'])
          assert x['full_complete'] and x['completed_members']=={'catalog':1,'sse':29,'see':29}, 'Bounded partial or blocked; inspect saved receipt'
          assert Path('g514_evidence/RESULT.json').exists()
          PY
