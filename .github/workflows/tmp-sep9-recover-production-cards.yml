name: tmp-sep9-recover-production-cards

on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - .github/workflows/tmp-sep9-recover-production-cards.yml

permissions:
  contents: write

jobs:
  diagnose-finalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild final candidate files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root=Path('runs/2026-09-10/sep9-r1-current-main-production-r1'); tmp=root/'tmp'; base=str(root)
          text=''.join((tmp/f'production-cards.part{i:02d}').read_text(encoding='utf-8').strip() for i in range(4))
          cards=json.loads(gzip.decompress(base64.b64decode(text,validate=True)).decode())
          common=[f'{base}/stages/stage-b.json',f'{base}/stages/stage-c.json',f'{base}/stages/stage-0-4.json',f'{base}/stages/stage-0-5.json',f'{base}/stages/stage-0-6.json',f'{base}/stages/stage-0-7.json']
          def refs(c): return [f'{base}/stages/stage-a-promotion2.json' if c['source_spec_id']=='STD26_0909_P_002' else f'{base}/stages/stage-a.json',*common]
          byid={c['id']:c for c in cards}
          inserts=[]
          for c in cards:
              urls=[u for u in c.get('urls',[]) if isinstance(u,str) and u.startswith(('http://','https://'))]
              inserts.append({'card':c,'stage_artifacts':refs(c),'evidence_refs':urls})
          rs=[
            {'source_id':'2026-09-09_GL_01','target_id':'2026-09-07_GL_01','source_spec_id':'STD26_0909_A_010','relation_type':'program_lineage','lineage_reason':'Fresh Jan-Jul ex-China battery dataset extends the same SNE market-tracker program lineage.','event_stage_relationship':'same_program_new_measurement_window'},
            {'source_id':'2026-09-07_CN_02','target_id':'2026-09-04_CN_01','source_spec_id':'STD26_0909_P_002','relation_type':'distinct_follow_up','lineage_reason':'Fresh production-vehicle rollout is a distinct execution milestone after Li Auto strategic battery-supply/investment lineage.','event_stage_relationship':'later_distinct_event'}]
          related=[]
          for r in rs:
              c=byid[r['source_id']]
              related.append({**r,'identity_card_id':r['source_id'],'direction':'directional','stage_artifacts':refs(c),'evidence_refs':c['urls'],'patches':[
                {'op':'add','path':'/related/-','value':r['target_id'],'card_id':r['source_id']},
                {'op':'add','path':'/related_lineage/related_ids/-','value':r['target_id'],'card_id':r['source_id']},
                {'op':'replace','path':'/related_lineage/relation_type','value':r['relation_type'],'card_id':r['source_id']},
                {'op':'replace','path':'/related_lineage/reason','value':r['lineage_reason'],'card_id':r['source_id']},
                {'op':'add','path':'/related_lineage/event_stage_relationship','value':r['event_stage_relationship'],'card_id':r['source_id']},
                {'op':'add','path':'/related_lineage/direction','value':'directional','card_id':r['source_id']} ]})
          ops={'insert':inserts,'update':[],'related_add':related}
          def stable(v):
              if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
              if isinstance(v,list): return [stable(x) for x in v]
              return v
          sha=hashlib.sha256(json.dumps(stable(ops),ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          if sha!='40a53b8407857a145981fafdc2bbd33612461d727e8d82ca6b0adc495c89e53d': raise SystemExit('operation hash drift '+sha)
          run={'schema':'card_run_v1','run_id':'card-run-2026-09-09-sep9-r1-current-main-production-r1','base_main_commit_sha':'3bb929004ff8b547b86e5f1beab0efb3dac19d62','base_full_blob_sha':'beb2aa7615b583b4c9c0c269974601a0b26c2684','expected_before':1617,'output_updated':'2026-09-11T16:10:00+09:00','operations':ops,'expected_after':1633,'audit_refs':[f'{base}/card-run-audit.json',f'{base}/stage-0-8-415-final.json'],'document_universe_manifest_ref':f'{base}/stage-0-0d.json','coverage_discovery_ref':f'{base}/stage-0-0c-415-final.json','independent_completeness_ref':f'{base}/stage-0-7c-415-final.json','notes':'Sep9/Sep10 governed 415-identity run; final repo-native operation serialization.'}
          (tmp/'card-run.diagnostic-candidate.json').write_text(json.dumps(run,ensure_ascii=False,indent=2)+'\n')
          p=root/'stage-0-7c-415-final.json'; d=json.loads(p.read_text()); d['reviewed_operations_sha256']=sha; d['operation_freeze']['reviewed_operations_sha256']=sha; d['round_6_operation_binding']['reviewed_operations_sha256']=sha; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=root/'stage-0-8-415-final.json'; d=json.loads(p.read_text()); d['reviewed_operations_sha256']=sha; d['certified_0_7c']['reviewed_operations_sha256']=sha
          for row in d['github_merge_ready']: row['merge_prep']['reviewed_operations_sha256']=sha
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Capture every pre-apply validator result
        shell: bash
        run: |
          set +e
          OUT=runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/finalizer-diagnostic.txt
          RUN=runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/card-run.diagnostic-candidate.json
          : > "$OUT"
          check() {
            name="$1"; shift
            echo "===== $name =====" >> "$OUT"
            "$@" >> "$OUT" 2>&1
            rc=$?
            echo "RC=$rc" >> "$OUT"
            echo >> "$OUT"
          }
          check schema node scripts/validate_json_schema_subset.mjs --schema schemas/card-run.v1.schema.json --instance "$RUN"
          check stage_artifacts node scripts/validate_card_run_stage_artifacts.mjs --run "$RUN"
          check js_v4 node scripts/validate_card_run_v4_hardening.mjs --run "$RUN"
          check py_v4 python3 validation_scripts/card_run_v4_binding_hardening.py --run "$RUN"
          check status node scripts/validate_card_run_status_consistency.mjs --run "$RUN"
          check relations node scripts/validate_card_run_relations.mjs --run "$RUN"
          check apply_check node scripts/apply_card_run.mjs --run "$RUN" --base-main-sha 3bb929004ff8b547b86e5f1beab0efb3dac19d62 --check
          cat "$OUT"
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/finalizer-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Sep9 finalizer gate diagnostics'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
