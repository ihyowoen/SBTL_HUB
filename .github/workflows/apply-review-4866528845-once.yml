name: Apply review 4866528845 once

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - validation_scripts/apply_review_4866528845_once.py
      - .github/workflows/apply-review-4866528845-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused patch
        run: python validation_scripts/apply_review_4866528845_once.py
      - name: Apply conditional and concessive clause guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("validation_scripts/stage_lineage_contract_check_review4860866998_base.py")
          text = path.read_text(encoding="utf-8")
          old = '''_DEPENDENT_CLAUSE_PATTERN = (
              r"\\b(?:because|since|as|after|before|when)\\b|"
              r"(?:때문에|이므로|므로|이후에|이후|이전에|전에|할 때|했을 때)"
          )'''
          new = '''_DEPENDENT_CLAUSE_PATTERN = (
              r"\\b(?:because|since|as|after|before|when|if|unless|until|despite)\\b|"
              r"(?:때문에|이므로|므로|이후에|이후|이전에|전에|할 때|했을 때|"
              r"만약|경우|않으면|까지|에도 불구하고)"
          )'''
          if text.count(old) != 1:
              raise RuntimeError("dependent-clause pattern replacement target changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("validation_scripts/tests/test_review_4866342255_contracts.py")
          test.write_text('''from __future__ import annotations

import unittest

from validation_scripts import stage_lineage_contract_check as lineage


class TestReview4866342255ConditionalClauseContracts(unittest.TestCase):
    def test_conditional_and_concessive_measurement_clauses_do_not_bind(self):
        for value in (
            "Project Alpha production weakened if the current demand outlook improved",
            "Project Alpha production confirmed unless the adoption thesis changes",
            "Project Alpha capacity weakened until the demand outlook improves",
            "Project Alpha production weakened despite the demand outlook improving",
        ):
            with self.subTest(value=value):
                self.assertFalse(lineage._has_bound_interpretation_effect(value))

    def test_actual_interpretation_effects_remain_valid(self):
        for value in (
            "The filing weakened the current demand outlook",
            "The milestone confirmed the adoption thesis",
        ):
            with self.subTest(value=value):
                self.assertTrue(lineage._has_bound_interpretation_effect(value))


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY
      - name: Align focused positive fixture with exact-target contract
        run: |
          sed -i 's/"Plant A inventory"/"Project Alpha capacity"/' validation_scripts/tests/test_review_4866528845_contracts.py
          grep -q '"Project Alpha capacity"' validation_scripts/tests/test_review_4866528845_contracts.py
      - name: Validate focused and full suites
        run: |
          python -m compileall -q validation_scripts
          python -m unittest validation_scripts.tests.test_review_4866342255_contracts -v
          python -m unittest validation_scripts.tests.test_review_4866528845_contracts -v
          python -m unittest discover -s validation_scripts/tests -v
          python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit final changes and remove one-time machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_scripts/stage_lineage_contract_check_review4860866998_base.py
          git add validation_scripts/stage_lineage_contract_check.py
          git add validation_scripts/related_lifecycle_check.py
          git add validation_scripts/evidence_qc_v8_check.py
          git add validation_scripts/date_role_freshness_check.py
          git add validation_scripts/tests/test_review_4866342255_contracts.py
          git add validation_scripts/tests/test_review_4866528845_contracts.py
          git rm .github/workflows/apply-review-4866528845-once.yml
          git rm validation_scripts/apply_review_4866528845_once.py
          git commit -m "fix: harden conditional effects and scoped identifiers"
          git push origin HEAD:agent/structural-news-value-v3
