name: patch-structural-v3-review-4838143604

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/structural-news-value-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review patch
        run: python scripts/patch_structural_v3_review_4838143604.py
      - name: Validate and commit
        run: |
          python -m unittest validation_scripts.tests.test_workflow_contracts
          python validation_scripts/apply_prompt_contract_overlays.py --verify
          git rm scripts/patch_structural_v3_review_4838143604.py
          git rm .github/workflows/patch-structural-v3-review-4838143604.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs validation_scripts
          git commit -m "fix: close structural V3 merge-path review gaps"
          git push origin HEAD:agent/structural-news-value-v3
