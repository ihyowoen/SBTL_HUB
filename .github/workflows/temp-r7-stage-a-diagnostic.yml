name: TEMP R7 Prompt 0.1P repo-native validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p01p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact Prompt 0.1P artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7-p01p /tmp/r7-p01p-validation
          cat tmp/r7-p01p-validation/artifact.part* | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/r7-p01p/stage-a-promotion13.json
          test "$(sha256sum /tmp/r7-p01p/stage-a-promotion13.json | awk '{print $1}')" = "6eb124e52bdf8e2396a52b2367a4571612a5a095ec58c243dec2cdb9f3de85b0"
          test "$(sha256sum docs/llm_prompts/v1/01_PROMPT_0_1_Stage_A.md | awk '{print $1}')" = "617b775d8ce711b7631073f4a335d385ee6e474efa80d6948435d2434af8461e"
          test "$(sha256sum docs/llm_prompts/v1/14_PROMPT_0_1P_Review_Pool_Promotion.md | awk '{print $1}')" = "86c5ab36d12dab6e4021315ff13b8241f0c0428eac09fceb4dfb3bbd998f74b3"
          python - <<'PY'
          import json, hashlib
          p='/tmp/r7-p01p/stage-a-promotion13.json'
          d=json.load(open(p,encoding='utf-8'))
          c=d['candidate_promotion_contract']
          assert d['stage']=='stage_a' and d['status']=='PASS'
          assert d['event_count']==13 and d['story_count']==13
          assert len(d['strict_passed_spec'])==13
          assert len(d['decision_ledger'])==13
          assert c['prompt_version']=='PROMPT_0_1P_V4_20260829'
          assert (c['candidate_count'],c['promoted_count'],c['retained_count'])==(52,13,39)
          assert len(c['promotion_ledger'])==52
          assert sum(1 for r in c['promotion_ledger'] if r.get('disposition')=='promoted_to_strict_passed_spec')==13
          assert sum(1 for r in c['promotion_ledger'] if r.get('disposition')=='retain_candidate_review_pool')==39
          assert all(s['decision_news_value_score']>=55 for s in d['strict_passed_spec'])
          print('artifact_sha256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          print('accounting','candidate52','promoted13','retained39','strict13','observations13')
          PY

      - name: Run current-main Stage A machine gates
        shell: bash
        run: |
          set +e
          REPORT=/tmp/r7-p01p-validation/validator-report.txt
          : > "$REPORT"
          failed=0
          F=/tmp/r7-p01p/stage-a-promotion13.json
          echo '--- stage_lineage_contract_check.py ---' | tee -a "$REPORT"
          python validation_scripts/stage_lineage_contract_check.py stage_a "$F" >> "$REPORT" 2>&1
          rc=$?
          echo "lineage_exit=$rc" | tee -a "$REPORT"
          if [ "$rc" -ne 0 ]; then failed=1; fi
          echo '--- stage_artifact_contract_check.py ---' | tee -a "$REPORT"
          python validation_scripts/stage_artifact_contract_check.py A "$F" >> "$REPORT" 2>&1
          rc=$?
          echo "artifact_exit=$rc" | tee -a "$REPORT"
          if [ "$rc" -ne 0 ]; then failed=1; fi
          echo "aggregate_failed=$failed" | tee -a "$REPORT"
          cat "$REPORT"
          exit "$failed"

      - name: Run active workflow regression suite
        if: always()
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python validation_scripts/run_active_workflow_tests.py > /tmp/r7-p01p-validation/active-workflow-tests.txt 2>&1
          rc=$?
          cat /tmp/r7-p01p-validation/active-workflow-tests.txt
          exit "$rc"

      - name: Upload exact artifact and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-p01p-promotion13-repo-native-validation
          path: |
            /tmp/r7-p01p
            /tmp/r7-p01p-validation
          if-no-files-found: error
