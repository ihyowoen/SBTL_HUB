name: harden-strategic-reader-once

on:
  push:
    branches:
      - chatgpt/strategic-brief-ui-split-20260908
    paths:
      - "scripts/harden_strategic_reader_fail_closed.mjs"
      - ".github/workflows/harden-strategic-reader-once.yml"

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[reader-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/strategic-brief-ui-split-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply fail-closed reader patch
        run: node scripts/harden_strategic_reader_fail_closed.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit hardened reader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/StrategicBriefPanel.jsx
          git commit -m "Fail closed official Strategic Brief reader [reader-hardened]"
          git push origin HEAD:chatgpt/strategic-brief-ui-split-20260908
