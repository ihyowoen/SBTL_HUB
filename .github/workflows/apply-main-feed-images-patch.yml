name: Apply main feed article images

on:
  push:
    branches:
      - agent/og-image-enrichment

permissions:
  contents: write

concurrency:
  group: apply-main-feed-images-patch
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-image-enrichment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-main-feed-images-patch.mjs
      - run: npm test
      - run: npm run build
      - name: Commit validated feed image patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "feat: show fresh article images in main feed"
          git pull --rebase origin agent/og-image-enrichment
          git push origin HEAD:agent/og-image-enrichment
