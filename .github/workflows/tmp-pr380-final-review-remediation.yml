name: tmp-pr380-final-review-remediation
on:
  push:
    branches:
      - chatgpt/rebuild-monthly-brief-2026-06
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded review remediation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const briefPath='public/data/monthly_briefs.json';
          const auditPath='runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json';
          const dropId='2026-06-11_KR_01';
          const lib=JSON.parse(fs.readFileSync(briefPath,'utf8'));
          const briefs=Array.isArray(lib)?lib:lib.items;
          const b=briefs.find(x=>x.id==='monthly-brief-2026-06-r1');
          if(!b) throw new Error('June brief missing');
          const f2=b.key_flows.find(x=>x.id==='02');
          const f3=b.key_flows.find(x=>x.id==='03');
          const f4=b.key_flows.find(x=>x.id==='04');
          const f5=b.key_flows.find(x=>x.id==='05');
          f2.summary=f2.summary.replace('글로벌 ESS 1분기 출하가 195.5GWh','글로벌 리튬이온 ESS 1분기 출하가 195.5GWh');
          f3.summary=f3.summary.replace('Ore Energy와 Buurttwice는','Ore Energy와 Budget Thuis는');
          f4.summary=f4.summary.replace('중국은 미국 방산·희토류 기업에 이중용도 수출통제와 정부조달 금지를 적용했다.','중국은 미국 기업 10곳을 이중용도 수출통제 대상에 올렸고, 별도의 46개 미국 기업 제품에 정부조달 금지를 적용했다.');
          f5.summary='5월의 현지화 논의가 생산기지와 공급망 재편에 무게를 뒀다면 6월에는 무엇을 생산할 권리가 있는지, 어떤 원료와 데이터를 적격으로 인정할지가 전면에 나왔다. Ford 미시간 LFP 공장은 CATL 기술라이선스를 적용한 생산의도 시험셀 단계에 들어갔고, 한국은 재생원료 생산 인증제 시범사업을 시작했으며 일본에서는 AESC ESS 배터리패스포트의 실데이터 검증이 진행됐다. 현지화의 경쟁 단위가 공장 주소를 넘어 기술사용권·순환원료 적격성·데이터 추적성으로 넓어지고 있다.';
          b.what_changed=b.what_changed.replace('특허 라이선스·재생원료 인증·배터리패스포트','기술 라이선스·재생원료 인증·배터리패스포트');
          b.watch=b.watch.map(x=>x.includes('Ford LFP 시험셀, 재생원료 인증, 배터리패스포트와 IP 라이선스')?'Ford LFP 기술라이선스·시험셀, 재생원료 인증과 배터리패스포트가 고객승인·상업출하·소재 적격성으로 이어지는지 확인한다.':x);
          b.source_card_ids=b.source_card_ids.filter(x=>x!==dropId);
          for(const f of b.key_flows) f.card_ids=(f.card_ids||[]).filter(x=>x!==dropId);
          b.refs=b.refs.filter(r=>r.id!==dropId);
          b.refs.forEach((r,i)=>r.n=i+1);
          fs.writeFileSync(briefPath,JSON.stringify(lib,null,2)+'\n');

          const a=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const af5=(a.selected_flows||[]).find(x=>x.id==='05');
          if(af5) af5.anchor_card_ids=(af5.anchor_card_ids||[]).filter(x=>x!==dropId);
          if(a.official_source_selection){
            a.official_source_selection.source_card_ids=(a.official_source_selection.source_card_ids||[]).filter(x=>x!==dropId);
            a.official_source_selection.binding=(a.official_source_selection.binding||[]).filter(x=>x.id!==dropId);
            a.official_source_selection.selected_card_count=a.official_source_selection.source_card_ids.length;
            a.official_source_selection.selection_principle='Compact June-only anchors selected for decision relevance and for their ability to prove what deepened, advanced, operationalized or expanded relative to the reconstructed May closing state. Cards with a public-title provenance defect are excluded pending canonical remediation.';
          }
          const d5=(a.delta_classification||[]).find(x=>x.flow_id==='05');
          if(d5) d5.june_change='Technology licensing, recycled-material certification and battery-passport verification expand the localization boundary beyond production footprint.';
          a.editorial_exclusions=a.editorial_exclusions||[];
          if(!a.editorial_exclusions.some(x=>x.id===dropId)) a.editorial_exclusions.push({id:dropId,reason:'Excluded from the public anchor set because the locked canonical title presents the licence as a direct LG Energy Solution–Sunwoda contract, while the underlying fact identifies Tulip Innovation–Sunwoda as the contracting pair. Keep out of publication until canonical title provenance is remediated.'});
          fs.writeFileSync(auditPath,JSON.stringify(a,null,2)+'\n');
          NODE
      - name: Validate remediation
        run: |
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          node <<'NODE'
          const fs=require('fs');
          const lib=JSON.parse(fs.readFileSync('public/data/monthly_briefs.json','utf8'));
          const briefs=Array.isArray(lib)?lib:lib.items;
          const b=briefs.find(x=>x.id==='monthly-brief-2026-06-r1');
          const f2=b.key_flows.find(x=>x.id==='02'); const f3=b.key_flows.find(x=>x.id==='03'); const f4=b.key_flows.find(x=>x.id==='04'); const f5=b.key_flows.find(x=>x.id==='05');
          if(!f2.summary.includes('리튬이온 ESS 1분기 출하가 195.5GWh')) throw new Error('lithium-ion qualifier missing');
          if(f3.summary.includes('Buurttwice')||!f3.summary.includes('Budget Thuis')) throw new Error('Budget Thuis fix missing');
          if(!f4.summary.includes('미국 기업 10곳')||!f4.summary.includes('별도의 46개 미국 기업 제품')) throw new Error('China lists not separated');
          if(f5.summary.includes('LFP 특허권')||f5.summary.includes('Tulip Innovation')) throw new Error('unsupported patent claim remains');
          if(b.source_card_ids.includes('2026-06-11_KR_01')||b.refs.some(r=>r.id==='2026-06-11_KR_01')||b.key_flows.some(f=>(f.card_ids||[]).includes('2026-06-11_KR_01'))) throw new Error('defective-title anchor remains public');
          if(b.source_card_ids.length!==21||b.refs.length!==21) throw new Error('expected 21 anchors');
          const a=JSON.parse(fs.readFileSync('runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json','utf8'));
          if(a.official_source_selection.selected_card_count!==21) throw new Error('audit count mismatch');
          if(!a.editorial_exclusions.some(x=>x.id==='2026-06-11_KR_01')) throw new Error('canonical-title exclusion missing');
          if(a.official_source_selection.source_card_ids.includes('2026-06-11_KR_01')||(a.official_source_selection.binding||[]).some(x=>x.id==='2026-06-11_KR_01')) throw new Error('audit public source still contains dropped anchor');
          NODE
      - name: Commit and remove helper
        run: |
          git rm .github/workflows/tmp-pr380-final-review-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/monthly_briefs.json runs/2026-09-15/monthly-brief-2026-06-editorial-audit.json
          git diff --cached --check
          git commit -m "fix: tighten June Monthly Brief evidence scope"
          git push
