name: Temporary Related import alignment fix

on:
  push:
    branches:
      - agent/review-4870635557-related-assertions

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-4870635557-related-assertions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch module exports and strict wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          impl_path = Path('validation_scripts/related_lifecycle_check_review_latest_base.py')
          impl = impl_path.read_text(encoding='utf-8')
          old_impl = '''for _name in dir(_base):
              if not _name.startswith("__"):
                  globals()[_name] = getattr(_base, _name)
          '''
          new_impl = '''for _name, _value in vars(_base).items():
              if not _name.startswith("__"):
                  globals()[_name] = _value
          '''
          if old_impl not in impl:
              raise SystemExit('implementation export loop not found')
          impl_path.write_text(impl.replace(old_impl, new_impl, 1), encoding='utf-8')

          main_path = Path('validation_scripts/related_lifecycle_check.py')
          main = main_path.read_text(encoding='utf-8')
          old_main = '''for _name in dir(_impl):
              if not _name.startswith("__"):
                  globals()[_name] = getattr(_impl, _name)
          '''
          new_main = '''for _name, _value in vars(_impl).items():
              if not _name.startswith("__"):
                  globals()[_name] = _value
          '''
          if old_main not in main:
              raise SystemExit('public export loop not found')
          main = main.replace(old_main, new_main, 1)
          main = main.replace(
              '''    bound = inspect.signature(_prior_check_card).bind_partial(*args, **kwargs)
              card = bound.arguments.get("card")
              require_contract = bool(bound.arguments.get("require_contract", False))
          ''',
              '''    bound = inspect.signature(_prior_check_card).bind_partial(*args, **kwargs)
              bound.apply_defaults()
              card = bound.arguments.get("card")
              if card is None and args:
                  card = args[0]
              require_contract = bool(bound.arguments.get("require_contract", False))
          ''',
              1,
          )
          start = main.find('\ndef _bind_public_check_card(root) -> None:\n')
          end_marker = '\n\n_bind_public_check_card(_impl)\nglobals()["check_card"] = check_card\n'
          end = main.find(end_marker)
          if start == -1 or end == -1:
              raise SystemExit('recursive binding block not found')
          main = (
              main[:start]
              + '\n\nglobals()["check_card"] = check_card\n'
              + main[end + len(end_marker):]
          )
          main_path.write_text(main, encoding='utf-8')
          Path('.github/workflows/tmp-related-import-alignment.yml').unlink()
          PY
      - name: Compile validators
        run: python -m compileall -q validation_scripts
      - name: Run focused latest regressions
        run: python -m unittest validation_scripts.tests.test_review_latest_related_subject_contracts -v
      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -v
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Related module export alignment"
          git push origin HEAD:agent/review-4870635557-related-assertions
