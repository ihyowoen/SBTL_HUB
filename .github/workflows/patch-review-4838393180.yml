name: Patch review 4838393180

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - "scripts/patch_structural_v3_review_4838393180.py"
      - ".github/workflows/patch-review-4838393180.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review patch
        run: python scripts/patch_structural_v3_review_4838393180.py

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run regression tests
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Remove temporary patch machinery
        run: git rm scripts/patch_structural_v3_review_4838393180.py .github/workflows/patch-review-4838393180.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/llm_prompts/v1/07_PROMPT_0_5_Evidence_QC.md docs/llm_prompts/v1/13_PROMPT_1_1_Retrospective.md docs/validation/STRUCTURAL_NEWS_VALUE_V3_VALIDATION_20260802.md
          git commit -m "docs: address review 4838393180 residual gates"
          git push origin HEAD:agent/structural-news-value-v3
