name: tmp-sep9-merge-us32-partial
on:
  push:
    branches:
      - chatgpt/sep9-r1-current-main-production-r1
    paths:
      - '.github/workflows/tmp-sep9-merge-us32-partial.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sep9-r1-current-main-production-r1
      - name: Merge exact-source US32 partial decisions into cumulative Stage A ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, collections
          root=pathlib.Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          ledger_path=root/'stage-a-cumulative-ledger-r1.json'
          batch_path=root/'stage-a-batch-us32-partial-r1.json'
          d=json.loads(ledger_path.read_text())
          b=json.loads(batch_path.read_text())
          assert d['universe']['terminal_identity_total']==415
          assert d['accounting']['terminal_decision_count']==40
          assert b['accounting']['new_terminal_decisions']==15
          existing={x['identity'] for x in d['terminal_decisions']}
          add=[]
          map_decision={
            'existing_reinforcement_or_same_event':'existing_reinforcement_or_same_event',
            'candidate_review_pool':'candidate_review_pool',
            'watchlist_or_support_context':'watchlist_or_support_context',
            'reject_or_support_only_pool':'reject_or_support_only_pool',
            'support_source_only':'support_source_only'
          }
          for x in b['new_terminal_decisions']:
            sid=x['story_id']
            assert sid not in existing, f'duplicate terminal identity: {sid}'
            y={'identity':sid,'identity_type':'original_source_row','decision':map_decision[x['decision']],
               'basis':'stage_a_batch_us32_partial_r1','new_card_authorized':False}
            for k in ('headline','event_summary','reason','canonical_target','stage_b_requirement','same_event_support_for'):
              if k in x: y[k]=x[k]
            add.append(y)
          assert len(add)==15 and len({x['identity'] for x in add})==15
          d['terminal_decisions'].extend(add)
          ids=[x['identity'] for x in d['terminal_decisions']]
          assert len(ids)==55 and len(set(ids))==55
          c=collections.Counter(x['decision'] for x in d['terminal_decisions'])
          expected={
            'existing_reinforcement_or_same_event':15,
            'split_parent_decomposed':1,
            'candidate_review_pool':24,
            'watchlist_or_support_context':6,
            'reject_or_support_only_pool':8,
            'support_source_only':1
          }
          assert dict(c)==expected, (dict(c),expected)
          d['decision_counts']=expected
          d['accounting']['terminal_decision_count']=55
          d['accounting']['open_identity_count']=360
          d['accounting']['duplicate_terminal_identity_count']=0
          d['accounting']['unknown_terminal_identity_count']=0
          d['accounting']['final_stage_a_pass_authorized']=False
          d['latest_batch']={
            'ref':'runs/2026-09-10/sep9-r1-current-main-production-r1/stage-a-batch-us32-partial-r1.json',
            'batch_membership':32,
            'resolved_total':17,
            'already_terminal_before_batch':2,
            'new_terminal_decisions':15,
            'unresolved':15,
            'batch_pass_authorized':False
          }
          ledger_path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          validation={
            'schema':'sbtl_stage_a_cumulative_validation_v1',
            'status':'PASS_PARTIAL',
            'universe':415,
            'terminal':55,
            'open':360,
            'duplicate_terminal_identity_count':0,
            'unknown_terminal_identity_count':0,
            'decision_counts':expected,
            'us32_membership':32,
            'us32_resolved':17,
            'us32_unresolved':15,
            'final_stage_a_pass_authorized':False
          }
          (root/'stage-a-cumulative-validation-r1.json').write_text(json.dumps(validation,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(validation))
          PY
      - name: Commit cumulative ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/stage-a-cumulative-ledger-r1.json runs/2026-09-10/sep9-r1-current-main-production-r1/stage-a-cumulative-validation-r1.json
          git diff --cached --quiet && exit 0
          git commit -m 'governance: merge Sep9 US32 partial Stage A decisions'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
