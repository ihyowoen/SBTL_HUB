name: Patch PR 233 latest review

on:
  workflow_dispatch:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - scripts/patch_pr233_review_latest.mjs
      - .github/workflows/patch-pr233-latest-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused patch
        run: node scripts/patch_pr233_review_latest.mjs
      - name: Compile validators
        run: python -m compileall validation_scripts
      - name: Run regression tests
        run: python -m unittest validation_scripts.tests.test_workflow_contracts
      - name: Verify prompt overlays
        run: python validation_scripts/verify_prompt_overlays.py
      - name: Remove temporary patch files
        run: rm scripts/patch_pr233_review_latest.mjs .github/workflows/patch-pr233-latest-review.yml
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: address latest PR 233 review feedback"
            git push origin HEAD:agent/structural-news-value-v3
          fi
