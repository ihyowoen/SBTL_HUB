name: tmp-remediate-pr376-codex-r2
on:
  push:
    branches:
      - chatgpt/publish-monthly-brief-2026-07
    paths:
      - .github/workflows/tmp-remediate-pr376-codex-r2.yml
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-monthly-brief-2026-07
          fetch-depth: 0
      - name: Patch Monthly Brief and editorial audit
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5147e5bfbe7cadbf03782ef68805444227afaf1e"
          python - <<'PY'
          import json
          from pathlib import Path

          MONTH = '2026-07'
          PADUCAH = '2026-07-29_US_02'
          EV_MATERIAL = '2026-07-14_GL_03'
          LOBITO = '2026-07-03_GL_08'
          YULCHON = '2026-07-03_KR_01'
          QUARANTINE = {EV_MATERIAL, LOBITO, YULCHON}
          PADUCAH_URL = 'https://www.investor.nexteraenergy.com/news-and-events/news-releases/2026/07-29-2026-133109921'

          p = Path('public/data/monthly_briefs.json')
          doc = json.loads(p.read_text())
          issue = next(x for x in doc['items'] if x.get('month') == MONTH)
          issue['source_card_ids'] = [x for x in issue['source_card_ids'] if x not in QUARANTINE]
          issue['executive_diagnosis'] = (
              '7월 배터리 산업의 핵심 변화는 ESS가 단순 설치 전망을 넘어 계약·프로젝트금융·플랫폼 M&A·가동을 갖춘 독립적인 인프라 자산군으로 자본화되기 시작한 점이다. '
              '동시에 AI 데이터센터와 계통 병목은 BESS를 전력 인프라 설계요소로 끌어들였다. 공급 측에서는 EV 수요가 유지되는 가운데 ESS·LFP가 추가 생산축으로 편입됐고, '
              '핵심광물 현지화는 오프테이크·최종투자결정·가공·투자·수익성 확인으로 구체화됐다. 관세·세제·안전·접속 규칙도 제품 경제성과 시장진입을 가르는 변수로 작동했다. '
              '따라서 7월을 ‘EV 둔화→ESS 대체’로 읽기보다 수요·자본·생산·공급망이 여러 축으로 재편된 달로 보는 편이 정확하다.'
          )
          issue['what_changed'] = (
              '7월에는 발표된 용량의 크기보다 어느 단계까지 실제로 내려왔는지가 더 중요해졌다. ESS에서는 장기 수익계약·금융종결·플랫폼 인수계약·통전·상업운전이 동시에 확인됐고, '
              'AI·배전망 제약이 저장장치의 새로운 수요 논리를 만들었다. 생산에서는 EV 축이 유지된 채 ESS·LFP가 추가됐으며, 핵심광물은 단순 협력선언보다 오프테이크·FID·가공·투자·수익성 확인 단계로 이동했다. '
              'SBTL 관점에서는 ESS 성장률을 파우치필름 수요로 자동 환산하지 않고, 실제 셀 폼팩터·고객 프로그램·공급계약이 확인되는 경우에만 직접 수요 신호로 해석해야 한다.'
          )

          flows = {x['id']: x for x in issue['key_flows']}
          flows['03']['card_ids'] = [x for x in flows['03']['card_ids'] if x not in {EV_MATERIAL, YULCHON}]
          flows['03']['summary'] = (
              '미국 Spring Hill에서는 기존 생산능력 일부를 ESS용 LFP로 전환해 생산을 시작했고, LG에너지솔루션-Honda 오하이오 합작공장도 ESS 셀 양산을 개시했다. '
              'CATL의 상반기 ESS 시스템 매출은 87.54% 늘었지만 중국 6월 동력배터리 탑재량도 전년 대비 31.5% 증가했고 LFP 비중은 83.3%에 달했다. '
              '즉 EV가 사라지고 ESS가 대체한 것이 아니라 생산·화학계·고객 믹스가 넓어진 것이다. SBTL 관점에서는 ESS 성장률을 파우치필름 수요로 자동 환산하지 않고, '
              '실제 셀 폼팩터·고객 프로그램·공급계약이 확인되는 경우에만 직접 수요 신호로 해석해야 한다.'
          )
          flows['04']['title'] = '핵심광물 현지화, 협력선언에서 오프테이크·FID·가공·수익성으로 내려옴'
          flows['04']['card_ids'] = [x for x in flows['04']['card_ids'] if x != LOBITO]
          flows['04']['summary'] = (
              'VHM은 Goschen 희토류 정광의 장기 오프테이크를 확보했고, Wesfarmers·SQM은 Mt Holland 리튬정광 생산능력을 연 38만톤에서 76만톤으로 확대하는 FID를 내렸다. '
              '한국 Sangdong은 재고광석 기반 텅스텐 가공을 시작했고, POSCO의 아르헨티나 염수리튬 1단계는 안정화 이후 분기 흑자를 기록했다. '
              '현지화가 광권 확보만이 아니라 판매계약·자본투입·가공·경제성 확인까지 연결되는 구간이다. 다만 FID는 즉시 생산을 뜻하지 않고 초기 흑자도 장기 현금흐름으로 확대해석하지 않는다.'
          )
          issue['watch'] = [
              w if not w.startswith('율촌화학 ESS용 파우치필름') else
              'ESS 생산 확대가 실제 파우치형 셀 프로그램·고객 공급계약·가동률·수율·매출로 연결되는지 추적하고, 폼팩터 미확정 ESS 성장률과 구분한다.'
              for w in issue.get('watch', [])
          ]

          refs = []
          for ref in issue['refs']:
              if ref['id'] in QUARANTINE:
                  continue
              if ref['id'] == PADUCAH:
                  ref['url'] = PADUCAH_URL
              refs.append(ref)
          for n, ref in enumerate(refs, 1):
              ref['n'] = n
          issue['refs'] = refs
          issue['qc']['notes'] = (
              'Rebuilt independently from the current governed July universe of 365 cards (75 top, 239 high, 51 mid). Legacy Vol.09 was consulted only after the independent thesis was locked and was used solely for omission/overreach red-team. '
              'After exact-head Codex review, three non-indispensable cards with compound-title/source-binding or geography defects were quarantined from publication; 25 official canonical anchors remain. '
              'Paducah was rebound to the governed NextEra source covering the full visible capacity claim. Post-month follow-up did not overturn the five-flow diagnosis.'
          )
          issue['approval']['notes'] = (
              'Re-authorized after exact-head Codex remediation: Paducah was rebound to full-claim evidence and three non-indispensable defective anchors were quarantined without mutating canonical cards inside the publication PR.'
          )
          p.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n')

          ap = Path('runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')
          audit = json.loads(ap.read_text())
          audit['method'] = [s.replace('28-card', '25-card') if isinstance(s, str) else s for s in audit.get('method', [])]
          for flow in audit.get('selected_flows', []):
              flow['anchor_card_ids'] = [x for x in flow.get('anchor_card_ids', []) if x not in QUARANTINE]
              if flow.get('id') == '03':
                  flow['reason'] = 'ESS/LFP production additions coexist with positive China traction-battery installation growth. The supported conclusion is production/customer diversification rather than simple EV-to-ESS substitution; unresolved compound-title and pouch-program bindings are excluded from the official evidence set.'
              if flow.get('id') == '04':
                  flow['title'] = flows['04']['title']
                  flow['reason'] = 'Offtake, FID, processing start and early profitability move localization from policy intent toward executable supply-chain assets. The Lobito card is excluded because its locked visible geography is not supported by the governed quote.'
          for item in audit.get('rejected_or_narrowed_narratives', []):
              if item.get('narrative') == 'ESS 성장률을 파우치필름 수요로 직접 환산할 수 있다':
                  item['reason'] = 'Several ESS cells have unconfirmed form factor. A July pouch-program card with unresolved ESS-use source binding is quarantined rather than used as a direct demand anchor.'
              if item.get('narrative') == 'EV 둔화가 ESS 성장으로 단순 대체됐다':
                  item['reason'] = 'July includes positive China traction-battery installation growth while ESS/LFP production expands; the separate compound EV-material card is quarantined because no single public ref proves its full compound title.'

          sel = audit['official_source_selection']
          sel['selected_card_count'] = 25
          sel['source_card_ids'] = [x for x in sel['source_card_ids'] if x not in QUARANTINE]
          new_binding = []
          for b in sel.get('binding', []):
              if b.get('id') in QUARANTINE:
                  continue
              if b.get('id') == PADUCAH:
                  b['selected_url'] = PADUCAH_URL
              new_binding.append(b)
          sel['binding'] = new_binding
          sel['selection_principle'] = 'Decision-relevant canonical anchors proving the five flows after exact-head review. Public references must support the complete visible canonical title from one selected governed URL; cards that cannot satisfy that rule without canonical remediation are quarantined rather than weakened inside the publication layer.'

          controls = audit.get('card_integrity_triage', {}).get('brief_overreach_controls', [])
          audit['card_integrity_triage'] = {
              'status': 'PASS_WITH_QUARANTINED_NON_INDISPENSABLE_CANONICAL_DEFECTS',
              'quarantined_cards': [
                  {'id': EV_MATERIAL, 'class': 'CARD_SOURCE_BINDING', 'reason': 'Compound canonical title spans electrolyte and separator figures supported by separate SNE releases; one public ref cannot prove the full visible title under the current provenance contract.'},
                  {'id': LOBITO, 'class': 'CARD_FACT_ERROR', 'reason': 'Locked visible title relocates the rehabilitated Lobito rail segment into DRC, while governed evidence describes the Angola segment to the DRC border.'},
                  {'id': YULCHON, 'class': 'CARD_SOURCE_BINDING', 'reason': 'Selected July source proves Poseung pouch-film commercialization but not the ESS application embedded in the locked visible title.'}
              ],
              'publication_binding_fix': {'id': PADUCAH, 'action': 'REBIND_TO_GOVERNED_FULL_CLAIM_SOURCE', 'url': PADUCAH_URL},
              'brief_overreach_controls': controls
          }
          audit['qc']['source_binding'] = 'PASS_AFTER_CODEX_REMEDIATION'
          audit['qc']['canonical_defect_quarantine'] = 'PASS'
          audit['qc']['codex_review_5193925152'] = 'REMEDIATED_P1_X4'
          ap.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n')

          assert len(issue['source_card_ids']) == 25
          assert len(issue['refs']) == 25
          assert all(r['n'] == i for i, r in enumerate(issue['refs'], 1))
          assert all(x not in issue['source_card_ids'] for x in QUARANTINE)
          assert next(r for r in issue['refs'] if r['id'] == PADUCAH)['url'] == PADUCAH_URL
          print('PR376 remediation prepared: 25 official refs; 3 quarantined; Paducah rebound')
          PY
      - name: Validate publication
        run: |
          npm ci
          npm run validate:monthly-briefs
          npm test
          npm run build
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s' 'public/data/monthly_briefs.json' 'runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json')"
          test "$changed" = "$expected"
      - name: Commit remediation outputs
        run: |
          git config user.name "ihyowoen"
          git config user.email "hyowoen@hotmail.com"
          git add public/data/monthly_briefs.json runs/2026-09-14/monthly-brief-2026-07-editorial-audit.json
          git commit -m "fix: remediate PR376 Codex P1 findings"
          git push origin HEAD:chatgpt/publish-monthly-brief-2026-07
