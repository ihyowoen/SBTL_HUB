name: Validate R7 Prompt 0.5 temp

on:
  pull_request:
    branches: [main]

jobs:
  validate-0-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked current baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "5317bec055b88a26cffb136e7844eb488ae4db0d"
          test "$(git hash-object data/cards.full.json)" = "8b3d96b5c1fd779567ef8512f7123fc4310093ec"
      - name: Materialize Prompt 0.5
        run: |
          set -euo pipefail
          python validation_temp/20260903-r7-stage-0-5/materialize_0_5_r2.py
          sha256sum /tmp/stage-0-5-r7.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stage-0-5-r7.json',encoding='utf-8'))
          current=p['evidence_complete_and_source_claim_covered']
          assert p['accounting']=={'input':33,'pass':33,'hold':0,'unaccounted':0}
          assert len(current)==33
          assert len(p['cards'])==1536+33
          assert [x['source_spec_id'] for x in p['cards'][-33:]]==[x['source_spec_id'] for x in current]
          print('RESULT: PASS_0_5_ACCOUNTING_AND_MERGED_BASELINE_PROJECTION')
          PY
      - name: Evidence QC source audit
        run: python validation_scripts/evidence_qc_v8_check.py /tmp/stage-0-5-r7.json --new-id-file /tmp/current-run-ids-0-5.json --json-report /tmp/evidence-qc-0-5.json
      - name: Related lifecycle recheck
        run: python validation_scripts/related_lifecycle_check.py /tmp/stage-0-5-r7.json --require-contract --allow-provisional-related --new-id-file /tmp/current-run-ids-0-5.json --report /tmp/related-0-5.json
      - name: Date-role freshness recheck
        run: python validation_scripts/date_role_freshness_check.py /tmp/stage-0-5-r7.json --require-date-role --new-id-file /tmp/current-run-ids-0-5.json
      - name: Prompt 0.5 artifact contract
        run: python validation_scripts/stage_artifact_contract_check.py 0.5 /tmp/stage-0-5-r7.json
      - name: Active workflow regression suite
        run: python validation_scripts/run_active_workflow_tests.py
      - name: Upload validated 0.5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r7-stage-0-5-validated
          path: |
            /tmp/stage-0-5-r7.json
            /tmp/evidence-qc-0-5.json
            /tmp/related-0-5.json
            /tmp/current-run-ids-0-5.json
