name: R24 audit URL lineage replay

on:
  pull_request:
    paths:
      - 'runs/2026-10-08/ops-recovery-intake-v1/**'
      - '.github/workflows/r24-audit-url-replay.yml'

permissions:
  contents: read

jobs:
  audit-lineage-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR with lineage history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduce all 1,157 source URLs from historical R12
        run: node runs/2026-10-08/ops-recovery-intake-v1/R24_REPLAY_ARTICLE_URLS_V2.mjs
      - name: Native hardening executable self-test (not 0.0C authorization)
        run: node scripts/validate_card_run_v4_hardening.mjs --self-test
      - name: Rename-source allowlist bypass regression
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git -C "$work" init -q
          git -C "$work" config user.name "Audit regression"
          git -C "$work" config user.email "audit-regression@example.invalid"
          mkdir -p "$work/data" "$work/runs/2026-10-08/ops-recovery-intake-v1"
          printf 'baseline production data\\n' > "$work/data/cards.full.json"
          git -C "$work" add data/cards.full.json
          git -C "$work" commit -qm baseline
          git -C "$work" mv data/cards.full.json runs/2026-10-08/ops-recovery-intake-v1/moved.json
          paths="$(git -C "$work" diff --cached --no-renames --name-only)"
          printf '%s\\n' "$paths" | grep -Fxq 'data/cards.full.json'
          printf '%s\\n' "$paths" | grep -Fxq 'runs/2026-10-08/ops-recovery-intake-v1/moved.json'
          echo "PASS: both rename endpoints visible"
      - name: Reject production files in audit-only PR
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --no-tags
          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT
          # Check both endpoints of renames (incl. forbidden production source).
          git diff --no-renames --name-only -z "origin/${BASE_REF}...HEAD" > "$changed_files"
          while IFS= read -r -d '' file; do
            case "$file" in
              runs/2026-10-08/ops-recovery-intake-v1/*|.github/workflows/r24-audit-url-replay.yml)
                echo "Allowed audit change: $file" ;;
              *)
                echo "Audit-only PR cannot change: $file" >&2
                exit 1 ;;
            esac
          done < "$changed_files"
