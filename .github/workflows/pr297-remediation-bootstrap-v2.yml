name: PR 297 remediation bootstrap v2

on:
  push:
    branches:
      - chatgpt/20260829-combined18-governed-run
    paths:
      - .github/workflows/pr297-remediation-bootstrap-v2.yml

permissions:
  contents: write

jobs:
  patch-remediation-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind Stage 0.7C to rematerialized operations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr297-final-remediation.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          audit["reviewed_operations_sha256"] = hashlib.sha256(canonical_ops).hexdigest()
          dump_json(audit_path, audit)
          print("updated audit operations hash")
          PY
'''
          new = '''          operations_sha = hashlib.sha256(canonical_ops).hexdigest()
          audit["reviewed_operations_sha256"] = operations_sha
          dump_json(audit_path, audit)

          completeness_path = RUN_DIR / "stage_0_7c_independent_completeness_review_20260829_CURRENT_MAIN_1496_COMBINED18.json"
          completeness = json.loads(completeness_path.read_text(encoding="utf-8"))
          completeness["reviewed_operations_sha256"] = operations_sha
          dump_json(completeness_path, completeness)
          print("updated audit and Stage 0.7C operations hash")
          PY
'''
          if old not in text:
              raise SystemExit('target hash-binding block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit bootstrap fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr297-remediation-bootstrap-v2.yml
          git add .github/workflows/pr297-final-remediation.yml
          git diff --cached --check
          git commit -m "Fix PR 297 remediation completeness hash binding"
          git push origin "HEAD:${GITHUB_REF_NAME}"
