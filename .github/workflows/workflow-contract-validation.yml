name: Workflow contract validation

on:
  push:
    branches:
      - agent/stage-a-0-7c-six-validator
    paths:
      - "validation_scripts/tests/test_stage_a_a034_targeted_rereview_r4_fixture.py"
      - "validation_scripts/tests/fixtures/stage_a_a034_r4_exact*"
      - ".github/workflows/workflow-contract-validation.yml"

permissions:
  contents: write

jobs:
  validate-a034-stage-a-r4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile current-main-derived validators
        run: python -m compileall -q validation_scripts

      - name: Validate exact A034 Stage A R4 fixture
        id: a034_r4_fixture
        shell: bash
        run: |
          mkdir -p validation_results
          set +e
          python -m unittest validation_scripts.tests.test_stage_a_a034_targeted_rereview_r4_fixture -v > validation_results/stage_a_a034_targeted_rereview_r4_validator_log.txt 2>&1
          code=$?
          cat validation_results/stage_a_a034_targeted_rereview_r4_validator_log.txt
          exit $code

      - name: Persist A034 Stage A R4 receipt
        if: always()
        env:
          FIXTURE_OUTCOME: ${{ steps.a034_r4_fixture.outcome }}
        run: |
          mkdir -p validation_results
          {
            echo "workflow=Workflow contract validation"
            echo "head_sha=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "fixture_outcome=${FIXTURE_OUTCOME}"
            echo "artifact_sha256=7c57e832a34bb1284893cd843445833ab16beb4bdf092c6006d5b7334e2e46e8"
            echo "artifact_bytes=41077"
            echo "prompt_0_1_git_blob_sha=57719c5eae5e219d704baad708992df79f8721bb"
            echo "prompt_0_1_sha256=0795fb16b89dc320a26e5ecb05965ffc67b73e06137e10a5c2a8132c01a846bc"
            if [ "${FIXTURE_OUTCOME}" = "success" ]; then
              echo "stage_a_a034_targeted_rereview_r4_validator=PASS"
            else
              echo "stage_a_a034_targeted_rereview_r4_validator=BLOCKED"
            fi
          } > validation_results/stage_a_a034_targeted_rereview_r4_validator_result.txt
          git config user.name "github-actions[bot]"
          git config user.email "418982967+github-actions[bot]@users.noreply.github.com"
          git add -- validation_results/stage_a_a034_targeted_rereview_r4_validator_result.txt validation_results/stage_a_a034_targeted_rereview_r4_validator_log.txt
          git commit -m "ci: persist A034 Stage A R4 validator diagnostics" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
