name: Apply PR233 review 4841890896

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - "scripts/patch_pr233_review_4841890896.py"
      - ".github/workflows/apply-pr233-review-4841890896.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/patch_pr233_review_4841890896.py"
      - ".github/workflows/apply-pr233-review-4841890896.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused review patch
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/patch_pr233_review_4841890896.py

      - name: Run focused regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest validation_scripts.tests.test_review_4841890896_contracts -v

      - name: Compile validators
        run: python -m compileall -q validation_scripts

      - name: Run full regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s validation_scripts/tests -v

      - name: Verify prompt overlays
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python validation_scripts/apply_prompt_contract_overlays.py --check

      - name: Commit verified patch and remove temporary helpers
        run: |
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find validation_scripts -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr233-review-4841890896.yml
          git rm scripts/patch_pr233_review_4841890896.py
          git add -A
          git commit -m "fix: address review 4841890896 edge cases"
          git push origin HEAD:agent/structural-news-value-v3
