name: Patch latest PR 233 review

on:
  push:
    branches:
      - agent/structural-news-value-v3
    paths:
      - ".github/workflows/patch-review-4839334318-followup.yml"
      - "scripts/patch_review_4839334318_followup.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-news-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: node scripts/patch_review_4839334318_followup.mjs
      - name: Compile validators
        run: python -m compileall -q validation_scripts
      - name: Run regression tests
        run: python -m unittest discover -s validation_scripts/tests -v
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified changes and remove temporary files
        run: |
          rm -f scripts/patch_review_4839334318_followup.mjs
          rm -f .github/workflows/patch-review-4839334318-followup.yml
          find validation_scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: preserve complete V3 package through final QC"
          git push origin HEAD:agent/structural-news-value-v3
