name: TEMP Sep 7 diagnose follow-up anchors

on:
  push:
    branches:
      - chatgpt/production-20260907-r7-21-baseline-rebind-work
    paths:
      - tmp/sep7-promote-rebound-trigger.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump governed follow-up state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const full=JSON.parse(fs.readFileSync('data/cards.full.json','utf8'));
          const run=JSON.parse(fs.readFileSync('runs/2026-09-08/sep7-r7-current-main-production-r1/card-run.json','utf8'));
          for (const id of ['2026-09-07_GL_01','2026-09-07_JP_01']) {
            const c=full.cards.find(x=>x.id===id);
            const op=(run.operations.insert||[]).find(x=>x.card?.id===id)?.card;
            console.log('CANONICAL',id,JSON.stringify(c?.related_lineage,null,2));
            console.log('INSERT',id,JSON.stringify(op?.related_lineage,null,2));
          }
          console.log('RELATED_ADD',JSON.stringify(run.operations.related_add,null,2));
          NODE
          printf '%s\n' '2026-09-07_GL_01' '2026-09-07_JP_01' > "$RUNNER_TEMP/ids.txt"
          node - "$RUNNER_TEMP/ids.txt" <<'NODE'
          const fs=require('fs');
          const ids=fs.readFileSync(process.argv[2],'utf8').trim().split(/\s+/);
          fs.writeFileSync(process.argv[2],JSON.stringify({ids},null,2)+'\n');
          NODE
          python3 validation_scripts/related_lifecycle_check.py data/cards.full.json --require-contract --new-id-file "$RUNNER_TEMP/ids.txt" || true
