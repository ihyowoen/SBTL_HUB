name: Inspect recoverable handoff425 historical chunk

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-recover-handoff425-chunk.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode historical part 00 and inspect completeness
        shell: bash
        run: |
          set +e
          git show 4ccc0da28306585cb9373f05ef482d697283a23b:.tmp/handoff425/part_00.txt > /tmp/part_00.txt
          echo "part00_text_bytes=$(wc -c </tmp/part_00.txt)"
          echo "part00_text_sha256=$(sha256sum /tmp/part_00.txt | awk '{print $1}')"
          base64 -d /tmp/part_00.txt > /tmp/part_00.gz 2>/tmp/base64.err
          echo "base64_rc=$?"
          echo "gzip_bytes=$(wc -c </tmp/part_00.gz)"
          echo "gzip_sha256=$(sha256sum /tmp/part_00.gz | awk '{print $1}')"
          gzip -t /tmp/part_00.gz 2>/tmp/gzip_test.err
          echo "gzip_test_rc=$?"
          cat /tmp/gzip_test.err || true
          gzip -dc /tmp/part_00.gz > /tmp/decoded.json 2>/tmp/gzip_decode.err
          echo "gzip_decode_rc=$?"
          echo "decoded_bytes=$(wc -c </tmp/decoded.json)"
          echo "decoded_sha256=$(sha256sum /tmp/decoded.json | awk '{print $1}')"
          cat /tmp/gzip_decode.err || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/decoded.json')
          raw=p.read_bytes()
          print('decoded_prefix=',raw[:160])
          print('decoded_suffix=',raw[-160:])
          try:
              o=json.loads(raw.decode('utf-8-sig'))
              print('json_parse=PASS')
              print('top_type=',type(o).__name__)
              if isinstance(o,dict):
                  print('top_keys=',sorted(o.keys()))
                  for k in ('schema','status','run_id','event_count','observation_count'):
                      if k in o: print(k,'=',o[k])
                  for key in ('events','event_membership','items'):
                      if isinstance(o.get(key),list):
                          ev=o[key]
                          print('event_list_key=',key)
                          print('event_list_count=',len(ev))
                          if ev:
                              print('first_event_id=',ev[0].get('event_id') or ev[0].get('id'))
                              print('last_event_id=',ev[-1].get('event_id') or ev[-1].get('id'))
                          break
              elif isinstance(o,list):
                  print('list_count=',len(o))
          except Exception as e:
              print('json_parse=FAIL',repr(e))
          PY
