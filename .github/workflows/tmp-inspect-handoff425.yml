name: Search all refs for handoff425 source

on:
  push:
    branches:
      - chatgpt/v4-run-baseline-20260831-20260901-r4
    paths:
      - '.github/workflows/tmp-inspect-handoff425.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search every remote branch for source fingerprints
        shell: bash
        run: |
          set +e
          mapfile -t REFS < <(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v '/HEAD$')
          echo "remote_ref_count=${#REFS[@]}"
          for needle in \
            '90719eb1067241df6b201c2722cca5280f89ea69d0e3fd3e7865b9e91d9e8c13' \
            'XRUN_20260831_20260901_R3_E0001' \
            '휴가철에도 전력수요 95.3GW' \
            'stage_a_event_handoff_425_v1'
          do
            echo "=== NEEDLE: $needle ==="
            git grep -n -I -F "$needle" "${REFS[@]}" 2>/dev/null | head -200
          done
          echo '=== ALL FILES CONTAINING R3 EVENT PREFIX ==='
          git grep -l -I -F 'XRUN_20260831_20260901_R3_E0' "${REFS[@]}" 2>/dev/null | head -500
