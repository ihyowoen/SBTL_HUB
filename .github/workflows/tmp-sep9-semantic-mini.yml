name: tmp-sep9-semantic-mini
on:
  push:
    branches: [chatgpt/sep9-r1-current-main-production-r1]
    paths: [.github/workflows/tmp-sep9-semantic-mini.yml]
permissions:
  contents: write
jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('runs/2026-09-10/sep9-r1-current-main-production-r1')
          cards=json.loads((root/'tmp/production-cards.detail.json').read_text())['cards']
          lines=['spec_id\tid\tcat\tsub_cat\tsignal\ttitle\tgate\tfact']
          for c in cards:
              vals=[c.get(k,'') for k in ['source_spec_id','id','cat','sub_cat','signal','title','gate','fact']]
              lines.append('\t'.join(str(v).replace('\t',' ').replace('\n',' ') for v in vals))
          (root/'tmp/production-semantic-mini.tsv').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runs/2026-09-10/sep9-r1-current-main-production-r1/tmp/production-semantic-mini.tsv
          git commit -m 'chore(sep9): record compact semantic recertification map'
          git push origin HEAD:chatgpt/sep9-r1-current-main-production-r1
