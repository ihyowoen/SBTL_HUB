name: apply-card-run

on:
  pull_request:
    paths:
      - "runs/**/card-run.json"
      - "direct-adds/**/direct-add.json"
      - "migrations/**/legacy-related-lineage-container-migration.json"
      - "data/cards.full.json"
      - "public/data/cards.json"
      - "scripts/apply_card_run.mjs"
      - "scripts/apply_card_run_test.mjs"
      - "scripts/validate_card_run_stage_artifacts.mjs"
      - "scripts/validate_card_run_status_consistency.mjs"
      - "scripts/validate_card_run_relations.mjs"
      - "scripts/validate_card_run_lineage_containers.mjs"
      - "scripts/validate_card_run_audits.mjs"
      - "scripts/validate_card_run_v4_hardening.mjs"
      - "scripts/validate_legacy_related_lineage_migration.mjs"
      - "scripts/validate_manual_direct_add.mjs"
      - "scripts/validate_manual_direct_add_v4_hardening.mjs"
      - "validation_scripts/stage_artifact_contract_check.py"
      - "validation_scripts/stage_a_v4_contract.py"
      - "validation_scripts/stage_a_v4_hardening.py"
      - "validation_scripts/stage_lineage_contract_check.py"
      - "schemas/card-run.v1.schema.json"
      - "schemas/manual-direct-add.v2.schema.json"
      - ".github/workflows/apply-card-run.yml"
      - ".github/workflows/legacy-related-lineage-migration.yml"
  workflow_dispatch:
    inputs:
      run_path:
        description: "Repository-relative card-run.json path (read-only verification; submitted full/lean outputs required)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apply-card-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate engine, schema, and regression suite
        run: |
          set -euo pipefail
          node --check scripts/apply_card_run.mjs
          node --check scripts/apply_card_run_test.mjs
          node --check scripts/validate_card_run_stage_artifacts.mjs
          node --check scripts/validate_card_run_status_consistency.mjs
          node --check scripts/validate_card_run_relations.mjs
          node --check scripts/validate_card_run_lineage_containers.mjs
          node --check scripts/validate_card_run_audits.mjs
          node --check scripts/validate_card_run_v4_hardening.mjs
          node --check scripts/validate_legacy_related_lineage_migration.mjs
          node --check scripts/validate_manual_direct_add.mjs
          node --check scripts/validate_manual_direct_add_v4_hardening.mjs
          python3 -m py_compile validation_scripts/stage_artifact_contract_check.py validation_scripts/stage_a_v4_contract.py validation_scripts/stage_a_v4_hardening.py validation_scripts/stage_lineage_contract_check.py
          node -e 'JSON.parse(require("fs").readFileSync("schemas/card-run.v1.schema.json", "utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("schemas/manual-direct-add.v2.schema.json", "utf8"))'
          node scripts/apply_card_run_test.mjs
          node scripts/validate_card_run_stage_artifacts.mjs --self-test
          node scripts/validate_card_run_status_consistency.mjs --self-test
          node scripts/validate_card_run_relations.mjs --self-test
          node scripts/validate_card_run_lineage_containers.mjs --self-test
          node scripts/validate_card_run_audits.mjs --self-test
          node scripts/validate_card_run_v4_hardening.mjs --self-test
          node scripts/validate_legacy_related_lineage_migration.mjs --self-test
          node scripts/validate_manual_direct_add.mjs --self-test
          node scripts/validate_manual_direct_add_v4_hardening.mjs --self-test

  verify-submitted-run:
    needs: validate-engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve exactly one governed change path
        id: run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_PATH: ${{ inputs.run_path }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --force
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_path="$DISPATCH_RUN_PATH"
            test -n "$run_path" && test -f "$run_path"
            echo "has_run=true" >> "$GITHUB_OUTPUT"
            echo "delegated_migration=false" >> "$GITHUB_OUTPUT"
            echo "delegated_direct_add=false" >> "$GITHUB_OUTPUT"
            echo "path=$run_path" >> "$GITHUB_OUTPUT"
            echo "report_path=$(dirname "$run_path")/apply-report.json" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(git rev-parse "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t runs < <(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(glob)runs/**/card-run.json')
          mapfile -t migrations < <(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(glob)migrations/**/legacy-related-lineage-container-migration.json')
          mapfile -t direct_adds < <(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(glob)direct-adds/**/direct-add.json')
          mapfile -t canonical_data < <(git diff --name-only "origin/$BASE_REF...HEAD" -- data/cards.full.json public/data/cards.json)

          declared_types=0
          [[ ${#runs[@]} -eq 0 ]] || declared_types=$((declared_types + 1))
          [[ ${#migrations[@]} -eq 0 ]] || declared_types=$((declared_types + 1))
          [[ ${#direct_adds[@]} -eq 0 ]] || declared_types=$((declared_types + 1))
          if [[ $declared_types -gt 1 ]]; then
            echo "FAIL: card-run, legacy migration, and manual direct-add are mutually exclusive in one PR" >&2
            exit 1
          fi
          [[ ${#runs[@]} -le 1 ]] || { echo "FAIL: found ${#runs[@]} card-run manifests; exactly one allowed" >&2; exit 1; }
          [[ ${#migrations[@]} -le 1 ]] || { echo "FAIL: found ${#migrations[@]} legacy migration manifests; exactly one allowed" >&2; exit 1; }
          [[ ${#direct_adds[@]} -le 1 ]] || { echo "FAIL: found ${#direct_adds[@]} direct-add manifests; exactly one allowed" >&2; exit 1; }

          base_sha="$(git rev-parse "origin/$BASE_REF")"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          if [[ ${#canonical_data[@]} -gt 0 ]]; then
            [[ ${#canonical_data[@]} -eq 2 ]] || {
              echo "FAIL: canonical card-data change must commit both data/cards.full.json and public/data/cards.json" >&2
              printf ' - %s\n' "${canonical_data[@]}" >&2
              exit 1
            }
            if [[ ${#migrations[@]} -eq 1 ]]; then
              echo "INFO: canonical change uses dedicated legacy-lineage migration path"
              echo "has_run=false" >> "$GITHUB_OUTPUT"
              echo "delegated_migration=true" >> "$GITHUB_OUTPUT"
              echo "delegated_direct_add=false" >> "$GITHUB_OUTPUT"
              echo "migration_path=${migrations[0]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ${#direct_adds[@]} -eq 1 ]]; then
              echo "INFO: canonical change uses governed manual direct-add path"
              echo "has_run=false" >> "$GITHUB_OUTPUT"
              echo "delegated_migration=false" >> "$GITHUB_OUTPUT"
              echo "delegated_direct_add=true" >> "$GITHUB_OUTPUT"
              echo "direct_add_path=${direct_adds[0]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ${#runs[@]} -eq 0 ]]; then
              echo "FAIL: canonical card-data changes require exactly one governed card-run, manual direct-add manifest, or dedicated legacy lineage migration manifest" >&2
              exit 1
            fi
          else
            if [[ $declared_types -gt 0 ]]; then
              echo "FAIL: governed manifest present without committed canonical full/lean outputs" >&2
              exit 1
            fi
            echo "has_run=false" >> "$GITHUB_OUTPUT"
            echo "delegated_migration=false" >> "$GITHUB_OUTPUT"
            echo "delegated_direct_add=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_path="${runs[0]}"
          echo "has_run=true" >> "$GITHUB_OUTPUT"
          echo "delegated_migration=false" >> "$GITHUB_OUTPUT"
          echo "delegated_direct_add=false" >> "$GITHUB_OUTPUT"
          echo "path=$run_path" >> "$GITHUB_OUTPUT"
          echo "report_path=$(dirname "$run_path")/apply-report.json" >> "$GITHUB_OUTPUT"

      - name: Validate delegated legacy lineage migration inside card-run gate
        if: steps.run.outputs.delegated_migration == 'true'
        shell: bash
        env:
          MANIFEST: ${{ steps.run.outputs.migration_path }}
          BASE_SHA: ${{ steps.run.outputs.base_sha }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST" && test -f "$MANIFEST"
          declared_main="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(r.base_main_commit_sha)' "$MANIFEST")"
          declared_blob="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(r.base_full_blob_sha)' "$MANIFEST")"
          actual_blob="$(git rev-parse "${BASE_SHA}:data/cards.full.json")"
          [[ "$declared_main" == "$BASE_SHA" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED main $BASE_SHA != $declared_main" >&2; exit 1; }
          [[ "$declared_blob" == "$actual_blob" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED blob $actual_blob != $declared_blob" >&2; exit 1; }
          git show "${BASE_SHA}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"
          [[ "$(git hash-object "$RUNNER_TEMP/cards.full.base.json")" == "$declared_blob" ]] || { echo "FAIL: reconstructed baseline bytes mismatch" >&2; exit 1; }
          node scripts/validate_legacy_related_lineage_migration.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD")
          for path in "${changed[@]}"; do
            case "$path" in
              data/cards.full.json|public/data/cards.json|"$MANIFEST") ;;
              *) echo "FAIL: migration data PR contains undeclared changed path $path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Validate governed manual direct-add inside card-run gate
        if: steps.run.outputs.delegated_direct_add == 'true'
        shell: bash
        env:
          MANIFEST: ${{ steps.run.outputs.direct_add_path }}
          BASE_SHA: ${{ steps.run.outputs.base_sha }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST" && test -f "$MANIFEST"
          declared_main="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(r.base_main_commit_sha)' "$MANIFEST")"
          declared_blob="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(r.base_full_blob_sha)' "$MANIFEST")"
          actual_blob="$(git rev-parse "${BASE_SHA}:data/cards.full.json")"
          [[ "$declared_main" == "$BASE_SHA" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED main $BASE_SHA != $declared_main" >&2; exit 1; }
          [[ "$declared_blob" == "$actual_blob" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED blob $actual_blob != $declared_blob" >&2; exit 1; }
          git show "${BASE_SHA}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"
          [[ "$(git hash-object "$RUNNER_TEMP/cards.full.base.json")" == "$declared_blob" ]] || { echo "FAIL: reconstructed baseline bytes mismatch" >&2; exit 1; }

          node scripts/validate_manual_direct_add.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate_manual_direct_add_v4_hardening.mjs --manifest "$MANIFEST" --base "$RUNNER_TEMP/cards.full.base.json" --full data/cards.full.json
          node scripts/validate.mjs
          migration_count="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.operations?.id_migration||[]).length))' "$MANIFEST")"
          if [[ "$migration_count" -gt 0 ]]; then
            CARDS_ALLOW_DELETE=1 node scripts/validate_cards.mjs data/cards.full.json
            CARDS_ALLOW_DELETE=1 node scripts/validate_cards.mjs public/data/cards.json
          else
            node scripts/validate_cards.mjs data/cards.full.json
            node scripts/validate_cards.mjs public/data/cards.json
          fi
          node scripts/lean_cards.mjs --check

          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD")
          for path in "${changed[@]}"; do
            case "$path" in
              data/cards.full.json|public/data/cards.json|"$MANIFEST") ;;
              *) echo "FAIL: manual direct-add data PR contains undeclared changed path $path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Require explicit passing and run-bound governance artifacts
        if: steps.run.outputs.has_run == 'true'
        run: |
          set -euo pipefail
          node scripts/validate_card_run_stage_artifacts.mjs \
            --run "${{ steps.run.outputs.path }}"
          node scripts/validate_card_run_v4_hardening.mjs \
            --run "${{ steps.run.outputs.path }}"
          node scripts/validate_card_run_status_consistency.mjs \
            --run "${{ steps.run.outputs.path }}"
          node scripts/validate_card_run_relations.mjs \
            --run "${{ steps.run.outputs.path }}"
          node scripts/validate_card_run_lineage_containers.mjs \
            --run "${{ steps.run.outputs.path }}" \
            --canonical data/cards.full.json
          node scripts/validate_card_run_audits.mjs \
            --run "${{ steps.run.outputs.path }}" \
            --full data/cards.full.json \
            --lean public/data/cards.json

      - name: Lock declared baseline to base commit
        if: steps.run.outputs.has_run == 'true'
        shell: bash
        env:
          RUN_PATH: ${{ steps.run.outputs.path }}
          BASE_SHA: ${{ steps.run.outputs.base_sha }}
        run: |
          set -euo pipefail
          declared_main="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(r.base_main_commit_sha)' "$RUN_PATH")"
          declared_blob="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(r.base_full_blob_sha)' "$RUN_PATH")"
          actual_blob="$(git rev-parse "${BASE_SHA}:data/cards.full.json")"
          [[ "$declared_main" == "$BASE_SHA" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED main $BASE_SHA != $declared_main" >&2; exit 1; }
          [[ "$declared_blob" == "$actual_blob" ]] || { echo "FAIL: BLOCKED_BASELINE_MOVED_REBASE_REQUIRED blob $actual_blob != $declared_blob" >&2; exit 1; }
          git show "${BASE_SHA}:data/cards.full.json" > "$RUNNER_TEMP/cards.full.base.json"
          [[ "$(git hash-object "$RUNNER_TEMP/cards.full.base.json")" == "$declared_blob" ]] || { echo "FAIL: reconstructed baseline bytes mismatch" >&2; exit 1; }

      - name: Validate submitted canonical outputs
        if: steps.run.outputs.has_run == 'true'
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          node scripts/validate_cards.mjs data/cards.full.json
          node scripts/validate_cards.mjs public/data/cards.json
          node scripts/lean_cards.mjs --check
          node scripts/apply_card_run.mjs \
            --run "${{ steps.run.outputs.path }}" \
            --baseline data/cards.full.json \
            --canonical-path data/cards.full.json \
            --output data/cards.full.json \
            --report "${{ steps.run.outputs.report_path }}" \
            --lean-path public/data/cards.json \
            --base-main-sha "${{ steps.run.outputs.base_sha }}" \
            --verify
          git diff --check

      - name: Enforce read-only verification
        if: steps.run.outputs.has_run == 'true'
        shell: bash
        env:
          REPORT_PATH: ${{ steps.run.outputs.report_path }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              "$REPORT_PATH") ;;
              data/cards.full.json|public/data/cards.json)
                echo "FAIL: PR/dispatch verification requires committed byte-exact full/lean outputs; runner changed $path" >&2
                exit 1
                ;;
              *) echo "FAIL: read-only verification changed undeclared path $path" >&2; exit 1 ;;
            esac
          done
