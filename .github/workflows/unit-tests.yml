name: unit-tests

on:
  pull_request:
    paths:
      - "src/**"
      - "__tests__/**"
      - "ops/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "__tests__/**"
      - "ops/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
