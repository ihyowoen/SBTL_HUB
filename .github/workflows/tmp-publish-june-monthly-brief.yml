              'Ford LFP 생산의도 시험셀이 고객승인·상업출하로 전환되는지, 양극박 원료계약과 배터리 IP 라이선스가 실제 현지 생산·원가·고객 믹스에 미치는 영향을 확인한다.'
            ],
            'refs':refs,
