name: Temporary review 4871719239 fix

on:
  push:
    branches:
      - agent/canonical-v3-contract-schema

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-v3-contract-schema
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply trimmed-length contract fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          structured_pattern = r'^\s*\S[\s\S]*\S\s*$'
          free_text_pattern = r'^\s*\S[\s\S]{2,}\S\s*$'

          schema_path = Path('contracts/v3_anchor_contract.schema.json')
          contract = json.loads(schema_path.read_text(encoding='utf-8'))
          for definition_name in ('evidence_target', 'confirmation_point'):
              for option in contract['$defs'][definition_name]['oneOf']:
                  if option.get('type') == 'string':
                      option['pattern'] = free_text_pattern
                  elif option.get('type') == 'object':
                      for key in option['required']:
                          option['properties'][key]['pattern'] = structured_pattern
          schema_path.write_text(
              json.dumps(contract, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          loader_path = Path('validation_scripts/v3_contract.py')
          text = loader_path.read_text(encoding='utf-8')
          old = '''def _expected_structured_text_definition(
    key_pairs: tuple[tuple[str, str], ...],
) -> dict[str, Any]:
    """Build the exact structured/free-text schema from canonical key pairs."""
    options: list[dict[str, Any]] = []
    for first_key, second_key in key_pairs:
        options.append(
            {
                "type": "object",
                "required": [first_key, second_key],
                "properties": {
                    first_key: {
                        "type": "string",
                        "minLength": 2,
                        "pattern": r"\\S",
                    },
                    second_key: {
                        "type": "string",
                        "minLength": 2,
                        "pattern": r"\\S",
                    },
                },
                "additionalProperties": True,
            }
        )
    options.append({"type": "string", "minLength": 4, "pattern": r"\\S"})
    return {"oneOf": options}
'''
          new = '''def _expected_structured_text_definition(
    key_pairs: tuple[tuple[str, str], ...],
) -> dict[str, Any]:
    """Build exact schemas with minimum lengths applied after trimming."""
    structured_pattern = r"^\\s*\\S[\\s\\S]*\\S\\s*$"
    free_text_pattern = r"^\\s*\\S[\\s\\S]{2,}\\S\\s*$"
    options: list[dict[str, Any]] = []
    for first_key, second_key in key_pairs:
        options.append(
            {
                "type": "object",
                "required": [first_key, second_key],
                "properties": {
                    first_key: {
                        "type": "string",
                        "minLength": 2,
                        "pattern": structured_pattern,
                    },
                    second_key: {
                        "type": "string",
                        "minLength": 2,
                        "pattern": structured_pattern,
                    },
                },
                "additionalProperties": True,
            }
        )
    options.append(
        {"type": "string", "minLength": 4, "pattern": free_text_pattern}
    )
    return {"oneOf": options}
'''
          if old not in text:
              raise SystemExit('expected structured definition block not found')
          loader_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('validation_scripts/tests/test_review_4871394041_contracts.py')
          test_path.write_text('''from __future__ import annotations

import copy
import re
import unittest

from validation_scripts.v3_contract import load_contract, validate_contract_document


class TestReview4871394041Contracts(unittest.TestCase):
    def setUp(self):
        self.contract = load_contract()

    @staticmethod
    def _fullmatch(schema, value):
        return (
            isinstance(value, str)
            and len(value) >= schema.get("minLength", 0)
            and re.fullmatch(schema["pattern"], value) is not None
        )

    def test_structured_values_apply_minimum_after_trimming(self):
        expected = r"^\s*\S[\s\S]*\S\s*$"
        for definition_name in ("evidence_target", "confirmation_point"):
            for option in self.contract["$defs"][definition_name]["oneOf"][:2]:
                for key in option["required"]:
                    schema = option["properties"][key]
                    with self.subTest(definition=definition_name, key=key):
                        self.assertEqual(expected, schema["pattern"])
                        for invalid in (" x", "x ", "  x  ", "\tx\n"):
                            self.assertFalse(self._fullmatch(schema, invalid))
                        for valid in ("xy", " x y ", "a b", "\tx y\n"):
                            self.assertTrue(self._fullmatch(schema, valid))

    def test_free_text_applies_four_character_trimmed_minimum(self):
        expected = r"^\s*\S[\s\S]{2,}\S\s*$"
        for definition_name in ("evidence_target", "confirmation_point"):
            schema = self.contract["$defs"][definition_name]["oneOf"][2]
            with self.subTest(definition=definition_name):
                self.assertEqual(expected, schema["pattern"])
                for invalid in (" x ", " ab ", "abc", "  a b  "):
                    self.assertFalse(self._fullmatch(schema, invalid))
                for valid in ("abcd", " a  b ", "ab cd", "\ta bc\n"):
                    self.assertTrue(self._fullmatch(schema, valid))

    def test_pattern_removal_or_weakening_is_detected_as_drift(self):
        for definition_name in ("evidence_target", "confirmation_point"):
            definition = self.contract["$defs"][definition_name]
            for option_index, option in enumerate(definition["oneOf"]):
                keys = (None,) if option["type"] == "string" else tuple(option["required"])
                for key in keys:
                    for mutation in ("remove", "weaken"):
                        with self.subTest(
                            definition=definition_name,
                            option=option_index,
                            key=key,
                            mutation=mutation,
                        ):
                            broken = copy.deepcopy(self.contract)
                            target = broken["$defs"][definition_name]["oneOf"][option_index]
                            schema = target if key is None else target["properties"][key]
                            if mutation == "remove":
                                schema.pop("pattern")
                            else:
                                schema["pattern"] = r"\S"
                            errors = validate_contract_document(broken)
                            self.assertTrue(
                                any(
                                    f"{definition_name} definition differs" in error
                                    for error in errors
                                ),
                                errors,
                            )

    def test_canonical_and_compatibility_pairs_remain_valid(self):
        evidence = self.contract["$defs"]["evidence_target"]["oneOf"]
        confirmation = self.contract["$defs"]["confirmation_point"]["oneOf"]
        self.assertEqual(
            ["source_or_document_class", "exact_claim_or_metric"],
            evidence[0]["required"],
        )
        self.assertEqual(
            ["source_class", "verification_target"],
            evidence[1]["required"],
        )
        self.assertEqual(
            ["measurable_event_or_metric", "interpretation_effect"],
            confirmation[0]["required"],
        )
        self.assertEqual(
            ["confirmation_event", "confirm_weaken_invalidate"],
            confirmation[1]["required"],
        )
        self.assertEqual([], validate_contract_document(self.contract))


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          Path('.github/workflows/tmp-review-4871719239-fix.yml').unlink()
          PY
      - name: Verify canonical drift
        run: python validation_scripts/v3_contract_drift_check.py
      - name: Compile validators
        run: python -m compileall -q validation_scripts
      - name: Run focused regressions
        run: python -m unittest validation_scripts.tests.test_review_4871394041_contracts -v
      - name: Run full regression suite
        run: python -m unittest discover -s validation_scripts/tests -v
      - name: Verify prompt overlays
        run: python validation_scripts/apply_prompt_contract_overlays.py --check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce trimmed V3 target lengths"
          git push origin HEAD:agent/canonical-v3-contract-schema
